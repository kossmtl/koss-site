        swatchRow.querySelectorAll('.textnote-color-swatch').forEach(sw=>{
          sw.addEventListener('click', ()=>{
            hiddenInput.value = sw.dataset.color;
            swatchRow.querySelectorAll('.textnote-color-swatch').forEach(s=>s.style.borderColor='transparent');
            sw.style.borderColor = 'var(--amber)';
          });
        });
      }
      wireSwatches();
      const paletteBtns = backdrop.querySelectorAll('.textnote-palette-btn');
      const paletteHidden = backdrop.querySelector('#textnote-palette-value');
      paletteBtns.forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const key = btn.dataset.palette;
          paletteHidden.value = key;
          paletteBtns.forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          const colors = textnotePaletteColors(key);
          hiddenInput.value = colors[0];
          swatchRow.innerHTML = renderTextnoteSwatchesHtml(colors, colors[0]);
          wireSwatches();
        });
      });
      const alignBtns = backdrop.querySelectorAll('.textnote-align-btn');
      const hAlignInput = backdrop.querySelector('#textnote-halign-value');
      alignBtns.forEach(btn=>{
        btn.addEventListener('click', ()=>{
          hAlignInput.value = btn.dataset.value;
          alignBtns.forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
        });
      });
    }
    if(m.type==='sticker-form'){
      const imgInput = backdrop.querySelector('#sticker-image-file');
      if(imgInput){
        imgInput.addEventListener('change', async (ev)=>{
          const f = ev.target.files[0];
          if(!f) return;
          try{ pendingStickerImage = await resizeImageFile(f, 220); showToast('Image prête à être enregistrée.'); }
          catch(err){ showToast('Impossible de traiter cette image.'); }
        });
      }
    }
    if(m.type==='notebook-settings'){
      const pageSwatches = backdrop.querySelectorAll('.nb-page-swatch');
      const pageHidden = backdrop.querySelector('#nb-page-color-value');
      pageSwatches.forEach(sw=>sw.addEventListener('click', ()=>{
        pageHidden.value = sw.dataset.color;
        pageSwatches.forEach(s=>s.style.borderColor='var(--border)');
        sw.style.borderColor = 'var(--amber)';
      }));
      const postitSwatches = backdrop.querySelectorAll('.nb-postit-swatch');
      const postitHidden = backdrop.querySelector('#nb-postit-color-value');
      postitSwatches.forEach(sw=>sw.addEventListener('click', ()=>{
        postitHidden.value = sw.dataset.color;
        postitSwatches.forEach(s=>s.style.borderColor=postitSwatchBorder(s.dataset.color,false));
        sw.style.borderColor = 'var(--amber)';
      }));
      const textureSwatches = backdrop.querySelectorAll('.nb-texture-swatch');
      const textureHidden = backdrop.querySelector('#nb-texture-value');
      textureSwatches.forEach(sw=>sw.addEventListener('click', ()=>{
        textureHidden.value = sw.dataset.texture;
        textureSwatches.forEach(s=>s.style.borderColor='var(--border)');
        sw.style.borderColor = 'var(--amber)';
      }));
      const coverSwatches = backdrop.querySelectorAll('.nb-cover-swatch');
      const coverHidden = backdrop.querySelector('#nb-cover-color-value');
      coverSwatches.forEach(sw=>sw.addEventListener('click', ()=>{
        coverHidden.value = sw.dataset.color;
        coverSwatches.forEach(s=>s.style.borderColor='transparent');
        sw.style.borderColor = 'var(--amber)';
        textureSwatches.forEach(ts=>ts.style.background = sw.dataset.color);
      }));
    }
  }

  // ---------- Glisser-déposer (post-its, notes-texte, autocollants) ----------
  function attachNotebookDrag(){
    const canvas = document.getElementById('nb-canvas');
    if(!canvas) return;
    if(!state.notebookEditMode) return;
    let dragEl=null, dragId=null, startX=0, startY=0, startLeft=0, startTop=0, moved=false;
    function onMove(ev){
      if(!dragEl) return;
      const point = ev.touches ? ev.touches[0] : ev;
      const dxPx = point.clientX - startX, dyPx = point.clientY - startY;
      if(Math.abs(dxPx)>3 || Math.abs(dyPx)>3) moved = true;
      const rect = canvas.getBoundingClientRect();
      let newLeft = startLeft + (dxPx/rect.width)*100;
      let newTop = startTop + (dyPx/rect.height)*100;
      newLeft = Math.max(0, Math.min(85, newLeft));
      newTop = Math.max(0, Math.min(88, newTop));
      dragEl.style.left = newLeft+'%';
      dragEl.style.top = newTop+'%';
    }
    async function onUp(){
      if(!dragEl) return;
      const el = dragEl, wasMoved = moved;
      dragEl.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      dragEl = null;
      if(wasMoved){
        const entry = state.data.entries.find(n=>n.id===dragId);
        if(entry){ entry.x = parseFloat(el.style.left); entry.y = parseFloat(el.style.top); await persist(); }
      } else if(el.classList.contains('textnote-free') || el.classList.contains('sticker-free') || el.classList.contains('postit-free')){
        state.notebookSelectedEntry = state.notebookSelectedEntry === dragId ? null : dragId;
        render();
      }
    }
    canvas.addEventListener('mousedown', (ev)=>{
      if(state.notebookQuickTextDraw) return;
      if(state.notebookQuickEditId) return; // laisse le blur naturel sauvegarder le texte rapide sans re-rendu concurrent
      if(state.notebookTextSelectId) return; // laisse le blur naturel sauvegarder l'édition en cours sans re-rendu concurrent
      if(ev.target===canvas && (state.notebookSelectedEntry || state.notebookTextSelectId)){
        state.notebookSelectedEntry=null; state.notebookTextSelectId=null; render();
      }
    });
    canvas.querySelectorAll('.postit-free, .textnote-free, .sticker-free').forEach(node=>{
      const startDrag = (ev)=>{
        if(ev.target.closest('button')) return;
        const isTextContent = ev.target.closest('.textnote-content, .postit-text');
        if(isTextContent){
          if(state.notebookTextSelectId === node.dataset.id) return; // déjà en mode sélection : laisse le texte se sélectionner nativement
          const now = Date.now();
          const isDoubleClick = lastContentClick.id === node.dataset.id && (now - lastContentClick.time) < 400;
          lastContentClick = {id: node.dataset.id, time: now};
          if(isDoubleClick){
            state.notebookSelectedEntry = node.dataset.id;
            state.notebookTextSelectId = node.dataset.id;
            render();
            return;
          }
        } else {
          lastContentClick = {id:null, time:0};
        }
        if(state.notebookTextSelectId && state.notebookTextSelectId !== node.dataset.id) state.notebookTextSelectId = null;
        const point = ev.touches ? ev.touches[0] : ev;
        dragEl = node; dragId = node.dataset.id; moved = false;
        startX = point.clientX; startY = point.clientY;
        startLeft = parseFloat(node.style.left) || 0;
        startTop = parseFloat(node.style.top) || 0;
        node.classList.add('dragging');
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        document.addEventListener('touchmove', onMove, {passive:false});
        document.addEventListener('touchend', onUp);
        ev.preventDefault();
      };
      node.addEventListener('mousedown', startDrag);
      node.addEventListener('touchstart', startDrag, {passive:false});
    });
  }

  function attachFreeHandles(){
    const canvas = document.getElementById('nb-canvas');
    if(!canvas) return;
    canvas.querySelectorAll('.rotate-handle').forEach(handle=>{
      const wrap = handle.closest('.textnote-free, .sticker-free, .postit-free');
      if(!wrap) return;
      const id = handle.dataset.id;
      const start = (ev)=>{
        ev.preventDefault(); ev.stopPropagation();
        const point = ev.touches ? ev.touches[0] : ev;
        const rect = wrap.getBoundingClientRect();
        const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
        const entry = state.data.entries.find(n=>n.id===id);
        const startRotation = (entry && entry.rotation) || 0;
        const startAngle = Math.atan2(point.clientY-cy, point.clientX-cx)*180/Math.PI;
        let pendingRotation = startRotation;
        function onMove(mv){
          const p = mv.touches ? mv.touches[0] : mv;
          const angle = Math.atan2(p.clientY-cy, p.clientX-cx)*180/Math.PI;
          pendingRotation = Math.round(startRotation + (angle-startAngle));
          wrap.style.transform = `rotate(${pendingRotation}deg)`;
        }
        async function onEnd(){
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onEnd);
          document.removeEventListener('touchmove', onMove);
          document.removeEventListener('touchend', onEnd);
          if(entry){ entry.rotation = pendingRotation; await persist(); }
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, {passive:false});
        document.addEventListener('touchend', onEnd);
      };
      handle.addEventListener('mousedown', start);
      handle.addEventListener('touchstart', start, {passive:false});
    });
    canvas.querySelectorAll('.resize-handle').forEach(handle=>{
      const wrap = handle.closest('.textnote-free, .sticker-free, .postit-free');
      if(!wrap) return;
      const id = handle.dataset.id;
      const isSticker = wrap.classList.contains('sticker-free');
      const isPostit = wrap.classList.contains('postit-free');
      const start = (ev)=>{
        ev.preventDefault(); ev.stopPropagation();
        const point = ev.touches ? ev.touches[0] : ev;
        const rect = wrap.getBoundingClientRect();
        const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
        const startDist = Math.max(20, Math.hypot(point.clientX-cx, point.clientY-cy));
        const entry = state.data.entries.find(n=>n.id===id);
        const startSize = isSticker ? (entry.size||60) : isPostit ? (entry.size||150) : (entry.fontSize||16);
        const minSize = isSticker ? 24 : isPostit ? 100 : 10;
        const maxSize = isSticker ? 240 : isPostit ? 400 : 60;
        let pendingSize = startSize;
        function onMove(mv){
          const p = mv.touches ? mv.touches[0] : mv;
          const dist = Math.max(20, Math.hypot(p.clientX-cx, p.clientY-cy));
          pendingSize = Math.round(Math.max(minSize, Math.min(maxSize, startSize*(dist/startDist))));
          if(isSticker){ wrap.style.width = pendingSize+'px'; const img=wrap.querySelector('img'); if(img) img.style.width=pendingSize+'px'; }
          else if(isPostit){
            const scale = pendingSize/150;
            wrap.style.width = pendingSize+'px';
            wrap.style.minHeight = Math.round(110*scale)+'px';
            const cat = wrap.querySelector('.postit-cat'); if(cat) cat.style.fontSize = (10*scale).toFixed(1)+'px';
            const txt = wrap.querySelector('.postit-text'); if(txt) txt.style.fontSize = (15*scale).toFixed(1)+'px';
          }
          else wrap.style.fontSize = pendingSize+'px';
        }
        async function onEnd(){
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onEnd);
          document.removeEventListener('touchmove', onMove);
          document.removeEventListener('touchend', onEnd);
          if(entry){ if(isSticker||isPostit) entry.size = pendingSize; else entry.fontSize = pendingSize; await persist(); }
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, {passive:false});
        document.addEventListener('touchend', onEnd);
      };
      handle.addEventListener('mousedown', start);
      handle.addEventListener('touchstart', start, {passive:false});
    });
  }

  function attachQuickTextDraw(){
    const canvas = document.getElementById('nb-canvas');
    if(!canvas) return;
    if(!state.notebookQuickTextDraw) return;
    canvas.classList.add('quick-text-drawing');
    let startX=0, startY=0, previewEl=null;
    function onMove(ev){
      if(!previewEl) return;
      const point = ev.touches ? ev.touches[0] : ev;
      const rect = canvas.getBoundingClientRect();
      const curX = Math.max(0, Math.min(rect.width, point.clientX-rect.left));
      const curY = Math.max(0, Math.min(rect.height, point.clientY-rect.top));
      const left = Math.min(startX, curX), top = Math.min(startY, curY);
      const w = Math.abs(curX-startX), h = Math.abs(curY-startY);
      previewEl.style.left = left+'px'; previewEl.style.top = top+'px';
      previewEl.style.width = w+'px'; previewEl.style.height = h+'px';
    }
    async function onUp(ev){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      if(!previewEl) return;
      const rect = canvas.getBoundingClientRect();
      const boxWidthPx = Math.max(60, parseFloat(previewEl.style.width)||160);
      const boxHeightPx = Math.max(28, parseFloat(previewEl.style.height)||28);
      const leftPx = parseFloat(previewEl.style.left)||0;
      const topPx = parseFloat(previewEl.style.top)||0;
      previewEl.remove(); previewEl = null;
      const nb = getOrCreateActiveNotebook();
      const entry = {
        id: uid(), notebookId: nb.id, kind:'text', page: state.notebookActivePage||1,
        x: Math.max(0, Math.min(85, (leftPx/rect.width)*100)),
        y: Math.max(0, Math.min(88, (topPx/rect.height)*100)),
        boxWidth: Math.round(boxWidthPx),
        boxHeight: Math.round(boxHeightPx),
        text:'', fontFamily:'sans', fontSize:10, color:TEXTNOTE_INK_COLORS[0], rotation:0, hAlign:'left',
        createdAt: Date.now(),
      };
      state.data.entries.push(entry);
      state.notebookQuickTextDraw = false;
      state.notebookQuickEditId = entry.id;
      render();
    }
    const startDraw = (ev)=>{
      if(ev.target.closest('button') || ev.target.closest('.btn-row')) return;
      const point = ev.touches ? ev.touches[0] : ev;
      const rect = canvas.getBoundingClientRect();
      startX = Math.max(0, Math.min(rect.width, point.clientX-rect.left));
      startY = Math.max(0, Math.min(rect.height, point.clientY-rect.top));
      previewEl = document.createElement('div');
      previewEl.className = 'quick-text-preview';
      previewEl.style.left = startX+'px'; previewEl.style.top = startY+'px';
      previewEl.style.width = '0px'; previewEl.style.height = '0px';
      canvas.appendChild(previewEl);
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      document.addEventListener('touchmove', onMove, {passive:false});
      document.addEventListener('touchend', onUp);
      ev.preventDefault();
    };
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('touchstart', startDraw, {passive:false});
  }

  function attachQuickTextEditor(){
    if(!state.notebookQuickEditId) return;
    const ta = document.getElementById('quick-text-input');
    if(!ta) return;
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    let done = false;
    async function finish(){
      if(done) return; done = true;
      const val = ta.value.trim();
      const entry = state.data.entries.find(n=>n.id===state.notebookQuickEditId);
      if(entry){
        if(!val){
          state.data.entries = state.data.entries.filter(n=>n.id!==entry.id);
        } else {
          entry.text = val;
        }
        await persist();
      }
      state.notebookQuickEditId = null;
      render();
    }
    ta.addEventListener('blur', finish);
    ta.addEventListener('keydown', (ev)=>{
      if(ev.key==='Escape'){ ev.preventDefault(); ta.blur(); }
    });
  }

  function attachTextSelectEditor(){
    if(!state.notebookTextSelectId) return;
    const canvas = document.getElementById('nb-canvas');
    if(!canvas) return;
    const el = canvas.querySelector(`[contenteditable="true"][data-id="${state.notebookTextSelectId}"]`);
    if(!el) return;
    setTimeout(()=>{ el.focus(); }, 0); // après le focus par défaut du mousedown, pour ne pas se faire écraser
    let done = false;
    async function finish(){
      if(done) return; done = true;
      const val = (el.innerText || el.textContent || '').replace(/\n+$/,'');
      const entry = state.data.entries.find(n=>n.id===state.notebookTextSelectId);
      if(entry){ entry.text = val; await persist(); }
      state.notebookTextSelectId = null;
      render();
    }
    el.addEventListener('blur', finish);
    el.addEventListener('keydown', (ev)=>{
      if(ev.key==='Enter'){ ev.preventDefault(); el.blur(); }
      if(ev.key==='Escape'){ ev.preventDefault(); el.blur(); }
    });
  }

  // ---------- Délégation d'événements ----------
  function attachHandlers(root){
    root.querySelectorAll('[data-action]').forEach(el=>{
      el.addEventListener('click', onAction);
    });
  }

  async function onAction(e){
    const action = e.currentTarget.dataset.action;
    const id = e.currentTarget.dataset.id;

    // ---- Connexion ----
    if(action==='do-login'){
      const name = document.getElementById('lg-name').value.trim();
      const code = document.getElementById('lg-code').value.trim();
      if(!name || !code){ markInvalid([!name?'lg-name':null, !code?'lg-code':null].filter(Boolean)); showToast('Nom et code requis.'); return; }
      showToast('Connexion...');
      const res = await rpcLoad(name, code);
      if(!res){ showToast('Nom ou code incorrect.'); return; }
      state.session = {name, code};
      storeSession(state.session);
      applyLoadResult(res);
      state.view = 'notebook';
      render();
      return;
    }
    if(action==='logout'){
      state.session=null; state.data=null; storeSession(null); state.view='login'; render(); return;
    }
    if(action==='goto-manager-login'){ state.view='manager-login'; render(); return; }
    if(action==='goto-login'){ state.view='login'; render(); return; }
    if(action==='do-manager-login'){
      const code = document.getElementById('mg-code').value.trim();
      if(!code){ markInvalid('mg-code'); return; }
      showToast('Connexion...');
      const res = await rpcManagerLoad(code);
      if(!res){ showToast('Code incorrect.'); return; }
      state.managerCode = code; storeManagerCode(code);
      state.managerData = res; state.managerTab = 'comptes';
      state.view = 'manager'; render();
      return;
    }
    if(action==='manager-logout'){ state.managerCode=null; state.managerData=null; storeManagerCode(null); state.view='login'; render(); return; }
    if(action==='manager-tab'){ state.managerTab = e.currentTarget.dataset.tab; render(); return; }

    // ---- Carnet : ouverture / carnets multiples ----
    if(action==='open-notebook-cover'){ state.notebookOpened = true; state.notebookActivePage = 1; render(); return; }
    if(action==='close-notebook-cover'){ state.notebookOpened = false; state.notebookFilterCategory = null; render(); return; }
    if(action==='new-notebook'){ state.modal = {type:'add-notebook'}; render(); return; }
    if(action==='submit-new-notebook'){
      const name = document.getElementById('new-nb-name').value.trim() || 'Nouveau carnet';
      const list = getNotebooks();
      const color = COVER_COLORS[list.length % COVER_COLORS.length];
      const nb = {
        id: uid(), name, pageCount:1, coverColor: color, coverTexture:'', coverTextColor:'#F4EFE7',
        pageColor: PAGE_COLORS[0], pageStyle:'ligne', postitColor: POSTIT_COLORS[0],
        titleFont:'marker', titleSize:32, nameFont:'sans', nameSize:14, inkPalette:'pastel', createdAt: Date.now(),
      };
      state.data.notebooks.push(nb);
      state.data.activeNotebookId = nb.id;
      state.notebookOpened = false;
      await persist();
      state.modal = null; render();
      showToast('Carnet créé.');
      return;
    }
    if(action==='switch-notebook'){
      const sel = document.getElementById('nb-select');
      if(sel){ state.data.activeNotebookId = sel.value; state.notebookActivePage = 1; state.notebookFilterCategory = null; await persist(); render(); }
      return;
    }
    if(action==='switch-notebook-thumb'){
      const nid = e.currentTarget.dataset.notebook;
      if(nid && nid!==state.data.activeNotebookId){
        state.data.activeNotebookId = nid; state.notebookActivePage = 1; state.notebookFilterCategory = null;
        await persist(); render();
      }
      return;
    }
    if(action==='scroll-cover-carousel'){
      const dir = parseInt(e.currentTarget.dataset.dir,10)||1;
      const track = document.getElementById('cover-carousel-track');
      if(track) track.scrollBy({left: dir*180, behavior:'smooth'});
      return;
    }
    if(action==='scroll-side-thumbs'){
      const dir = parseInt(e.currentTarget.dataset.dir,10)||1;
      const track = document.getElementById('side-thumb-track');
      if(track) track.scrollBy({top: dir*100, behavior:'smooth'});
      return;
    }
    if(action==='delete-notebook'){
      state.modal = {type:'confirm-delete-notebook', payload:{notebookId: e.currentTarget.dataset.notebook}};
      render(); return;
    }
    if(action==='confirm-delete-notebook-yes'){
      const notebookId = e.currentTarget.dataset.notebook;
      const remaining = getNotebooks().filter(x=>x.id!==notebookId);
      // Les autocollants et notes reçus (shareId/grantId) retournent dans les reçus plutôt que d'être perdus.
      const toReturn = state.data.entries.filter(n=>n.notebookId===notebookId && (n.shareId || n.grantId));
      for(const n of toReturn){
        if(n.shareId){
          const res = await rpcPersonAction(state.session.name, state.session.code, 'return_shared_to_inbox', {id:n.shareId});
          if(res && res.ok){
            const content = sharedItemContentFromEntry(n);
            state.data.receivedItems = state.data.receivedItems || [];
            state.data.receivedItems.unshift(Object.assign({id:n.shareId, senderName:n.senderName||'', anonymous:n.anonymous||false}, content));
          }
        } else if(n.grantId){
          const res = await rpcPersonAction(state.session.name, state.session.code, 'return_sticker_to_bank', {id:n.grantId});
          if(res && res.ok){
            state.data.stickerGrants = state.data.stickerGrants || [];
            state.data.stickerGrants.unshift({id:n.grantId, stickerId:n.stickerId, message:'', used:false, grantedAt:Date.now()});
          }
        }
      }
      state.data.notebooks = state.data.notebooks.filter(x=>x.id!==notebookId);
      state.data.entries = state.data.entries.filter(n=>n.notebookId!==notebookId);
      state.data.activeNotebookId = remaining.length ? remaining[0].id : null;
      state.notebookActivePage = 1; state.notebookFilterCategory = null;
      await persist();
      state.modal = null; render();
      showToast('Carnet supprimé.');
      return;
    }
    if(action==='open-notebook-settings'){ state.modal = {type:'notebook-settings', payload:{notebookId: getOrCreateActiveNotebook().id}}; render(); return; }
    if(action==='save-notebook-settings'){
      const nb = state.data.notebooks.find(x=>x.id===e.currentTarget.dataset.notebook);
      if(!nb){ showToast('Carnet introuvable.'); return; }
      nb.name = document.getElementById('nb-name-input').value.trim() || nb.name;
      nb.titleFont = document.getElementById('nb-title-font-input').value;
      nb.titleSize = parseInt(document.getElementById('nb-title-size-input').value,10) || 32;
      nb.nameFont = document.getElementById('nb-name-font-input').value;
      nb.nameSize = parseInt(document.getElementById('nb-name-size-input').value,10) || 14;
      nb.coverColor = document.getElementById('nb-cover-color-value').value;
      nb.coverTexture = document.getElementById('nb-texture-value').value;
      nb.coverTextColor = document.getElementById('nb-cover-text-color-input').value;
      nb.pageColor = document.getElementById('nb-page-color-value').value;
      nb.pageStyle = document.getElementById('nb-page-style-input').value;
      nb.postitColor = document.getElementById('nb-postit-color-value').value;
      const ok = await persist();
      showToast(ok===false ? "Erreur d'enregistrement, réessaie." : 'Carnet personnalisé.');
      state.modal = null; render();
      return;
    }

    // ---- Pages ----
    if(action==='goto-notebook-page'){ state.notebookActivePage = parseInt(e.currentTarget.dataset.page,10)||1; state.notebookFilterCategory=null; render(); return; }
    if(action==='add-notebook-page'){
      const nb = getOrCreateActiveNotebook();
      if((nb.pageCount||1) >= MAX_NOTEBOOK_PAGES){ showToast('Nombre maximum de pages atteint.'); return; }
      nb.pageCount = (nb.pageCount||1)+1;
      state.notebookActivePage = nb.pageCount;
      await persist(); render();
      return;
    }
    if(action==='delete-notebook-page'){
      const nb = getOrCreateActiveNotebook();
      const pageCount = nb.pageCount||1;
      if(pageCount<=1){ showToast('Un carnet doit garder au moins une page.'); return; }
      const targetPage = Math.min(state.notebookActivePage||1, pageCount);
      state.data.entries.forEach(n=>{
        if(n.notebookId!==nb.id) return;
        const p = n.page||1;
        if(p===targetPage){ n.trashed=true; n.trashedAt=Date.now(); }
        else if(p>targetPage){ n.page = p-1; }
      });
      nb.pageCount = pageCount-1;
      state.notebookActivePage = Math.min(targetPage, nb.pageCount);
      await persist(); render();
      showToast('Page supprimée — les notes qu’elle contenait sont dans la corbeille.');
      return;
    }
    if(action==='toggle-notebook-edit-mode'){ state.notebookEditMode = !state.notebookEditMode; state.notebookSelectedEntry=null; render(); return; }
    if(action==='toggle-notebook-search'){ state.notebookSearchOpen = !state.notebookSearchOpen; render(); return; }
    if(action==='run-notebook-search'){ state.notebookSearchQuery = document.getElementById('nb-search-input').value.trim(); render(); return; }
    if(action==='filter-notebook-category'){ state.notebookFilterCategory = e.currentTarget.dataset.category || null; render(); return; }

    // ---- Post-its ----
    if(action==='new-postit'){ pendingPostitPhoto=null; state.modal={type:'postit-form', payload:{entry:null}}; render(); return; }
    if(action==='start-quick-text'){
      state.notebookQuickTextDraw = !state.notebookQuickTextDraw;
      if(state.notebookQuickTextDraw) showToast('Dessine un rectangle sur la page pour écrire.');
      render(); return;
    }
    if(action==='edit-entry'){
      const entry = state.data.entries.find(n=>n.id===id);
      if(!entry) return;
      if(entry.kind==='text'){ state.modal={type:'textnote-form', payload:{entry}}; render(); return; }
      pendingPostitPhoto = entry.photo || null;
      state.modal = {type:'postit-form', payload:{entry}}; render(); return;
    }
    if(action==='pick-postit-color'){
      document.getElementById('postit-color-value').value = e.currentTarget.dataset.color;
      const row = e.currentTarget.parentElement;
      if(row) row.querySelectorAll('.sq-swatch').forEach(s=>s.style.borderColor=postitSwatchBorder(s.dataset.color,false));
      e.currentTarget.style.borderColor = 'var(--amber)';
      return;
    }
    if(action==='save-postit'){
      const nb = getOrCreateActiveNotebook();
      const text = document.getElementById('postit-text').value.trim();
      const category = document.getElementById('postit-category-input').value.trim();
      const color = document.getElementById('postit-color-value').value;
      if(!text){ markInvalid('postit-text'); showToast('La note ne peut pas être vide.'); return; }
      if(!category){ markInvalid('postit-category-input'); showToast('Choisis ou tape une catégorie.'); return; }
      if(id){
        const entry = state.data.entries.find(n=>n.id===id);
        if(entry){
          entry.text=text; entry.category=category; entry.color=color;
          if(pendingPostitPhoto) entry.photo = pendingPostitPhoto;
          const pageInput = document.getElementById('postit-page');
          if(pageInput){ const maxPage = nb.pageCount||1; entry.page = Math.max(1, Math.min(maxPage, parseInt(pageInput.value,10)||1)); }
        }
      } else {
        state.data.entries.push({id:uid(), notebookId:nb.id, kind:'postit', page:state.notebookActivePage||1, x:10+Math.round(Math.random()*40), y:10+Math.round(Math.random()*40), text, category, color, photo:pendingPostitPhoto||null, createdAt:Date.now()});
      }
      pendingPostitPhoto = null;
      await persist();
      state.modal=null; render();
      showToast('Note enregistrée.');
      return;
    }
    if(action==='delete-entry'){
      const entry = state.data.entries.find(n=>n.id===id);
      if(entry){ entry.trashed=true; entry.trashedAt=Date.now(); }
      if(state.notebookSelectedEntry===id) state.notebookSelectedEntry=null;
      await persist(); render();
      showToast('Retiré — envoyé à la corbeille.');
      return;
    }

    // ---- Notes-texte ----
    if(action==='new-textnote'){ state.modal={type:'textnote-form', payload:{entry:null}}; render(); return; }
    if(action==='save-textnote'){
      const nb = getOrCreateActiveNotebook();
      const text = document.getElementById('textnote-text').value.trim();
      const category = document.getElementById('textnote-category-input').value.trim();
      const fontFamily = document.getElementById('textnote-font').value;
      const color = document.getElementById('textnote-color-value').value;
      const hAlign = document.getElementById('textnote-halign-value').value || 'left';
      const inkPalette = document.getElementById('textnote-palette-value').value || 'pastel';
      if(!text){ markInvalid('textnote-text'); showToast('La note ne peut pas être vide.'); return; }
      if(!category){ markInvalid('textnote-category-input'); showToast('Choisis ou tape une catégorie.'); return; }
      if(id){
        const entry = state.data.entries.find(n=>n.id===id);
        if(entry){
          entry.text=text; entry.category=category; entry.fontFamily=fontFamily; entry.color=color; entry.hAlign=hAlign;
          const pageInput = document.getElementById('textnote-page');
          if(pageInput){ const maxPage = nb.pageCount||1; entry.page = Math.max(1, Math.min(maxPage, parseInt(pageInput.value,10)||1)); }
        }
      } else {
        state.data.entries.push({id:uid(), notebookId:nb.id, kind:'text', page:state.notebookActivePage||1, x:10+Math.round(Math.random()*40), y:10+Math.round(Math.random()*40), text, category, fontFamily, fontSize:16, rotation:0, color, hAlign, createdAt:Date.now()});
      }
      nb.inkPalette = inkPalette;
      await persist();
      state.modal=null; render();
      showToast('Note enregistrée.');
      return;
    }

    // ---- Autocollants (côté personne) ----
    if(action==='open-sticker-picker'){ state.modal={type:'sticker-picker', payload:{}}; render(); return; }
    if(action==='pick-sticker'){
      const stickerId = e.currentTarget.dataset.sticker;
      const grantId = e.currentTarget.dataset.grant;
      const nb = getOrCreateActiveNotebook();
      state.data.entries.push({id:uid(), notebookId:nb.id, kind:'sticker', stickerId, grantId:grantId||null, page:state.notebookActivePage||1, x:10+Math.round(Math.random()*40), y:10+Math.round(Math.random()*40), size:60, rotation:0, createdAt:Date.now()});
      if(grantId){
        await rpcPersonAction(state.session.name, state.session.code, 'claim_gifted_sticker', {id:grantId});
        state.data.stickerGrants = (state.data.stickerGrants||[]).filter(g=>g.id!==grantId);
      }
      await persist();
      state.modal=null; render();
      showToast('Autocollant ajouté.');
      return;
    }

    // ---- Partage ----
    if(action==='open-share'){
      state.shareRecipientType='coach'; state.shareSearchQuery=''; state.shareSelectedRecipient=null; state.shareSearchResults=[];
      state.modal={type:'share-form', payload:{entryId:id}}; render(); return;
    }
    if(action==='set-share-recipient-type'){ state.shareRecipientType = e.currentTarget.dataset.value; state.shareSearchQuery=''; state.shareSelectedRecipient=null; state.shareSearchResults=[]; render(); return; }
    if(action==='run-share-search'){
      const q = document.getElementById('share-search-input').value.trim();
      state.shareSearchQuery = q;
      state.shareSearchResults = q ? await rpcSearchAccounts(state.session.name, state.session.code, q) : [];
      render(); return;
    }
    if(action==='pick-share-recipient'){ state.shareSelectedRecipient = e.currentTarget.dataset.name; render(); return; }
    if(action==='clear-share-recipient'){ state.shareSelectedRecipient = null; render(); return; }
    if(action==='send-share'){
      const entryId = e.currentTarget.dataset.entry;
      const entry = state.data.entries.find(n=>n.id===entryId);
      if(!entry){ showToast('Note introuvable.'); return; }
      const recipientType = state.shareRecipientType || 'coach';
      let recipientName = null;
      if(recipientType==='person'){
        if(!state.shareSelectedRecipient){ showToast('Choisis d’abord une personne dans les résultats.'); return; }
        recipientName = state.shareSelectedRecipient;
      }
      const content = sharedItemContentFromEntry(entry);
      const item = Object.assign({}, content, {id:uid(), anonymous:false, recipientType, recipientName});
      const ok = await rpcShareItem(state.session.name, state.session.code, item);
      state.modal=null; render();
      showToast(ok ? 'Note envoyée !' : 'Erreur d’envoi.');
      return;
    }

    // ---- Reçu ----
    if(action==='open-received-items'){ state.modal={type:'received-items', payload:{}}; render(); return; }
    if(action==='claim-shared-item'){
      const item = (state.data.receivedItems||[]).find(it=>it.id===id);
      if(!item){ showToast('Introuvable.'); return; }
      const nb = getOrCreateActiveNotebook();
      const entry = Object.assign({}, item, {
        id: uid(), notebookId: nb.id, page: state.notebookActivePage||1,
        x: 10+Math.round(Math.random()*40), y: 10+Math.round(Math.random()*40),
        size: item.kind==='sticker' ? 60 : undefined, rotation: 0,
        fontSize: item.kind==='text' ? 16 : undefined, createdAt: Date.now(), shareId: item.id,
      });
      delete entry.anonymous; delete entry.recipientType; delete entry.recipientName; delete entry.senderName; delete entry.status; delete entry.decidedAt; delete entry.inappropriate;
      state.data.entries.push(entry);
      await rpcPersonAction(state.session.name, state.session.code, 'claim_shared_item', {id});
      state.data.receivedItems = (state.data.receivedItems||[]).filter(it=>it.id!==id);
      await persist();
      state.notebookOpened = true; state.notebookActivePage = entry.page;
      state.modal=null; render();
      showToast('Ajouté à ton carnet.');
      return;
    }
    if(action==='delete-shared-item'){
      await rpcPersonAction(state.session.name, state.session.code, 'delete_shared_item', {id});
      state.data.receivedItems = (state.data.receivedItems||[]).filter(it=>it.id!==id);
      render();
      showToast('Élément supprimé.');
      return;
    }
    if(action==='claim-gifted-sticker'){
      const grantId = e.currentTarget.dataset.grant;
      const grant = (state.data.stickerGrants||[]).find(g=>g.id===grantId);
      if(!grant){ showToast('Introuvable.'); return; }
      const sticker = state.data.stickers.find(s=>s.id===grant.stickerId);
      if(!sticker){ showToast('Autocollant introuvable.'); return; }
      const nb = getOrCreateActiveNotebook();
      const entryPage = state.notebookActivePage||1;
      state.data.entries.push({id:uid(), notebookId:nb.id, kind:'sticker', stickerId:sticker.id, grantId:grant.id, page:entryPage, x:10+Math.round(Math.random()*40), y:10+Math.round(Math.random()*40), size:60, rotation:0, createdAt:Date.now()});
      await rpcPersonAction(state.session.name, state.session.code, 'claim_gifted_sticker', {id:grantId});
      state.data.stickerGrants = (state.data.stickerGrants||[]).filter(g=>g.id!==grantId);
      await persist();
      state.notebookOpened = true; state.notebookActivePage = entryPage;
      state.modal=null; render();
      showToast('Ajouté à ton carnet.');
      return;
    }
    if(action==='delete-gifted-sticker'){
      const grantId = e.currentTarget.dataset.grant;
      await rpcPersonAction(state.session.name, state.session.code, 'delete_gifted_sticker', {id:grantId});
      state.data.stickerGrants = (state.data.stickerGrants||[]).filter(g=>g.id!==grantId);
      render();
      showToast('Autocollant supprimé.');
      return;
    }

    // ---- Corbeille ----
    if(action==='open-notebook-trash'){ state.modal={type:'notebook-trash', payload:{}}; render(); return; }
    if(action==='restore-entry'){
      const entry = state.data.entries.find(n=>n.id===id);
      if(entry){ entry.trashed=false; entry.page = state.notebookActivePage||1; }
      await persist();
      state.modal=null; render();
      showToast('Remis sur la page actuelle.');
      return;
    }
    if(action==='return-shared-to-origin'){
      const entry = state.data.entries.find(n=>n.id===id);
      if(entry && entry.shareId){
        const res = await rpcPersonAction(state.session.name, state.session.code, 'return_shared_to_inbox', {id:entry.shareId});
        if(res && res.ok){
          const content = sharedItemContentFromEntry(entry);
          state.data.receivedItems = state.data.receivedItems || [];
          state.data.receivedItems.unshift(Object.assign({id:entry.shareId, senderName:entry.senderName||'', anonymous:entry.anonymous||false}, content));
        }
        state.data.entries = state.data.entries.filter(n=>n.id!==id);
      }
      await persist();
      state.modal=null; render();
      showToast('Remis dans tes reçus.');
      return;
    }
    if(action==='return-sticker-to-bank'){
      const entry = state.data.entries.find(n=>n.id===id);
      if(entry && entry.grantId){
        const res = await rpcPersonAction(state.session.name, state.session.code, 'return_sticker_to_bank', {id:entry.grantId});
        if(res && res.ok){
          const sticker = state.data.stickers.find(s=>s.id===entry.stickerId);
          state.data.stickerGrants = state.data.stickerGrants || [];
          state.data.stickerGrants.unshift({id:entry.grantId, stickerId:entry.stickerId, message:'', used:false, grantedAt:Date.now()});
        }
        state.data.entries = state.data.entries.filter(n=>n.id!==id);
      }
      await persist();
      state.modal=null; render();
      showToast('Remis dans tes reçus.');
      return;
    }
    if(action==='permanently-delete-entry'){
      state.data.entries = state.data.entries.filter(n=>n.id!==id);
      await persist();
      state.modal=null; render();
      showToast('Supprimé définitivement.');
      return;
    }

    // ---- Signalement de bug ----
    if(action==='open-report-bug'){ state.modal={type:'report-bug'}; render(); return; }
    if(action==='submit-bug'){
      const text = document.getElementById('bug-text').value.trim();
      if(!text){ markInvalid('bug-text'); return; }
      const ok = await rpcReportBug(state.session.name, state.session.code, text);
      state.modal=null; render();
      showToast(ok ? 'Merci, c’est envoyé !' : 'Erreur d’envoi.');
      return;
    }
    if(action==='close-modal'){ state.modal=null; closeModalDom(); return; }

    // ==================== Espace gestionnaire ====================
    if(action==='create-account'){
      const name = document.getElementById('acc-name').value.trim();
      const code = document.getElementById('acc-code').value.trim();
      if(!name || !code){ markInvalid([!name?'acc-name':null, !code?'acc-code':null].filter(Boolean)); return; }
      const res = await rpcManagerAction(state.managerCode, 'create_account', {name, code});
      if(res && res.ok){
        const fresh = await rpcManagerLoad(state.managerCode);
        state.managerData = fresh; render();
        showToast('Compte créé.');
      } else showToast((res&&res.error)||'Erreur.');
      return;
    }
    if(action==='delete-account'){
      const name = e.currentTarget.dataset.name;
      if(!confirm(`Supprimer le compte de ${name} et tout son carnet ?`)) return;
      const res = await rpcManagerAction(state.managerCode, 'delete_account', {name});
      if(res && res.ok){
        state.managerData.accounts = state.managerData.accounts.filter(a=>a.name!==name);
        render();
        showToast('Compte supprimé.');
      } else showToast('Erreur.');
      return;
    }

    // ---- Banque d'autocollants (gestionnaire) ----
    if(action==='run-sticker-search'){ state.stickerSearchQuery = document.getElementById('sticker-search-input').value.trim(); render(); return; }
    if(action==='toggle-admin-sticker-group'){
      const g = e.currentTarget.dataset.group;
      state.expandedStickerGroups[g] = !state.expandedStickerGroups[g];
      render(); return;
    }
    if(action==='new-sticker'){ pendingStickerImage=null; state.modal={type:'sticker-form', payload:{entry:null, pendingAll:true, pendingAssigned:[]}}; render(); return; }
    if(action==='edit-sticker'){
      const s = state.managerData.meta.stickers.find(x=>x.id===id);
      if(!s) return;
      pendingStickerImage = null;
      state.modal = {type:'sticker-form', payload:{entry:s, pendingAll: !!s.availableToAll, pendingAssigned: (s.assignedNames||[]).slice()}};
      render(); return;
    }
    if(action==='delete-sticker'){
      const res = await rpcManagerAction(state.managerCode, 'delete_sticker', {id});
      if(res && res.ok){ state.managerData.meta.stickers = state.managerData.meta.stickers.filter(s=>s.id!==id); render(); showToast('Autocollant supprimé.'); }
      else showToast('Erreur.');
      return;
    }
    if(action==='toggle-sticker-all'){ state.modal.payload.pendingAll = e.currentTarget.checked; render(); return; }
    if(action==='sticker-assign-search'){
      const q = document.getElementById('sticker-assign-search').value.trim();
      state.modal.payload.searchQuery = q;
      const already = new Set(state.modal.payload.pendingAssigned.map(n=>n.toLowerCase()));
      state.modal.payload.searchResults = q ? state.managerData.accounts.filter(a=>normalizeStr(a.name).includes(normalizeStr(q)) && !already.has(a.name.toLowerCase())) : [];
      render(); return;
    }
    if(action==='sticker-assign-add'){
      const name = e.currentTarget.dataset.name;
      if(!state.modal.payload.pendingAssigned.find(n=>n.toLowerCase()===name.toLowerCase())) state.modal.payload.pendingAssigned.push(name);
      state.modal.payload.searchQuery=''; state.modal.payload.searchResults=[];
      render(); return;
    }
    if(action==='sticker-assign-remove'){
      const name = e.currentTarget.dataset.name;
      state.modal.payload.pendingAssigned = state.modal.payload.pendingAssigned.filter(n=>n.toLowerCase()!==name.toLowerCase());
      render(); return;
    }
    if(action==='save-sticker'){
      const name = document.getElementById('sticker-name').value.trim();
      if(!name){ markInvalid('sticker-name'); showToast('Donne un nom à l’autocollant.'); return; }
      const existing = id ? state.managerData.meta.stickers.find(s=>s.id===id) : null;
      const image = pendingStickerImage || (existing ? existing.image : null);
      if(!image){ showToast('Ajoute une image pour cet autocollant.'); return; }
      const pendingAll = state.modal.payload.pendingAll;
      const assignedNames = pendingAll ? [] : state.modal.payload.pendingAssigned.slice();
      const category = document.getElementById('sticker-category').value.trim();
      const payload = {id: id||undefined, name, image, category, availableToAll:pendingAll, assignedNames};
      const res = await rpcManagerAction(state.managerCode, 'save_sticker', payload);
      pendingStickerImage = null;
      if(res && res.ok){
        const fresh = await rpcManagerLoad(state.managerCode);
        state.managerData = fresh;
        state.modal=null; render();
        showToast('Autocollant enregistré.');
      } else showToast('Erreur.');
      return;
    }

    // ---- Cadeaux d'autocollants ----
    if(action==='open-sticker-grant-picker'){ state.modal={type:'sticker-grant-picker', payload:{name:e.currentTarget.dataset.name}}; render(); return; }
    if(action==='grant-sticker'){
      const stickerId = e.currentTarget.dataset.sticker;
      const name = e.currentTarget.dataset.name;
      const already = (state.managerData.meta.stickerGrants||[]).find(g=>g.stickerId===stickerId && g.name.toLowerCase()===name.toLowerCase() && !g.used);
      if(already){ showToast('Déjà offert.'); return; }
      const messageInput = document.getElementById('grant-message-input');
      const message = messageInput ? messageInput.value.trim() : '';
      const res = await rpcManagerAction(state.managerCode, 'grant_sticker', {stickerId, name, message});
      if(res && res.ok){
        const fresh = await rpcManagerLoad(state.managerCode);
        state.managerData = fresh; render();
        showToast('Autocollant offert.');
      } else showToast((res&&res.error)||'Erreur.');
      return;
    }
    if(action==='revoke-sticker-grant'){
      const res = await rpcManagerAction(state.managerCode, 'revoke_sticker_grant', {id});
      if(res && res.ok){ state.managerData.meta.stickerGrants = (state.managerData.meta.stickerGrants||[]).filter(g=>g.id!==id); render(); showToast('Autocollant retiré.'); }
      return;
    }

    // ---- Notes directes du coach ----
    if(action==='open-send-note-form'){ state.modal={type:'send-note-form', payload:{name:e.currentTarget.dataset.name}}; render(); return; }
    if(action==='send-coach-note'){
      const name = e.currentTarget.dataset.name;
      const text = document.getElementById('coach-note-text').value.trim();
      if(!text){ showToast('Écrivez un message.'); return; }
      const res = await rpcManagerAction(state.managerCode, 'send_note', {name, kind:'text', category:'Coach', text});
      if(res && res.ok){
        const fresh = await rpcManagerLoad(state.managerCode);
        state.managerData = fresh;
        state.modal=null; render();
        showToast('Note envoyée.');
      } else showToast('Erreur.');
      return;
    }

    // ---- Modération des notes partagées ----
    if(action==='approve-shared-item' || action==='refuse-shared-item' || action==='archive-shared-item' || action==='unflag-shared-item'){
      const map = {'approve-shared-item':'approve_shared_item','refuse-shared-item':'refuse_shared_item','archive-shared-item':'archive_shared_item','unflag-shared-item':'unflag_shared_item'};
      const res = await rpcManagerAction(state.managerCode, map[action], {id});
      if(res && res.ok){ const fresh = await rpcManagerLoad(state.managerCode); state.managerData = fresh; render(); showToast('Fait.'); }
      return;
    }
    if(action==='confirm-flag-shared-item'){ state.modal={type:'confirm-flag-shared-item', payload:{id}}; render(); return; }
    if(action==='flag-shared-item'){
      const res = await rpcManagerAction(state.managerCode, 'flag_shared_item', {id});
      if(res && res.ok){ const fresh = await rpcManagerLoad(state.managerCode); state.managerData = fresh; }
      state.modal=null; render();
      showToast('Message signalé — origine et destination visibles ci-dessous.');
      return;
    }
    if(action==='delete-shared-item-admin'){
      const res = await rpcManagerAction(state.managerCode, 'delete_shared_item_admin', {id});
      if(res && res.ok){ state.managerData.meta.sharedItems = (state.managerData.meta.sharedItems||[]).filter(s=>s.id!==id); render(); showToast('Supprimé définitivement.'); }
      return;
    }
    if(action==='toggle-archived-note'){ state.expandedArchivedNotes[id] = !state.expandedArchivedNotes[id]; render(); return; }

    // ---- Bugs ----
    if(action==='delete-bug'){
      const md = state.managerData;
      md.meta.bugReports = (md.meta.bugReports||[]).filter(b=>b.id!==id);
      await persistManagerMeta();
      render(); return;
    }
    if(action==='change-manager-code'){
      const newCode = document.getElementById('new-mgr-code').value.trim();
      if(!newCode){ markInvalid('new-mgr-code'); return; }
      const md = state.managerData;
      md.meta.managerCode = newCode;
      await persistManagerMeta();
      state.managerCode = newCode; storeManagerCode(newCode);
      showToast('Code gestionnaire changé.');
      return;
    }
  }

  function applyLoadResult(res){
    const blob = res.notebook || {};
    state.data = {
      notebooks: blob.notebooks || [],
      entries: blob.entries || [],
      activeNotebookId: blob.activeNotebookId || null,
      stickers: res.stickers || [],
      receivedItems: res.receivedItems || [],
      stickerGrants: res.stickerGrants || [],
    };
    state.notebookOpened = false;
    state.notebookActivePage = 1;
    state.notebookEditMode = false;
    state.notebookSelectedEntry = null;
    state.notebookFilterCategory = null;
  }

  // ---------- Démarrage ----------
  async function init(){
    if(!sb){ document.getElementById('app').innerHTML = '<p style="padding:40px;text-align:center;">Erreur de chargement (Supabase).</p>'; return; }
    loadStoredSession();
    if(state.session){
      const res = await rpcLoad(state.session.name, state.session.code);
      if(res){ applyLoadResult(res); state.view = 'notebook'; }
      else { state.session = null; storeSession(null); }
    }
    render();
  }

  init();
})();
</script>
</body>
</html>

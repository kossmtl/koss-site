            <button class="small-btn" data-action="toggle-create-account">Nouveau chez ${escapeHtml(state.data.config.name)} ? Créer un compte</button>
          </p>
        </div>
      `;
    }
    const email = state.studentSession.email;
    const acct = findStudentAccount(email);
    const showHiddenMemberships = !!state.accountShowHiddenMemberships;
    const allOwnMemberships = state.data.memberships.filter(m=>m.studentEmail.toLowerCase()===email.toLowerCase() && m.status!=='annulee');
    const hiddenOwnCount = allOwnMemberships.filter(m=>m.hiddenByStudent).length;
    const memberships = showHiddenMemberships ? allOwnMemberships : allOwnMemberships.filter(m=>!m.hiddenByStudent);
    const bookings = state.data.bookings.filter(b=>b.studentEmail.toLowerCase()===email.toLowerCase() && b.status!=='annulee')
      .sort((a,b)=>a.dateIso.localeCompare(b.dateIso));

    // L'abonnement actif n'est plus dupliqué ici depuis qu'il est toujours visible sous le
    // nom dans le coin en haut à droite (renderHeader) — évite un doublon d'affichage.
    const header = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <div>
          <h3 style="margin:0;">Mon compte</h3>
          <p class="muted" style="color:var(--chalk-dim);margin-top:4px;">${escapeHtml(acct?acct.name:email)} <span style="color:var(--chalk-dim);">(${escapeHtml(email)})</span></p>
        </div>
        <button class="small-btn" data-action="toggle-account-expand" title="${state.accountExpanded?'Réduire':'Agrandir'}" style="font-size:14px;padding:6px 10px;">${state.accountExpanded ? '▲' : '▼'}</button>
      </div>
    `;

    if(!state.accountExpanded){
      return `<div class="card">${header}</div>`;
    }

    return `
      <div class="card">
        ${header}
        <label style="margin-top:14px;">Photo de profil</label>
        <div style="display:flex;align-items:center;gap:12px;margin-top:6px;">
          ${acct && acct.photo ? `<img src="${acct.photo}" style="width:56px;height:56px;border-radius:50%;object-fit:cover;">` : `<span class="avatar-fallback" style="width:56px;height:56px;font-size:22px;">${escapeHtml((acct&&acct.name||'?').trim().charAt(0).toUpperCase())}</span>`}
          <div>
            <input type="file" id="acc-photo-file" accept="image/*" style="max-width:220px;">
            ${acct && acct.photo ? '<button class="small-btn" data-action="remove-photo" style="margin-top:6px;">Retirer la photo</button>' : ''}
          </div>
        </div>
        <div class="btn-row" style="margin-top:14px;"><button class="btn btn-secondary" data-action="student-logout">Déconnexion</button></div>

        <label style="margin-top:14px;">Mon carnet</label>
        <p class="muted" style="color:var(--chalk-dim);font-size:12px;margin-bottom:6px;">Un carnet personnel pour noter tes apprentissages.</p>
        <div class="btn-row">
          <button class="btn btn-primary" data-action="goto-notebook" data-profile="">Mon carnet</button>
          ${(acct.familyMembers||[]).map(f=>`<button class="btn btn-secondary" data-action="goto-notebook" data-profile="${f.id}">Carnet de ${escapeHtml(f.name)}</button>`).join('')}
        </div>

        <label style="margin-top:14px;">Prénom</label>
        <input id="acc-firstname" value="${escapeHtml(acct?(acct.firstName||''):'')}">
        <label style="margin-top:10px;">Nom</label>
        <input id="acc-lastname" value="${escapeHtml(acct?(acct.lastName||''):'')}">
        <div class="btn-row"><button class="btn btn-secondary" data-action="update-account-name">Enregistrer le nom</button></div>

        <label style="margin-top:18px;color:var(--chalk);">Téléphone (optionnel)</label>
        <input id="acc-phone" type="tel" value="${escapeHtml(acct&&acct.phone?acct.phone:'')}" placeholder="ex. 514-555-1234">
        <div class="btn-row"><button class="btn btn-secondary" data-action="update-account-phone">Enregistrer le téléphone</button></div>

        <label style="margin-top:18px;">Membres de la famille</label>
        <p class="muted" style="color:var(--chalk-dim);font-size:12px;margin-bottom:6px;">Ajoutez vos enfants pour réserver et gérer leurs abonnements sous votre compte.</p>
        ${(acct.familyMembers||[]).length ? acct.familyMembers.map(f=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;">
            <span>${escapeHtml(f.name)}${f.birthday?' <span style="color:var(--chalk-dim);font-size:11px;">· '+f.birthday+'</span>':''}</span>
            <span>
              <button class="small-btn" data-action="edit-family-member" data-id="${f.id}">Modifier</button>
              <button class="small-btn" data-action="confirm-delete-family-member" data-id="${f.id}" data-name="${escapeHtml(f.name)}">Retirer</button>
            </span>
          </div>
        `).join('') : ''}
        <div class="btn-row"><button class="btn btn-secondary" data-action="new-family-member">+ Ajouter un enfant</button></div>

        <label style="margin-top:18px;">Changer mon mot de passe</label>
        ${pwField('acc-current-pw', "Mot de passe actuel")}
        ${pwField('acc-new-pw', "Nouveau mot de passe", {wrapStyle:'margin-top:8px;'})}
        ${pwField('acc-confirm-pw', "Confirmer le nouveau mot de passe", {wrapStyle:'margin-top:8px;'})}
        <div class="btn-row"><button class="btn btn-secondary" data-action="update-account-password">Mettre à jour le mot de passe</button></div>

        <label style="margin-top:18px;">Mes abonnements (et ceux de la famille)</label>
        ${memberships.length ? memberships.map(m=>{
          const ds = membershipDisplayStatus(m);
          const hideBtn = ds==='expiree' ? ` <button class="small-btn" data-action="${m.hiddenByStudent?'unhide-membership-self':'hide-membership-self'}" data-id="${m.id}">${m.hiddenByStudent?'Afficher':'Masquer'}</button>` : '';
          const canInvoice = !m.grantedFree && m.planPrice != null && (ds==='active' || ds==='expiree');
          const invoiceBtn = canInvoice ? ` <button class="small-btn" data-action="send-invoice-email" data-id="${m.id}">🧾 Recevoir une facture</button>` : '';
          return `<div style="font-size:13px;margin-bottom:4px;">${escapeHtml(m.planName)}${m.profileId?' <span style="color:var(--chalk-dim);">(pour '+escapeHtml(getProfileName(acct,m.profileId))+')</span>':''} — ${membershipBadge(m)} ${ds==='active' ? '· '+membershipDetail(m) : ''}${hideBtn}${invoiceBtn}</div>`;
        }).join('') : '<p class="muted" style="color:var(--chalk-dim);">Aucun abonnement.</p>'}
        ${hiddenOwnCount ? `<button class="small-btn" style="margin-top:4px;" data-action="toggle-show-hidden-memberships-self">${showHiddenMemberships ? 'Cacher les abonnements masqués' : `Afficher les abonnements masqués (${hiddenOwnCount})`}</button>` : ''}
        <div class="btn-row"><button class="btn btn-primary" data-action="browse-plans">Acheter / ajouter un abonnement</button></div>

        <label style="margin-top:18px;">Mes réservations (et celles de la famille)</label>
        ${bookings.length ? `<table style="margin-top:6px;"><tr><th>Cours</th><th>Pour</th><th>Date</th><th>Statut</th><th></th></tr>${bookings.map(b=>{
          const c = state.data.classes.find(cl=>cl.id===b.classId);
          return `<tr><td>${c?escapeHtml(c.name):'—'}</td><td>${b.profileId?escapeHtml(getProfileName(acct,b.profileId)):'Moi'}</td><td>${b.dateIso}</td><td>${statusBadge(b.status)}</td><td><button class="small-btn" data-action="self-cancel" data-id="${b.id}">Annuler</button></td></tr>`;
        }).join('')}</table>` : '<p class="muted" style="color:var(--chalk-dim);">Aucune réservation.</p>'}

        <div style="margin-top:26px;border-top:1px solid var(--border);padding-top:14px;">
          <button class="small-btn" data-action="open-delete-account" style="color:var(--coral);">Supprimer mon compte</button>
        </div>
      </div>
    `;
  }

  function adminCard(key, title, contentHtml, titleColor, borderColor){
    if(!state.expandedAdminCards) state.expandedAdminCards = {};
    if(state.expandedAdminCards[key] === undefined) state.expandedAdminCards[key] = true;
    const isOpen = state.expandedAdminCards[key];
    return `
      <div class="card"${borderColor?` style="border-color:${borderColor};"`:''}>
        <button type="button" data-action="toggle-admin-card" data-card="${key}" style="width:100%;display:flex;justify-content:space-between;align-items:center;background:transparent;border:none;padding:0;cursor:pointer;">
          <h3 style="margin:0;${titleColor?'color:'+titleColor+';':''}">${title}</h3>
          <span style="font-family:var(--font-d);color:var(--chalk-dim);font-size:14px;">${isOpen?'▲':'▼'}</span>
        </button>
        ${isOpen ? `<div style="margin-top:12px;">${contentHtml}</div>` : ''}
      </div>
    `;
  }

  function renderManagersSection(){
    const me = currentManager();
    const isSuper = me && me.role === 'super';
    const rows = state.data.managers.map(m=>`
      <li>
        <span><strong>${escapeHtml(m.name)}</strong> ${m.role==='super'?'<span style="color:var(--amber);font-size:11px;">(super gestionnaire)</span>':''}${m.id===state.currentManagerId?' <span style="color:var(--sage);font-size:11px;">(vous)</span>':''}<br><span style="color:var(--chalk-dim);font-size:11px;">NIP : ${escapeHtml(m.pin)}</span></span>
        ${isSuper ? `
          <span>
            <button class="small-btn" data-action="edit-manager" data-id="${m.id}">Modifier</button>
            ${m.id!==state.currentManagerId ? `<button class="small-btn" data-action="delete-manager" data-id="${m.id}">Supprimer</button>` : ''}
          </span>
        ` : ''}
      </li>
    `).join('');
    return `
      <ul class="link-list">${rows}</ul>
      ${isSuper ? `<div class="btn-row"><button class="btn btn-primary" data-action="new-manager">+ Ajouter un gestionnaire</button></div>` : '<p class="muted" style="color:var(--chalk-dim);">Seul le super gestionnaire peut ajouter ou modifier des gestionnaires.</p>'}
    `;
  }

  function renderNotebook(){
    const acct = findStudentAccount(state.studentSession.email);
    if(!acct) return '<p>Session expirée.</p>';
    const profileId = state.notebookProfileId || null;
    const ownerName = profileId ? getProfileName(acct, profileId) : acct.name;
    const ownerKey = notebookOwnerKey(acct.email, profileId);
    const backBtn = `<div class="btn-row" style="margin-top:0;margin-bottom:14px;"><button class="btn btn-secondary" data-action="goto-account">← Retour à Mon compte</button></div>`;
    const myNotebooks = getNotebooksForOwner(ownerKey);
    const activeNotebook = getOrCreateActiveNotebook(ownerKey);
    const settings = activeNotebook;

    if(!state.notebookOpened){
      const coverBgStyle = `background:${activeNotebook.coverColor};${notebookTextureCss(activeNotebook.coverTexture)}`;
      return `
        ${backBtn}
        ${myNotebooks.length > 1 ? `
          <div class="btn-row" style="margin-top:0;margin-bottom:14px;">
            <select id="nb-select-cover" class="nb-switch-select">
              ${myNotebooks.map(nb=>`<option value="${nb.id}" ${nb.id===activeNotebook.id?'selected':''}>${escapeHtml(nb.name)}</option>`).join('')}
            </select>
            <button class="small-btn" data-action="switch-notebook" data-select="nb-select-cover">Changer</button>
          </div>
        ` : ''}
        <div class="notebook-cover" style="${coverBgStyle}">
          <div class="koss-logo-wrap" id="koss-logo-wrap" style="left:${activeNotebook.kossLogoX ?? 50}%;top:${activeNotebook.kossLogoY ?? 8}%;color:${activeNotebook.coverTextColor};">
            <div class="koss-logo-main" id="koss-logo-main">K-OSS</div>
          </div>
          <div class="owner-name" style="color:${activeNotebook.coverTextColor};font-family:${textnoteFontCss(activeNotebook.titleFont||'marker')};font-size:${activeNotebook.titleSize||32}px;">${escapeHtml(activeNotebook.name)}</div>
          <p class="muted" style="color:${activeNotebook.coverTextColor};opacity:0.75;margin:0;font-family:${textnoteFontCss(activeNotebook.nameFont||'sans')};font-size:${activeNotebook.nameSize||14}px;">${escapeHtml(ownerName)}</p>
          <div class="btn-row" style="justify-content:center;">
            <button class="btn btn-primary" data-action="open-notebook-cover" style="margin-top:10px;">Ouvrir mon carnet</button>
            <button class="btn btn-secondary" data-action="new-notebook" style="margin-top:10px;">+ Nouveau carnet</button>
            <button class="small-btn" data-action="open-notebook-settings" style="margin-top:10px;">⚙ Personnaliser</button>
            <button class="small-btn" data-action="delete-notebook" data-notebook="${activeNotebook.id}" style="margin-top:10px;color:var(--coral);">🗑 Supprimer ce carnet</button>
          </div>
        </div>
      `;
    }

    const entries = state.data.notebookEntries.filter(n=>n.ownerKey===ownerKey && n.notebookId===activeNotebook.id && !n.trashed).sort((a,b)=>b.createdAt-a.createdAt);
    const usedCategories = Array.from(new Set(entries.map(n=>(n.category||'').trim()).filter(Boolean)));
    const searchOpen = !!state.notebookSearchOpen;
    const searchQuery = state.notebookSearchQuery || '';
    const pageCount = activeNotebook.pageCount || 1;
    const activePage = Math.min(state.notebookActivePage || 1, pageCount);

    let searchResultsHtml = '';
    if(searchOpen){
      const qn = normalizeStr(searchQuery);
      const matches = qn ? entries.filter(n=> normalizeStr(n.text||'').includes(qn) || normalizeStr(n.category||'').includes(qn)) : [];
      searchResultsHtml = `
        <div style="margin-bottom:12px;padding:10px;border:1px solid var(--border);border-radius:8px;">
          <input id="nb-search-input" placeholder="Chercher un mot-clé..." value="${escapeHtml(searchQuery)}">
          <div class="btn-row"><button class="btn btn-secondary" data-action="run-notebook-search">Chercher</button><button class="small-btn" data-action="toggle-notebook-search">Fermer</button></div>
          ${qn ? (matches.length ? `<ul class="link-list" style="margin-top:8px;">${matches.map(n=>`
            <li>
              <span>${escapeHtml(n.category)} — ${escapeHtml((n.text||'').slice(0,60))}${(n.text||'').length>60?'…':''}<br><span style="color:var(--chalk-dim);font-size:11px;">Page ${n.page||1}</span></span>
              <span><button class="small-btn" data-action="goto-notebook-page" data-page="${n.page||1}">Aller à la page</button></span>
            </li>
          `).join('')}</ul>` : '<p class="muted" style="color:var(--chalk-dim);margin-top:8px;">Aucun résultat.</p>') : ''}
        </div>
      `;
    }

    // Chaque page a une place fixe : 1 à 20 toujours à gauche, 21 à 40 toujours à droite —
    // on ne fait plus glisser la fenêtre de pages selon la page active, seule la mise en
    // surbrillance (classe "active") bouge.
    const leftTabs = [];
    for(let p=1; p<=Math.min(20, pageCount); p++) leftTabs.push(p);
    const rightTabs = [];
    for(let p=21; p<=Math.min(pageCount, 40); p++) rightTabs.push(p);

    const pageEntries = entries.filter(n=>(n.page||1)===activePage);

    return `
      ${backBtn}
      ${myNotebooks.length > 1 ? `
        <div class="btn-row" style="margin-top:0;margin-bottom:10px;">
          <select id="nb-select-active" class="nb-switch-select">
            ${myNotebooks.map(nb=>`<option value="${nb.id}" ${nb.id===activeNotebook.id?'selected':''}>${escapeHtml(nb.name)}</option>`).join('')}
          </select>
          <button class="small-btn" data-action="switch-notebook" data-select="nb-select-active">Changer</button>
        </div>
      ` : ''}
      <div class="btn-row" style="margin-bottom:10px;">
        <button class="small-btn" data-action="close-notebook-cover">← Fermer le carnet</button>
        <button class="small-btn" data-action="open-notebook-settings">⚙ Personnaliser</button>
        <button class="small-btn" data-action="new-notebook">+ Nouveau carnet</button>
        <button class="small-btn ${state.notebookEditMode?'active':''}" data-action="toggle-notebook-edit-mode" style="${state.notebookEditMode?'background:var(--amber);color:var(--ink);':''}">${state.notebookEditMode ? '✓ Mode édition' : '✎ Modifier le carnet'}</button>
        <button class="small-btn" data-action="open-received-items" data-owner="${escapeHtml(ownerKey)}" style="${(receivedItemsForOwner(ownerKey).length+giftedStickersForOwner(ownerKey).length)?'background:var(--amber);color:var(--ink);':''}">📥 Reçu${(receivedItemsForOwner(ownerKey).length+giftedStickersForOwner(ownerKey).length)?' ('+(receivedItemsForOwner(ownerKey).length+giftedStickersForOwner(ownerKey).length)+')':''}</button>
        <button class="small-btn" data-action="open-notebook-trash" data-owner="${escapeHtml(ownerKey)}">🗑 Corbeille${trashedItemsForOwner(ownerKey).length?' ('+trashedItemsForOwner(ownerKey).length+')':''}</button>
        <button class="small-btn" data-action="delete-notebook" data-notebook="${activeNotebook.id}" style="color:var(--coral);">🗑 Supprimer ce carnet</button>
      </div>
      <div style="margin-bottom:10px;">
        <button class="category-chip ${!state.notebookFilterCategory?'active':''}" data-action="filter-notebook-category" data-category="">Tous</button>
        ${usedCategories.map(cat=>`<button class="category-chip ${state.notebookFilterCategory===cat?'active':''}" data-action="filter-notebook-category" data-category="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`).join('')}
      </div>
      ${searchResultsHtml}
      ${state.notebookFilterCategory ? `
        <div class="notebook-page" style="${notebookPageBgCss(settings)}">
          <div class="notebook-postits">
            ${entries.filter(n=>n.category===state.notebookFilterCategory).map(n=> n.kind==='text' ? `
              <div class="postit" style="background:transparent;box-shadow:none;border:1px dashed rgba(40,41,46,0.3);font-family:${textnoteFontCss(n.fontFamily)};color:${n.color||TEXTNOTE_INK_COLORS[0]};">
                <div class="postit-cat" style="color:rgba(40,41,46,0.6);">${escapeHtml(n.category)}</div>
                <div class="postit-text">${escapeHtml(n.text)}</div>
                <div class="postit-actions">
                  <button data-action="goto-notebook-page" data-page="${n.page||1}">Page ${n.page||1}</button>
                  <button data-action="edit-postit" data-id="${n.id}">Modifier</button>
                  <button data-action="open-share" data-id="${n.id}" data-owner="${escapeHtml(ownerKey)}">Partager</button>
                </div>
              </div>
            ` : `
              <div class="postit" style="background:${n.color};">
                <div class="postit-cat">${escapeHtml(n.category)}</div>
                <div class="postit-text">${escapeHtml(n.text)}</div>
                ${n.photo ? `<img src="${n.photo}">` : ''}
                <div class="postit-actions">
                  <button data-action="goto-notebook-page" data-page="${n.page||1}">Page ${n.page||1}</button>
                  <button data-action="edit-postit" data-id="${n.id}">Modifier</button>
                  <button data-action="open-share" data-id="${n.id}" data-owner="${escapeHtml(ownerKey)}">Partager</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      ` : `
        <div class="notebook-frame">
          <div class="notebook-tabs left">
            <div class="nb-tab nb-search" data-action="toggle-notebook-search">🔍</div>
            ${leftTabs.map(p=>`<div class="nb-tab ${p===activePage?'active':''}" data-action="goto-notebook-page" data-page="${p}">${p}</div>`).join('')}
          </div>
          <div class="notebook-canvas notebook-page" style="${notebookPageBgCss(settings)}" id="nb-canvas">
            ${pageEntries.filter(n=>n.kind!=='text' && n.kind!=='sticker').map(n=>`
              <div class="postit postit-free" data-id="${n.id}" style="left:${n.x||0}%;top:${n.y||0}%;background:${n.color};">
                <div class="postit-cat">${escapeHtml(n.category)}</div>
                <div class="postit-text">${escapeHtml(n.text)}</div>
                ${n.photo ? `<img src="${n.photo}">` : ''}
                ${state.notebookEditMode ? `
                <div class="postit-actions">
                  <button data-action="edit-postit" data-id="${n.id}">Modifier</button>
                  <button data-action="delete-postit" data-id="${n.id}">Retirer</button>
                  <button data-action="open-share" data-id="${n.id}" data-owner="${escapeHtml(ownerKey)}">Partager</button>
                </div>
                ` : ''}
              </div>
            `).join('')}
            ${pageEntries.filter(n=>n.kind==='text').map(n=>{
              const hAlign = n.hAlign||'left';
              const tx = hAlign==='right' ? '-100%' : (hAlign==='center' ? '-50%' : '0');
              const wide = (hAlign==='center' || hAlign==='justify');
              const wrapStyle = wide ? 'width:200px;' : '';
              const contentStyle = wide ? 'display:block;width:100%;' : '';
              return `
              <div class="textnote-free ${n.id===state.notebookSelectedEntry?'selected':''}" data-id="${n.id}" style="left:${n.x||0}%;top:${n.y||0}%;translate:${tx} 0;transform:rotate(${n.rotation||0}deg);text-align:${hAlign};${wrapStyle}font-family:${textnoteFontCss(n.fontFamily)};font-size:${n.fontSize||16}px;color:${n.color||TEXTNOTE_INK_COLORS[0]};"><span class="textnote-content" style="${contentStyle}">${escapeHtml(n.text)}</span>
                ${state.notebookEditMode && n.id===state.notebookSelectedEntry ? `
                  <button type="button" class="free-handle rotate-handle" data-id="${n.id}" title="Pivoter">↻</button>
                  <button type="button" class="free-handle resize-handle" data-id="${n.id}" title="Redimensionner">⤡</button>
                ` : ''}
                ${state.notebookEditMode ? `
                <div class="textnote-toolbar">
                  <button data-action="edit-postit" data-id="${n.id}">Modifier</button>
                  <button data-action="delete-postit" data-id="${n.id}">Retirer</button>
                  <button data-action="open-share" data-id="${n.id}" data-owner="${escapeHtml(ownerKey)}">Partager</button>
                </div>
                ` : ''}
              </div>
            `;}).join('')}
            ${pageEntries.filter(n=>n.kind==='sticker').map(n=>{
              const sticker = state.data.stickers.find(s=>s.id===n.stickerId);
              if(!sticker) return '';
              return `
              <div class="sticker-free ${n.id===state.notebookSelectedEntry?'selected':''}" data-id="${n.id}" style="left:${n.x||0}%;top:${n.y||0}%;transform:rotate(${n.rotation||0}deg);width:${n.size||60}px;">
                <img src="${sticker.image}" style="width:${n.size||60}px;">
                ${state.notebookEditMode && n.id===state.notebookSelectedEntry ? `
                  <button type="button" class="free-handle rotate-handle" data-id="${n.id}" title="Pivoter">↻</button>
                  <button type="button" class="free-handle resize-handle" data-id="${n.id}" title="Redimensionner">⤡</button>
                ` : ''}
                ${state.notebookEditMode ? `
                <div class="textnote-toolbar">
                  <button data-action="delete-postit" data-id="${n.id}">Retirer</button>
                  <button data-action="open-share" data-id="${n.id}" data-owner="${escapeHtml(ownerKey)}">Partager</button>
                </div>
                ` : ''}
              </div>
            `;
            }).join('')}
            <div class="btn-row" style="position:absolute;bottom:10px;right:10px;">
              <button class="btn btn-primary" data-action="new-postit" style="font-family:var(--font-b);">+ Note</button>

  function buildAttendanceTileHtml(c, dateIso){
    const count = state.data.bookings.filter(b=>b.classId===c.id && b.dateIso===dateIso && b.status==='confirmee').length;
    const accent = categoryAccent(c.category);
    const isRainbow = c.name && c.name.trim()==='Queers & Allies';
    const nameColor = isRainbow ? '#FFFBF8' : accent;
    const tint = categoryTint(c.category);
    const tileStyle = isRainbow ? '' : ` style="border-left-color:${accent};${tint ? `background:${tint};` : ''}"`;
    const tileInner = `
      <div class="class-tile"${tileStyle} data-action="open-attendance" data-class="${c.id}" data-date="${dateIso}">
        <div class="class-time">${c.time} <span style="color:var(--chalk);font-weight:700;">· ${categoryLabel(c.category)}</span> ${c.free ? '<span style="color:var(--sage);">· gratuit</span>' : ''}</div>
        <div class="class-name" style="color:${nameColor};">${escapeHtml(c.name)}</div>
        <div class="class-spots">${count} inscrit(s)</div>
      </div>
    `;
    return isRainbow ? `<div class="rainbow-wrap">${tileInner}</div>` : tileInner;
  }

  function renderAttendance(){
    // Les gestionnaires normaux ne voient que les cours d'aujourd'hui ; seul le super
    // gestionnaire peut naviguer les autres semaines et voir l'historique complet.
    const mgr = currentManager();
    const isSuperMgr = !!(mgr && mgr.role==='super');
    if(!isSuperMgr) state.weekOffset = 0;
    const dates = getWeekDates(state.weekOffset);
    let anyClass = false;
    let weekHasMorning = false;
    let weekHasAfternoon = false;
    const today = todayIso();
    let dayData = dates.map((d,i)=>{
      const dateIso = isoDate(d);
      const dayClasses = state.data.classes.filter(c=>c.dayOfWeek===i)
        .filter(c=> (!c.startDate || dateIso >= c.startDate) && (!c.endDate || dateIso <= c.endDate))
        .sort((a,b)=>a.time.localeCompare(b.time));
      if(dayClasses.length) anyClass = true;
      const morning = dayClasses.filter(c=>c.time < '12:01');
      const afternoon = dayClasses.filter(c=>c.time >= '12:01');
      if(morning.length) weekHasMorning = true;
      if(afternoon.length) weekHasAfternoon = true;
      return {d, i, dateIso, dayClasses, morning, afternoon};
    });
    if(!isSuperMgr){
      dayData = dayData.filter(dd=>dd.dateIso===today);
      anyClass = dayData.some(dd=>dd.dayClasses.length);
    }
    const splitAmPm = weekHasMorning && weekHasAfternoon && window.innerWidth > 700;
    let cols = '';
    if(splitAmPm){
      cols += '<div class="board board-am">';
      dayData.forEach(({d,i,dateIso,morning})=>{
        const tiles = morning.map(c=>buildAttendanceTileHtml(c, dateIso)).join('');
        cols += `
          <div class="day-col">
            <div class="day-head">${DAYS_SHORT[i]} <span class="num">${formatDayNum(d)}</span></div>
            ${tiles}
          </div>
        `;
      });
      cols += '</div><div class="week-divider"></div><div class="board board-pm">';
      dayData.forEach(({dateIso,afternoon})=>{
        const tiles = afternoon.map(c=>buildAttendanceTileHtml(c, dateIso)).join('');
        cols += `<div class="day-col">${tiles}</div>`;
      });
      cols += '</div>';
    } else {
      dayData.forEach(({d,i,dateIso,dayClasses})=>{
        const tiles = dayClasses.map(c=>buildAttendanceTileHtml(c, dateIso)).join('');
        cols += `
          <div class="day-col">
            <div class="day-head">${DAYS_SHORT[i]} <span class="num">${formatDayNum(d)}</span></div>
            ${tiles || '<div style="font-size:12px;color:var(--chalk-dim);">—</div>'}
          </div>
        `;
      });
    }

    return `
      <div class="btn-row" style="margin-top:0;margin-bottom:14px;"><button class="btn btn-secondary" data-action="goto-admin">← Retour à Gérer</button></div>
      <h3 style="font-family:var(--font-d);text-transform:uppercase;letter-spacing:0.01em;">Prise de présences</h3>
      ${isSuperMgr ? `
      <div class="week-nav">
        <button data-action="week-prev"><span class="full-text">← Semaine préc.</span><span class="short-text">Semaine<br>← Préc.</span></button>
        <span class="week-label">${weekLabel(state.weekOffset)}</span>
        <button data-action="week-next"><span class="full-text">Semaine suiv. →</span><span class="short-text">Semaine<br>Suiv. →</span></button>
        ${state.weekOffset!==0 ? '<button data-action="week-today">Aujourd\'hui</button>' : ''}
      </div>
      ` : `<p class="muted" style="color:var(--chalk-dim);">Cours d’aujourd’hui seulement.</p>`}
      ${anyClass ? (splitAmPm ? cols : `<div class="board">${cols}</div>`) : `<div class="board"><div class="empty-note">${isSuperMgr ? 'Aucun cours programmé cette semaine.' : 'Aucun cours aujourd’hui.'}</div></div>`}
    `;
  }

  function renderAdmin(){
    const today = todayIso();
    const upcomingBookings = state.data.bookings
      .filter(b=>b.status!=='annulee' && isoDate(new Date(b.createdAt))===today)
      .sort((a,b)=> b.createdAt-a.createdAt);

    const toConfirmMemberships = state.data.memberships.filter(m=>m.status==='paiement_declare');

    // Revenu du mois en cours : uniquement l'argent réellement passé par Helcim (carte),
    // pas les abonnements payés sur place, offerts ou importés — ceux-là ne sont pas de
    // l'argent encaissé automatiquement et ne doivent pas gonfler ce chiffre.
    const nowForRevenue = new Date();
    const monthStart = new Date(nowForRevenue.getFullYear(), nowForRevenue.getMonth(), 1);
    const monthLabel = nowForRevenue.toLocaleDateString('fr-CA', {month:'long', year:'numeric'});
    const monthSales = state.data.memberships.filter(m=> m.paidViaHelcim && new Date(m.paidViaHelcimAt||m.createdAt) >= monthStart);
    const monthRevenue = monthSales.reduce((sum,m)=>{
      const plan = state.data.membershipPlans.find(p=>p.id===m.planId);
      const amountStr = m.planPrice || (plan?plan.price:'') || '';
      return sum + parsePriceAmount(amountStr);
    }, 0);

    const ADMIN_GROUPS = [
      {key:'bjj_adulte', label:'BJJ Adulte'},

      {key:'muay_thai', label:'Muay Thai'},
      ...(state.data.customCategories||[]),
      {key:'ALL_UNLIMITED', label:'All Unlimited'},
    ];
    if(!state.expandedClassGroups) state.expandedClassGroups = {};
    if(!state.expandedPlanGroups) state.expandedPlanGroups = {};

    const classesByCategory = state.data.classes.slice().sort((a,b)=>a.dayOfWeek-b.dayOfWeek || a.time.localeCompare(b.time));
    let classRows = ADMIN_GROUPS.filter(g=>g.key!=='ALL_UNLIMITED').map(g=>{
      const items = classesByCategory.filter(c=>c.category===g.key);
      if(!items.length) return '';
      const isOpen = !!state.expandedClassGroups[g.key];
      const seenWindows = new Set();
      let logicalCount = 0;
      items.forEach(c=>{
        if(c.startDate && c.endDate){
          const key = c.startDate+'|'+c.endDate;
          if(!seenWindows.has(key)){ seenWindows.add(key); logicalCount++; }
        } else {
          logicalCount++;
        }
      });
      const programGroups = new Map();
      const standaloneItems = [];
      items.forEach(c=>{
        if(c.startDate && c.endDate){
          const key = c.startDate+'|'+c.endDate;
          if(!programGroups.has(key)) programGroups.set(key, []);
          programGroups.get(key).push(c);
        } else {
          standaloneItems.push(c);
        }
      });
      const programRows = Array.from(programGroups.values()).map(sibsRaw=>{
        const sibs = sibsRaw.slice().sort((a,b)=>a.dayOfWeek-b.dayOfWeek);
        const first = sibs[0];
        const dayLabel = sibs.map(s=>DAYS[s.dayOfWeek]).join(' et ');
        const timeLabel = Array.from(new Set(sibs.map(s=>s.time))).join(', ');
        const editBtns = sibs.map(s=>`<button class="small-btn" data-action="edit-class" data-id="${s.id}">Modifier (${DAYS[s.dayOfWeek].slice(0,3)})</button>`).join('');
        const delBtns = sibs.map(s=>`<button class="small-btn" data-action="delete-class" data-id="${s.id}">Supprimer (${DAYS[s.dayOfWeek].slice(0,3)})</button>`).join('');

          <span><strong>${escapeHtml(first.name)}</strong>${first.free ? ' <span style="color:var(--sage);">(gratuit)</span>' : ''} — ${dayLabel} ${timeLabel} · ${first.capacity} places · ${first.price}<br><span style="color:var(--amber);font-size:11px;">Programme : ${first.startDate||'\u2014'} \u2192 ${first.endDate||'\u2014'}</span></span>
          <span>${editBtns}${delBtns}</span>

      const draw = ()=>{
        ctx.clearRect(0,0,size,size);
        const w = cropState.img.width * cropState.scale;
        const h = cropState.img.height * cropState.scale;
        const x = size/2 - w/2 + cropState.offsetX;
        const y = size/2 - h/2 + cropState.offsetY;
        ctx.drawImage(cropState.img, x, y, w, h);
      };
      const clamp = ()=>{
        const w = cropState.img.width*cropState.scale;
        const h = cropState.img.height*cropState.scale;
        const maxOffsetX = Math.max(0,(w-size)/2);
        const maxOffsetY = Math.max(0,(h-size)/2);
        cropState.offsetX = Math.max(-maxOffsetX, Math.min(maxOffsetX, cropState.offsetX));
        cropState.offsetY = Math.max(-maxOffsetY, Math.min(maxOffsetY, cropState.offsetY));
      };
      draw();
      canvas.addEventListener('pointerdown', (ev)=>{
        cropState.dragging = true;
        cropState.lastX = ev.clientX; cropState.lastY = ev.clientY;
        canvas.style.cursor = 'grabbing';
        try{ canvas.setPointerCapture(ev.pointerId); }catch(err){}

        cropState.lastX = ev.clientX; cropState.lastY = ev.clientY;
        clamp(); draw();
      });
      const endDrag = ()=>{ cropState.dragging = false; canvas.style.cursor = 'grab'; };
      canvas.addEventListener('pointerup', endDrag);
      canvas.addEventListener('pointerleave', endDrag);
      if(zoomInput){
        zoomInput.addEventListener('input', ()=>{

  function formatDisplayName(fullName){
    const parts = String(fullName||'').trim().split(/\s+/).filter(Boolean);
    if(parts.length === 0) return '';
    if(parts.length === 1) return parts[0];
    const first = parts[0];
    const lastInitial = parts[parts.length-1].charAt(0).toUpperCase();
    return `${first} ${lastInitial}.`;
  }

  function attachHandlers(scope){
    const root = scope || document.getElementById('app');
    root.querySelectorAll('[data-action]').forEach(node=>{
      // Filet de sécurité : si onAction (ou un render() qu'il déclenche) lève une erreur
      // inattendue, on l'affiche/loggue au lieu de laisser l'app silencieusement figée
      // (plus rien ne réagit aux clics) sans que personne ne sache pourquoi.
      node.addEventListener('click', (e)=>{
        Promise.resolve(onAction(e)).catch(err=>{
          console.error('Erreur dans onAction:', err);
          showToast('Une erreur est survenue. Rafraîchissez la page si l’app ne répond plus.');
        });
      });
    });
  }

  function attachNotebookDrag(){
    const canvas = document.getElementById('nb-canvas');
    if(!canvas) return;
    if(!state.notebookEditMode) return;
    let dragEl = null, dragId = null, startX = 0, startY = 0, startLeft = 0, startTop = 0, moved = false;

    function onMove(ev){
      if(!dragEl) return;
      const point = ev.touches ? ev.touches[0] : ev;
      const dxPx = point.clientX - startX;
      const dyPx = point.clientY - startY;
      if(Math.abs(dxPx) > 3 || Math.abs(dyPx) > 3) moved = true;
      const rect = canvas.getBoundingClientRect();
      const dxPct = (dxPx / rect.width) * 100;
      const dyPct = (dyPx / rect.height) * 100;
      let newLeft = startLeft + dxPct;
      let newTop = startTop + dyPct;
      newLeft = Math.max(0, Math.min(85, newLeft));
      newTop = Math.max(0, Math.min(88, newTop));
      dragEl.style.left = newLeft + '%';
      dragEl.style.top = newTop + '%';
    }
    async function onUp(){
      if(!dragEl) return;
      const el = dragEl, wasMoved = moved;
      dragEl.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      dragEl = null;
      if(wasMoved){
        const entry = state.data.notebookEntries.find(n=>n.id===dragId);
        if(entry){
          entry.x = parseFloat(el.style.left);
          entry.y = parseFloat(el.style.top);
          await persist();
        }
      } else if(el.classList.contains('textnote-free') || el.classList.contains('sticker-free')){
        state.notebookSelectedEntry = state.notebookSelectedEntry === dragId ? null : dragId;
        render();
      }
    }
    canvas.addEventListener('mousedown', (ev)=>{
      if(ev.target === canvas && state.notebookSelectedEntry){ state.notebookSelectedEntry = null; render(); }
    });
    canvas.querySelectorAll('.postit-free, .textnote-free, .sticker-free').forEach(node=>{
      const startDrag = (ev)=>{
        if(ev.target.closest('button')) return;
        const point = ev.touches ? ev.touches[0] : ev;
        dragEl = node;
        dragId = node.dataset.id;
        moved = false;
        startX = point.clientX;
        startY = point.clientY;
        startLeft = parseFloat(node.style.left) || 0;
        startTop = parseFloat(node.style.top) || 0;
        node.classList.add('dragging');
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        document.addEventListener('touchmove', onMove, {passive:false});
        document.addEventListener('touchend', onUp);
        ev.preventDefault();
      };
      node.addEventListener('mousedown', startDrag);
      node.addEventListener('touchstart', startDrag, {passive:false});
    });
  }

  function attachFreeHandles(){
    const canvas = document.getElementById('nb-canvas');
    if(!canvas) return;

    canvas.querySelectorAll('.rotate-handle').forEach(handle=>{
      const wrap = handle.closest('.textnote-free, .sticker-free');
      if(!wrap) return;
      const id = handle.dataset.id;
      const start = (ev)=>{
        ev.preventDefault(); ev.stopPropagation();
        const point = ev.touches ? ev.touches[0] : ev;
        const rect = wrap.getBoundingClientRect();
        const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
        const entry = state.data.notebookEntries.find(n=>n.id===id);
        const startRotation = (entry && entry.rotation) || 0;
        const startAngle = Math.atan2(point.clientY-cy, point.clientX-cx) * 180/Math.PI;
        let pendingRotation = startRotation;
        function onMove(mv){
          const p = mv.touches ? mv.touches[0] : mv;
          const angle = Math.atan2(p.clientY-cy, p.clientX-cx) * 180/Math.PI;
          pendingRotation = Math.round(startRotation + (angle-startAngle));
          wrap.style.transform = `rotate(${pendingRotation}deg)`;
        }
        async function onEnd(){
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onEnd);
          document.removeEventListener('touchmove', onMove);
          document.removeEventListener('touchend', onEnd);
          if(entry){
            entry.rotation = pendingRotation;
            await persist();
          }
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, {passive:false});
        document.addEventListener('touchend', onEnd);
      };
      handle.addEventListener('mousedown', start);
      handle.addEventListener('touchstart', start, {passive:false});
    });

    canvas.querySelectorAll('.resize-handle').forEach(handle=>{
      const wrap = handle.closest('.textnote-free, .sticker-free');
      if(!wrap) return;
      const id = handle.dataset.id;
      const isSticker = wrap.classList.contains('sticker-free');
      const start = (ev)=>{
        ev.preventDefault(); ev.stopPropagation();
        const point = ev.touches ? ev.touches[0] : ev;
        const rect = wrap.getBoundingClientRect();
        const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
        const startDist = Math.max(20, Math.hypot(point.clientX-cx, point.clientY-cy));
        const entry = state.data.notebookEntries.find(n=>n.id===id);
        const startSize = isSticker ? (entry.size||60) : (entry.fontSize||16);
        const minSize = isSticker ? 24 : 10;
        const maxSize = isSticker ? 240 : 60;
        let pendingSize = startSize;
        function onMove(mv){
          const p = mv.touches ? mv.touches[0] : mv;
          const dist = Math.max(20, Math.hypot(p.clientX-cx, p.clientY-cy));
          const scale = dist/startDist;
          pendingSize = Math.round(Math.max(minSize, Math.min(maxSize, startSize*scale)));
          if(isSticker){
            wrap.style.width = pendingSize+'px';
            const img = wrap.querySelector('img'); if(img) img.style.width = pendingSize+'px';
          } else {
            wrap.style.fontSize = pendingSize+'px';
          }
        }
        async function onEnd(){
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onEnd);
          document.removeEventListener('touchmove', onMove);
          document.removeEventListener('touchend', onEnd);
          if(entry){
            if(isSticker) entry.size = pendingSize; else entry.fontSize = pendingSize;
            await persist();
          }
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, {passive:false});
        document.addEventListener('touchend', onEnd);
      };
      handle.addEventListener('mousedown', start);
      handle.addEventListener('touchstart', start, {passive:false});
    });
  }

  function attachCoverLogoDrag(){
    const cover = document.querySelector('.notebook-cover');

    if(!cover || !wrap) return;
    let startX=0, startY=0, startLeft=0, startTop=0, moved=false, dragging=false;
    function onMove(ev){

      const point = ev.touches ? ev.touches[0] : ev;
      const dxPx = point.clientX - startX;
      const dyPx = point.clientY - startY;
      if(Math.abs(dxPx) > 3 || Math.abs(dyPx) > 3) moved = true;
      const rect = cover.getBoundingClientRect();
      const dxPct = (dxPx / rect.width) * 100;
      const dyPct = (dyPx / rect.height) * 100;
      let newLeft = Math.max(10, Math.min(90, startLeft + dxPct));
      let newTop = Math.max(0, Math.min(88, startTop + dyPct));
      wrap.style.left = newLeft + '%';
      wrap.style.top = newTop + '%';
    }
    async function onUp(){
      if(!dragging) return;
      dragging = false;
      wrap.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      if(moved){
        const acct = findStudentAccount(state.studentSession.email);
        const ownerKey = notebookOwnerKey(acct.email, state.notebookProfileId || null);
        const nb = getOrCreateActiveNotebook(ownerKey);
        nb.kossLogoX = parseFloat(wrap.style.left);
        nb.kossLogoY = parseFloat(wrap.style.top);

      }

    const startDrag = (ev)=>{
      const point = ev.touches ? ev.touches[0] : ev;
      dragging = true; moved = false;
      startX = point.clientX; startY = point.clientY;
      startLeft = parseFloat(wrap.style.left) || 0;
      startTop = parseFloat(wrap.style.top) || 0;
      wrap.classList.add('dragging');
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      document.addEventListener('touchmove', onMove, {passive:false});
      document.addEventListener('touchend', onUp);
      ev.preventDefault();
    };
    wrap.addEventListener('mousedown', startDrag);
    wrap.addEventListener('touchstart', startDrag, {passive:false});
  }

  async function onAction(e){
    if(e.currentTarget.tagName === 'A') e.preventDefault();
    const action = e.currentTarget.dataset.action;
    const id = e.currentTarget.dataset.id;

    if(action==='goto-student'){ state.view='student'; render(); }
    else if(action==='toggle-password'){
      const targetId = e.currentTarget.dataset.target;
      const input = document.getElementById(targetId);
      if(input){
        if(input.type === 'password'){
          input.type = 'text';
          e.currentTarget.textContent = 'Masquer';
        } else {
          input.type = 'password';
          e.currentTarget.textContent = 'Afficher';
        }
      }
    }
    else if(action==='goto-account'){ state.view='account'; state.accountMenuOpen=false; render(); }
    else if(action==='toggle-account-membership-menu'){
      state.accountMembershipMenuOpen = !state.accountMembershipMenuOpen;
      render();
    }
    else if(action==='pick-account-membership'){
      state.accountActiveMembershipIndex = parseInt(e.currentTarget.dataset.idx, 10) || 0;
      state.accountMembershipMenuOpen = false;
      render();
    }
    else if(action==='toggle-header-membership-menu'){
      state.headerMembershipMenuOpen = !state.headerMembershipMenuOpen;
      render();
    }
    else if(action==='pick-header-membership'){
      state.headerActiveMembershipIndex = parseInt(e.currentTarget.dataset.idx, 10) || 0;
      state.headerMembershipMenuOpen = false;
      render();
    }
    else if(action==='toggle-account-menu'){ state.accountMenuOpen = !state.accountMenuOpen; render(); }
    else if(action==='toggle-manager-menu'){ state.managerMenuOpen = !state.managerMenuOpen; render(); }
    else if(action==='admin-logout'){
      state.adminUnlocked = false;
      state.currentManagerId = null;
      state.managerMenuOpen = false;
      // Sur l'URL ?admin, revenir à l'écran de PIN admin plutôt qu'à la page élève.
      state.view = ADMIN_URL_FLAG ? 'admin-login' : 'student';
      render();
    }
    else if(action==='goto-manager-account'){
      state.managerMenuOpen = false;
      state.modal = {type:'manager-account', payload:null};
      render();
    }
    else if(action==='set-manager-theme'){
      const mgr = currentManager();
      if(!mgr){ showToast('Session gestionnaire introuvable.'); return; }
      mgr.accentTheme = e.currentTarget.dataset.theme;
      await persist();
      render();
    }
    else if(action==='save-manager-info'){
      const mgr = currentManager();
      if(!mgr){ showToast('Session gestionnaire introuvable.'); return; }
      mgr.name = document.getElementById('mgr-name').value.trim() || mgr.name;
      mgr.email = document.getElementById('mgr-email').value.trim();
      mgr.phone = document.getElementById('mgr-phone').value.trim();
      await persist();
      render();
      showToast('Infos du compte enregistrées.');
    }
    else if(action==='goto-admin'){ state.view = state.adminUnlocked ? 'admin' : 'admin-login'; render(); }
    else if(action==='goto-attendance'){ state.view = 'attendance'; render(); }
    else if(action==='open-notebook-cover'){ state.notebookOpened = true; render(); }
    else if(action==='close-notebook-cover'){ state.notebookOpened = false; state.notebookEditMode = false; state.notebookSelectedEntry = null; render(); }
    else if(action==='toggle-notebook-edit-mode'){ state.notebookEditMode = !state.notebookEditMode; if(!state.notebookEditMode) state.notebookSelectedEntry = null; render(); }
    else if(action==='filter-notebook-category'){
      state.notebookFilterCategory = e.currentTarget.dataset.category || null;
      render();
    }
    else if(action==='new-notebook'){
      const acct = findStudentAccount(state.studentSession.email);
      const ownerKey = notebookOwnerKey(acct.email, state.notebookProfileId);
      const existing = getNotebooksForOwner(ownerKey);
      const defaultCovers = ['#1D5C43','#7A3B12','#2A4B7C','#8B1E3F'];
      const nb = {id:uid(), ownerKey, name:'Carnet '+(existing.length+1), pageCount:1,
        coverColor: defaultCovers[existing.length % defaultCovers.length], coverTexture:'uni', coverTextColor:'#F2E27A',
        pageColor:'#FFFBF8', postitColor:POSTIT_COLORS[0], createdAt:Date.now()};
      state.data.notebooks.push(nb);
      state.notebookActiveId = nb.id;
      state.notebookActivePage = 1;
      state.notebookFilterCategory = null;
      await persist();
      render();
      showToast('Nouveau carnet créé.');
    }
    else if(action==='switch-notebook'){
      const selectId = e.currentTarget.dataset.select;
      const val = document.getElementById(selectId).value;
      state.notebookActiveId = val;
      state.notebookActivePage = 1;
      state.notebookFilterCategory = null;
      render();
    }
    else if(action==='toggle-notebook-search'){
      state.notebookSearchOpen = !state.notebookSearchOpen;
      render();
    }
    else if(action==='run-notebook-search'){
      state.notebookSearchQuery = document.getElementById('nb-search-input').value.trim();
      render();
    }
    else if(action==='goto-notebook-page'){
      state.notebookActivePage = parseInt(e.currentTarget.dataset.page, 10) || 1;
      state.notebookSearchOpen = false;
      state.notebookSelectedEntry = null;
      render();
    }
    else if(action==='add-notebook-page'){
      const acct = findStudentAccount(state.studentSession.email);
      const ownerKey = notebookOwnerKey(acct.email, state.notebookProfileId);
      const nb = getOrCreateActiveNotebook(ownerKey);
      if((nb.pageCount||1) >= MAX_NOTEBOOK_PAGES){ showToast('Maximum de 40 pages atteint.'); return; }
      nb.pageCount = (nb.pageCount||1) + 1;
      state.notebookActivePage = nb.pageCount;
      await persist();
      render();
      showToast('Page ajoutée.');
    }
    else if(action==='delete-notebook-page'){
      const acct = findStudentAccount(state.studentSession.email);
      const ownerKey = notebookOwnerKey(acct.email, state.notebookProfileId);
      const nb = getOrCreateActiveNotebook(ownerKey);
      const pageCount = nb.pageCount || 1;
      if(pageCount <= 1){ showToast('Un carnet doit garder au moins une page.'); return; }
      const targetPage = Math.min(state.notebookActivePage || 1, pageCount);
      // Les notes de la page supprimée vont à la corbeille (récupérables) plutôt que d'être
      // effacées ; les pages suivantes glissent d'un cran pour ne pas laisser de trou.
      state.data.notebookEntries.forEach(n=>{
        if(n.ownerKey!==ownerKey || n.notebookId!==nb.id) return;
        const p = n.page || 1;
        if(p===targetPage){ n.trashed = true; n.trashedAt = Date.now(); }
        else if(p>targetPage){ n.page = p - 1; }
      });
      nb.pageCount = pageCount - 1;
      state.notebookActivePage = Math.min(targetPage, nb.pageCount);
      await persist();
      render();
      showToast('Page supprimée — les notes qu’elle contenait sont dans la corbeille.');
    }
    else if(action==='new-postit'){
      pendingPostitPhoto = null;
      const acct = findStudentAccount(state.studentSession.email);
      const ownerKey = notebookOwnerKey(acct.email, state.notebookProfileId);
      const nb = getOrCreateActiveNotebook(ownerKey);
      state.modal = {type:'postit-form', payload:{ownerKey, entry:null, notebookId:nb.id, pageCount:nb.pageCount||1}};
      render();
    }
    else if(action==='edit-postit'){
      const entry = state.data.notebookEntries.find(n=>n.id===id);
      if(!entry) return;
      if(entry.kind === 'text'){
        state.modal = {type:'textnote-form', payload:{ownerKey:entry.ownerKey, entry}};
        render();
        return;
      }
      pendingPostitPhoto = entry.photo || null;
      state.modal = {type:'postit-form', payload:{ownerKey:entry.ownerKey, entry}};
      render();
    }
    else if(action==='new-textnote'){
      const acct = findStudentAccount(state.studentSession.email);
      const ownerKey = notebookOwnerKey(acct.email, state.notebookProfileId);
      const nb = getOrCreateActiveNotebook(ownerKey);
      state.modal = {type:'textnote-form', payload:{ownerKey, entry:null, notebookId:nb.id, pageCount:nb.pageCount||1}};
      render();
    }
    else if(action==='save-textnote'){
      const ownerKey = e.currentTarget.dataset.owner;
      const notebookId = e.currentTarget.dataset.notebook;
      const text = document.getElementById('textnote-text').value.trim();
      const category = document.getElementById('textnote-category-input').value.trim();
      const fontFamily = document.getElementById('textnote-font').value;
      const color = document.getElementById('textnote-color-value').value;
      const hAlign = document.getElementById('textnote-halign-value').value || 'left';
      const paletteEl = document.getElementById('textnote-palette-value');
      const inkPalette = paletteEl ? paletteEl.value : 'pastel';
      if(!text){ markInvalid('textnote-text'); showToast('La note ne peut pas être vide.'); return; }
      if(!category){ markInvalid('textnote-category-input'); showToast('Choisis ou tape une catégorie.'); return; }
      if(id){
        const entry = state.data.notebookEntries.find(n=>n.id===id);
        if(entry){
          entry.text = text; entry.category = category; entry.fontFamily = fontFamily; entry.color = color; entry.hAlign = hAlign;
          const pageInput = document.getElementById('textnote-page');
          if(pageInput){
            const nb = state.data.notebooks.find(x=>x.id===entry.notebookId);
            const maxPage = (nb && nb.pageCount) || 1;
            let p = parseInt(pageInput.value, 10) || 1;
            p = Math.max(1, Math.min(maxPage, p));
            entry.page = p;
          }
          const nbForPalette = state.data.notebooks.find(x=>x.id===entry.notebookId);
          if(nbForPalette) nbForPalette.inkPalette = inkPalette;
        }
      } else {
        state.data.notebookEntries.push({id:uid(), ownerKey, notebookId, kind:'text', page: state.notebookActivePage||1, x:10+Math.round(Math.random()*40), y:10+Math.round(Math.random()*40), text, category, fontFamily, fontSize:16, rotation:0, color, hAlign, createdAt:Date.now()});
        const nbForPalette = state.data.notebooks.find(x=>x.id===notebookId);
        if(nbForPalette) nbForPalette.inkPalette = inkPalette;
      }
      await persist();
      state.modal = null; closeModalDom();
      render();
      showToast('Note enregistrée.');
    }
    else if(action==='open-sticker-picker'){
      if(!state.studentSession){ showToast('Connectez-vous pour accéder au carnet.'); return; }
      state.modal = {type:'sticker-picker', payload:{}};
      render();
    }
    else if(action==='pick-sticker'){
      const stickerId = e.currentTarget.dataset.sticker;
      const grantId = e.currentTarget.dataset.grant;
      const acct = findStudentAccount(state.studentSession.email);
      const ownerKey = notebookOwnerKey(acct.email, state.notebookProfileId);
      const nb = getOrCreateActiveNotebook(ownerKey);
      state.data.notebookEntries.push({id:uid(), ownerKey, notebookId:nb.id, kind:'sticker', stickerId, grantId: grantId||null, page: state.notebookActivePage||1, x:10+Math.round(Math.random()*40), y:10+Math.round(Math.random()*40), size:60, rotation:0, createdAt:Date.now()});
      if(grantId){
        const grant = state.data.stickerGrants.find(g=>g.id===grantId);
        if(grant) grant.used = true;
      }
      await persist();
      state.modal = null; closeModalDom();
      render();
      showToast('Autocollant ajouté.');
    }
    else if(action==='open-share'){
      const entryId = e.currentTarget.dataset.id;
      const ownerKey = e.currentTarget.dataset.owner;
      state.shareRecipientType = 'coach';
      state.shareSearchQuery = '';
      state.shareSelectedRecipient = null;
      state.shareAnonymous = false;
      state.modal = {type:'share-form', payload:{entryId, ownerKey}};
      render();
    }
    else if(action==='toggle-share-anonymous'){
      // Ne pas re-render ici : le navigateur a déjà basculé la case à cocher, et un
      // render() la régénérerait à l'identique — on garde juste l'état en mémoire pour
      // que choisir un destinataire ensuite ne la décoche pas.
      state.shareAnonymous = !!e.currentTarget.checked;
    }
    else if(action==='set-share-recipient-type'){
      state.shareRecipientType = e.currentTarget.dataset.value;
      state.shareSearchQuery = '';
      state.shareSelectedRecipient = null;
      render();
    }
    else if(action==='run-share-search'){
      const input = document.getElementById('share-search-input');
      state.shareSearchQuery = input ? input.value.trim() : '';
      render();
    }
    else if(action==='pick-share-recipient'){
      const ownerKeyR = e.currentTarget.dataset.owner;
      const label = e.currentTarget.dataset.label;
      state.shareSelectedRecipient = {ownerKey: ownerKeyR, label};
      render();
    }
    else if(action==='clear-share-recipient'){
      state.shareSelectedRecipient = null;
      render();
    }
    else if(action==='send-share'){
      const entryId = e.currentTarget.dataset.entry;
      const ownerKey = e.currentTarget.dataset.owner;
      const entry = state.data.notebookEntries.find(n=>n.id===entryId);
      if(!entry){ showToast('Note introuvable.'); return; }
      const recipientType = state.shareRecipientType || 'coach';
      let recipientManagerId = null, recipientOwnerKey = null;
      if(recipientType==='coach'){
        const sel = document.getElementById('share-manager-select');
        recipientManagerId = sel ? sel.value : null;
        if(!recipientManagerId){ showToast('Choisissez un coach.'); return; }
      } else {
        if(!state.shareSelectedRecipient){ showToast('Choisissez d’abord un·e étudiant·e dans les résultats de recherche.'); return; }
        recipientOwnerKey = state.shareSelectedRecipient.ownerKey;
        if(recipientOwnerKey === ownerKey){ showToast('Vous ne pouvez pas vous envoyer une note à vous-même.'); return; }
      }
      const anonymous = !!(document.getElementById('share-anonymous') && document.getElementById('share-anonymous').checked);
      const content = sharedItemContentFromEntry(entry);
      const item = Object.assign({}, content, {
        id: uid(),
        anonymous,
        recipientType, recipientManagerId, recipientOwnerKey,
        senderOwnerKey: ownerKey,
        status: anonymous ? 'pending_review' : 'delivered',
        createdAt: Date.now(), decidedAt: null,
      });
      state.data.sharedItems.push(item);
      await persist();
      state.modal = null; closeModalDom();
      render();
      showToast(anonymous ? 'Note envoyée — elle sera livrée dès qu’un·e gestionnaire l’aura approuvée.' : 'Note envoyée !');
    }
    else if(action==='open-received-items'){
      const ownerKey = e.currentTarget.dataset.owner;
      state.modal = {type:'received-items', payload:{ownerKey}};
      render();
    }
    else if(action==='open-notebook-trash'){
      const ownerKey = e.currentTarget.dataset.owner;
      state.modal = {type:'notebook-trash', payload:{ownerKey}};
      render();
    }
    else if(action==='restore-postit'){
      const entry = state.data.notebookEntries.find(n=>n.id===id);
      if(entry){
        entry.trashed = false;
        // Restaure sur la page actuellement affichée plutôt que sa page d'origine (demandé
        // explicitement) — sinon la note réapparaît hors de vue, sur une page qu'on a peut-être oubliée.
        entry.page = state.notebookActivePage || 1;
      }
      await persist();
      render();
      showToast('Remis sur la page actuelle.');
    }
    else if(action==='return-shared-to-origin'){
      const entry = state.data.notebookEntries.find(n=>n.id===id);
      if(entry && entry.shareId){
        const item = state.data.sharedItems.find(s=>s.id===entry.shareId);
        if(item){ item.status = 'delivered'; item.decidedAt = Date.now(); }
        state.data.notebookEntries = state.data.notebookEntries.filter(n=>n.id!==id);
      }
      await persist();
      render();
      showToast('Remis dans les reçus.');
    }
    else if(action==='return-sticker-to-bank'){
      const entry = state.data.notebookEntries.find(n=>n.id===id);
      if(entry && entry.grantId){
        const grant = state.data.stickerGrants.find(g=>g.id===entry.grantId);
        if(grant) grant.used = false;
        state.data.notebookEntries = state.data.notebookEntries.filter(n=>n.id!==id);
      }
      await persist();
      render();
      showToast('Remis dans vos reçus.');
    }
    else if(action==='permanently-delete-postit'){
      state.data.notebookEntries = state.data.notebookEntries.filter(n=>n.id!==id);
      await persist();
      render();
      showToast('Supprimé définitivement.');
    }
    else if(action==='claim-shared-item'){
      const itemId = e.currentTarget.dataset.id;
      const ownerKey = e.currentTarget.dataset.owner;
      const item = state.data.sharedItems.find(s=>s.id===itemId);
      if(!item){ showToast('Introuvable.'); return; }
      const nb = getOrCreateActiveNotebook(ownerKey);
      const entry = Object.assign({}, item, {
        id: uid(), ownerKey, notebookId: nb.id,
        page: state.notebookActivePage||1,
        x: 10+Math.round(Math.random()*40), y: 10+Math.round(Math.random()*40),
        size: item.kind==='sticker' ? 60 : undefined, rotation: 0,
        fontSize: item.kind==='text' ? 16 : undefined,
        createdAt: Date.now(), shareId: item.id,
      });
      delete entry.anonymous; delete entry.recipientType; delete entry.recipientManagerId;
      delete entry.recipientOwnerKey; delete entry.senderOwnerKey; delete entry.status; delete entry.decidedAt;
      state.data.notebookEntries.push(entry);
      item.status = 'claimed';
      await persist();
      render();
      showToast('Ajouté à votre carnet.');
    }
    else if(action==='confirm-delete-gifted-sticker'){
      const grantId = e.currentTarget.dataset.grant;
      const ownerKey = e.currentTarget.dataset.owner;
      state.modal = {type:'confirm-delete-gifted-sticker', payload:{grantId, ownerKey}};
      render();
    }
    else if(action==='delete-gifted-sticker'){
      const grantId = e.currentTarget.dataset.grant;
      state.data.stickerGrants = state.data.stickerGrants.filter(g=>g.id!==grantId);
      await persist();
      state.modal = {type:'received-items', payload:{ownerKey: e.currentTarget.dataset.owner}};
      render();
      showToast('Autocollant supprimé.');
    }
    else if(action==='claim-gifted-sticker'){
      const grantId = e.currentTarget.dataset.grant;
      const ownerKey = e.currentTarget.dataset.owner;
      const grant = state.data.stickerGrants.find(g=>g.id===grantId);
      if(!grant){ showToast('Introuvable.'); return; }
      const sticker = state.data.stickers.find(s=>s.id===grant.stickerId);
      if(!sticker){ showToast('Autocollant introuvable.'); return; }
      const nb = getOrCreateActiveNotebook(ownerKey);
      state.data.notebookEntries.push({
        id: uid(), ownerKey, notebookId: nb.id, kind:'sticker', stickerId: sticker.id, grantId: grant.id,
        page: state.notebookActivePage||1,
        x: 10+Math.round(Math.random()*40), y: 10+Math.round(Math.random()*40),
        size: 60, rotation: 0, createdAt: Date.now(),
      });
      grant.used = true;
      await persist();
      render();
      showToast('Ajouté à votre carnet.');
    }
    else if(action==='approve-shared-item'){
      const item = state.data.sharedItems.find(s=>s.id===id);
      if(item){ item.status = 'delivered'; item.decidedAt = Date.now(); await persist(); render(); showToast('Note approuvée et livrée.'); }
    }
    else if(action==='refuse-shared-item'){
      const item = state.data.sharedItems.find(s=>s.id===id);
      if(item){ item.status = 'refused'; item.decidedAt = Date.now(); await persist(); render(); showToast('Note refusée.'); }
    }
    else if(action==='confirm-flag-shared-item'){
      state.modal = {type:'confirm-flag-shared-item', payload:{id}};
      render();
    }
    else if(action==='flag-shared-item'){
      // Seule exception à l'anonymat : un message jugé inacceptable — l'origine et la
      // destination deviennent visibles dans la carte "Messages signalés inappropriés"
      // (politique de tolérance zéro), voir flaggedInappropriateItems()/ownerKeyLabel().
      const item = state.data.sharedItems.find(s=>s.id===id);
      if(item){
        item.status = 'refused'; item.inappropriate = true; item.decidedAt = Date.now();
        // Garde une trace de qui a fait le signalement, pour que ça apparaisse ensuite dans
        // les notes si on transfère ce message (transfer-flagged-to-notes).
        const mgr = currentManager();
        item.flaggedByManagerId = mgr ? mgr.id : null;
        item.flaggedByManagerName = mgr ? mgr.name : null;
        await persist();
      }
      state.modal = null; closeModalDom();
      render();
      showToast('Message signalé — origine et destination visibles ci-dessous.');
    }
    else if(action==='unflag-shared-item'){
      // Annule un signalement fait par erreur : remet le message dans la file de
      // modération normale (anonymat restauré) plutôt que de le supprimer.
      const item = state.data.sharedItems.find(s=>s.id===id);
      if(item){
        item.inappropriate = false;
        item.status = 'pending_review';
        item.decidedAt = null;
        await persist();
        render();
        showToast('Signalement annulé — le message est retourné en approbation.');
      }
    }
    else if(action==='transfer-flagged-to-notes'){
      // Copie le contenu du message signalé dans les notes privées (Avis) de la personne
      // qui l'a envoyé, pour garder une trace même après avoir traité/archivé le signalement.
      const item = state.data.sharedItems.find(s=>s.id===id);
      if(!item){ return; }
      const {email, profileId} = parseOwnerKey(item.senderOwnerKey);
      const acct = findStudentAccount(email);
      if(!acct){ showToast('Compte de l’expéditeur introuvable.'); return; }
      let contentDesc = '';
      if(item.kind === 'sticker'){
        const sticker = state.data.stickers.find(x=>x.id===item.stickerId);
        contentDesc = 'Autocollant envoyé : ' + (sticker ? sticker.name : 'inconnu');
      } else {
        contentDesc = (item.text||'').trim();
      }
      const dateStr = new Date().toLocaleDateString('fr-CA');
      const recipientLabel = item.recipientType==='coach'
        ? ((state.data.managers.find(mg=>mg.id===item.recipientManagerId)||{}).name || 'coach inconnu')
        : ownerKeyLabel(item.recipientOwnerKey);
      const flaggerLabel = item.flaggedByManagerName || 'gestionnaire inconnu';
      const line = `[${dateStr}] Message signalé — destiné à ${recipientLabel} — signalé par ${flaggerLabel} : "${contentDesc}"`;
      const target = profileId ? (acct.familyMembers||[]).find(f=>f.id===profileId) : acct;
      if(!target){ showToast('Profil de l’expéditeur introuvable.'); return; }
      if(!target.notes) target.notes = {};
      target.notes.avis = (target.notes.avis ? target.notes.avis + '\n' : '') + line;
      await persist();
      render();
      showToast('Transféré dans les notes (Avis) de ' + (target.name||acct.name) + '.');
    }
    else if(action==='archive-shared-item'){
      const item = state.data.sharedItems.find(s=>s.id===id);
      if(item){ item.status = 'archived'; await persist(); render(); showToast('Archivé.'); }
    }
    else if(action==='new-sticker'){
      pendingStickerImage = null;
      state.modal = {type:'sticker-form', payload:{entry:null, pendingAll:true, pendingAssigned:[]}};
      render();
    }
    else if(action==='edit-sticker'){
      const s = state.data.stickers.find(x=>x.id===id);
      if(!s) return;
      pendingStickerImage = null;
      const pendingAssigned = (s.assignedEmails||[]).map(email=>{
        const acct = findStudentAccount(email);
        return {email, name: acct ? acct.name : email};
      });

      const removedEntry = state.data.notebookEntries.find(n=>n.id===id);

      if(state.notebookSelectedEntry===id) state.notebookSelectedEntry = null;

      const category = document.getElementById('postit-category-input').value.trim();
      const color = document.getElementById('postit-color-value').value;
      if(!text){ markInvalid('postit-text'); showToast('La note ne peut pas être vide.'); return; }
      if(!category){ markInvalid('postit-category-input'); showToast('Choisis ou tape une catégorie.'); return; }
      if(id){
        const entry = state.data.notebookEntries.find(n=>n.id===id);
        if(entry){
          entry.text = text; entry.category = category; entry.color = color;
          if(pendingPostitPhoto) entry.photo = pendingPostitPhoto;
          const pageInput = document.getElementById('postit-page');
          if(pageInput){
            const nb = state.data.notebooks.find(x=>x.id===entry.notebookId);

      if(!nb){ state.modal = null; closeModalDom(); render(); return; }
      const ownerKey = nb.ownerKey;
      // On peut maintenant supprimer même le dernier carnet — getOrCreateActiveNotebook() en
      // recrée automatiquement un vierge ("Mon carnet") la prochaine fois qu'on ouvre l'onglet.
      const remaining = getNotebooksForOwner(ownerKey).filter(x=>x.id!==notebookId);

      state.data.notebookEntries = state.data.notebookEntries.filter(n=>n.notebookId!==notebookId);

    else if(action==='request-reset-code'){
      const email = document.getElementById('rp-email').value.trim();

      const btn = e.currentTarget;
      const originalLabel = btn.textContent;
      btn.disabled = true; btn.textContent = 'Envoi en cours…';
      try{
        const resp = await sb.functions.invoke('koss-send-reset-code', {body:{email}});
        if(resp.error || !resp.data || !resp.data.ok){
          showToast(resp.data && resp.data.error==='not_found' ? 'Aucun compte trouvé avec ce courriel.' : "Échec de l'envoi du code. Réessayez.");
          btn.disabled = false; btn.textContent = originalLabel;
          return;
        }
        state.modal = {type:'reset-password', payload:{step:'code', email}};
        render();
      }catch(err){
        console.error('Échec envoi code de réinitialisation:', err);
        showToast("Échec de l'envoi du code. Réessayez.");
        btn.disabled = false; btn.textContent = originalLabel;
      }

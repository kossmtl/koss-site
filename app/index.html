      dragging = true; moved = false;
      startX = point.clientX; startY = point.clientY;
      startLeft = parseFloat(wrap.style.left) || 0;
      startTop = parseFloat(wrap.style.top) || 0;
      wrap.classList.add('dragging');
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      document.addEventListener('touchmove', onMove, {passive:false});
      document.addEventListener('touchend', onUp);
      ev.preventDefault();
    };
    wrap.addEventListener('mousedown', startDrag);
    wrap.addEventListener('touchstart', startDrag, {passive:false});
  }

  async function onAction(e){
    if(e.currentTarget.tagName === 'A') e.preventDefault();
    const action = e.currentTarget.dataset.action;
    const id = e.currentTarget.dataset.id;

    if(action==='goto-student'){ state.view='student'; render(); }
    else if(action==='toggle-password'){
      const targetId = e.currentTarget.dataset.target;
      const input = document.getElementById(targetId);
      if(input){
        if(input.type === 'password'){
          input.type = 'text';
          e.currentTarget.textContent = 'Masquer';
        } else {
          input.type = 'password';
          e.currentTarget.textContent = 'Afficher';
        }
      }
    }
    else if(action==='goto-account'){ state.view='account'; state.accountMenuOpen=false; render(); }
    else if(action==='toggle-account-membership-menu'){
      state.accountMembershipMenuOpen = !state.accountMembershipMenuOpen;
      render();
    }
    else if(action==='pick-account-membership'){
      state.accountActiveMembershipIndex = parseInt(e.currentTarget.dataset.idx, 10) || 0;
      state.accountMembershipMenuOpen = false;
      render();
    }
    else if(action==='toggle-header-membership-menu'){
      state.headerMembershipMenuOpen = !state.headerMembershipMenuOpen;
      render();
    }
    else if(action==='pick-header-membership'){
      state.headerActiveMembershipIndex = parseInt(e.currentTarget.dataset.idx, 10) || 0;
      state.headerMembershipMenuOpen = false;
      render();
    }
    else if(action==='toggle-account-menu'){ state.accountMenuOpen = !state.accountMenuOpen; render(); }
    else if(action==='toggle-manager-menu'){ state.managerMenuOpen = !state.managerMenuOpen; render(); }
    else if(action==='admin-logout'){
      state.adminUnlocked = false;
      state.currentManagerId = null;
      state.managerMenuOpen = false;
      try{ await sb.auth.signOut(); }catch(err){}
      // Sur l'URL ?admin, revenir à l'écran de connexion admin plutôt qu'à la page élève.
      state.view = ADMIN_URL_FLAG ? 'admin-login' : 'student';
      render();
    }
    else if(action==='goto-manager-account'){
      state.managerMenuOpen = false;
      state.modal = {type:'manager-account', payload:null};
      render();
    }
    else if(action==='set-manager-theme'){
      const mgr = currentManager();
      if(!mgr){ showToast('Session gestionnaire introuvable.'); return; }
      mgr.accentTheme = e.currentTarget.dataset.theme;
      await persist();
      render();
    }
    else if(action==='save-manager-info'){
      const mgr = currentManager();
      if(!mgr){ showToast('Session gestionnaire introuvable.'); return; }
      mgr.name = document.getElementById('mgr-name').value.trim() || mgr.name;
      mgr.email = document.getElementById('mgr-email').value.trim();
      mgr.phone = document.getElementById('mgr-phone').value.trim();
      await persist();
      render();
      showToast('Infos du compte enregistrées.');
    }
    else if(action==='goto-admin'){ state.view = state.adminUnlocked ? 'admin' : 'admin-login'; render(); }
    else if(action==='goto-attendance'){ state.view = 'attendance'; render(); }
    else if(action==='open-notebook-cover'){ state.notebookOpened = true; render(); }
    else if(action==='close-notebook-cover'){ state.notebookOpened = false; state.notebookEditMode = false; state.notebookSelectedEntry = null; render(); }
    else if(action==='toggle-notebook-edit-mode'){ state.notebookEditMode = !state.notebookEditMode; if(!state.notebookEditMode) state.notebookSelectedEntry = null; render(); }
    else if(action==='filter-notebook-category'){
      state.notebookFilterCategory = e.currentTarget.dataset.category || null;
      render();
    }
    else if(action==='new-notebook'){
      const acct = findStudentAccount(state.studentSession.email);
      const ownerKey = notebookOwnerKey(acct.email, state.notebookProfileId);
      const existing = getNotebooksForOwner(ownerKey);
      const defaultCovers = ['#1D5C43','#7A3B12','#2A4B7C','#8B1E3F'];
      const nb = {id:uid(), ownerKey, name:'Carnet '+(existing.length+1), pageCount:1,
        coverColor: defaultCovers[existing.length % defaultCovers.length], coverTexture:'uni', coverTextColor:'#F2E27A',
        pageColor:'#FFFBF8', postitColor:POSTIT_COLORS[0], createdAt:Date.now()};
      state.data.notebooks.push(nb);
      state.notebookActiveId = nb.id;
      state.notebookActivePage = 1;
      state.notebookFilterCategory = null;
      await persist();
      render();
      showToast('Nouveau carnet créé.');
    }
    else if(action==='switch-notebook'){
      const selectId = e.currentTarget.dataset.select;
      const val = document.getElementById(selectId).value;
      state.notebookActiveId = val;
      state.notebookActivePage = 1;
      state.notebookFilterCategory = null;
      render();
    }
    else if(action==='toggle-notebook-search'){
      state.notebookSearchOpen = !state.notebookSearchOpen;
      render();
    }
    else if(action==='run-notebook-search'){
      state.notebookSearchQuery = document.getElementById('nb-search-input').value.trim();
      render();
    }
    else if(action==='goto-notebook-page'){
      state.notebookActivePage = parseInt(e.currentTarget.dataset.page, 10) || 1;
      state.notebookSearchOpen = false;
      state.notebookSelectedEntry = null;
      render();
    }
    else if(action==='add-notebook-page'){
      const acct = findStudentAccount(state.studentSession.email);
      const ownerKey = notebookOwnerKey(acct.email, state.notebookProfileId);
      const nb = getOrCreateActiveNotebook(ownerKey);
      if((nb.pageCount||1) >= MAX_NOTEBOOK_PAGES){ showToast('Maximum de 40 pages atteint.'); return; }
      nb.pageCount = (nb.pageCount||1) + 1;
      state.notebookActivePage = nb.pageCount;
      await persist();
      render();
      showToast('Page ajoutée.');
    }
    else if(action==='delete-notebook-page'){
      const acct = findStudentAccount(state.studentSession.email);
      const ownerKey = notebookOwnerKey(acct.email, state.notebookProfileId);
      const nb = getOrCreateActiveNotebook(ownerKey);
      const pageCount = nb.pageCount || 1;
      if(pageCount <= 1){ showToast('Un carnet doit garder au moins une page.'); return; }
      const targetPage = Math.min(state.notebookActivePage || 1, pageCount);
      // Les notes de la page supprimée vont à la corbeille (récupérables) plutôt que d'être
      // effacées ; les pages suivantes glissent d'un cran pour ne pas laisser de trou.
      state.data.notebookEntries.forEach(n=>{
        if(n.ownerKey!==ownerKey || n.notebookId!==nb.id) return;
        const p = n.page || 1;
        if(p===targetPage){ n.trashed = true; n.trashedAt = Date.now(); }
        else if(p>targetPage){ n.page = p - 1; }
      });
      nb.pageCount = pageCount - 1;
      state.notebookActivePage = Math.min(targetPage, nb.pageCount);
      await persist();
      render();
      showToast('Page supprimée — les notes qu’elle contenait sont dans la corbeille.');
    }
    else if(action==='new-postit'){
      pendingPostitPhoto = null;
      const acct = findStudentAccount(state.studentSession.email);
      const ownerKey = notebookOwnerKey(acct.email, state.notebookProfileId);
      const nb = getOrCreateActiveNotebook(ownerKey);
      state.modal = {type:'postit-form', payload:{ownerKey, entry:null, notebookId:nb.id, pageCount:nb.pageCount||1}};
      render();
    }
    else if(action==='start-quick-text'){
      state.notebookQuickTextDraw = !state.notebookQuickTextDraw;
      if(state.notebookQuickTextDraw) showToast('Dessine un rectangle sur la page pour écrire.');

      }

      }
      // Le serveur seul décide si ce compte est bien un compte gestionnaire — jamais le client.
      const { data: isMgr, error: roleErr } = await sb.rpc('koss_is_manager');

      const email = document.getElementById('rp-email').value.trim();

      const btn = e.currentTarget;
      const originalLabel = btn.textContent;
      btn.disabled = true; btn.textContent = 'Envoi en cours…';
      try{
        const resp = await sb.functions.invoke('koss-send-reset-code', {body:{email}});
        if(resp.error || !resp.data || !resp.data.ok){
          showToast(resp.data && resp.data.error==='not_found' ? 'Aucun compte trouvé avec ce courriel.' : "Échec de l'envoi du code. Réessayez.");
          btn.disabled = false; btn.textContent = originalLabel;
          return;
        }
        state.modal = {type:'reset-password', payload:{step:'code', email}};
        render();
      }catch(err){
        console.error('Échec envoi code de réinitialisation:', err);
        showToast("Échec de l'envoi du code. Réessayez.");
        btn.disabled = false; btn.textContent = originalLabel;
      }

    else if(action==='confirm-reset-code'){
      const email = e.currentTarget.dataset.email;
      const code = document.getElementById('rp-code').value.trim();
      const newPw = document.getElementById('rp-new-password').value;
      if(!code || code.length !== 6){ markInvalid('rp-code'); showToast('Entrez le code à 6 chiffres reçu par courriel.'); return; }
      if(!newPw || newPw.length < 4){ markInvalid('rp-new-password'); showToast('Choisissez un mot de passe (4 caractères minimum).'); return; }
      const btn = e.currentTarget;
      const originalLabel = btn.textContent;
      btn.disabled = true; btn.textContent = 'Vérification…';
      try{
        const resp = await sb.functions.invoke('koss-verify-reset-code', {body:{email, code, newPassword:newPw}});
        if(resp.error || !resp.data || !resp.data.ok){
          const reason = resp.data && resp.data.error;
          showToast(reason==='invalid_code' ? 'Code invalide ou expiré.' : "Échec de la réinitialisation. Réessayez.");
          btn.disabled = false; btn.textContent = originalLabel;
          return;
        }
        state.modal = null; closeModalDom();
        await loadData();
        showToast('Mot de passe réinitialisé — vous pouvez vous connecter.');
      }catch(err){
        console.error('Échec vérification code de réinitialisation:', err);
        showToast("Échec de la réinitialisation. Réessayez.");
        btn.disabled = false; btn.textContent = originalLabel;
      }
    }
    else if(action==='confirm-signup-code-submit'){
      const payload = state.modal.payload || {};
      const code = (document.getElementById('signup-code').value || '').trim();
      if(!code || code.length !== 6){ markInvalid('signup-code'); showToast('Entrez le code à 6 chiffres reçu par courriel.'); return; }
      const btn = e.currentTarget;
      const originalLabel = btn.textContent;
      btn.disabled = true; btn.textContent = 'Vérification…';
      try{
        const resp = await sb.functions.invoke('koss-verify-signup-code', {body:{email:payload.email, code}});
        if(resp.error || !resp.data || !resp.data.ok){
          const reason = resp.data && resp.data.error;
          showToast(reason==='invalid_code' ? 'Code invalide ou expiré.' : "Échec de la vérification. Réessayez.");
          btn.disabled = false; btn.textContent = originalLabel;
          return;
        }
      }catch(err){
        console.error('Échec vérification code d’inscription:', err);
        showToast("Échec de la vérification. Réessayez.");
        btn.disabled = false; btn.textContent = originalLabel;
        return;
      }
      // Le code à 6 chiffres confirme que la personne possède ce courriel — on crée
      // maintenant le VRAI compte d'authentification (Supabase Auth), plus jamais un mot
      // de passe comparé dans le navigateur. Si un compte auth existe déjà pour ce courriel
      // (cas rare : compte migré manuellement), on retombe simplement sur une connexion.
      //
      // ⚠️ state.studentSession est posé AVANT sb.auth.signUp() (et non après) — signUp()
      // déclenche immédiatement l'événement SIGNED_IN de Supabase, capté ailleurs par
      // sb.auth.onAuthStateChange() → handleGoogleSession(), qui a sa propre logique de
      // création/connexion. handleGoogleSession() se retire dès qu'elle voit un
      // state.studentSession déjà posé pour ce courriel — sans ce court-circuit posé tôt,
      // les deux bouts de code s'exécutent en parallèle (course), ce qui provoquait un
      // ré-affichage brutal de la page pendant l'inscription (vu en test S24).
      state.studentSession = {email: payload.email};
      // Pas de case « Se souvenir de moi » à la création de compte (le texte promet déjà
      // à l'usager qu'il restera connecté) — on s'assure juste qu'un « non » choisi plus
      // tôt sur cet appareil (autre écran de connexion) ne s'applique pas ici.
      setRememberMe(true);
      let signUpFailed = false;
      try{
        const { error: signUpErr } = await sb.auth.signUp({
          email: payload.email,
          password: payload.password,
          options: { data: { full_name: payload.name, given_name: payload.firstName, family_name: payload.lastName } }
        });
        if(signUpErr && !/already registered|already exists/i.test(signUpErr.message||'')){
          console.error('Échec création du compte Supabase Auth:', signUpErr);
          signUpFailed = true;
        }
        if(signUpErr && /already registered|already exists/i.test(signUpErr.message||'')){
          const { error: signInErr } = await sb.auth.signInWithPassword({ email: payload.email, password: payload.password });
          if(signInErr){ console.error('Échec connexion de secours après "already registered":', signInErr); signUpFailed = true; }
        }
      }catch(err){ console.error('Échec création du compte Supabase Auth:', err); signUpFailed = true; }
      if(signUpFailed){
        state.studentSession = null;
        btn.disabled = false; btn.textContent = originalLabel;
        showToast("Échec de la création du compte de connexion. Réessayez, ou contactez le studio si ça persiste.");
        return;
      }
      await loadData();
      await saveSessionToStorage(payload.email);
      try{ await storageBackend.set('my_profile', JSON.stringify({name:payload.name, email:payload.email}), false); }catch(err){}
      const onVerified = payload.onVerified;
      state.modal = null; closeModalDom();
      render();
      showToast('Compte vérifié — bienvenue !');
      if(onVerified){ await onVerified(); }
    }
    else if(action==='open-sales-report'){
      const prev = (state.modal && state.modal.type==='sales-report') ? state.modal.payload : null;
      state.modal = {type:'sales-report', payload:{category:prev&&prev.category||'', from:prev&&prev.from||'', to:prev&&prev.to||todayIso()}};
      render();
    }
    else if(action==='run-sales-report'){
      const category = document.getElementById('sr-category').value;
      const from = document.getElementById('sr-from').value || '0000-01-01';
      const to = document.getElementById('sr-to').value || '9999-12-31';
      const sold = state.data.memberships.filter(m=> m.status!=='attente_paiement' && m.status!=='annulee');
      const inRange = sold.filter(m=>{
        const d = isoDate(new Date(m.createdAt));
        return d>=from && d<=to;
      });
      const filtered = category ? inRange.filter(m=>(m.categories||[]).includes(category)) : inRange;
      const rows = filtered.map(m=>{
        const plan = state.data.membershipPlans.find(p=>p.id===m.planId);
        const amountStr = m.planPrice || (plan?plan.price:'') || '';
        const amount = parsePriceAmount(amountStr);
        const cats = m.categories||[];
        return {
          studentName: m.studentName, email: m.studentEmail, profileId: m.profileId||null,
          category: cats.length>1 ? 'Plusieurs' : (cats[0]?categoryLabel(cats[0]):'—'),
          _categoryKey: cats.length===1 ? cats[0] : (cats.length>1 ? 'ALL_UNLIMITED' : ''),
          planName: m.planName, amountDisplay: amountStr||'—', amount,
          purchaseDate: isoDate(new Date(m.createdAt)), startDate: m.startDate||'', endDate: m.endDate||''
        };
      });
      const totalsMap = new Map();
      rows.forEach(r=>{
        const key = r._categoryKey || 'none';
        if(!totalsMap.has(key)) totalsMap.set(key, {label: r.category, count:0, amount:0});
        const t = totalsMap.get(key);
        t.count++; t.amount += r.amount;
      });
      const totals = Array.from(totalsMap.values());
      state.modal = {type:'sales-report', payload:{category, from:document.getElementById('sr-from').value, to:document.getElementById('sr-to').value, results:{rows, totals}}};
      render();
    }
    else if(action==='download-sales-report-csv'){
      const {rows} = state.modal.payload.results;
      downloadCsv(`rapport-ventes-${todayIso()}.csv`,
        ['studentName','category','planName','amountDisplay','purchaseDate','startDate','endDate'],
        {studentName:'Étudiant', category:'Catégorie', planName:'Formule', amountDisplay:'Montant payé', purchaseDate:'Date d’achat', startDate:'Date de début', endDate:'Date de fin'},
        rows);
    }
    else if(action==='open-intro-report'){
      const prev = (state.modal && state.modal.type==='intro-report') ? state.modal.payload : null;
      state.modal = {type:'intro-report', payload:{months:prev&&prev.months||'3'}};
      render();
    }
    else if(action==='run-intro-report'){
      const months = document.getElementById('ir-months').value;
      const cutoff = new Date(); cutoff.setMonth(cutoff.getMonth() - parseInt(months,10));
      const cutoffIso = isoDate(cutoff);
      const today = todayIso();
      const introMemberships = state.data.memberships.filter(m=>{
        const plan = state.data.membershipPlans.find(p=>p.id===m.planId);
        if(!plan || !plan.isIntroProgram) return false;
        if(m.status==='attente_paiement' || m.status==='annulee') return false;
        return isoDate(new Date(m.createdAt)) >= cutoffIso;
      });
      const rows = introMemberships.map(m=>{
        const pid = m.profileId || null;
        const next = state.data.memberships
          .filter(m2=> m2.id!==m.id && m2.studentEmail.toLowerCase()===m.studentEmail.toLowerCase() && (m2.profileId||null)===pid
            && m2.createdAt > m.createdAt && m2.status!=='attente_paiement' && m2.status!=='annulee'
            && !((state.data.membershipPlans.find(p=>p.id===m2.planId)||{}).isIntroProgram))
          .sort((a,b)=>a.createdAt-b.createdAt)[0];
        const introDateIso = isoDate(new Date(m.createdAt));
        const relevantBookings = state.data.bookings.filter(b=>
          b.studentEmail.toLowerCase()===m.studentEmail.toLowerCase() && (b.profileId||null)===pid
          && b.status==='confirmee' && b.dateIso >= introDateIso && b.dateIso <= today
        );
        const byClass = new Map();
        relevantBookings.forEach(b=>{ byClass.set(b.classId, (byClass.get(b.classId)||0)+1); });
        let topClass = '', topCount = 0;
        byClass.forEach((count, classId)=>{
          if(count>topCount){ topCount = count; const c = state.data.classes.find(cl=>cl.id===classId); topClass = c?c.name:''; }
        });
        return {
          studentName: m.studentName, email: m.studentEmail, profileId: pid, introDate: introDateIso,
          nextPlanName: next ? next.planName : '', visitCount: relevantBookings.length, topClass
        };
      });
      state.modal = {type:'intro-report', payload:{months, results:rows}};
      render();
    }
    else if(action==='download-intro-report-csv'){
      const rows = state.modal.payload.results;
      downloadCsv(`rapport-conversions-intro-${todayIso()}.csv`,
        ['studentName','email','introDate','nextPlanName','visitCount','topClass'],
        {studentName:'Étudiant', email:'Courriel', introDate:'Date intro', nextPlanName:'Abonnement suivant', visitCount:'Nb présences', topClass:'Cours le plus visité'},
        rows);
    }
    else if(action==='open-noshow-report'){
      const prev = (state.modal && state.modal.type==='noshow-report') ? state.modal.payload : null;
      state.modal = {type:'noshow-report', payload:{minDays:prev&&prev.minDays||30}};
      render();
    }
    else if(action==='run-noshow-report'){
      const minDays = parseInt(document.getElementById('ns-mindays').value,10) || 0;
      const today = todayIso();
      const todayDate = new Date(today+'T00:00:00');
      const profiles = [];
      state.data.studentAccounts.forEach(acct=>{
        profiles.push({email:acct.email, profileId:null, name:acct.name});
        (acct.familyMembers||[]).forEach(f=> profiles.push({email:acct.email, profileId:f.id, name:f.name}));
      });
      const rows = [];
      profiles.forEach(pr=>{
        const hasMembership = state.data.memberships.some(m=>m.studentEmail.toLowerCase()===pr.email.toLowerCase() && (m.profileId||null)===pr.profileId);
        const bookings = state.data.bookings.filter(b=>b.studentEmail.toLowerCase()===pr.email.toLowerCase() && (b.profileId||null)===pr.profileId && b.status==='confirmee' && b.dateIso<=today);
        if(!hasMembership && !bookings.length) return;
        const visitDates = bookings.map(b=>b.dateIso).sort();
        const lastVisit = visitDates[visitDates.length-1] || null;
        let daysSince = null;
        if(lastVisit){
          const d = new Date(lastVisit+'T00:00:00');
          daysSince = Math.round((todayDate - d) / 86400000);
        }
        if(daysSince===null || daysSince>=minDays){
          rows.push({studentName:pr.name, email:pr.email, profileId:pr.profileId||null, lastVisit, daysSince});
        }
      });
      rows.sort((a,b)=>{
        if(a.daysSince===null && b.daysSince===null) return 0;
        if(a.daysSince===null) return -1;
        if(b.daysSince===null) return 1;
        return b.daysSince - a.daysSince;
      });
      state.modal = {type:'noshow-report', payload:{minDays, results:rows}};
      render();
    }
    else if(action==='download-noshow-report-csv'){

      if(!checked.length){ showToast('Choisissez au moins une colonne.'); return; }
      const planFilterId = document.getElementById('report-plan-filter').value;
      const today = todayIso();
      // Un compte parent peut avoir des enfants (familyMembers) : on génère une ligne pour
      // le parent ET une ligne par enfant, chacune avec ses propres statistiques (filtrées
      // par profileId), pour que les enfants apparaissent dans le rapport eux aussi.
      const computeReportRow = (email, profileId, displayName, birthday, createdAt, firstNameOverride, lastNameOverride)=>{
        const pid = profileId || null;
        const pastConfirmed = state.data.bookings.filter(b=>b.studentEmail.toLowerCase()===email.toLowerCase() && (b.profileId||null)===pid && b.status==='confirmee' && b.dateIso<=today);
        const cancelCount = state.data.bookings.filter(b=>b.studentEmail.toLowerCase()===email.toLowerCase() && (b.profileId||null)===pid && b.status==='annulee').length;
        const visitDates = pastConfirmed.map(b=>b.dateIso).sort();
        const memberships = state.data.memberships.filter(m2=>m2.studentEmail.toLowerCase()===email.toLowerCase() && (m2.profileId||null)===pid);
        const activeM = memberships.filter(m2=>membershipDisplayStatus(m2)==='active');
        const pastM = memberships.filter(m2=>membershipDisplayStatus(m2)!=='active');
        const nameParts = (displayName||'').trim().split(/\s+/);
        return {
          _hasFilterPlan: activeM.some(m2=>m2.planId===planFilterId),
          name: displayName, email, profileId: pid,
          lastName: lastNameOverride || nameParts.slice(1).join(' ') || '', firstName: firstNameOverride || nameParts[0] || '',
          registeredDate: createdAt ? isoDate(new Date(createdAt)) : '',
          firstVisit: visitDates[0]||'', lastVisit: visitDates[visitDates.length-1]||'',
          visitCount: pastConfirmed.length, cancelCount: cancelCount,
          activeMemberships: activeM.map(m2=>m2.planName).join('; '),
          pastMemberships: pastM.map(m2=>m2.planName).join('; '),
          membershipType: activeM.map(m2=>m2.type).join('; '),
          birthday: birthday||''
        };
      };
      let reportRows = [];
      state.data.studentAccounts.forEach(acct=>{
        reportRows.push(computeReportRow(acct.email, null, acct.name, acct.birthday, acct.createdAt, acct.firstName, acct.lastName));
        (acct.familyMembers||[]).forEach(fm=>{
          reportRows.push(computeReportRow(acct.email, fm.id, fm.name, fm.birthday, acct.createdAt));
        });
      });
      if(planFilterId) reportRows = reportRows.filter(r=>r._hasFilterPlan);
      reportRows.forEach(r=>delete r._hasFilterPlan);
      state.modal = {type:'report-builder', payload:{results:{columns:checked, rows:reportRows}}};
      render();

        firstVisit:'Première visite', lastVisit:'Dernière visite', visitCount:'Nombre de visites',
        cancelCount:'Nombre d\u2019annulations', activeMemberships:'Abonnements actifs', pastMemberships:'Abonnements passés',
        membershipType:'Type d\u2019abonnement', birthday:'Date de fête'

      const csvRows = [columns.map(k=>fieldLabels[k]).join(',')];

      if(!rows.length){ showToast('Aucune donnée trouvée.'); return; }
      let start = 0;
      if(rows[0][0] && normalizeStr(rows[0][0]).includes('nom')) start = 1;
      let created = 0, unmatched = 0;
      for(let r = start; r < rows.length; r++){
        const row = rows[r];
        const name = (row[0]||'').trim();
        const email = (row[1]||'').trim();
        const typeRaw = (row[2]||'').trim();
        const value = (row[3]||'').trim();
        const catsStr = (row[4]||'').trim();
        const planName = (row[5]||'').trim();
        if(!name || !email) continue;
        const type = normalizeStr(typeRaw).includes('illimit') ? 'illimite' : 'credits';
        const categories = matchCategories(catsStr);
        if(!categories.length) unmatched++;
        const mem = {
          id: uid(),
          planId: null,
          planName: planName || 'Abonnement importé',
          categories,
          studentName: name,
          studentEmail: email,
          type,
          status: 'active',
          grantedFree: false,
          imported: true,
          createdAt: Date.now()
        };
        if(type === 'illimite'){
          mem.startDate = todayIso();
          mem.endDate = value || todayIso();
        } else {
          mem.creditsRemaining = parseInt(value,10) || 0;
        }
        state.data.memberships.push(mem);
        created++;
      }
      await persist();
      state.modal = null; closeModalDom();
      render();
      showToast(`${created} étudiant(s) importé(s)${unmatched ? ', '+unmatched+' sans catégorie reconnue (à corriger)' : ''}.`);

      // NOUVEAU (S47) : option « Payant (montant personnalisé) » — au lieu d'activer

      // on avertit le client par courriel qu'il doit payer sur Helcim pour l'activer (le client

      if(!firstName) missing.push('fm-firstname');
      if(!lastName) missing.push('fm-lastname');

    }
    else if(action==='save-cropped-photo'){
      if(!cropState){ showToast('Aucune image à enregistrer.'); return; }
      const srcSize = 260;
      const outSize = 200;
      const ratio = outSize/srcSize;
      const outCanvas = document.createElement('canvas');
      outCanvas.width = outSize; outCanvas.height = outSize;
      const octx = outCanvas.getContext('2d');
      const w = cropState.img.width * cropState.scale * ratio;
      const h = cropState.img.height * cropState.scale * ratio;
      const x = outSize/2 - w/2 + cropState.offsetX*ratio;
      const y = outSize/2 - h/2 + cropState.offsetY*ratio;
      octx.drawImage(cropState.img, x, y, w, h);
      const dataUrl = outCanvas.toDataURL('image/jpeg', 0.85);
      if(cropTargetManager){
        const mgr = currentManager();
        if(mgr){ mgr.photo = dataUrl; await persist(); }
      } else {
        const acct = state.studentSession ? findStudentAccount(state.studentSession.email) : null;

      }
      await persist();

      showToast('Réservation annulée.');

  // ⚠️ Bug Android corrigé : ce re-rendu au resize existe pour réajuster l'horaire quand la
  // fenêtre change de taille (rotation, redimensionnement navigateur) — mais sur mobile,
  // l'ouverture du clavier virtuel (ex. en touchant un champ "tel") déclenche AUSSI un
  // événement 'resize' (le viewport visible rétrécit). Comme render() détruit et recrée
  // TOUTE la modale (closeModalDom() + renderModal()), ce re-rendu remplaçait le champ juste
  // au moment où l'usager le touchait, lui faisant perdre le focus — et donc le clavier se
  // refermait tout de suite (ex. numéro de téléphone à l'inscription, Android). Corrigé en
  // sautant ce re-rendu automatique tant qu'une modale est ouverte (`!state.modal`), exactement
  // comme le fait déjà refreshFromRemote() pour la même raison.
  let resizeRenderTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeRenderTimer);
    resizeRenderTimer = setTimeout(()=>{
      if((state.view==='student' || state.view==='attendance') && !state.modal) render();
    }, 200);
  });

  // Site public depuis le lancement des tests avec de vrais courriels : plus de
  // mot de passe unique partagé (Supabase Auth) devant tout le site. Chaque
  // visiteur passe maintenant par l'écran d'accueil membre/nouveau (renderWelcome).
  // ⚠️ Ça veut dire que les appels à Supabase se font maintenant en rôle "anon" et
  // non "authenticated" — le rôle anon doit avoir le droit d'exécuter les fonctions
  // koss_load_all/koss_sync_all/koss_reset_all (GRANT EXECUTE, voir
  // supabase/migration_multi_tables.sql), sinon rien ne se charge.
  // Ferme les menus déroulants (compte élève, compte gestionnaire, abonnement actif) quand on
  // clique en dehors — attaché une seule fois sur document (pas à chaque render, sinon les
  // listeners s'empileraient). e.target reste utilisable même détaché du DOM live après un
  // render() déclenché par le même clic : la chaîne de parenté du sous-arbre détaché est
  // préservée, donc .closest() fonctionne toujours normalement.
  document.addEventListener('click', (e)=>{
    let changed = false;
    if((state.accountMenuOpen || state.managerMenuOpen || state.headerMembershipMenuOpen) && !e.target.closest('.account-corner')){
      state.accountMenuOpen = false;
      state.managerMenuOpen = false;
      state.headerMembershipMenuOpen = false;
      changed = true;
    }
    if(state.accountMembershipMenuOpen && !e.target.closest('[data-menu-root="account-membership"]')){
      state.accountMembershipMenuOpen = false;
      changed = true;
    }
    if(changed) render();
  });

  async function boot(){
    // NOUVEAU (S47) : capture ?pay=<membershipId> (lien "PAYER MAINTENANT" du courriel de
    // demande de paiement) tout de suite, en mémoire — avant que quoi que ce soit (dont le
    // nettoyage d'URL post-retour Google plus bas) ait la moindre chance d'y toucher. Reste en
    // mémoire jusqu'à ce qu'une session élève soit disponible (voir maybeResumePendingPayment,
    // déclenché depuis render()), donc fonctionne même si la personne doit d'abord se connecter.
    try{
      const payParam = new URLSearchParams(window.location.search).get('pay');
      if(payParam) state.pendingPayMembershipId = payParam;
    }catch(err){}
    // Restaure une session gestionnaire déjà active (compte courriel/mot de passe) AVANT
    // loadData(), pour qu'elle choisisse tout de suite la bonne vue au chargement/actualisation
    // — c'est le serveur seul (koss_is_manager) qui décide, jamais un NIP local.
    if(ADMIN_URL_FLAG){
      try{
        const { data: sessData } = await sb.auth.getSession();
        if(sessData && sessData.session){
          const { data: isMgr } = await sb.rpc('koss_is_manager');
          state.adminUnlocked = !!isMgr;
        } else {
          state.adminUnlocked = false;
        }
      }catch(err){ console.error('Échec vérification session gestionnaire:', err); state.adminUnlocked = false; }
    }
    await loadData();
    if(ADMIN_URL_FLAG && state.adminUnlocked && !state.currentManagerId){
      try{
        const { data: sessData2 } = await sb.auth.getSession();
        const myEmail = (sessData2 && sessData2.session && sessData2.session.user) ? sessData2.session.user.email.toLowerCase() : '';
        const mgr = state.data.managers.find(m=>(m.email||'').toLowerCase()===myEmail);
        state.currentManagerId = mgr ? mgr.id : null;
      }catch(err){ console.error('Échec résolution de l\'identité gestionnaire:', err); }
    }
    // Retour d'un login Google (redirection) : repère si Google/Supabase a renvoyé une erreur
    // (ex. "access_denied" — compte pas autorisé pendant que l'app OAuth est encore en mode
    // Test côté Google Cloud) AVANT de nettoyer l'URL, pour pouvoir prévenir clairement.
    const hadOAuthError = /[?#&]error(_description)?=/.test(window.location.search + window.location.hash);
    // Session Google déjà active dans ce navigateur — supabase-js détecte l'URL de retour
    // tout seul et remonte la session via getSession().
    let signedIn = false;
    // ⚠️ Piège corrigé : cette détection de session doit être IGNORÉE en mode admin (?admin).
    // sb.auth.onAuthStateChange()/getSession() ne distingue pas "connexion Google" de
    // "connexion gestionnaire par courriel/mot de passe" — sans ce garde-fou, une gestionnaire
    // qui vient de se connecter à /?admin se faisait basculer de force en mode élève juste après.
    if(!ADMIN_URL_FLAG){
      try{
        const { data } = await sb.auth.getSession();
        if(data && data.session){ await handleGoogleSession(data.session); signedIn = true; }
      }catch(err){ console.error('Échec vérification session Google:', err); }
    }
    // Nettoie l'URL après coup (qu'il y ait eu une erreur ou un succès) — sinon ces
    // paramètres restent collés dans l'adresse et seraient repris par erreur au prochain
    // essai (voir le piège corrigé dans signInWithGoogle()). ⚠️ On ne fait ça QUE s'il
    // s'agissait bien d'un retour OAuth (erreur, succès, ou fragments/paramètres Google
    // encore présents) — sinon ça effaçait AUSSI ?admin à chaque actualisation de page,
    // ce qui ramenait le gestionnaire en mode élève au lieu de rester en mode admin.
    const looksLikeOAuthReturn = hadOAuthError || signedIn ||
      /[?#&](code|access_token|refresh_token)=/.test(window.location.search + window.location.hash);
    if(looksLikeOAuthReturn && (window.location.search || window.location.hash)){
      // Garde ?admin si présent, pour ne pas éjecter le gestionnaire de son mode admin.
      const cleanSearch = ADMIN_URL_FLAG ? '?admin' : '';
      try{ window.history.replaceState(null, '', window.location.pathname + cleanSearch); }catch(err){}
    }
    // showToast() APRÈS tout render() déclenché ci-dessus (par loadData()/handleGoogleSession())
    // — render() efface tous les toasts affichés avant lui, donc appeler showToast() trop tôt
    // ferait disparaître le message avant que quiconque le voie.
    if(hadOAuthError && !signedIn){
      showToast('Connexion Google refusée. Si tu testes encore, vérifie que ton compte est bien ajouté comme "Test user" dans Google Cloud Console.');
    }
    // Écoute les connexions Google qui arrivent APRÈS le chargement initial (le clic sur
    // "Se connecter avec Google" redirige puis revient ici, ce qui redéclenche boot() au
    // complet de toute façon — cet écouteur couvre aussi les cas où Supabase la détecte
    // après coup, sans rechargement complet de la page).
    sb.auth.onAuthStateChange((event, session)=>{
      // Même garde-fou qu'au démarrage : ne jamais traiter une connexion en mode admin
      // comme une connexion élève (voir commentaire plus haut dans boot()).
      // (PASSWORD_RECOVERY est géré par un écouteur séparé, posé dès la création de `sb`
      // — voir plus haut — pour ne jamais rater l'événement.)
      if(event === 'SIGNED_IN' && session && !ADMIN_URL_FLAG){ handleGoogleSession(session); }
    });
  }

  boot();
})();
</script>
<script>
// Enregistrement du service worker (PWA — installable sur téléphone/tablette). Best-effort :
// si ça échoue (navigateur trop vieux, ouvert en local, etc.), l'app continue de fonctionner
// normalement sans ça.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
</script>
</body></html>

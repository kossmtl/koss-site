  function renderTextnoteSwatchesHtml(colors, selected){
    return colors.map(col=>`<span class="textnote-color-swatch" data-color="${col}" style="width:26px;height:26px;border-radius:4px;background:${col};cursor:pointer;border:2px solid ${selected===col?'var(--amber)':'transparent'};display:inline-block;"></span>`).join('');
  }
  function textnoteFontCss(key){ return (TEXTNOTE_FONTS.find(f=>f.key===key)||TEXTNOTE_FONTS[0]).css; }
  const NOTEBOOK_TEXTURES = [
    {key:'uni', label:'Uni'},
    {key:'cuir', label:'Cuir'},
    {key:'tisse', label:'Tissée'},
    {key:'kraft', label:'Papier kraft'},
    {key:'denim', label:'Denim'},
    {key:'pointille', label:'Pointillé'},
  ];
  function notebookTextureCss(key){
    switch(key){
      case 'cuir': return 'background-image:repeating-linear-gradient(45deg, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 3px, transparent 3px, transparent 9px);';
      case 'tisse': return 'background-image:repeating-linear-gradient(0deg, rgba(255,255,255,0.09) 0px, rgba(255,255,255,0.09) 1px, transparent 1px, transparent 7px), repeating-linear-gradient(90deg, rgba(255,255,255,0.09) 0px, rgba(255,255,255,0.09) 1px, transparent 1px, transparent 7px);';
      case 'kraft': return 'background-image:repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px, transparent 1px, transparent 14px);';
      case 'denim': return 'background-image:repeating-linear-gradient(65deg, rgba(255,255,255,0.08) 0px, rgba(255,255,255,0.08) 2px, transparent 2px, transparent 6px);';
      case 'pointille': return 'background-image:radial-gradient(rgba(0,0,0,0.18) 1px, transparent 1.5px);background-size:8px 8px;';
      default: return '';
    }
  }

  function notebookPageBgCss(nb){
    const color = nb.pageColor || '#FFFBF8';
    const style = nb.pageStyle || 'ligne';
    if(style === 'vierge'){
      return `background-image:none;background-color:${color};`;
    }
    if(style === 'point'){
      return `background-image:radial-gradient(rgba(40,41,46,0.28) 1.5px, transparent 2px);background-size:18px 18px;background-position:0 0;background-color:${color};`;
    }
    return `background-image:linear-gradient(90deg, rgba(200,60,60,0.35) 2px, transparent 2px), repeating-linear-gradient(${color} 0px, ${color} 27px, rgba(120,140,180,0.25) 28px);background-position:34px 0, 0 6px;background-size:auto, 100% 28px;background-color:${color};`;
  }

  function notebookOwnerKey(email, profileId){
    return `${email.toLowerCase()}::${profileId||'self'}`;
  }
  // Décompose un ownerKey de carnet ("email::self" ou "email::idProfilEnfant").
  function parseOwnerKey(ownerKey){
    const idx = String(ownerKey||'').lastIndexOf('::');
    if(idx === -1) return {email: ownerKey||'', profileId: null};
    const email = ownerKey.slice(0, idx);
    const rest = ownerKey.slice(idx+2);
    return {email, profileId: rest==='self' ? null : rest};
  }
  // true si l'ownerKey correspond au profil d'un enfant (pas le compte principal/adulte).
  function isChildOwnerKey(ownerKey){
    return !!parseOwnerKey(ownerKey).profileId;
  }
  // Étiquette lisible pour un ownerKey — utilisée UNIQUEMENT dans les endroits où on a le
  // droit de révéler une identité (jamais dans la modération des notes anonymes en attente,
  // sauf le signalement "inapproprié" — voir plus bas).
  function ownerKeyLabel(ownerKey){
    const {email, profileId} = parseOwnerKey(ownerKey);
    const acct = findStudentAccount(email);
    if(!acct) return email || 'Inconnu';
    const name = getProfileName(acct, profileId);
    return profileId ? `${name} (enfant · compte ${email})` : `${name} (${email})`;
  }
  // Catégories considérées "enfants" pour le ciblage d'audience des autocollants (S41-bis) —
  // tout le reste (bjj_adulte, muay_thai, yoga, intro_bjj, catégories perso, etc.) = "adultes".
  const KIDS_STICKER_CATEGORIES = new Set(['enfants','parents_enfants']);
  // Toutes les catégories couvertes par un abonnement ACTIF de ce profil précis (compte
  // principal si profileId est null, sinon cet enfant) — un abonnement peut couvrir plusieurs
  // catégories (ex. "All Unlimited").
  function activeMembershipCategoriesForEmail(email, profileId){
    const set = new Set();
    activeMembershipsForEmail(email, null, profileId).forEach(m=>(m.categories||[]).forEach(c=>set.add(c)));
    return set;
  }
  // Cœur du ciblage : est-ce que CE profil (compte principal ou enfant) fait partie de
  // l'audience choisie par la gestionnaire pour cet autocollant ? Recalculé à chaque
  // affichage (jamais figé) — un élève qui obtient un membership plus tard voit aussitôt
  // apparaître les autocollants qui lui étaient destinés, sans action de la gestionnaire.
  function stickerAudience(sticker){
    return sticker.audience || (sticker.availableToAll ? 'all' : 'custom');
  }
  function studentMatchesStickerAudience(sticker, email, profileId){
    const audience = stickerAudience(sticker);
    if(audience === 'all') return true;
    if(audience === 'custom'){
      const e = (email||'').toLowerCase();
      return !!(sticker.assignedEmails && sticker.assignedEmails.includes(e));
    }
    const cats = activeMembershipCategoriesForEmail(email, profileId);
    if(!cats.size) return false;
    if(audience === 'membership') return true;
    if(audience === 'kids') return Array.from(cats).some(c=>KIDS_STICKER_CATEGORIES.has(c));
    if(audience === 'adults') return Array.from(cats).some(c=>!KIDS_STICKER_CATEGORIES.has(c));
    return false;
  }
  // Nombre de fois que CE profil précis a déjà placé cet autocollant sur une page de son
  // carnet (compté à partir des notebookEntries existantes — aucune nouvelle table).
  function stickerUsageCountForOwner(stickerId, ownerKey){
    return state.data.notebookEntries.filter(n=>n.kind==='sticker' && n.stickerId===stickerId && n.ownerKey===ownerKey).length;
  }
  function stickerUsageLimitReachedForOwner(sticker, ownerKey){
    return sticker.usageLimit != null && stickerUsageCountForOwner(sticker.id, ownerKey) >= sticker.usageLimit;
  }
  // "Ignoré" ou déjà utilisé au moins une fois = plus jamais renotifié dans 📥 Reçu pour ce
  // profil précis — stocké directement sur le compte élève (self) ou le profil enfant
  // (familyMembers), aucun changement de schéma Supabase requis (déjà synchronisé en entier).
  function dismissedStickerIdsFor(acct, profileId){
    if(!acct) return [];
    if(!profileId) return acct.dismissedStickerIds || [];
    const fm = (acct.familyMembers||[]).find(f=>f.id===profileId);
    return fm ? (fm.dismissedStickerIds||[]) : [];
  }
  function markStickerDismissedFor(acct, profileId, stickerId){
    if(!acct) return;
    const target = profileId ? (acct.familyMembers||[]).find(f=>f.id===profileId) : acct;
    if(!target) return;
    if(!target.dismissedStickerIds) target.dismissedStickerIds = [];
    if(!target.dismissedStickerIds.includes(stickerId)) target.dismissedStickerIds.push(stickerId);
  }
  // Autocollants "diffusés" (audience ≠ personnalisée) que ce profil peut encore placer —
  // utilisé par le sélecteur "+ Autocollant" du carnet (banque de l'étudiant).
  function stickersAvailableForStudent(email, profileId){
    const ownerKey = notebookOwnerKey(email, profileId||null);
    return state.data.stickers.filter(s=>
      studentMatchesStickerAudience(s, email, profileId) && !stickerUsageLimitReachedForOwner(s, ownerKey)
    );
  }
  // Autocollants diffusés jamais vus par ce profil (ni ignorés, ni déjà placés une fois) —
  // affichés automatiquement dans 📥 Reçu, sans qu'une gestionnaire ait à les attribuer un
  // par un (contrairement aux dons individuels stickerGrants, mécanisme séparé et inchangé).
  function newBroadcastStickersForOwner(ownerKey){
    const {email, profileId} = parseOwnerKey(ownerKey);
    const acct = findStudentAccount(email);
    if(!acct) return [];
    const dismissed = new Set(dismissedStickerIdsFor(acct, profileId));
    return state.data.stickers.filter(s=>{
      if(stickerAudience(s) === 'custom') return false;
      if(dismissed.has(s.id)) return false;
      if(stickerUsageCountForOwner(s.id, ownerKey) > 0) return false;
      return studentMatchesStickerAudience(s, email, profileId);
    });
  }
  function giftedStickersForStudent(email, profileId){
    const e = (email||'').toLowerCase();
    const pid = profileId || null;
    const grants = state.data.stickerGrants.filter(g=>g.email.toLowerCase()===e && (g.profileId||null)===pid && !g.used);
    return grants.map(g=>{
      const s = state.data.stickers.find(x=>x.id===g.stickerId);
      return s ? Object.assign({}, s, {grantId:g.id, grantMessage:g.message||''}) : null;
    }).filter(Boolean);
  }
  function giftedStickersForOwner(ownerKey){
    const parsed = parseOwnerKey(ownerKey);
    return giftedStickersForStudent(parsed.email, parsed.profileId);
  }
  // Total pour le badge 📥 Reçu d'un profil précis : notes/dons individuels (comme avant) +
  // autocollants diffusés jamais vus (nouveau, S41-bis) — newBroadcastStickersForOwner()
  // s'occupe déjà d'exclure ce qui est ignoré/déjà utilisé.
  function totalInboxCountForOwner(ownerKey){
    return receivedItemsForOwner(ownerKey).length + giftedStickersForOwner(ownerKey).length + newBroadcastStickersForOwner(ownerKey).length;
  }
  // Nombre total de notes/autocollants pas encore vus (ni placés sur une page, ni supprimés),
  // sur TOUS les profils du compte (soi-même + enfants) — utilisé pour le petit icône ✉️
  // dans l'en-tête, à côté du nom, pour prévenir l'usager sans qu'il ait à ouvrir son carnet.
  function unreadInboxCountForAccount(acct){
    if(!acct) return 0;
    const profiles = getProfiles(acct);
    return profiles.reduce((sum,p)=>{
      const ownerKey = notebookOwnerKey(acct.email, p.id||null);
      return sum + totalInboxCountForOwner(ownerKey);
    }, 0);
  }
  // NOUVEAU (S47) : nombre d'abonnements en attente de paiement pour ce compte (soi-même ET
  // ses enfants — tous rangés sous le courriel du compte parent, voir activatePlanForStudent).
  // Sert à afficher un petit badge de notification à côté du nom, à côté de celui des
  // messages/autocollants non lus, pour qu'un abonnement offert par une gestionnaire ne passe
  // pas inaperçu même si le courriel de demande de paiement n'a jamais été ouvert.
  function pendingPaymentCountForAccount(acct){
    if(!acct) return 0;
    const e = acct.email.toLowerCase();
    return state.data.memberships.filter(m =>
      m.studentEmail && m.studentEmail.toLowerCase()===e && m.status==='attente_paiement'
    ).length;
  }
  // Notes/post-its/autocollants partagés entre carnets (élève → coach ou élève → élève).
  // Une note "signée" est livrée immédiatement (statut 'delivered') ; une note "anonyme"
  // doit d'abord être approuvée par un·e gestionnaire (statut 'pending_review') — dans les
  // deux cas, personne (ni Amélie via la modération, ni le destinataire) ne voit qui l'a
  // envoyée : l'identité de l'expéditeur n'est jamais affichée dans l'interface.
  function sharedItemContentFromEntry(entry){
    const base = {kind: entry.kind, category: entry.category||''};
    if(entry.kind === 'text'){
      Object.assign(base, {text:entry.text, fontFamily:entry.fontFamily, color:entry.color, hAlign:entry.hAlign});
    } else if(entry.kind === 'sticker'){
      Object.assign(base, {stickerId:entry.stickerId});
    } else {
      Object.assign(base, {text:entry.text, color:entry.color, photo:entry.photo||null});
    }
    return base;
  }
  function receivedItemsForOwner(ownerKey){
    return state.data.sharedItems.filter(s=>s.recipientType==='student' && s.recipientOwnerKey===ownerKey && s.status==='delivered');
  }
  function receivedItemsForManager(managerId){
    return state.data.sharedItems.filter(s=>s.recipientType==='coach' && s.recipientManagerId===managerId && s.status==='delivered');
  }
  // Notes déjà marquées "lues" par un coach — gardées (jamais supprimées automatiquement) pour
  // qu'elles restent consultables plus tard, au lieu de disparaître dès qu'elles sont lues.
  function archivedItemsForManager(managerId){
    return state.data.sharedItems
      .filter(s=>s.recipientType==='coach' && s.recipientManagerId===managerId && s.status==='archived')
      .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  }
  function pendingModerationSharedItems(){
    return state.data.sharedItems.filter(s=>s.anonymous && s.status==='pending_review');
  }
  function flaggedInappropriateItems(){
    return state.data.sharedItems.filter(s=>s.inappropriate && s.status!=='archived');
  }
  // Présences ajoutées sans abonnement valide, encore non réglées, pour un étudiant (ou un
  // de ses enfants) précis — affiché directement dans sa fiche, en plus de la liste globale
  // "Présences sans abonnement" du tableau de bord.
  function unpaidAttendanceFor(email, profileId){
    const pid = profileId || null;
    return state.data.bookings.filter(b=>b.studentEmail.toLowerCase()===(email||'').toLowerCase() && (b.profileId||null)===pid && b.noMembership && b.status!=='annulee');
  }
  function unpaidAttendanceHtml(email, profileId){
    const items = unpaidAttendanceFor(email, profileId);
    if(!items.length) return '';
    return `
      <label style="margin-top:14px;color:var(--coral);">⚠ Présences non réglées (${items.length})</label>
      <ul class="link-list">
        ${items.map(b=>{
          const c = state.data.classes.find(cl=>cl.id===b.classId);
          return `<li><span>${c?escapeHtml(c.name):'—'} — ${b.dateIso}</span><span><button class="small-btn" data-action="open-mark-attendance-paid" data-id="${b.id}">A payé</button></span></li>`;
        }).join('')}
      </ul>
    `;
  }
  // Onglet "Visites" dépliable dans la fiche d'un étudiant (ou d'un enfant) : toutes ses
  // réservations passées et à venir (hors déjà annulées), avec possibilité de les retirer.
  function studentVisitsHtml(email, profileId, showVisits){
    const pid = profileId || null;
    const visits = state.data.bookings.filter(b=>b.studentEmail.toLowerCase()===(email||'').toLowerCase() && (b.profileId||null)===pid && b.status!=='annulee').sort((a,b)=>a.dateIso.localeCompare(b.dateIso));
    const today = todayIso();
    return `
      <div class="btn-row" style="margin-top:14px;">
        <button class="small-btn" data-action="toggle-modal-visits">${showVisits?'▲':'▼'} Visites (${visits.length})</button>
      </div>
      ${showVisits ? (visits.length ? `
        <table style="margin-top:6px;">
          <tr><th>Cours</th><th>Date</th><th>Statut</th><th></th></tr>
          ${visits.map(b=>{
            const c = state.data.classes.find(cl=>cl.id===b.classId);
            const upcoming = b.dateIso >= today;
            return `<tr><td>${c?escapeHtml(c.name):'—'}${upcoming?' <span style="color:var(--sage);font-size:11px;">(à venir)</span>':''}</td><td>${b.dateIso}</td><td>${statusBadge(b.status)}</td><td><button class="small-btn" data-action="cancel-booking" data-id="${b.id}">Supprimer</button></td></tr>`;
          }).join('')}
        </table>
      ` : '<p class="muted" style="color:var(--chalk-dim);margin-top:6px;">Aucune visite.</p>') : ''}
    `;
  }
  function trashedItemsForOwner(ownerKey){
    return state.data.notebookEntries.filter(n=>n.ownerKey===ownerKey && n.trashed).sort((a,b)=>(b.trashedAt||0)-(a.trashedAt||0));
  }
  function sharedContentPreviewHtml(c){
    if(c.kind === 'sticker'){
      const sticker = state.data.stickers.find(s=>s.id===c.stickerId);
      return sticker ? `<img src="${sticker.image}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;"><div class="sname">${escapeHtml(sticker.name)}</div>` : '<p class="muted" style="color:var(--chalk-dim);">Autocollant introuvable.</p>';
    }
    // Les notes-texte utilisent une encre foncée pensée pour la page claire du carnet.
    // Ici (modale sur fond sombre), on leur donne toujours un fond clair type papier pour
    // que le texte reste lisible (sinon: texte foncé sur fond sombre = invisible).
    return `
      <div class="postit" style="background:${c.kind==='text' ? 'var(--chalk)' : (c.color||POSTIT_COLORS[0])};${c.kind==='text' ? 'box-shadow:none;border:1px dashed rgba(40,41,46,0.3);font-family:'+textnoteFontCss(c.fontFamily)+';color:'+(c.color||TEXTNOTE_INK_COLORS[0])+';' : ''}max-width:220px;">
        ${c.category ? `<div class="postit-cat" style="${c.kind==='text'?'color:rgba(40,41,46,0.6);':''}">${escapeHtml(c.category)}</div>` : ''}
        <div class="postit-text">${escapeHtml(c.text||'')}</div>
        ${c.photo ? `<img src="${c.photo}">` : ''}
      </div>
    `;
  }
  const MAX_NOTEBOOK_PAGES = 40;
  function getNotebooksForOwner(ownerKey){
    return state.data.notebooks.filter(nb=>nb.ownerKey===ownerKey).sort((a,b)=>a.createdAt-b.createdAt);
  }
  function getOrCreateActiveNotebook(ownerKey){
    let list = getNotebooksForOwner(ownerKey);
    if(!list.length){
      const nb = {id:uid(), ownerKey, name:'Mon carnet', pageCount:1,
        coverColor:'#1D5C43', coverTexture:'uni', coverTextColor:'#F2E27A',
        pageColor:'#FFFBF8', postitColor:POSTIT_COLORS[0], createdAt:Date.now()};
      state.data.notebooks.push(nb);
      list = [nb];
    }
    if(!state.notebookActiveId || !list.find(nb=>nb.id===state.notebookActiveId)){
      state.notebookActiveId = list[0].id;
    }
    return list.find(nb=>nb.id===state.notebookActiveId);
  }

  function getProfiles(acct){
    const self = {id:null, name:acct.name, firstName:acct.firstName, lastName:acct.lastName, isSelf:true};
    return [self].concat((acct.familyMembers||[]).map(f=>({...f, isSelf:false})));
  }
  function getProfileName(acct, profileId){
    if(!profileId) return acct.name;
    const fm = (acct.familyMembers||[]).find(f=>f.id===profileId);
    return fm ? fm.name : acct.name;
  }

  function currentManager(){
    return state.data.managers.find(m=>m.id===state.currentManagerId) || null;
  }

  function findStudentAccount(email){
    const e = String(email||'').toLowerCase();
    return state.data.studentAccounts.find(a=>a.email.toLowerCase()===e) || null;
  }

  // Archive un compte élève supprimé (self-delete OU suppression admin) dans
  // state.data.deletedAccounts au lieu de le perdre pour toujours tout de suite — Amélie peut
  // ensuite le réactiver ou le supprimer pour de bon depuis l'onglet "Comptes supprimés".
  // Retire le compte + carnet(s) des données actives, MAIS garde les abonnements/réservations en
  // place tels quels (comme avant S24) : ils deviennent orphelins, conservés pour la comptabilité,
  // et se retrouvent naturellement reliés au compte si jamais il est réactivé (même courriel).
  function archiveDeletedAccount(acct, deletedBy){
    const email = acct.email.toLowerCase();
    const ownerKeys = new Set([notebookOwnerKey(acct.email, null)]);
    (acct.familyMembers||[]).forEach(fm=>ownerKeys.add(notebookOwnerKey(acct.email, fm.id)));

    // Annule les réservations à venir (comme annoncé aux élèves), pour tous les profils du compte.
    state.data.bookings.forEach(b=>{
      if(b.studentEmail && b.studentEmail.toLowerCase()===email && b.status!=='annulee'){
        refundCreditIfNeeded(b);
        b.status = 'annulee';
        promoteWaitlistIfRoom(b.classId, b.dateIso);
      }
    });

    const hadActiveMembership = state.data.memberships.some(m=>
      m.studentEmail && m.studentEmail.toLowerCase()===email && membershipDisplayStatus(m)==='active'
    );

    const archivedNotebooks = state.data.notebooks.filter(nb=>ownerKeys.has(nb.ownerKey));
    const archivedEntries = state.data.notebookEntries.filter(n=>ownerKeys.has(n.ownerKey));
    const archivedGrants = (state.data.stickerGrants||[]).filter(g=>g.email && g.email.toLowerCase()===email);

    state.data.notebooks = state.data.notebooks.filter(nb=>!ownerKeys.has(nb.ownerKey));
    state.data.notebookEntries = state.data.notebookEntries.filter(n=>!ownerKeys.has(n.ownerKey));
    state.data.stickerGrants = (state.data.stickerGrants||[]).filter(g=>!(g.email && g.email.toLowerCase()===email));
    state.data.studentAccounts = state.data.studentAccounts.filter(a=>a.email.toLowerCase()!==email);

    if(!state.data.deletedAccounts) state.data.deletedAccounts = [];
    state.data.deletedAccounts = state.data.deletedAccounts.filter(d=>d.account.email.toLowerCase()!==email);
    state.data.deletedAccounts.push({
      id: uid(),
      deletedAt: Date.now(),
      deletedBy, // 'self' ou le nom du gestionnaire
      hadActiveMembership,
      account: acct,
      notebooks: archivedNotebooks,
      notebookEntries: archivedEntries,
      stickerGrants: archivedGrants,
    });
  }

  function renderMembershipRows(filterEmail, filterProfileId){
    let allMemberships = state.data.memberships.slice().sort((a,b)=>b.createdAt-a.createdAt);
    if(filterEmail) allMemberships = allMemberships.filter(m=>m.studentEmail.toLowerCase()===filterEmail.toLowerCase());
    if(filterProfileId!==undefined) allMemberships = allMemberships.filter(m=>(m.profileId||null)===(filterProfileId||null));
    const showHidden = !!state.adminShowHiddenMemberships;
    const hiddenCount = allMemberships.filter(m=>m.hiddenByAdmin).length;
    if(!showHidden) allMemberships = allMemberships.filter(m=>!m.hiddenByAdmin);
    const rows = allMemberships.map(m=>{
      const ds = membershipDisplayStatus(m);
      let extra = '';
      if(ds==='active'){
        extra = m.type==='credits'
          ? `<button class="small-btn" data-action="add-credit" data-id="${m.id}">+1 cours</button>`
          : `<button class="small-btn" data-action="add-days" data-id="${m.id}">+7 jours</button>`;
      }
      if(ds!=='annulee'){

  function searchStudentAccounts(query){
    const q = normalizeStr(query);
    if(!q) return [];
    const results = [];
    state.data.studentAccounts.forEach(a=>{
      const hay = normalizeStr(`${a.name||''} ${a.firstName||''} ${a.lastName||''} ${a.email||''} ${a.phone||''}`);
      if(hay.includes(q)) results.push({type:'account', email:a.email, name:a.name, phone:a.phone||''});
      (a.familyMembers||[]).forEach(f=>{
        if(normalizeStr(f.name||'').includes(q)){
          results.push({type:'child', parentEmail:a.email, parentName:a.name, memberId:f.id, name:f.name, birthday:f.birthday||'', email:f.email||'', phone:f.phone||''});
        }
      });
    });
    return results;
  }

  // Returns {ok, reason, isNew}. Creates the account on first use of an email.
  // ⚠️ SUPPRIMÉ (sécurité) : verifyOrCreateAccount comparait un hash côté navigateur et créait
  // des comptes directement dans state.data — c'est exactement le schéma pré-Supabase-Auth
  // qu'on a éliminé partout ailleurs. Les deux appelants (submit-welcome-auth, submit-booking,
  // branche "existing") font maintenant un vrai sb.auth.signInWithPassword() à la place —
  // voir plus bas.

  // Étape 1 de la création de compte vérifiée par courriel. Si le courriel a déjà un compte,
  // on retombe simplement sur une connexion normale (aucun code requis — l'usager s'est juste
  // trompé de bouton). Sinon, envoie un code à 6 chiffres et ne crée PAS le compte tout de
  // suite : il ne sera créé qu'une fois le code confirmé (confirm-signup-code-submit), pour
  // qu'on ne puisse jamais créer de compte avec un courriel qu'on ne possède pas.
  async function startSignupCode(email, name, password, firstName, lastName){
    const existing = findStudentAccount(email);
    if(existing){
      const hash = await hashPassword(password);
      if(existing.hash !== hash) return {ok:false, reason:'wrong'};
      return {ok:true, isNew:false};
    }
    try{
      const hash = await hashPassword(password);
      const resp = await sb.functions.invoke('koss-send-signup-code', {body:{email, name, firstName, lastName, hash}});
      if(resp.error || !resp.data || !resp.data.ok){
        const errCode = resp.data && resp.data.error;
        return {ok:false, reason: errCode==='exists' ? 'exists' : 'send_failed'};
      }
      return {ok:true, isNew:true, needsCode:true};
    }catch(err){
      console.error('Échec envoi code de vérification (inscription):', err);
      return {ok:false, reason:'send_failed'};
    }
  }

  // --- Connexion avec Google (en option, en plus du courriel/mot de passe — jamais un
  // remplacement) --------------------------------------------------------------------
  // Lance le flot OAuth Google via Supabase Auth. Redirige vers Google, puis revient sur
  // cette même page (redirectTo = l'URL actuelle) avec une session Supabase Auth active —
  // c'est handleGoogleSession() qui prend le relais à ce moment-là (voir boot()).
  async function signInWithGoogle(){
    try{
      // ⚠️ Piège : NE JAMAIS utiliser window.location.href tel quel ici — si la page a déjà
      // des paramètres d'un essai précédent (?error=... ou #access_token=...) encore collés
      // dans l'URL, ils seraient repris comme adresse de retour et s'empileraient à chaque
      // nouvel essai (URL à rallonge, plusieurs # dans la même adresse). On repart toujours
      // d'une URL propre (juste le chemin, sans query ni hash).
      const cleanUrl = window.location.origin + window.location.pathname;
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: cleanUrl }
      });
      if(error){ console.error('Échec connexion Google:', error); showToast('Échec de la connexion Google. Réessayez.'); }
    }catch(err){
      console.error('Échec connexion Google:', err);
      showToast('Échec de la connexion Google. Réessayez.');
    }
  }

  // Appelée au chargement de la page (si on revient d'un login Google) et à chaque connexion
  // Google réussie. Relie le courriel Google à un compte studentAccounts EXISTANT s'il y en a
  // un (même logique que pour un compte courriel/mot de passe : identifié par courriel) —
  // sinon en crée un nouveau directement, SANS le code de vérification à 6 chiffres habituel
  // (startSignupCode) puisque Google a déjà confirmé que cette personne possède ce courriel.
  // Appelée pour TOUTE session Supabase Auth active côté élève (Google OU courriel/mot de
  // passe — sb.auth.onAuthStateChange() ne distingue pas les deux) — pas seulement Google
  // malgré son nom historique. Le drapeau "googleLinked" n'est posé que si le fournisseur
  // réel de CETTE session est bien Google, jamais par défaut.
  async function handleGoogleSession(session){
    const email = session && session.user ? session.user.email : null;
    if(!email) return;
    // ⚠️ Piège corrigé (15 sept 2026) : une gestionnaire (compte réel Supabase Auth, ex.
    // super-gestionnaire kossmtl@gmail.com) qui ouvre l'app SANS ?admin dans le même
    // navigateur où elle est connectée en admin se faisait automatiquement créer/connecter
    // un compte ÉLÈVE avec sa propre adresse admin — sb.auth.getSession() renvoie la même
    // session peu importe l'onglet/la page, cette fonction ne distinguait pas "courriel
    // gestionnaire" de "courriel élève". On ne traite donc jamais ici un courriel qui
    // correspond à un compte gestionnaire existant.
    if(state.data.managers.some(m=>(m.email||'').toLowerCase()===email.toLowerCase())) return;
    if(state.studentSession && state.studentSession.email.toLowerCase() === email.toLowerCase()) return; // déjà connecté·e
    const isGoogle = !!(session.user && session.user.app_metadata && session.user.app_metadata.provider === 'google');
    let acct = findStudentAccount(email);
    if(!acct){
      const meta = (session.user && session.user.user_metadata) || {};
      const fullName = meta.full_name || meta.name || email.split('@')[0];
      const parts = String(fullName).trim().split(/\s+/).filter(Boolean);
      const firstName = meta.given_name || parts[0] || '';
      const lastName = meta.family_name || parts.slice(1).join(' ') || '';
      acct = {
        email, name: fullName, hash: null, googleLinked: isGoogle, phone:'',
        firstName, lastName,
        createdAt: Date.now(), lastVisit:null, firstVisit:null, visitCount:0, cancelCount:0,
        birthday:'', belt:'', notes:{}, familyMembers:[]
      };
      // Création explicite, via une fonction dédiée à ça — jamais via la synchro de routine
      // (koss_sync_all), pour qu'une suppression faite par une gestionnaire reste permanente
      // même si la personne supprimée a encore l'app ouverte ailleurs.
      try{
        const { error: signupErr } = await sb.rpc('koss_student_self_signup', { payload: acct });
        if(signupErr) console.error('Échec création du compte (signup Google):', signupErr);
      }catch(err){ console.error('Échec création du compte (signup Google):', err); }
      state.data.studentAccounts.push(acct);
      state.lastSyncedData = deepClone(state.data);
      try{ sb.functions.invoke('koss-send-welcome-email', {body:{email, firstName: firstName||fullName}}); }catch(err){ console.error('Échec envoi courriel de bienvenue:', err); }
    } else if(isGoogle && !acct.googleLinked){
      acct.googleLinked = true;
      await persist();
    }
    state.studentSession = {email: acct.email};
    await saveSessionToStorage(acct.email);
    state.view = 'student';
    render();
    showToast(`Bienvenue, ${acct.firstName || acct.name} !`);
  }

  function normalizeStr(s){
    return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  }

  function matchCategories(str){
    if(!str) return [];
    const parts = str.split(/[;,/]/).map(normalizeStr).filter(Boolean);
    const found = new Set();
    parts.forEach(p=>{
      CATEGORIES.forEach(cat=>{
        const label = normalizeStr(cat.label);
        const keyWords = cat.key.replace('_',' ');
        if(p.includes(label) || label.includes(p) || p.includes(keyWords)) found.add(cat.key);
      });
    });
    return Array.from(found);
  }

  function parseCSV(text){
    const rows = [];
    let i=0, field='', row=[], inQuotes=false;
    const s = String(text||'').replace(/\r\n/g,'\n');
    while(i < s.length){
      const c = s[i];
      if(inQuotes){
        if(c === '"'){
          if(s[i+1] === '"'){ field+='"'; i+=2; continue; }
          inQuotes = false; i++; continue;
        } else { field += c; i++; continue; }
      } else {
        if(c === '"'){ inQuotes = true; i++; continue; }
        if(c === ','){ row.push(field); field=''; i++; continue; }
        if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
        field += c; i++; continue;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.some(cell => cell.trim() !== ''));
  }

  function activateMembership(m){
    m.status = 'active';
    const plan = state.data.membershipPlans.find(p=>p.id===m.planId);
    const durationDays = plan ? plan.durationDays : 30;
    const creditsCount = plan ? plan.creditsCount : 1;
    if(m.type === 'illimite'){
      const start = new Date();
      const end = new Date(start); end.setDate(end.getDate() + durationDays);
      m.startDate = isoDate(start);
      m.endDate = isoDate(end);
    } else {
      let remaining = creditsCount;
      if(m.introStart){
        const introClass = state.data.classes.find(c=>c.category==='intro_bjj' && c.startDate===m.introStart && c.endDate===m.introEnd);
        if(introClass){
          const alreadyBooked = state.data.bookings.filter(b=>
            b.studentEmail.toLowerCase()===m.studentEmail.toLowerCase() &&
            ACTIVE_STATUSES.includes(b.status) &&
            getProgramOccurrences(introClass).some(o=>o.classId===b.classId && o.dateIso===b.dateIso)
          ).length;
          remaining = Math.max(0, creditsCount - alreadyBooked);
        }
      }
      m.creditsRemaining = remaining;
    }
  }

  // Nom court pour le coin en haut à droite de l'en-tête (demande explicite d'Amélie, S28) :
  // prénom complet + première lettre du nom de famille (ex. "Sarah Martin" → "Sarah M"), et si
  // le PRÉNOM lui-même est composé (avec un trait d'union), seule la première lettre de son
  // deuxième segment est gardée (ex. "Marie-Claude Tremblay" → "Marie-C T"). Aucun effet ailleurs
  // dans l'app (carte "Mon compte", listes admin, etc. gardent le nom complet) — seulement ici.
  function headerShortName(fullName){
    const name = String(fullName||'');
    const parts = name.trim().split(/\s+/).filter(Boolean);
    if(parts.length < 2) return fullName||'';
    const lastName = parts[parts.length-1];
    // ⚠️ Piège trouvé (screenshot Amélie, "Lily (" tronqué) : un profil (souvent un enfant)
    // peut avoir un nom avec une précision entre parenthèses (ex. "Lily (Léa)") ou toute autre
    // ponctuation collée au dernier "mot". La règle "1re lettre du nom de famille" prenait alors
    // cette parenthèse comme si c'était le nom de famille et affichait juste "Lily (" — pas un
    // bug d'affichage CSS, le texte généré était réellement tronqué à cet endroit. On ne
    // raccourcit maintenant QUE si le dernier mot ressemble à un vrai nom de famille (lettres,
    // apostrophes, traits d'union seulement) ; sinon on affiche le nom complet tel quel.
    if(!/^[A-Za-zÀ-ÖØ-öø-ÿ'’-]+$/.test(lastName)) return name;
    let firstPart = parts.slice(0, -1).join(' ');
    if(firstPart.includes('-')){
      const sub = firstPart.split('-');
      firstPart = sub[0] + '-' + (sub[1] ? sub[1].charAt(0).toUpperCase() : '');
    }
    return firstPart + ' ' + lastName.charAt(0).toUpperCase();
  }

  function renderHeader(){
    const acct = state.studentSession ? findStudentAccount(state.studentSession.email) : null;
    const activeProfileId = acct ? (state.activeProfileId || null) : null;
    const activeName = acct ? getProfileName(acct, activeProfileId) : '';
    const profiles = acct ? getProfiles(acct) : [];
    // Abonnement actif de la personne actuellement affichée (soi-même ou le profil enfant
    // sélectionné) — toujours visible sous le nom dans le coin en haut à droite, pas seulement
    // sur la carte "Mon compte". Le ▼ n'ouvre un menu déroulant que s'il y en a plusieurs.
    // ⚠️ CHANGÉ (S28) : "Abonnement actif :" et le nom de la formule sont maintenant sur 2
    // lignes séparées (avant : une seule ligne), toujours alignés à droite.
    const headerActiveMemberships = acct ? activeMembershipsForEmail(acct.email, null, activeProfileId) : [];

  function buildStudentTileHtml(cRaw, dateIso){
    const c = getEffectiveClass(cRaw, dateIso);
    if(c.cancelled){
      if(c.hideFromSchedule) return '';
      return `
        <div class="class-tile" style="opacity:.55;border-left-color:var(--border);">
          <div class="class-time">${c.time} <span style="color:var(--chalk);font-weight:700;">· ${categoryLabel(c.category)}</span></div>
          <div class="class-name" style="text-decoration:line-through;color:var(--chalk-dim);">${escapeHtml(c.name)}</div>
          <div class="class-spots" style="color:var(--coral);">Annulé</div>
        </div>
      `;
    }
    const booked = bookedCount(c.id, dateIso);
    const full = booked >= c.capacity;
    const numDots = Math.ceil(c.capacity/2);
    const filledUnits = booked/2;
    let dots = '';
    for(let k=0;k<numDots;k++){
      const fill = Math.max(0, Math.min(1, filledUnits-k));
      const dotColor = capacityColor(numDots>1 ? k/(numDots-1) : 0);
      let dotStyle;
      if(fill<=0) dotStyle = `border:1px solid var(--border);background:transparent;`;
      else if(fill>=1) dotStyle = `background:${dotColor};border:1px solid ${dotColor};`;
      else dotStyle = `background:linear-gradient(90deg, ${dotColor} 50%, transparent 50%);border:1px solid ${dotColor};`;
      dots += `<span class="dot" style="${dotStyle}"></span>`;
    }
    const isProgram = isProgramClass(c);
    let spotsText;
    if(full){
      spotsText = 'Complet \u00b7 liste d\u2019attente';
    } else {
      spotsText = (c.capacity - booked) + ' place(s) restante(s)';
    }
    const accent = classAccent(c);
    const isRainbow = c.name && c.name.trim()==='Queers & Allies';
    const nameColor = isRainbow ? '#FFFBF8' : accent;
    const tint = classTint(c);
    const tileStyle = isRainbow ? '' : ` style="border-left-color:${accent};${tint ? `background:${tint};` : ''}"`;
    const tileInner = `
      <div class="class-tile ${full?'full':''}"${tileStyle} data-action="open-class" data-class="${c.id}" data-date="${dateIso}">
        <div class="class-time">${c.time} <span style="color:var(--chalk);font-weight:700;">\u00b7 ${categoryLabel(c.category)}</span> ${c.free ? '<span style="color:var(--sage);">\u00b7 gratuit</span>' : ''}</div>
        <div class="class-name" style="color:${nameColor};">${escapeHtml(c.name)}${isProgram ? ` <span style="color:var(--amber);font-size:11px;">\u00b7 ${programOrEventWord(c)}</span>` : ''}</div>
        ${c.publicNote ? `<div style="color:var(--sage);font-size:11px;line-height:1.3;margin-top:2px;">\u{1F4CC} ${escapeHtml(c.publicNote)}</div>` : ''}
        <div class="class-spots">${spotsText}</div>
        <div class="dots">${dots}</div>
      </div>
    `;
    return isRainbow ? `<div class="rainbow-wrap">${tileInner}</div>` : tileInner;
  }

  function renderStudent(){
    const dates = getWeekDates(state.weekOffset);
    let anyClass = false;
    let weekHasMorning = false;
    let weekHasAfternoon = false;
    const dayData = dates.map((d,i)=>{
      const dateIso = isoDate(d);
      const dayClasses = state.data.classes.filter(c=>c.dayOfWeek===i)
        .filter(c=> (!c.startDate || dateIso >= c.startDate) && (!c.endDate || dateIso <= c.endDate))
        .sort((a,b)=>a.time.localeCompare(b.time));
      if(dayClasses.length) anyClass = true;
      const morning = dayClasses.filter(c=>c.time < '12:01');
      const afternoon = dayClasses.filter(c=>c.time >= '12:01');
      if(morning.length) weekHasMorning = true;
      if(afternoon.length) weekHasAfternoon = true;
      return {d, i, dateIso, dayClasses, morning, afternoon};
    });
    const splitAmPm = weekHasMorning && weekHasAfternoon && window.innerWidth > 700;
    let cols = '';
    if(splitAmPm){
      cols += '<div class="board board-am">';
      dayData.forEach(({d,i,dateIso,morning})=>{
        const tiles = morning.map(c=>buildStudentTileHtml(c, dateIso)).join('');
        cols += `
          <div class="day-col">
            <div class="day-head">${DAYS_SHORT[i]} <span class="num">${formatDayNum(d)}</span></div>
            <div class="am-tiles-wrap">${tiles}</div>
          </div>
        `;
      });
      cols += '</div><div class="week-divider"></div><div class="board board-pm">';
      dayData.forEach(({dateIso,afternoon})=>{
        const tiles = afternoon.map(c=>buildStudentTileHtml(c, dateIso)).join('');
        cols += `<div class="day-col">${tiles}</div>`;
      });
      cols += '</div>';
    } else {
      dayData.forEach(({d,i,dateIso,dayClasses})=>{
        const tiles = dayClasses.map(c=>buildStudentTileHtml(c, dateIso)).join('');
        cols += `
          <div class="day-col">
            <div class="day-head">${DAYS_SHORT[i]} <span class="num">${formatDayNum(d)}</span></div>
            ${tiles || '<div style="font-size:12px;color:var(--chalk-dim);">\u2014</div>'}
          </div>
        `;
      });
    }
    let myWeekBookingsHtml = '';
    if(state.studentSession){
      const weekStart = isoDate(dates[0]);
      const weekEnd = isoDate(dates[6]);
      const myBookings = state.data.bookings.filter(b=>
        b.studentEmail.toLowerCase()===state.studentSession.email.toLowerCase() &&
        b.status!=='annulee' &&
        b.dateIso>=weekStart && b.dateIso<=weekEnd
      ).sort((a,b)=>a.dateIso.localeCompare(b.dateIso));
      if(myBookings.length){
        myWeekBookingsHtml = `
          <div class="card" style="margin-bottom:16px;">
            <h3 style="margin:0 0 8px;">Mes réservations cette semaine</h3>
            ${myBookings.map(b=>{
              const c = state.data.classes.find(cl=>cl.id===b.classId);
              const d = new Date(b.dateIso+'T00:00:00');
              const dayShort = DAYS_SHORT[(d.getDay()+6)%7].toUpperCase();
              return `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;">
                  <span style="color:var(--chalk-dim);font-family:var(--font-d);font-size:11px;min-width:50px;">${dayShort} ${formatDayNum(d)}</span>
                  <span style="flex:1;padding:0 10px;">${c?escapeHtml(c.name):'—'} · ${c?c.time:''}</span>
                  ${statusBadge(b.status)}
                  <button class="small-btn" style="margin-left:8px;" data-action="open-add-to-calendar" data-class="${b.classId}" data-date="${b.dateIso}" title="Ajouter au calendrier">📅</button>
                  <button class="small-btn" style="margin-left:8px;" data-action="student-cancel-booking" data-id="${b.id}" title="Annuler cette réservation">✕</button>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }
    }

    return `
      ${myWeekBookingsHtml}
      <div class="week-nav">
        ${state.weekOffset>0 ? '<button data-action="week-prev"><span class="full-text">← Semaine préc.</span><span class="short-text">Semaine<br>← Préc.</span></button>' : ''}
        <span class="week-label">${weekLabel(state.weekOffset)}</span>
        <button data-action="week-next"><span class="full-text">Semaine suiv. →</span><span class="short-text">Semaine<br>Suiv. →</span></button>
        ${state.weekOffset!==0 ? '<button data-action="week-today">Aujourd\'hui</button>' : ''}
        ${getNextIntroProgram() ? `<button class="btn-intro-highlight" data-action="goto-next-intro" style="line-height:1.3;text-align:center;">Aller au prochain<br>programme d\u2019intro<br>${formatShortDate(getNextIntroProgram().startDate)} au ${formatShortDate(getNextIntroProgram().endDate)}</button>` : ''}
      </div>
      ${anyClass ? (splitAmPm ? cols : `<div class="board">${cols}</div>`) : `<div class="board"><div class="empty-note">Aucun cours programm\u00e9 pour l\u2019instant. Revenez bient\u00f4t !</div></div>`}
      <div class="card" style="margin-top:20px;">
        <h3>Devenir membre</h3>
        <p class="muted" style="color:var(--chalk-dim);margin-bottom:0;">Un abonnement actif est requis pour réserver un cours.</p>
        <div class="btn-row"><button class="btn btn-primary" data-action="browse-plans">Voir les formules</button></div>
      </div>
    `;
  }

        <button type="button" data-action="toggle-admin-card" data-card="${key}" style="width:100%;display:flex;justify-content:space-between;align-items:center;background:transparent;border:none;padding:0;cursor:pointer;">

  function buildAttendanceTileHtml(cRaw, dateIso){
    const c = getEffectiveClass(cRaw, dateIso);
    const count = state.data.bookings.filter(b=>b.classId===c.id && b.dateIso===dateIso && b.status==='confirmee').length;
    const accent = classAccent(c);
    const isRainbow = c.name && c.name.trim()==='Queers & Allies';
    const nameColor = isRainbow ? '#FFFBF8' : accent;
    const tint = classTint(c);
    const tileStyle = isRainbow ? '' : ` style="border-left-color:${accent};${tint ? `background:${tint};` : ''}${c.cancelled?'opacity:.55;':''}"`;
    const tileInner = `
      <div class="class-tile"${tileStyle} data-action="open-attendance" data-class="${c.id}" data-date="${dateIso}">
        <div class="class-time">${c.time} <span style="color:var(--chalk);font-weight:700;">· ${categoryLabel(c.category)}</span> ${c.free ? '<span style="color:var(--sage);">· gratuit</span>' : ''}</div>
        <div class="class-name" style="color:${nameColor};${c.cancelled?'text-decoration:line-through;':''}">${escapeHtml(c.name)}${c.cancelled?` <span style="color:var(--coral);font-size:11px;">(annulé${c.hideFromSchedule?' · caché des élèves':''})</span>`:''}</div>
        <div class="class-spots">${c.cancelled ? 'Annulé' : count+' inscrit(s)'}</div>
      </div>
    `;
    return isRainbow ? `<div class="rainbow-wrap">${tileInner}</div>` : tileInner;
  }

  function renderAttendance(){
    // Les gestionnaires normaux ne voient que les cours d'aujourd'hui ; seul le super
    // gestionnaire peut naviguer les autres semaines et voir l'historique complet.
    const mgr = currentManager();
    const isSuperMgr = !!(mgr && mgr.role==='super');
    if(!isSuperMgr) state.weekOffset = 0;
    const dates = getWeekDates(state.weekOffset);
    let anyClass = false;
    let weekHasMorning = false;
    let weekHasAfternoon = false;
    const today = todayIso();
    let dayData = dates.map((d,i)=>{
      const dateIso = isoDate(d);
      const dayClasses = state.data.classes.filter(c=>c.dayOfWeek===i)
        .filter(c=> (!c.startDate || dateIso >= c.startDate) && (!c.endDate || dateIso <= c.endDate))
        .sort((a,b)=>a.time.localeCompare(b.time));
      if(dayClasses.length) anyClass = true;
      const morning = dayClasses.filter(c=>c.time < '12:01');
      const afternoon = dayClasses.filter(c=>c.time >= '12:01');
      if(morning.length) weekHasMorning = true;
      if(afternoon.length) weekHasAfternoon = true;
      return {d, i, dateIso, dayClasses, morning, afternoon};
    });
    if(!isSuperMgr){
      dayData = dayData.filter(dd=>dd.dateIso===today);
      anyClass = dayData.some(dd=>dd.dayClasses.length);
    }
    const splitAmPm = weekHasMorning && weekHasAfternoon && window.innerWidth > 700;
    let cols = '';
    if(splitAmPm){
      cols += '<div class="board board-am">';
      dayData.forEach(({d,i,dateIso,morning})=>{
        const tiles = morning.map(c=>buildAttendanceTileHtml(c, dateIso)).join('');
        cols += `
          <div class="day-col">
            <div class="day-head">${DAYS_SHORT[i]} <span class="num">${formatDayNum(d)}</span></div>
            ${tiles}
          </div>
        `;
      });
      cols += '</div><div class="week-divider"></div><div class="board board-pm">';
      dayData.forEach(({dateIso,afternoon})=>{
        const tiles = afternoon.map(c=>buildAttendanceTileHtml(c, dateIso)).join('');
        cols += `<div class="day-col">${tiles}</div>`;
      });
      cols += '</div>';
    } else {
      dayData.forEach(({d,i,dateIso,dayClasses})=>{
        const tiles = dayClasses.map(c=>buildAttendanceTileHtml(c, dateIso)).join('');
        cols += `
          <div class="day-col">
            <div class="day-head">${DAYS_SHORT[i]} <span class="num">${formatDayNum(d)}</span></div>
            ${tiles || '<div style="font-size:12px;color:var(--chalk-dim);">—</div>'}
          </div>
        `;
      });
    }

    return `
      <div class="btn-row" style="margin-top:0;margin-bottom:14px;"><button class="btn btn-secondary" data-action="goto-admin">← Retour à Gérer</button></div>
      <h3 style="font-family:var(--font-d);text-transform:uppercase;letter-spacing:0.01em;">Prise de présences</h3>
      ${isSuperMgr ? `
      <div class="week-nav">
        <button data-action="week-prev"><span class="full-text">← Semaine préc.</span><span class="short-text">Semaine<br>← Préc.</span></button>
        <span class="week-label">${weekLabel(state.weekOffset)}</span>
        <button data-action="week-next"><span class="full-text">Semaine suiv. →</span><span class="short-text">Semaine<br>Suiv. →</span></button>
        ${state.weekOffset!==0 ? '<button data-action="week-today">Aujourd\'hui</button>' : ''}
      </div>
      ` : `<p class="muted" style="color:var(--chalk-dim);">Cours d’aujourd’hui seulement.</p>`}
      ${anyClass ? (splitAmPm ? cols : `<div class="board">${cols}</div>`) : `<div class="board"><div class="empty-note">${isSuperMgr ? 'Aucun cours programmé cette semaine.' : 'Aucun cours aujourd’hui.'}</div></div>`}
    `;
  }

  function renderAdmin(){
    const today = todayIso();
    const upcomingBookings = state.data.bookings
      .filter(b=>b.status!=='annulee' && isoDate(new Date(b.createdAt))===today)
      .sort((a,b)=> b.createdAt-a.createdAt);

    const toConfirmMemberships = state.data.memberships.filter(m=>m.status==='paiement_declare');

    // Revenu du mois en cours (⚠️ CHANGÉ S28, demande explicite d'Amélie) : TOUTES les ventes
    // réelles du mois — carte Helcim ET comptant/confirmées manuellement — pas seulement les
    // paiements automatiques par carte comme avant. Seuls les abonnements offerts gratuitement
    // (grantedFree) et ceux encore en attente de paiement/annulés sont exclus. Le critère de
    // date est la date d'achat (createdAt), pas paidViaHelcimAt (qui n'existe pas pour un
    // paiement comptant).
    const nowForRevenue = new Date();
    const monthStart = new Date(nowForRevenue.getFullYear(), nowForRevenue.getMonth(), 1);
    const monthLabel = nowForRevenue.toLocaleDateString('fr-CA', {month:'long', year:'numeric'});
    const monthSales = state.data.memberships.filter(m=>
      !m.grantedFree && m.status!=='attente_paiement' && m.status!=='annulee' && new Date(m.createdAt) >= monthStart
    );
    const monthRevenue = monthSales.reduce((sum,m)=>{
      const plan = state.data.membershipPlans.find(p=>p.id===m.planId);
      const amountStr = m.planPrice || (plan?plan.price:'') || '';
      return sum + parsePriceAmount(amountStr);
    }, 0);

    const ADMIN_GROUPS = [
      {key:'bjj_adulte', label:'BJJ Adulte'},
      {key:'enfants', label:'BJJ Enfants'},
      {key:'intro_bjj', label:'Intro au BJJ'},
      {key:'parents_enfants', label:'Parents Enfants'},
      {key:'yoga', label:'Yoga'},
      {key:'muay_thai', label:'Muay Thai'},
      ...(state.data.customCategories||[]),
      {key:'ALL_UNLIMITED', label:'All Unlimited'},
    ];
    if(!state.expandedClassGroups) state.expandedClassGroups = {};
    if(!state.expandedPlanGroups) state.expandedPlanGroups = {};

    const classesByCategory = state.data.classes.slice().sort((a,b)=>a.dayOfWeek-b.dayOfWeek || a.time.localeCompare(b.time));
    let classRows = ADMIN_GROUPS.filter(g=>g.key!=='ALL_UNLIMITED').map(g=>{
      const items = classesByCategory.filter(c=>c.category===g.key);
      if(!items.length) return '';
      const isOpen = !!state.expandedClassGroups[g.key];
      const seenWindows = new Set();
      let logicalCount = 0;
      items.forEach(c=>{
        if(c.startDate && c.endDate){
          const key = c.startDate+'|'+c.endDate;
          if(!seenWindows.has(key)){ seenWindows.add(key); logicalCount++; }
        } else {
          logicalCount++;
        }
      });
      const programGroups = new Map();
      const standaloneItems = [];
      items.forEach(c=>{
        if(c.startDate && c.endDate){
          const key = c.startDate+'|'+c.endDate;
          if(!programGroups.has(key)) programGroups.set(key, []);
          programGroups.get(key).push(c);
        } else {
          standaloneItems.push(c);
        }
      });
      const programRows = Array.from(programGroups.values()).map(sibsRaw=>{
        const sibs = sibsRaw.slice().sort((a,b)=>a.dayOfWeek-b.dayOfWeek);
        const first = sibs[0];
        const dayLabel = sibs.map(s=>DAYS[s.dayOfWeek]).join(' et ');
        const timeLabel = Array.from(new Set(sibs.map(s=>s.time))).join(', ');
        const editBtns = sibs.map(s=>`<button class="small-btn" data-action="edit-class" data-id="${s.id}">Modifier (${DAYS[s.dayOfWeek].slice(0,3)})</button>`).join('');
        const delBtns = sibs.map(s=>`<button class="small-btn" data-action="delete-class" data-id="${s.id}">Supprimer (${DAYS[s.dayOfWeek].slice(0,3)})</button>`).join('');
        return `
        <li>
          <span><strong>${escapeHtml(first.name)}</strong>${first.free ? ' <span style="color:var(--sage);">(gratuit)</span>' : ''} — ${dayLabel} ${timeLabel} · ${first.capacity} places · ${first.price}<br><span style="color:var(--amber);font-size:11px;">${ProgramOrEventWord(first)} : ${first.startDate||'\u2014'} \u2192 ${first.endDate||'\u2014'}</span></span>
          <span>${editBtns}${delBtns}</span>
        </li>
      `;
      }).join('');
      const standaloneRows = standaloneItems.map(c=>`
        <li>
          <span><strong>${escapeHtml(c.name)}</strong>${c.free ? ' <span style="color:var(--sage);">(gratuit)</span>' : ''} — ${DAYS[c.dayOfWeek]} ${c.time} · ${c.capacity} places · ${c.price}</span>
          <span>
            <button class="small-btn" data-action="edit-class" data-id="${c.id}">Modifier</button>
            <button class="small-btn" data-action="delete-class" data-id="${c.id}">Supprimer</button>
          </span>
        </li>
      `).join('');
      const rows = programRows + standaloneRows;
      return `
        <div style="margin-top:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden;">
          <button type="button" data-action="toggle-admin-class-group" data-group="${g.key}"
            style="width:100%;display:flex;justify-content:space-between;align-items:center;border:none;border-radius:0;background:var(--bg-tile);color:var(--chalk);padding:10px 12px;cursor:pointer;font-family:var(--font-d);font-size:13px;text-transform:uppercase;letter-spacing:0.02em;">
            <span>${g.label} (${logicalCount})</span><span>${isOpen ? '▲' : '▼'}</span>
          </button>
          ${isOpen ? `<ul class="link-list" style="padding:6px 12px;margin:0;">${rows}</ul>` : ''}
        </div>
      `;
    }).join('');

    const planGroupOf = p => {
      const cats = p.categories || [];
      if(cats.length > 1) return 'ALL_UNLIMITED';
      if(cats.length === 1) return cats[0];
      return null;
    };
    let planRows = ADMIN_GROUPS.map(g=>{
      const items = state.data.membershipPlans.filter(p=>planGroupOf(p)===g.key);
      if(!items.length) return '';
      const isOpen = !!state.expandedPlanGroups[g.key];
      const rows = items.map(p=>`
        <li>
          <span><strong>${escapeHtml(p.name)}</strong> — ${p.type==='illimite' ? p.durationDays+' jours illimité' : p.creditsCount+' cours'} · ${escapeHtml(p.price)}${p.memberPrice?` <span style="color:var(--chalk-dim);">(${escapeHtml(p.memberPrice)} membres${p.familyMemberCheck?', familial':''})</span>`:''}</span>
          <span>
            <button class="small-btn" data-action="edit-plan" data-id="${p.id}">Modifier</button>
            <button class="small-btn" data-action="delete-plan" data-id="${p.id}">Supprimer</button>
          </span>
        </li>
      `).join('');
      return `
        <div style="margin-top:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden;">
          <button type="button" data-action="toggle-admin-plan-group" data-group="${g.key}"
            style="width:100%;display:flex;justify-content:space-between;align-items:center;border:none;border-radius:0;background:var(--bg-tile);color:var(--chalk);padding:10px 12px;cursor:pointer;font-family:var(--font-d);font-size:13px;text-transform:uppercase;letter-spacing:0.02em;">
            <span>${g.label} (${items.length})</span><span>${isOpen ? '▲' : '▼'}</span>
          </button>
          ${isOpen ? `<ul class="link-list" style="padding:6px 12px;margin:0;">${rows}</ul>` : ''}
        </div>
      `;
    }).join('');

    let confirmRows = toConfirmMemberships.map(m=>`
      <tr>
        <td>${studentLinkHtml(m.studentName, m.studentEmail, m.profileId)}<br><span style="color:var(--chalk-dim);font-size:11px;">${escapeHtml(m.studentEmail)}</span></td>
        <td>${escapeHtml(m.planName)}</td>
        <td>
          <button class="small-btn" style="background:var(--sage);border-color:var(--sage);color:var(--ink);" data-action="open-confirm-membership-amount" data-id="${m.id}">Confirmer</button>
          <button class="small-btn" data-action="refuse-membership" data-id="${m.id}">Refuser</button>
        </td>
      </tr>
    `).join('');

    let allRows = upcomingBookings.map(b=>{
      const c = state.data.classes.find(cl=>cl.id===b.classId);
      return `
        <tr>
          <td>${studentLinkHtml(b.studentName, b.studentEmail, b.profileId)}</td>
          <td>${c?escapeHtml(c.name):'—'}</td>
          <td>${b.dateIso}</td>
          <td>${statusBadge(b.status)}</td>
          <td><button class="small-btn" data-action="cancel-booking" data-id="${b.id}">Annuler</button></td>
        </tr>
      `;
    }).join('');

    const unpaidAttendance = state.data.bookings.filter(b=>b.noMembership && b.status!=='annulee');

    const notesSortBy = state.notesSortBy || 'date';
    let allNotes = [];
    state.data.bookings.forEach(b=>{
      if(b.attendanceNote){
        const c = state.data.classes.find(cl=>cl.id===b.classId);
        allNotes.push({kind:'booking', id:b.id, email:b.studentEmail||'', profileId:b.profileId||null, type:'Étudiant', subject:b.studentName, className:c?c.name:'—', dateIso:b.dateIso, note:b.attendanceNote, author:b.attendanceNoteAuthor||'', at:b.attendanceNoteAt||0});
      }
    });
    state.data.classNotes.forEach(n=>{
      if(n.note){
        const c = state.data.classes.find(cl=>cl.id===n.classId);
        allNotes.push({kind:'classNote', id:n.id, email:'', type:'Cours', subject:c?c.name:'—', className:c?c.name:'—', dateIso:n.dateIso, note:n.note, author:n.authorName||'', at:n.updatedAt||n.createdAt||0});
      }
    });
    if(notesSortBy==='student') allNotes.sort((a,b)=>a.subject.localeCompare(b.subject));
    else if(notesSortBy==='class') allNotes.sort((a,b)=>a.className.localeCompare(b.className));
    else allNotes.sort((a,b)=>b.at-a.at);

    // Liste cachée par défaut (protection de la vie privée des étudiants) : avant toute

      const draw = ()=>{
        ctx.clearRect(0,0,size,size);
        const w = cropState.img.width * cropState.scale;
        const h = cropState.img.height * cropState.scale;
        const x = size/2 - w/2 + cropState.offsetX;
        const y = size/2 - h/2 + cropState.offsetY;
        ctx.drawImage(cropState.img, x, y, w, h);
      };
      const clamp = ()=>{
        const w = cropState.img.width*cropState.scale;
        const h = cropState.img.height*cropState.scale;
        const maxOffsetX = Math.max(0,(w-size)/2);
        const maxOffsetY = Math.max(0,(h-size)/2);
        cropState.offsetX = Math.max(-maxOffsetX, Math.min(maxOffsetX, cropState.offsetX));
        cropState.offsetY = Math.max(-maxOffsetY, Math.min(maxOffsetY, cropState.offsetY));
      };
      draw();
      canvas.addEventListener('pointerdown', (ev)=>{
        cropState.dragging = true;
        cropState.lastX = ev.clientX; cropState.lastY = ev.clientY;
        canvas.style.cursor = 'grabbing';
        try{ canvas.setPointerCapture(ev.pointerId); }catch(err){}

      canvas.addEventListener('pointermove', (ev)=>{
        if(!cropState.dragging) return;
        cropState.offsetX += ev.clientX - cropState.lastX;
        cropState.offsetY += ev.clientY - cropState.lastY;
        cropState.lastX = ev.clientX; cropState.lastY = ev.clientY;
        clamp(); draw();
      });
      const endDrag = ()=>{ cropState.dragging = false; canvas.style.cursor = 'grab'; };
      canvas.addEventListener('pointerup', endDrag);
      canvas.addEventListener('pointerleave', endDrag);
      if(zoomInput){
        zoomInput.addEventListener('input', ()=>{
          const pct = parseInt(zoomInput.value,10)/100;

      if(el) el.classList.add('field-invalid');

  function formatDisplayName(fullName){
    const parts = String(fullName||'').trim().split(/\s+/).filter(Boolean);
    if(parts.length === 0) return '';
    if(parts.length === 1) return parts[0];
    const first = parts[0];
    const lastInitial = parts[parts.length-1].charAt(0).toUpperCase();
    return `${first} ${lastInitial}.`;
  }

  function escapeHtml(str){
    return String(str||'').replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  // afin de distinguer les profils enfants des comptes parents dans les tableaux.

  // ---------- event handling ----------
  function attachHandlers(scope){
    const root = scope || document.getElementById('app');
    root.querySelectorAll('[data-action]').forEach(node=>{
      // Filet de sécurité : si onAction (ou un render() qu'il déclenche) lève une erreur
      // inattendue, on l'affiche/loggue au lieu de laisser l'app silencieusement figée
      // (plus rien ne réagit aux clics) sans que personne ne sache pourquoi.
      node.addEventListener('click', (e)=>{
        Promise.resolve(onAction(e)).catch(err=>{
          console.error('Erreur dans onAction:', err);
          showToast('Une erreur est survenue. Rafraîchissez la page si l’app ne répond plus.');
        });
      });
    });
  }

  function attachNotebookDrag(){
    const canvas = document.getElementById('nb-canvas');
    if(!canvas) return;
    if(!state.notebookEditMode) return;
    let dragEl = null, dragId = null, startX = 0, startY = 0, startLeft = 0, startTop = 0, moved = false;

    function onMove(ev){
      if(!dragEl) return;
      const point = ev.touches ? ev.touches[0] : ev;
      const dxPx = point.clientX - startX;
      const dyPx = point.clientY - startY;
      if(Math.abs(dxPx) > 3 || Math.abs(dyPx) > 3) moved = true;
      const rect = canvas.getBoundingClientRect();
      const dxPct = (dxPx / rect.width) * 100;
      const dyPct = (dyPx / rect.height) * 100;
      let newLeft = startLeft + dxPct;
      let newTop = startTop + dyPct;
      newLeft = Math.max(0, Math.min(85, newLeft));
      newTop = Math.max(0, Math.min(88, newTop));
      dragEl.style.left = newLeft + '%';
      dragEl.style.top = newTop + '%';
    }
    async function onUp(){
      if(!dragEl) return;
      const el = dragEl, wasMoved = moved;
      dragEl.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      dragEl = null;
      if(wasMoved){
        const entry = state.data.notebookEntries.find(n=>n.id===dragId);
        if(entry){
          entry.x = parseFloat(el.style.left);
          entry.y = parseFloat(el.style.top);
          await persist();
        }
      } else if(el.classList.contains('textnote-free') || el.classList.contains('sticker-free') || el.classList.contains('postit-free')){
        state.notebookSelectedEntry = state.notebookSelectedEntry === dragId ? null : dragId;
        render();
      }
    }
    canvas.addEventListener('mousedown', (ev)=>{
      if(state.notebookQuickTextDraw) return;
      if(state.notebookQuickEditId) return; // laisse le blur naturel sauvegarder le texte rapide sans re-rendu concurrent
      if(state.notebookTextSelectId) return; // laisse le blur naturel sauvegarder l'édition en cours sans re-rendu concurrent
      if(ev.target === canvas && (state.notebookSelectedEntry || state.notebookTextSelectId)){
        state.notebookSelectedEntry = null; state.notebookTextSelectId = null; render();
      }
    });
    canvas.querySelectorAll('.postit-free, .textnote-free, .sticker-free').forEach(node=>{
      const startDrag = (ev)=>{
        if(ev.target.closest('button')) return;
        // L'édition du texte (double-clic) est gérée indépendamment du mode édition par
        // attachNotebookTextEdit() — si ce node est déjà en édition de texte, on laisse le
        // texte se sélectionner/s'éditer nativement plutôt que de démarrer un glisser.
        if(node.dataset.id === state.notebookTextSelectId) return;
        if(state.notebookTextSelectId && state.notebookTextSelectId !== node.dataset.id) state.notebookTextSelectId = null;
        const point = ev.touches ? ev.touches[0] : ev;
        dragEl = node;
        dragId = node.dataset.id;
        moved = false;
        startX = point.clientX;
        startY = point.clientY;
        startLeft = parseFloat(node.style.left) || 0;
        startTop = parseFloat(node.style.top) || 0;
        node.classList.add('dragging');
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        document.addEventListener('touchmove', onMove, {passive:false});
        document.addEventListener('touchend', onUp);
        ev.preventDefault();
      };
      node.addEventListener('mousedown', startDrag);
      node.addEventListener('touchstart', startDrag, {passive:false});
    });
  }

  // ---------- Édition du texte par double-clic : fonctionne QUE le mode édition soit
  // ouvert ou non (contrairement au glisser/redimensionner/pivoter, réservés au mode édition). ----------
  function attachNotebookTextEdit(){
    const canvas = document.getElementById('nb-canvas');
    if(!canvas) return;
    if(state.notebookQuickTextDraw || state.notebookQuickEditId) return;
    canvas.querySelectorAll('.postit-text[data-id], .textnote-content[data-id]').forEach(el=>{
      if(el.isContentEditable) return; // déjà en édition
      const id = el.dataset.id;
      const onDown = (ev)=>{
        if(state.notebookTextSelectId === id) return; // déjà en mode édition : laisse le texte se sélectionner nativement
        const now = Date.now();
        const isDoubleClick = lastContentClick.id === id && (now - lastContentClick.time) < 400;
        lastContentClick = {id, time: now};
        if(isDoubleClick){
          ev.preventDefault();
          ev.stopPropagation();
          state.notebookSelectedEntry = id;
          state.notebookTextSelectId = id;
          render();
        }
      };
      el.addEventListener('mousedown', onDown);
      el.addEventListener('touchstart', onDown, {passive:false});
    });
  }

  function attachFreeHandles(){
    const canvas = document.getElementById('nb-canvas');
    if(!canvas) return;

    canvas.querySelectorAll('.rotate-handle').forEach(handle=>{
      const wrap = handle.closest('.textnote-free, .sticker-free, .postit-free');
      if(!wrap) return;
      const id = handle.dataset.id;
      const start = (ev)=>{
        ev.preventDefault(); ev.stopPropagation();
        const point = ev.touches ? ev.touches[0] : ev;
        const rect = wrap.getBoundingClientRect();
        const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
        const entry = state.data.notebookEntries.find(n=>n.id===id);
        const startRotation = (entry && entry.rotation) || 0;
        const startAngle = Math.atan2(point.clientY-cy, point.clientX-cx) * 180/Math.PI;
        let pendingRotation = startRotation;
        function onMove(mv){
          const p = mv.touches ? mv.touches[0] : mv;
          const angle = Math.atan2(p.clientY-cy, p.clientX-cx) * 180/Math.PI;
          pendingRotation = Math.round(startRotation + (angle-startAngle));
          wrap.style.transform = `rotate(${pendingRotation}deg)`;
        }
        async function onEnd(){
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onEnd);
          document.removeEventListener('touchmove', onMove);
          document.removeEventListener('touchend', onEnd);
          if(entry){
            entry.rotation = pendingRotation;
            await persist();
          }
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, {passive:false});
        document.addEventListener('touchend', onEnd);
      };
      handle.addEventListener('mousedown', start);
      handle.addEventListener('touchstart', start, {passive:false});
    });

    canvas.querySelectorAll('.resize-handle').forEach(handle=>{
      const wrap = handle.closest('.textnote-free, .sticker-free, .postit-free');
      if(!wrap) return;
      const id = handle.dataset.id;
      const isSticker = wrap.classList.contains('sticker-free');
      const isPostit = wrap.classList.contains('postit-free');
      const start = (ev)=>{
        ev.preventDefault(); ev.stopPropagation();
        const point = ev.touches ? ev.touches[0] : ev;
        const rect = wrap.getBoundingClientRect();
        const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
        const startDist = Math.max(20, Math.hypot(point.clientX-cx, point.clientY-cy));
        const entry = state.data.notebookEntries.find(n=>n.id===id);
        const startSize = isSticker ? (entry.size||60) : isPostit ? (entry.size||150) : (entry.fontSize||16);
        const minSize = isSticker ? 24 : isPostit ? 100 : 10;
        const maxSize = isSticker ? 240 : isPostit ? 400 : 60;
        let pendingSize = startSize;
        function onMove(mv){
          const p = mv.touches ? mv.touches[0] : mv;
          const dist = Math.max(20, Math.hypot(p.clientX-cx, p.clientY-cy));
          const scale = dist/startDist;
          pendingSize = Math.round(Math.max(minSize, Math.min(maxSize, startSize*scale)));
          if(isSticker){
            wrap.style.width = pendingSize+'px';
            const img = wrap.querySelector('img'); if(img) img.style.width = pendingSize+'px';
          } else if(isPostit){
            const pScale = pendingSize/150;
            wrap.style.width = pendingSize+'px';
            wrap.style.minHeight = Math.round(130*pScale)+'px';
            const cat = wrap.querySelector('.postit-cat'); if(cat) cat.style.fontSize = (10*pScale).toFixed(1)+'px';
            const txt = wrap.querySelector('.postit-text'); if(txt) txt.style.fontSize = (15*pScale).toFixed(1)+'px';
          } else {
            wrap.style.fontSize = pendingSize+'px';
          }
        }
        async function onEnd(){
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onEnd);
          document.removeEventListener('touchmove', onMove);
          document.removeEventListener('touchend', onEnd);
          if(entry){
            if(isSticker || isPostit) entry.size = pendingSize; else entry.fontSize = pendingSize;
            await persist();
          }
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, {passive:false});
        document.addEventListener('touchend', onEnd);
      };
      handle.addEventListener('mousedown', start);
      handle.addEventListener('touchstart', start, {passive:false});
    });
  }

  function attachQuickTextDraw(){
    const canvas = document.getElementById('nb-canvas');
    if(!canvas) return;
    if(!state.notebookQuickTextDraw) return;
    canvas.classList.add('quick-text-drawing');
    let startX=0, startY=0, previewEl=null;
    function onMove(ev){
      if(!previewEl) return;
      const point = ev.touches ? ev.touches[0] : ev;
      const rect = canvas.getBoundingClientRect();
      const curX = Math.max(0, Math.min(rect.width, point.clientX-rect.left));
      const curY = Math.max(0, Math.min(rect.height, point.clientY-rect.top));
      const left = Math.min(startX, curX), top = Math.min(startY, curY);
      const w = Math.abs(curX-startX), h = Math.abs(curY-startY);
      previewEl.style.left = left+'px'; previewEl.style.top = top+'px';
      previewEl.style.width = w+'px'; previewEl.style.height = h+'px';
    }
    async function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      if(!previewEl) return;
      const rect = canvas.getBoundingClientRect();
      const boxWidthPx = Math.max(60, parseFloat(previewEl.style.width)||160);
      const boxHeightPx = Math.max(28, parseFloat(previewEl.style.height)||28);
      const leftPx = parseFloat(previewEl.style.left)||0;
      const topPx = parseFloat(previewEl.style.top)||0;
      previewEl.remove(); previewEl = null;
      const acct = findStudentAccount(state.studentSession.email);
      const ownerKey = notebookOwnerKey(acct.email, state.notebookProfileId);
      const nb = getOrCreateActiveNotebook(ownerKey);
      const entry = {
        id: uid(), ownerKey, notebookId: nb.id, kind:'text', page: state.notebookActivePage||1,
        x: Math.max(0, Math.min(85, (leftPx/rect.width)*100)),
        y: Math.max(0, Math.min(88, (topPx/rect.height)*100)),
        boxWidth: Math.round(boxWidthPx),
        boxHeight: Math.round(boxHeightPx),
        text:'', fontFamily:'sans', fontSize:10, color:TEXTNOTE_INK_COLORS[0], rotation:0, hAlign:'left',
        createdAt: Date.now(),
      };
      state.data.notebookEntries.push(entry);
      state.notebookQuickTextDraw = false;
      state.notebookQuickEditId = entry.id;
      render();
    }
    const startDraw = (ev)=>{
      if(ev.target.closest('button') || ev.target.closest('.btn-row')) return;
      const point = ev.touches ? ev.touches[0] : ev;
      const rect = canvas.getBoundingClientRect();
      startX = Math.max(0, Math.min(rect.width, point.clientX-rect.left));
      startY = Math.max(0, Math.min(rect.height, point.clientY-rect.top));
      previewEl = document.createElement('div');
      previewEl.className = 'quick-text-preview';
      previewEl.style.left = startX+'px'; previewEl.style.top = startY+'px';
      previewEl.style.width = '0px'; previewEl.style.height = '0px';
      canvas.appendChild(previewEl);
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      document.addEventListener('touchmove', onMove, {passive:false});
      document.addEventListener('touchend', onUp);
      ev.preventDefault();
    };
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('touchstart', startDraw, {passive:false});
  }

  function attachQuickTextEditor(){
    if(!state.notebookQuickEditId) return;
    const ta = document.getElementById('quick-text-input');
    if(!ta) return;
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    let done = false;
    async function finish(){
      if(done) return; done = true;
      const val = ta.value.trim();
      const entry = state.data.notebookEntries.find(n=>n.id===state.notebookQuickEditId);
      if(entry){
        if(!val){
          state.data.notebookEntries = state.data.notebookEntries.filter(n=>n.id!==entry.id);
        } else {
          entry.text = val;
        }
        await persist();
      }
      state.notebookQuickEditId = null;
      render();
    }
    ta.addEventListener('blur', finish);
    ta.addEventListener('keydown', (ev)=>{
      if(ev.key==='Escape'){ ev.preventDefault(); ta.blur(); }
    });
  }

  function attachTextSelectEditor(){
    if(!state.notebookTextSelectId) return;
    const canvas = document.getElementById('nb-canvas');
    if(!canvas) return;
    const el = canvas.querySelector(`[contenteditable="true"][data-id="${state.notebookTextSelectId}"]`);
    if(!el) return;
    setTimeout(()=>{ el.focus(); }, 0); // après le focus par défaut du mousedown, pour ne pas se faire écraser
    let done = false;
    async function finish(){
      if(done) return; done = true;
      const val = (el.innerText || el.textContent || '').replace(/\n+$/,'');
      const entry = state.data.notebookEntries.find(n=>n.id===state.notebookTextSelectId);
      if(entry){ entry.text = val; await persist(); }
      state.notebookTextSelectId = null;
      render();
    }
    el.addEventListener('blur', finish);
    el.addEventListener('keydown', (ev)=>{
      if(ev.key==='Enter'){ ev.preventDefault(); el.blur(); }
      if(ev.key==='Escape'){ ev.preventDefault(); el.blur(); }
    });
  }

  function attachCoverLogoDrag(){

    if(!cover || !wrap) return;
    let startX=0, startY=0, startLeft=0, startTop=0, moved=false, dragging=false;
    function onMove(ev){

      const point = ev.touches ? ev.touches[0] : ev;
      const dxPx = point.clientX - startX;
      const dyPx = point.clientY - startY;
      if(Math.abs(dxPx) > 3 || Math.abs(dyPx) > 3) moved = true;
      const rect = cover.getBoundingClientRect();
      const dxPct = (dxPx / rect.width) * 100;
      const dyPct = (dyPx / rect.height) * 100;
      let newLeft = Math.max(10, Math.min(90, startLeft + dxPct));
      let newTop = Math.max(0, Math.min(88, startTop + dyPct));
      wrap.style.left = newLeft + '%';
      wrap.style.top = newTop + '%';
    }
    async function onUp(){
      if(!dragging) return;

      document.removeEventListener('mousemove', onMove);

        nb.kossLogoX = parseFloat(wrap.style.left);
        nb.kossLogoY = parseFloat(wrap.style.top);

    const startDrag = (ev)=>{

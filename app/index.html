  // localStorage peu importe le backend. Seule STORAGE_KEY (studio_data_v1, les vraies
  // données du studio) passe par Supabase pour être visible par tout le monde.
  const LOCAL_ONLY_KEYS = new Set(['student_session', 'my_profile']);

  const localBackend = {
    async get(key){
      const v = localStorage.getItem(key);
      if(v === null) throw new Error('not found');
      return {value: v};
    },
    async set(key, value){ localStorage.setItem(key, value); },
    async delete(key){ localStorage.removeItem(key); }
  };

  const supabaseBackend = {
    async get(key){
      const { data, error } = await sb.from('app_state').select('data').eq('id', 1).maybeSingle();
      if(error) throw error;
      if(!data) throw new Error('not found');
      return { value: JSON.stringify(data.data) };
    },
    async set(key, value){
      const { error } = await sb.from('app_state').upsert({ id: 1, data: JSON.parse(value) });
      if(error) throw error;
    },
    async delete(key){
      const { error } = await sb.from('app_state').delete().eq('id', 1);
      if(error) throw error;
    }
  };

  // on route studio_data_v1 vers Supabase (partagé) et le reste vers localStorage (local
  // à cet appareil).
  const storageBackend = (typeof window.storage !== 'undefined' && window.storage) ? window.storage : {
    async get(key, ...args){ return (LOCAL_ONLY_KEYS.has(key) ? localBackend : supabaseBackend).get(key, ...args); },
    async set(key, value, ...args){ return (LOCAL_ONLY_KEYS.has(key) ? localBackend : supabaseBackend).set(key, value, ...args); },
    async delete(key, ...args){ return (LOCAL_ONLY_KEYS.has(key) ? localBackend : supabaseBackend).delete(key, ...args); }

  function capacityColor(pct){
    const stops = ['#A9D9A0','#C7D98F','#E8D66B','#EFBE5D','#EDA050','#E37D4E','#D9534F'];
    const clamped = Math.max(0, Math.min(1, pct));
    const idx = clamped>=1 ? stops.length-1 : Math.floor(clamped*stops.length);
    return stops[idx];
  }

  function computeIntroPrice(program){
    const today = todayIso();
    const cutoff = new Date(program.start+'T00:00:00');
    cutoff.setDate(cutoff.getDate()-30);
    const isEarly = program.earlyBird && (today <= isoDate(cutoff));
    const price = isEarly ? Math.round(program.basePrice*0.85*100)/100 : program.basePrice;
    return {price, isEarly};
  }
  function upcomingIntroPrograms(){
    const today = todayIso();
    return INTRO_PROGRAMS.filter(p=>p.end >= today);
  }

  function addMinutesToTime(time, minutes){
    const [h,m] = time.split(':').map(Number);
    let total = h*60+m+minutes;
    total = ((total % 1440)+1440)%1440;
    const hh = Math.floor(total/60).toString().padStart(2,'0');
    const mm = (total%60).toString().padStart(2,'0');
    return `${hh}:${mm}`;
  }
  function formatFullClassDateTime(dateIso, time, durationMinutes){
    const d = new Date(dateIso+'T00:00:00');
    const dayName = DAYS[(d.getDay()+6)%7];
    const dayNum = d.getDate().toString().padStart(2,'0');
    const monthName = MONTHS_FULL[d.getMonth()];
    const year = d.getFullYear();
    const endTime = addMinutesToTime(time, durationMinutes||60);
    return `${dayName} ${dayNum} ${monthName} ${year} ${time} \u00e0 ${endTime}`;
  }

  async function loadData(){
    try{
      const res = await storageBackend.get(STORAGE_KEY, true);
      state.data = JSON.parse(res.value);
    }catch(e){
      state.data = defaultData();
      await persist();
    }
    if(!state.data.membershipPlans) state.data.membershipPlans = [];
    if(!state.data.memberships) state.data.memberships = [];
    if(!state.data.studentAccounts) state.data.studentAccounts = [];
    migrateData();
    if(!state.data.seededKoss && state.data.classes.length===0){
      seedKossSchedule();
      state.data.seededKoss = true;
      await persist();
    }
    if(!state.data.seededPricing){
      seedPricingPlans();
      state.data.seededPricing = true;
      await persist();
    }
    try{
      const sres = await storageBackend.get('student_session', false);
      const sess = JSON.parse(sres.value);
      if(sess && sess.email && findStudentAccount(sess.email)){
        state.studentSession = {email: sess.email};
      }
    }catch(e){}
    render();
  }

  function migrateData(){
    let changed = false;
    const guessCategory = (name)=>{
      const n = name.toLowerCase();

      if(n.includes('muay')) return 'muay_thai';

      if(typeof c.free !== 'boolean'){ c.free = false; changed = true; }

    state.data.memberships.forEach(m=>{
      if(!Array.isArray(m.categories)){

        changed = true;

    });
    if(!state.data.migratedCategoriesV2){
      state.data.classes.forEach(c=>{
        if(c.name && c.name.trim().toLowerCase()==='intro au bjj'){
          c.category = 'intro_bjj';
        }
      });
      state.data.membershipPlans.forEach(p=>{
        if(p.name && p.name.indexOf('Intro to BJJ')===0){
          p.categories = ['intro_bjj'];
          p.isIntroProgram = true;

  function showToast(msg){

  // ---------- paiement Helcim intégré (HelcimPay.js) ----------
  // Ouvre le module de paiement Helcim DIRECTEMENT dans l'app (iframe superposée), sans
  // redirection. onDone(status, transaction) est appelé avec status 'SUCCESS' ou 'ABORTED' ;
  // sur SUCCESS, transaction est l'objet transaction rapporté par Helcim (contient
  // transactionId) — il sert seulement à savoir QUOI vérifier ; la confirmation réelle se
  // fait côté serveur (koss-confirm-payment) qui revérifie lui-même auprès de Helcim.
  function startHelcimCheckout(checkoutToken, onDone){
    if(typeof appendHelcimPayIframe !== 'function'){
      showToast('Le module de paiement n’a pas pu se charger. Réessayez ou contactez le studio.');
      onDone('ABORTED');
      return;
    }
    appendHelcimPayIframe(checkoutToken, true);
    const key = 'helcim-pay-js-' + checkoutToken;
    let done = false;
    // Helcim fournit removeHelcimPayIframe() spécifiquement pour fermer/retirer le module —
    // s'y fier plutôt que d'espérer un nettoyage automatique (c'est l'absence de cet appel qui
    // causait l'app "gelée" après un paiement : le module restait superposé, invisible mais
    // toujours là, bloquant les clics, jusqu'à un rafraîchissement de la page).
    const cleanup = ()=>{
      window.removeEventListener('message', handler);
      try{
        if(typeof removeHelcimPayIframe === 'function') removeHelcimPayIframe();
        else { const el = document.getElementById('helcimPayIframe'); if(el) el.remove(); }
      }catch(err){ console.error('Échec de fermeture du module de paiement Helcim:', err); }
    };
    const handler = (event)=>{
      if(!event.data || event.data.eventName !== key || done) return;
      if(event.data.eventStatus === 'HIDE'){
        // Aucun SUCCESS/ABORTED reçu avant que l'élève ferme la fenêtre : on traite ça comme
        // une annulation.
        done = true;
        cleanup();
        onDone('ABORTED', null);
        return;
      }
      done = true;
      let transaction = null;
      if(event.data.eventStatus === 'SUCCESS'){
        // eventMessage est une chaîne JSON de forme {data:{data:{...transaction...}, status, headers}}
        // (confirmé en conditions réelles le 10 sept 2026) — la transaction elle-même est nichée
        // deux niveaux plus bas que ce qu'on pourrait croire. On reste tolérant à d'autres formes
        // possibles (transaction directement à la racine, etc.) au cas où Helcim la ferait varier.
        let parsed = null;
        if(typeof event.data.eventMessage === 'string'){
          try{ parsed = JSON.parse(event.data.eventMessage); }catch(err){ console.error('Réponse Helcim illisible:', err); }
        } else if(event.data.eventMessage && typeof event.data.eventMessage === 'object'){
          parsed = event.data.eventMessage;
        }
        if(parsed){
          if(parsed.transactionId) transaction = parsed;
          else if(parsed.data && parsed.data.transactionId) transaction = parsed.data;
          else if(parsed.data && parsed.data.data && parsed.data.data.transactionId) transaction = parsed.data.data;
        }
        if(!transaction || !transaction.transactionId){
          console.error('Impossible d’extraire transactionId de la réponse Helcim:', event.data);
        }
      }
      cleanup();
      onDone(event.data.eventStatus, transaction);
    };
    window.addEventListener('message', handler);
  }

  // ---------- date helpers ----------
  function startOfWeek(offset){
    const now = new Date();
    const day = (now.getDay() + 6) % 7; // 0 = Monday
    const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day + offset*7);
    return monday;
  }
  function getWeekDates(offset){
    const monday = startOfWeek(offset);
    return Array.from({length:7}, (_,i)=>{
      const d = new Date(monday);
      d.setDate(monday.getDate()+i);
      return d;
    });
  }
  function isoDate(d){ return d.toISOString().slice(0,10); }
  function formatDayNum(d){ return d.getDate(); }

  function getNextIntroProgram(){
    const introClasses = state.data.classes.filter(c=>c.category==='intro_bjj' && c.startDate && c.endDate);
    if(!introClasses.length) return null;
    const programs = new Map();
    introClasses.forEach(c=>{
      const key = c.startDate+'|'+c.endDate;
      if(!programs.has(key)) programs.set(key, {startDate:c.startDate, endDate:c.endDate});
    });
    const list = Array.from(programs.values()).sort((a,b)=>a.startDate.localeCompare(b.startDate));
    const today = todayIso();
    return list.find(p=>p.startDate >= today) || list[list.length-1] || null;
  }

  function formatShortDate(dateIso){
    const d = new Date(dateIso+'T00:00:00');
    return formatDayNum(d) + ' ' + formatMonthShort(d);
  }

  function weekOffsetForDate(dateIso){
    const target = new Date(dateIso+'T00:00:00');
    const day = (target.getDay()+6)%7;
    const targetMonday = new Date(target);
    targetMonday.setDate(target.getDate()-day);
    const currentMonday = startOfWeek(0);
    const diffDays = Math.round((targetMonday - currentMonday)/(1000*60*60*24));
    return Math.round(diffDays/7);
  }
  function formatMonthShort(d){
    return d.toLocaleDateString('fr-FR', {month:'short'}).replace('.','');
  }
  function weekLabel(offset){
    const dates = getWeekDates(offset);
    const a = dates[0], b = dates[6];
    return `${formatDayNum(a)} ${formatMonthShort(a)} – ${formatDayNum(b)} ${formatMonthShort(b)}`;
  }

  // ---------- booking logic ----------
  const ACTIVE_STATUSES = ['attente_paiement','paiement_declare','confirmee'];

  function bookedCount(classId, dateIso){
    return state.data.bookings.filter(b => b.classId===classId && b.dateIso===dateIso && ACTIVE_STATUSES.includes(b.status)).length;
  }
  function waitlistFor(classId, dateIso){
    return state.data.bookings.filter(b => b.classId===classId && b.dateIso===dateIso && b.status==='liste_attente')
      .sort((a,b)=>a.createdAt-b.createdAt);
  }
  function isProgramClass(c){ return !!(c && c.startDate && c.endDate); }

  function getProgramSiblings(c){
    return state.data.classes.filter(x => x.startDate===c.startDate && x.endDate===c.endDate && x.category===c.category);
  }

  function getProgramOccurrences(c){
    const siblings = getProgramSiblings(c);
    const occ = [];
    siblings.forEach(s=>{
      const jsDay = (s.dayOfWeek+1)%7; // our 0=Monday -> JS 0=Sunday
      let d = new Date(s.startDate+'T00:00:00');
      while(d.getDay() !== jsDay){ d.setDate(d.getDate()+1); }
      while(isoDate(d) <= s.endDate){
        occ.push({classId:s.id, dateIso:isoDate(d), className:s.name, time:s.time});
        d.setDate(d.getDate()+7);
      }
    });
    occ.sort((a,b)=> a.dateIso.localeCompare(b.dateIso) || a.time.localeCompare(b.time));
    return occ;
  }

  function isFirstProgramOccurrence(c, dateIso){
    const occ = getProgramOccurrences(c);
    return occ.length>0 && occ[0].classId===c.id && occ[0].dateIso===dateIso;
  }

  function promoteWaitlistIfRoom(classId, dateIso){
    const cls = state.data.classes.find(c=>c.id===classId);
    if(!cls) return;
    if(bookedCount(classId,dateIso) < cls.capacity){
      const wl = waitlistFor(classId,dateIso);
      if(wl.length){
        const promoted = wl[0];
        promoted.status = 'confirmee';
        promoted.promotedAt = Date.now();
        const membership = activeMembershipForEmail(promoted.studentEmail, cls.category, promoted.profileId);
        if(membership && membership.type==='credits'){
          membership.creditsRemaining = Math.max(0, membership.creditsRemaining - 1);
        }
      }
    }
  }

  async function proceedBooking(classId, dateIso, name, email, isDuplicateConfirmed, profileId, membershipId){
    const c = state.data.classes.find(cl=>cl.id===classId);
    if(!c){ showToast('Ce cours n\u2019existe plus.'); return; }

    if(isProgramClass(c)){
      return await proceedProgramBooking(c, name, email, isDuplicateConfirmed, profileId);
    }

    const alreadyBooked = state.data.bookings.some(b =>
      b.classId===classId && b.dateIso===dateIso &&
      b.studentEmail.toLowerCase()===email.toLowerCase() &&
      (b.profileId||null)===(profileId||null) &&
      ACTIVE_STATUSES.includes(b.status)
    );

    if(alreadyBooked && !isDuplicateConfirmed){
      state.modal = {type:'confirm-duplicate', payload:{classId, dateIso, name, email, profileId}};
      render();
      return;
    }

    let membership = null;
    if(!c.free){
      if(alreadyBooked){
        const candidates = activeMembershipsForEmail(email, c.category, profileId).filter(m=>m.type==='credits');
        if(!candidates.length){
          state.modal = {type:'need-membership', payload:{
            name, email, profileId, classId, dateIso,
            intro:'Un abonnement \u00e0 la carte (cr\u00e9dits) est requis pour r\u00e9server ce cours une 2e fois',
            neededCategory:c.category,
            requireCreditsOnly:true
          }};
          render();
          return;
        }
        if(candidates.length > 1 && !membershipId){
          state.modal = {type:'choose-membership', payload:{
            classId, dateIso, name, email, profileId, isDuplicateConfirmed,
            candidateIds: candidates.map(m=>m.id)
          }};
          render();
          return;
        }
        membership = membershipId ? candidates.find(m=>m.id===membershipId) : candidates[0];
        if(!membership){ showToast('Abonnement introuvable.'); return; }
      } else {
        const candidates = activeMembershipsForEmail(email, c.category, profileId);
        if(!candidates.length){
          state.modal = {type:'need-membership', payload:{
            name, email, profileId, classId, dateIso,
            intro:`Votre abonnement ne couvre pas les cours "${categoryLabel(c.category)}"`,
            neededCategory:c.category
          }};
          render();
          return;
        }
        if(candidates.length > 1 && !membershipId){
          state.modal = {type:'choose-membership', payload:{
            classId, dateIso, name, email, profileId, isDuplicateConfirmed,
            candidateIds: candidates.map(m=>m.id)
          }};
          render();
          return;
        }
        membership = membershipId ? candidates.find(m=>m.id===membershipId) : candidates[0];
        if(!membership){ showToast('Abonnement introuvable.'); return; }
      }
    }

    const full = bookedCount(classId,dateIso) >= c.capacity;
    const booking = {
      id: uid(), classId, dateIso,
      studentName:name, studentEmail:email, profileId: profileId||null,
      status: full ? 'liste_attente' : 'confirmee',
      membershipId: membership ? membership.id : null,
      createdAt: Date.now()
    };
    state.data.bookings.push(booking);
    if(!full && membership && membership.type==='credits'){
      membership.creditsRemaining = Math.max(0, membership.creditsRemaining - 1);
    }
    await persist();
    state.modal = null; closeModalDom();
    render();
    showToast(full ? 'Ajout\u00e9 \u00e0 la liste d\u2019attente.' : (isDuplicateConfirmed ? 'Deuxi\u00e8me r\u00e9servation confirm\u00e9e !' : 'R\u00e9servation confirm\u00e9e !'));
  }

  async function proceedProgramBooking(c, name, email, isDuplicateConfirmed, profileId){
    const occ = getProgramOccurrences(c);
    const firstDateIso = occ[0].dateIso;
    const alreadyInProgram = state.data.bookings.some(b =>
      b.classId===c.id && b.dateIso===firstDateIso &&
      b.studentEmail.toLowerCase()===email.toLowerCase() &&
      (b.profileId||null)===(profileId||null) &&
      ACTIVE_STATUSES.includes(b.status)
    );
    if(alreadyInProgram){
      state.modal = null; closeModalDom();
      render();
      showToast('Vous êtes déjà inscrit à ce programme.');
      return;
    }

    let membership = null;
    if(!c.free){
      membership = state.data.memberships.find(mm =>
        mm.studentEmail.toLowerCase()===email.toLowerCase() &&
        (mm.profileId||null)===(profileId||null) &&
        isMembershipActive(mm) && (mm.categories||[]).includes(c.category) &&
        (!mm.introStart || mm.introStart === c.startDate)
      );
      if(!membership){
        state.modal = {type:'need-membership', payload:{
          name, email, profileId,
          intro:`Votre abonnement ne couvre pas ce programme (${categoryLabel(c.category)} du ${formatShortDate(c.startDate)})`,
          neededCategory:c.category
        }};
        render();
        return;
      }
      if(membership.type==='credits' && membership.creditsRemaining < occ.length){
        state.modal = {type:'need-membership', payload:{
          name, email, profileId,
          intro:`Il vous manque des cours sur votre carte pour ce programme de ${occ.length} séances (${membership.creditsRemaining} restant(s))`,
          neededCategory:c.category
        }};
        render();
        return;
      }
    }

    let confirmedCount = 0, waitlistCount = 0;
    occ.forEach(o=>{
      const full = bookedCount(o.classId, o.dateIso) >= state.data.classes.find(cl=>cl.id===o.classId).capacity;
      state.data.bookings.push({
        id: uid(), classId:o.classId, dateIso:o.dateIso,
        studentName:name, studentEmail:email, profileId: profileId||null,
        status: full ? 'liste_attente' : 'confirmee',
        createdAt: Date.now(),
        programBooking: true
      });
      if(full) waitlistCount++; else confirmedCount++;
      if(!full && membership && membership.type==='credits'){
        membership.creditsRemaining = Math.max(0, membership.creditsRemaining - 1);
      }
    });

    await persist();
    state.modal = null; closeModalDom();
    render();
    showToast(waitlistCount ? `Programme réservé — ${confirmedCount} confirmée(s), ${waitlistCount} en liste d\u2019attente.` : `Programme réservé — ${confirmedCount} séances confirmées !`);
  }

  function statusBadge(status){
    const map = {
      attente_paiement: ['badge-pending','Paiement à faire'],
      paiement_declare: ['badge-declared','Paiement déclaré'],
      confirmee: ['badge-confirmed','Confirmée'],
      liste_attente: ['badge-waitlist','Liste d\u2019attente'],
      annulee: ['badge-cancelled','Annulée'],
    };
    const [cls,label] = map[status] || ['badge-pending', status];
    return `<span class="badge ${cls}">${label}</span>`;
  }

  // ---------- membership logic ----------
  function todayIso(){ return isoDate(new Date()); }

  function isMembershipActive(m){
    if(m.status !== 'active') return false;
    if(m.type === 'illimite') return m.endDate >= todayIso();
    if(m.type === 'credits') return m.creditsRemaining > 0;
    return false;
  }

  function membershipDisplayStatus(m){
    if(m.status === 'active' && !isMembershipActive(m)) return 'expiree';
    return m.status;
  }

  function membershipBadge(m){
    const ds = membershipDisplayStatus(m);
    const map = {
      attente_paiement: ['badge-pending','Paiement à faire'],
      paiement_declare: ['badge-declared','Paiement déclaré'],
      active: ['badge-confirmed','Actif'],
      expiree: ['badge-cancelled','Expiré'],
      annulee: ['badge-cancelled','Annulé'],
    };
    const [cls,label] = map[ds] || ['badge-pending', ds];
    return `<span class="badge ${cls}">${label}</span>`;
  }

  function membershipDetail(m){
    if(m.type === 'illimite') return 'jusqu\u2019au ' + m.endDate;
    if(m.type === 'credits') return m.creditsRemaining + ' cours restant(s)';
    return '';
  }

  function activeMembershipsForEmail(email, category, profileId){
    const e = email.toLowerCase();
    const pid = profileId || null;
    const mine = state.data.memberships.filter(m => m.studentEmail.toLowerCase()===e && (m.profileId||null)===pid);
    return mine.filter(m => isMembershipActive(m) && (!category || (m.categories||[]).includes(category)));
  }
  function activeMembershipForEmail(email, category, profileId){
    return activeMembershipsForEmail(email, category, profileId)[0] || null;
  }

  // Refunds a drop-in credit when a confirmed (non-waitlist, non-free) booking is cancelled.
  function refundCreditIfNeeded(b){
    if(!b || b.status !== 'confirmee') return;
    const c = state.data.classes.find(cl=>cl.id===b.classId);
    if(!c || c.free) return;

  function resizeImageFile(file, maxSize, maxBytes){
    maxBytes = maxBytes || 220000; // ~ dataURL char length ceiling, keeps saved data small enough to persist reliably
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=>reject(new Error('read failed'));
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = ()=>reject(new Error('decode failed'));
        img.onload = ()=>{
          const attempts = [
            {size:maxSize, q:0.82},
            {size:maxSize, q:0.6},
            {size:maxSize, q:0.4},
            {size:Math.round(maxSize*0.65), q:0.5},
            {size:Math.round(maxSize*0.5), q:0.4},
            {size:Math.round(maxSize*0.4), q:0.35},
          ];
          let result = null;
          for(const att of attempts){
            let w = img.width, h = img.height;
            if(w > h){ if(w > att.size){ h = Math.round(h*att.size/w); w = att.size; } }
            else { if(h > att.size){ w = Math.round(w*att.size/h); h = att.size; } }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', att.q);
            result = dataUrl;
            if(dataUrl.length <= maxBytes) break;
          }
          if(result && result.length <= maxBytes*1.4) resolve(result);
          else reject(new Error('image too large after compression'));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function hashPassword(pw){
    const enc = new TextEncoder().encode(String(pw||''));
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  function normalizeStr(s){

  function matchCategories(str){
    if(!str) return [];
    const parts = str.split(/[;,/]/).map(normalizeStr).filter(Boolean);
    const found = new Set();
    parts.forEach(p=>{
      CATEGORIES.forEach(cat=>{
        const label = normalizeStr(cat.label);
        const keyWords = cat.key.replace('_',' ');
        if(p.includes(label) || label.includes(p) || p.includes(keyWords)) found.add(cat.key);
      });
    });
    return Array.from(found);
  }

  function parseCSV(text){
    const rows = [];
    let i=0, field='', row=[], inQuotes=false;
    const s = String(text||'').replace(/\r\n/g,'\n');
    while(i < s.length){
      const c = s[i];
      if(inQuotes){
        if(c === '"'){
          if(s[i+1] === '"'){ field+='"'; i+=2; continue; }
          inQuotes = false; i++; continue;
        } else { field += c; i++; continue; }
      } else {
        if(c === '"'){ inQuotes = true; i++; continue; }
        if(c === ','){ row.push(field); field=''; i++; continue; }
        if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
        field += c; i++; continue;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.some(cell => cell.trim() !== ''));
  }

  function activateMembership(m){
    m.status = 'active';
    const plan = state.data.membershipPlans.find(p=>p.id===m.planId);
    const durationDays = plan ? plan.durationDays : 30;
    const creditsCount = plan ? plan.creditsCount : 1;
    if(m.type === 'illimite'){
      const start = new Date();
      const end = new Date(start); end.setDate(end.getDate() + durationDays);
      m.startDate = isoDate(start);
      m.endDate = isoDate(end);
    } else {
      let remaining = creditsCount;
      if(m.introStart){
        const introClass = state.data.classes.find(c=>c.category==='intro_bjj' && c.startDate===m.introStart && c.endDate===m.introEnd);
        if(introClass){
          const alreadyBooked = state.data.bookings.filter(b=>
            b.studentEmail.toLowerCase()===m.studentEmail.toLowerCase() &&
            ACTIVE_STATUSES.includes(b.status) &&
            getProgramOccurrences(introClass).some(o=>o.classId===b.classId && o.dateIso===b.dateIso)
          ).length;
          remaining = Math.max(0, creditsCount - alreadyBooked);
        }
      }
      m.creditsRemaining = remaining;
    }
  }

        reader.onerror = ()=> showToast('Impossible de lire cette image.');
        reader.onload = ()=>{
          const img = new Image();
          img.onerror = ()=> showToast('Impossible de traiter cette image.');
          img.onload = ()=>{
            const size = 260;
            const cover = Math.max(size/img.width, size/img.height);
            cropState = { img, scale:cover, minScale:cover, offsetX:0, offsetY:0, dragging:false, lastX:0, lastY:0 };
            state.modal = {type:'crop-photo', payload:{}};
            render();
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(f);
      });
    }

    closeModalDom();
    if(state.modal) renderModal();

    document.querySelectorAll('.toast').forEach(t=>t.remove());
    if(state.toastMsg){
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = state.toastMsg;
      document.body.appendChild(t);
    }
  }

  function buildStudentTileHtml(c, dateIso){
    const booked = bookedCount(c.id, dateIso);
    const full = booked >= c.capacity;
    const numDots = Math.ceil(c.capacity/2);
    const filledUnits = booked/2;
    let dots = '';
    for(let k=0;k<numDots;k++){
      const fill = Math.max(0, Math.min(1, filledUnits-k));
      const dotColor = capacityColor(numDots>1 ? k/(numDots-1) : 0);
      let dotStyle;
      if(fill<=0) dotStyle = `border:1px solid var(--border);background:transparent;`;
      else if(fill>=1) dotStyle = `background:${dotColor};border:1px solid ${dotColor};`;
      else dotStyle = `background:linear-gradient(90deg, ${dotColor} 50%, transparent 50%);border:1px solid ${dotColor};`;
      dots += `<span class="dot" style="${dotStyle}"></span>`;
    }
    const isProgram = isProgramClass(c);
    let spotsText;
    if(full){
      spotsText = 'Complet \u00b7 liste d\u2019attente';
    } else {
      spotsText = (c.capacity - booked) + ' place(s) restante(s)';
    }
    const accent = categoryAccent(c.category);
    const isRainbow = c.name && c.name.trim()==='Queers & Allies';
    const nameColor = isRainbow ? '#FFFBF8' : accent;
    const tint = categoryTint(c.category);
    const tileStyle = isRainbow ? '' : ` style="border-left-color:${accent};${tint ? `background:${tint};` : ''}"`;
    const tileInner = `
      <div class="class-tile ${full?'full':''}"${tileStyle} data-action="open-class" data-class="${c.id}" data-date="${dateIso}">
        <div class="class-time">${c.time} <span style="color:var(--chalk);font-weight:700;">\u00b7 ${categoryLabel(c.category)}</span> ${c.free ? '<span style="color:var(--sage);">\u00b7 gratuit</span>' : ''}</div>
        <div class="class-name" style="color:${nameColor};">${escapeHtml(c.name)}${isProgram ? ' <span style="color:var(--amber);font-size:11px;">\u00b7 programme</span>' : ''}</div>
        <div class="class-spots">${spotsText}</div>
        <div class="dots">${dots}</div>
      </div>
    `;
    return isRainbow ? `<div class="rainbow-wrap">${tileInner}</div>` : tileInner;
  }

  function renderStudent(){
    const dates = getWeekDates(state.weekOffset);
    let anyClass = false;
    let weekHasMorning = false;
    let weekHasAfternoon = false;
    const dayData = dates.map((d,i)=>{
      const dateIso = isoDate(d);
      const dayClasses = state.data.classes.filter(c=>c.dayOfWeek===i)
        .filter(c=> (!c.startDate || dateIso >= c.startDate) && (!c.endDate || dateIso <= c.endDate))
        .sort((a,b)=>a.time.localeCompare(b.time));
      if(dayClasses.length) anyClass = true;
      const morning = dayClasses.filter(c=>c.time < '12:01');
      const afternoon = dayClasses.filter(c=>c.time >= '12:01');
      if(morning.length) weekHasMorning = true;
      if(afternoon.length) weekHasAfternoon = true;
      return {d, i, dateIso, dayClasses, morning, afternoon};
    });
    const splitAmPm = weekHasMorning && weekHasAfternoon && window.innerWidth > 700;
    let cols = '';
    if(splitAmPm){
      cols += '<div class="board board-am">';
      dayData.forEach(({d,i,dateIso,morning})=>{
        const tiles = morning.map(c=>buildStudentTileHtml(c, dateIso)).join('');
        cols += `
          <div class="day-col">
            <div class="day-head">${DAYS_SHORT[i]} <span class="num">${formatDayNum(d)}</span></div>
            <div class="am-tiles-wrap">${tiles}</div>
          </div>
        `;
      });
      cols += '</div><div class="week-divider"></div><div class="board board-pm">';
      dayData.forEach(({dateIso,afternoon})=>{
        const tiles = afternoon.map(c=>buildStudentTileHtml(c, dateIso)).join('');
        cols += `<div class="day-col">${tiles}</div>`;
      });
      cols += '</div>';
    } else {
      dayData.forEach(({d,i,dateIso,dayClasses})=>{
        const tiles = dayClasses.map(c=>buildStudentTileHtml(c, dateIso)).join('');
        cols += `
          <div class="day-col">
            <div class="day-head">${DAYS_SHORT[i]} <span class="num">${formatDayNum(d)}</span></div>
            ${tiles || '<div style="font-size:12px;color:var(--chalk-dim);">\u2014</div>'}
          </div>
        `;
      });
    }
    let myWeekBookingsHtml = '';
    if(state.studentSession){
      const weekStart = isoDate(dates[0]);
      const weekEnd = isoDate(dates[6]);
      const myBookings = state.data.bookings.filter(b=>
        b.studentEmail.toLowerCase()===state.studentSession.email.toLowerCase() &&
        b.status!=='annulee' &&
        b.dateIso>=weekStart && b.dateIso<=weekEnd
      ).sort((a,b)=>a.dateIso.localeCompare(b.dateIso));
      if(myBookings.length){
        myWeekBookingsHtml = `
          <div class="card" style="margin-bottom:16px;">
            <h3 style="margin:0 0 8px;">Mes réservations cette semaine</h3>
            ${myBookings.map(b=>{
              const c = state.data.classes.find(cl=>cl.id===b.classId);
              const d = new Date(b.dateIso+'T00:00:00');
              const dayShort = DAYS_SHORT[(d.getDay()+6)%7].toUpperCase();
              return `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;">
                  <span style="color:var(--chalk-dim);font-family:var(--font-d);font-size:11px;min-width:50px;">${dayShort} ${formatDayNum(d)}</span>
                  <span style="flex:1;padding:0 10px;">${c?escapeHtml(c.name):'—'} · ${c?c.time:''}</span>
                  ${statusBadge(b.status)}
                  <button class="small-btn" style="margin-left:8px;" data-action="student-cancel-booking" data-id="${b.id}" title="Annuler cette réservation">✕</button>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }
    }

    return `
      ${myWeekBookingsHtml}
      <div class="week-nav">
        <button data-action="week-prev"><span class="full-text">← Semaine préc.</span><span class="short-text">Semaine<br>← Préc.</span></button>
        <span class="week-label">${weekLabel(state.weekOffset)}</span>
        <button data-action="week-next"><span class="full-text">Semaine suiv. →</span><span class="short-text">Semaine<br>Suiv. →</span></button>
        ${state.weekOffset!==0 ? '<button data-action="week-today">Aujourd\'hui</button>' : ''}
        ${getNextIntroProgram() ? `<button class="btn-intro-highlight" data-action="goto-next-intro" style="line-height:1.3;text-align:center;">Aller au prochain<br>programme d\u2019intro<br>${formatShortDate(getNextIntroProgram().startDate)} au ${formatShortDate(getNextIntroProgram().endDate)}</button>` : ''}
      </div>
      ${anyClass ? (splitAmPm ? cols : `<div class="board">${cols}</div>`) : `<div class="board"><div class="empty-note">Aucun cours programm\u00e9 pour l\u2019instant. Revenez bient\u00f4t !</div></div>`}
      <div class="card" style="margin-top:20px;">
        <h3>Devenir membre</h3>
        <p class="muted" style="color:var(--chalk-dim);margin-bottom:0;">Un abonnement actif est requis pour réserver un cours.</p>
        <div class="btn-row"><button class="btn btn-primary" data-action="browse-plans">Voir les formules</button></div>
      </div>

            <div style="align-self:flex-start;text-align:left;width:100%;">
              <label style="margin-top:14px;color:${activeNotebook.coverTextColor};opacity:0.8;">Changer de carnet</label>
              <select id="nb-select-cover">
                ${myNotebooks.map(nb=>`<option value="${nb.id}" ${nb.id===activeNotebook.id?'selected':''}>${escapeHtml(nb.name)}</option>`).join('')}
              </select>
              <div class="btn-row" style="justify-content:flex-start;margin-top:6px;"><button class="small-btn" data-action="switch-notebook" data-select="nb-select-cover">Valider</button></div>
            </div>
          ` : ''}
          <div class="btn-row" style="justify-content:center;">
            <button class="btn btn-primary" data-action="open-notebook-cover" style="margin-top:10px;">Ouvrir mon carnet</button>
            <button class="btn btn-secondary" data-action="new-notebook" style="margin-top:10px;">+ Nouveau carnet</button>
            <button class="small-btn" data-action="open-notebook-settings" style="margin-top:10px;">⚙ Personnaliser</button>
          </div>
        </div>
      `;
    }

    const entries = state.data.notebookEntries.filter(n=>n.ownerKey===ownerKey && n.notebookId===activeNotebook.id && !n.trashed).sort((a,b)=>b.createdAt-a.createdAt);
    const usedCategories = Array.from(new Set(entries.map(n=>(n.category||'').trim()).filter(Boolean)));
    const allCategories = Array.from(new Set([...POSTIT_PRESET_CATEGORIES, ...usedCategories]));
    const searchOpen = !!state.notebookSearchOpen;
    const searchQuery = state.notebookSearchQuery || '';
    const pageCount = activeNotebook.pageCount || 1;
    const activePage = Math.min(state.notebookActivePage || 1, pageCount);

    let searchResultsHtml = '';
    if(searchOpen){
      const qn = normalizeStr(searchQuery);
      const matches = qn ? entries.filter(n=> normalizeStr(n.text||'').includes(qn) || normalizeStr(n.category||'').includes(qn)) : [];
      searchResultsHtml = `
        <div style="margin-bottom:12px;padding:10px;border:1px solid var(--border);border-radius:8px;">
          <input id="nb-search-input" placeholder="Chercher un mot-clé..." value="${escapeHtml(searchQuery)}">
          <div class="btn-row"><button class="btn btn-secondary" data-action="run-notebook-search">Chercher</button><button class="small-btn" data-action="toggle-notebook-search">Fermer</button></div>
          ${qn ? (matches.length ? `<ul class="link-list" style="margin-top:8px;">${matches.map(n=>`
            <li>
              <span>${escapeHtml(n.category)} — ${escapeHtml((n.text||'').slice(0,60))}${(n.text||'').length>60?'…':''}<br><span style="color:var(--chalk-dim);font-size:11px;">Page ${n.page||1}</span></span>
              <span><button class="small-btn" data-action="goto-notebook-page" data-page="${n.page||1}">Aller à la page</button></span>
            </li>
          `).join('')}</ul>` : '<p class="muted" style="color:var(--chalk-dim);margin-top:8px;">Aucun résultat.</p>') : ''}
        </div>
      `;
    }

    // Chaque page a une place fixe : 1 à 20 toujours à gauche, 21 à 40 toujours à droite —
    // on ne fait plus glisser la fenêtre de pages selon la page active, seule la mise en
    // surbrillance (classe "active") bouge.
    const leftTabs = [];
    for(let p=1; p<=Math.min(20, pageCount); p++) leftTabs.push(p);
    const rightTabs = [];
    for(let p=21; p<=Math.min(pageCount, 40); p++) rightTabs.push(p);

    const pageEntries = entries.filter(n=>(n.page||1)===activePage);

    return `
      ${backBtn}
      ${myNotebooks.length > 1 ? `
        <div class="btn-row" style="margin-top:0;margin-bottom:10px;">
          <select id="nb-select-active">
            ${myNotebooks.map(nb=>`<option value="${nb.id}" ${nb.id===activeNotebook.id?'selected':''}>${escapeHtml(nb.name)}</option>`).join('')}
          </select>
          <button class="small-btn" data-action="switch-notebook" data-select="nb-select-active">Changer</button>
        </div>
      ` : ''}
      <div class="btn-row" style="margin-bottom:10px;">
        <button class="small-btn" data-action="close-notebook-cover">← Fermer le carnet</button>
        <button class="small-btn" data-action="open-notebook-settings">⚙ Personnaliser</button>
        <button class="small-btn" data-action="new-notebook">+ Nouveau carnet</button>
        <button class="small-btn ${state.notebookEditMode?'active':''}" data-action="toggle-notebook-edit-mode" style="${state.notebookEditMode?'background:var(--amber);color:var(--ink);':''}">${state.notebookEditMode ? '✓ Mode édition' : '✎ Modifier le carnet'}</button>
        <button class="small-btn" data-action="open-received-items" data-owner="${escapeHtml(ownerKey)}" style="${receivedItemsForOwner(ownerKey).length?'background:var(--amber);color:var(--ink);':''}">📥 Reçu${receivedItemsForOwner(ownerKey).length?' ('+receivedItemsForOwner(ownerKey).length+')':''}</button>
        <button class="small-btn" data-action="open-notebook-trash" data-owner="${escapeHtml(ownerKey)}">🗑 Corbeille${trashedItemsForOwner(ownerKey).length?' ('+trashedItemsForOwner(ownerKey).length+')':''}</button>
      </div>
      <div style="margin-bottom:10px;">
        <button class="category-chip ${!state.notebookFilterCategory?'active':''}" data-action="filter-notebook-category" data-category="">Tous</button>
        ${allCategories.map(cat=>`<button class="category-chip ${state.notebookFilterCategory===cat?'active':''}" data-action="filter-notebook-category" data-category="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`).join('')}
      </div>
      ${searchResultsHtml}
      ${state.notebookFilterCategory ? `
        <div class="notebook-page" style="${notebookPageBgCss(settings)}">
          <div class="notebook-postits">
            ${entries.filter(n=>n.category===state.notebookFilterCategory).map(n=> n.kind==='text' ? `
              <div class="postit" style="background:transparent;box-shadow:none;border:1px dashed rgba(40,41,46,0.3);font-family:${textnoteFontCss(n.fontFamily)};color:${n.color||TEXTNOTE_INK_COLORS[0]};">
                <div class="postit-cat" style="color:rgba(40,41,46,0.6);">${escapeHtml(n.category)}</div>
                <div class="postit-text">${escapeHtml(n.text)}</div>
                <div class="postit-actions">
                  <button data-action="goto-notebook-page" data-page="${n.page||1}">Page ${n.page||1}</button>
                  <button data-action="edit-postit" data-id="${n.id}">Modifier</button>
                  <button data-action="open-share" data-id="${n.id}" data-owner="${escapeHtml(ownerKey)}">Partager</button>
                </div>
              </div>
            ` : `
              <div class="postit" style="background:${n.color};">
                <div class="postit-cat">${escapeHtml(n.category)}</div>
                <div class="postit-text">${escapeHtml(n.text)}</div>
                ${n.photo ? `<img src="${n.photo}">` : ''}
                <div class="postit-actions">
                  <button data-action="goto-notebook-page" data-page="${n.page||1}">Page ${n.page||1}</button>
                  <button data-action="edit-postit" data-id="${n.id}">Modifier</button>
                  <button data-action="open-share" data-id="${n.id}" data-owner="${escapeHtml(ownerKey)}">Partager</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      ` : `
        <div class="notebook-frame">
          <div class="notebook-tabs left">
            <div class="nb-tab nb-search" data-action="toggle-notebook-search">🔍</div>
            ${leftTabs.map(p=>`<div class="nb-tab ${p===activePage?'active':''}" data-action="goto-notebook-page" data-page="${p}">${p}</div>`).join('')}
          </div>
          <div class="notebook-canvas notebook-page" style="${notebookPageBgCss(settings)}" id="nb-canvas">
            ${pageEntries.filter(n=>n.kind!=='text' && n.kind!=='sticker').map(n=>`
              <div class="postit postit-free" data-id="${n.id}" style="left:${n.x||0}%;top:${n.y||0}%;background:${n.color};">
                <div class="postit-cat">${escapeHtml(n.category)}</div>
                <div class="postit-text">${escapeHtml(n.text)}</div>
                ${n.photo ? `<img src="${n.photo}">` : ''}
                ${state.notebookEditMode ? `
                <div class="postit-actions">
                  <button data-action="edit-postit" data-id="${n.id}">Modifier</button>
                  <button data-action="delete-postit" data-id="${n.id}">Retirer</button>
                  <button data-action="open-share" data-id="${n.id}" data-owner="${escapeHtml(ownerKey)}">Partager</button>
                </div>
                ` : ''}
              </div>
            `).join('')}
            ${pageEntries.filter(n=>n.kind==='text').map(n=>{
              const hAlign = n.hAlign||'left';
              const tx = hAlign==='right' ? '-100%' : (hAlign==='center' ? '-50%' : '0');
              const wide = (hAlign==='center' || hAlign==='justify');
              const wrapStyle = wide ? 'width:200px;' : '';
              const contentStyle = wide ? 'display:block;width:100%;' : '';
              return `
              <div class="textnote-free ${n.id===state.notebookSelectedEntry?'selected':''}" data-id="${n.id}" style="left:${n.x||0}%;top:${n.y||0}%;translate:${tx} 0;transform:rotate(${n.rotation||0}deg);text-align:${hAlign};${wrapStyle}font-family:${textnoteFontCss(n.fontFamily)};font-size:${n.fontSize||16}px;color:${n.color||TEXTNOTE_INK_COLORS[0]};"><span class="textnote-content" style="${contentStyle}">${escapeHtml(n.text)}</span>
                ${state.notebookEditMode && n.id===state.notebookSelectedEntry ? `
                  <button type="button" class="free-handle rotate-handle" data-id="${n.id}" title="Pivoter">↻</button>
                  <button type="button" class="free-handle resize-handle" data-id="${n.id}" title="Redimensionner">⤡</button>
                ` : ''}
                ${state.notebookEditMode ? `
                <div class="textnote-toolbar">
                  <button data-action="edit-postit" data-id="${n.id}">Modifier</button>
                  <button data-action="delete-postit" data-id="${n.id}">Retirer</button>
                  <button data-action="open-share" data-id="${n.id}" data-owner="${escapeHtml(ownerKey)}">Partager</button>
                </div>
                ` : ''}
              </div>
            `;}).join('')}
            ${pageEntries.filter(n=>n.kind==='sticker').map(n=>{
              const sticker = state.data.stickers.find(s=>s.id===n.stickerId);
              if(!sticker) return '';
              return `
              <div class="sticker-free ${n.id===state.notebookSelectedEntry?'selected':''}" data-id="${n.id}" style="left:${n.x||0}%;top:${n.y||0}%;transform:rotate(${n.rotation||0}deg);width:${n.size||60}px;">
                <img src="${sticker.image}" style="width:${n.size||60}px;">
                ${state.notebookEditMode && n.id===state.notebookSelectedEntry ? `
                  <button type="button" class="free-handle rotate-handle" data-id="${n.id}" title="Pivoter">↻</button>
                  <button type="button" class="free-handle resize-handle" data-id="${n.id}" title="Redimensionner">⤡</button>
                ` : ''}
                ${state.notebookEditMode ? `
                <div class="textnote-toolbar">
                  <button data-action="delete-postit" data-id="${n.id}">Retirer</button>
                  <button data-action="open-share" data-id="${n.id}" data-owner="${escapeHtml(ownerKey)}">Partager</button>
                </div>
                ` : ''}
              </div>
            `;
            }).join('')}
            <div class="btn-row" style="position:absolute;bottom:10px;right:10px;">
              <button class="btn btn-primary" data-action="new-postit" style="font-family:var(--font-b);">+ Note</button>
              <button class="btn btn-secondary" data-action="new-textnote" style="font-family:var(--font-b);">+ Texte</button>
              <button class="btn btn-secondary" data-action="open-sticker-picker" style="font-family:var(--font-b);">+ Autocollant</button>
              ${pageCount < MAX_NOTEBOOK_PAGES ? `<button class="btn btn-secondary" data-action="add-notebook-page" style="font-family:var(--font-b);">+ Page</button>` : ''}
            </div>
            ${!pageEntries.length ? `<p style="font-family:var(--font-b);color:rgba(40,41,46,0.55);">Page ${activePage} vide — clique sur + Note, + Texte ou + Autocollant, ou glisse une note d’une autre page ici.</p>` : ''}
          </div>
          <div class="notebook-tabs right">
            ${rightTabs.map(p=>`<div class="nb-tab ${p===activePage?'active':''}" data-action="goto-notebook-page" data-page="${p}">${p}</div>`).join('')}
          </div>
        </div>
        <p class="muted" style="color:var(--chalk-dim);font-size:11px;margin-top:6px;">Page ${activePage} sur ${pageCount} · glisse une note pour la repositionner sur la page.</p>
      `}
    `;
  }

  function buildAttendanceTileHtml(c, dateIso){
    const count = state.data.bookings.filter(b=>b.classId===c.id && b.dateIso===dateIso && b.status==='confirmee').length;
    const accent = categoryAccent(c.category);
    const isRainbow = c.name && c.name.trim()==='Queers & Allies';
    const nameColor = isRainbow ? '#FFFBF8' : accent;
    const tint = categoryTint(c.category);
    const tileStyle = isRainbow ? '' : ` style="border-left-color:${accent};${tint ? `background:${tint};` : ''}"`;
    const tileInner = `
      <div class="class-tile"${tileStyle} data-action="open-attendance" data-class="${c.id}" data-date="${dateIso}">
        <div class="class-time">${c.time} <span style="color:var(--chalk);font-weight:700;">· ${categoryLabel(c.category)}</span> ${c.free ? '<span style="color:var(--sage);">· gratuit</span>' : ''}</div>
        <div class="class-name" style="color:${nameColor};">${escapeHtml(c.name)}</div>
        <div class="class-spots">${count} inscrit(s)</div>
      </div>
    `;
    return isRainbow ? `<div class="rainbow-wrap">${tileInner}</div>` : tileInner;
  }

  function renderAttendance(){
    const dates = getWeekDates(state.weekOffset);
    let anyClass = false;
    let weekHasMorning = false;
    let weekHasAfternoon = false;
    const dayData = dates.map((d,i)=>{
      const dateIso = isoDate(d);
      const dayClasses = state.data.classes.filter(c=>c.dayOfWeek===i)
        .filter(c=> (!c.startDate || dateIso >= c.startDate) && (!c.endDate || dateIso <= c.endDate))
        .sort((a,b)=>a.time.localeCompare(b.time));
      if(dayClasses.length) anyClass = true;
      const morning = dayClasses.filter(c=>c.time < '12:01');
      const afternoon = dayClasses.filter(c=>c.time >= '12:01');
      if(morning.length) weekHasMorning = true;
      if(afternoon.length) weekHasAfternoon = true;
      return {d, i, dateIso, dayClasses, morning, afternoon};
    });
    const splitAmPm = weekHasMorning && weekHasAfternoon && window.innerWidth > 700;
    let cols = '';
    if(splitAmPm){
      cols += '<div class="board board-am">';
      dayData.forEach(({d,i,dateIso,morning})=>{
        const tiles = morning.map(c=>buildAttendanceTileHtml(c, dateIso)).join('');
        cols += `
          <div class="day-col">
            <div class="day-head">${DAYS_SHORT[i]} <span class="num">${formatDayNum(d)}</span></div>
            ${tiles}
          </div>
        `;
      });
      cols += '</div><div class="week-divider"></div><div class="board board-pm">';
      dayData.forEach(({dateIso,afternoon})=>{
        const tiles = afternoon.map(c=>buildAttendanceTileHtml(c, dateIso)).join('');
        cols += `<div class="day-col">${tiles}</div>`;
      });
      cols += '</div>';
    } else {
      dayData.forEach(({d,i,dateIso,dayClasses})=>{
        const tiles = dayClasses.map(c=>buildAttendanceTileHtml(c, dateIso)).join('');
        cols += `
          <div class="day-col">
            <div class="day-head">${DAYS_SHORT[i]} <span class="num">${formatDayNum(d)}</span></div>
            ${tiles || '<div style="font-size:12px;color:var(--chalk-dim);">—</div>'}
          </div>
        `;
      });
    }

    return `
      <div class="btn-row" style="margin-top:0;margin-bottom:14px;"><button class="btn btn-secondary" data-action="goto-admin">← Retour à Gérer</button></div>
      <h3 style="font-family:var(--font-d);text-transform:uppercase;letter-spacing:0.01em;">Prise de présences</h3>
      <div class="week-nav">
        <button data-action="week-prev"><span class="full-text">← Semaine préc.</span><span class="short-text">Semaine<br>← Préc.</span></button>
        <span class="week-label">${weekLabel(state.weekOffset)}</span>
        <button data-action="week-next"><span class="full-text">Semaine suiv. →</span><span class="short-text">Semaine<br>Suiv. →</span></button>
        ${state.weekOffset!==0 ? '<button data-action="week-today">Aujourd\'hui</button>' : ''}
      </div>
      ${anyClass ? (splitAmPm ? cols : `<div class="board">${cols}</div>`) : `<div class="board"><div class="empty-note">Aucun cours programmé cette semaine.</div></div>`}
    `;
  }

  function renderAdminLogin(){
    return `
      <div class="pin-screen">
        <h3 style="font-family:var(--font-d);">Espace administrateur</h3>
        <p class="muted" style="color:var(--chalk-dim);">Entrez votre NIP personnel pour gérer les cours et les paiements.</p>
        ${pwField('pin-input', '••••', {wrapStyle:'max-width:180px;margin:0 auto;', inputExtra:'inputmode="numeric" style="text-align:center;letter-spacing:4px;"'})}
        <div class="btn-row"><button class="btn btn-primary" data-action="pin-submit">Entrer</button></div>
      </div>
    `;
  }

  function renderAdmin(){
    const today = todayIso();
    const upcomingBookings = state.data.bookings
      .filter(b=>b.status!=='annulee' && isoDate(new Date(b.createdAt))===today)
      .sort((a,b)=> b.createdAt-a.createdAt);

    const toConfirmMemberships = state.data.memberships.filter(m=>m.status==='paiement_declare');

    const ADMIN_GROUPS = [
      {key:'bjj_adulte', label:'BJJ Adulte'},
      {key:'enfants', label:'BJJ Enfants'},
      {key:'intro_bjj', label:'Intro au BJJ'},
      {key:'parents_enfants', label:'Parents Enfants'},
      {key:'yoga', label:'Yoga'},
      {key:'muay_thai', label:'Muay Thai'},
      {key:'ALL_UNLIMITED', label:'All Unlimited'},
    ];
    if(!state.expandedClassGroups) state.expandedClassGroups = {};
    if(!state.expandedPlanGroups) state.expandedPlanGroups = {};

    const classesByCategory = state.data.classes.slice().sort((a,b)=>a.dayOfWeek-b.dayOfWeek || a.time.localeCompare(b.time));
    let classRows = ADMIN_GROUPS.filter(g=>g.key!=='ALL_UNLIMITED').map(g=>{
      const items = classesByCategory.filter(c=>c.category===g.key);
      if(!items.length) return '';
      const isOpen = !!state.expandedClassGroups[g.key];
      const seenWindows = new Set();
      let logicalCount = 0;
      items.forEach(c=>{
        if(c.startDate && c.endDate){
          const key = c.startDate+'|'+c.endDate;
          if(!seenWindows.has(key)){ seenWindows.add(key); logicalCount++; }
        } else {
          logicalCount++;
        }
      });
      const programGroups = new Map();
      const standaloneItems = [];
      items.forEach(c=>{
        if(c.startDate && c.endDate){
          const key = c.startDate+'|'+c.endDate;
          if(!programGroups.has(key)) programGroups.set(key, []);
          programGroups.get(key).push(c);
        } else {
          standaloneItems.push(c);
        }
      });
      const programRows = Array.from(programGroups.values()).map(sibsRaw=>{
        const sibs = sibsRaw.slice().sort((a,b)=>a.dayOfWeek-b.dayOfWeek);
        const first = sibs[0];
        const dayLabel = sibs.map(s=>DAYS[s.dayOfWeek]).join(' et ');
        const timeLabel = Array.from(new Set(sibs.map(s=>s.time))).join(', ');
        const editBtns = sibs.map(s=>`<button class="small-btn" data-action="edit-class" data-id="${s.id}">Modifier (${DAYS[s.dayOfWeek].slice(0,3)})</button>`).join('');
        const delBtns = sibs.map(s=>`<button class="small-btn" data-action="delete-class" data-id="${s.id}">Supprimer (${DAYS[s.dayOfWeek].slice(0,3)})</button>`).join('');
        return `
        <li>
          <span><strong>${escapeHtml(first.name)}</strong>${first.free ? ' <span style="color:var(--sage);">(gratuit)</span>' : ''} — ${dayLabel} ${timeLabel} · ${first.capacity} places · ${first.price}<br><span style="color:var(--amber);font-size:11px;">Programme : ${first.startDate||'\u2014'} \u2192 ${first.endDate||'\u2014'}</span></span>
          <span>${editBtns}${delBtns}</span>
        </li>
      `;
      }).join('');
      const standaloneRows = standaloneItems.map(c=>`
        <li>
          <span><strong>${escapeHtml(c.name)}</strong>${c.free ? ' <span style="color:var(--sage);">(gratuit)</span>' : ''} — ${DAYS[c.dayOfWeek]} ${c.time} · ${c.capacity} places · ${c.price}</span>
          <span>
            <button class="small-btn" data-action="edit-class" data-id="${c.id}">Modifier</button>
            <button class="small-btn" data-action="delete-class" data-id="${c.id}">Supprimer</button>
          </span>
        </li>
      `).join('');
      const rows = programRows + standaloneRows;
      return `
        <div style="margin-top:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden;">
          <button type="button" data-action="toggle-admin-class-group" data-group="${g.key}"
            style="width:100%;display:flex;justify-content:space-between;align-items:center;border:none;border-radius:0;background:var(--bg-tile);color:var(--chalk);padding:10px 12px;cursor:pointer;font-family:var(--font-d);font-size:13px;text-transform:uppercase;letter-spacing:0.02em;">
            <span>${g.label} (${logicalCount})</span><span>${isOpen ? '▲' : '▼'}</span>
          </button>
          ${isOpen ? `<ul class="link-list" style="padding:6px 12px;margin:0;">${rows}</ul>` : ''}
        </div>
      `;
    }).join('');

    const planGroupOf = p => {
      const cats = p.categories || [];
      if(cats.length > 1) return 'ALL_UNLIMITED';
      if(cats.length === 1) return cats[0];
      return null;
    };
    let planRows = ADMIN_GROUPS.map(g=>{
      const items = state.data.membershipPlans.filter(p=>planGroupOf(p)===g.key);
      if(!items.length) return '';
      const isOpen = !!state.expandedPlanGroups[g.key];
      const rows = items.map(p=>`
        <li>
          <span><strong>${escapeHtml(p.name)}</strong> — ${p.type==='illimite' ? p.durationDays+' jours illimité' : p.creditsCount+' cours'} · ${escapeHtml(p.price)}</span>
          <span>
            <button class="small-btn" data-action="edit-plan" data-id="${p.id}">Modifier</button>
            <button class="small-btn" data-action="delete-plan" data-id="${p.id}">Supprimer</button>
          </span>
        </li>
      `).join('');
      return `
        <div style="margin-top:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden;">
          <button type="button" data-action="toggle-admin-plan-group" data-group="${g.key}"

        <tr>
          <td>${studentLinkHtml(b.studentName, b.studentEmail, b.profileId)}</td>

    const notesSortBy = state.notesSortBy || 'date';

      if(b.attendanceNote){
        const c = state.data.classes.find(cl=>cl.id===b.classId);
        allNotes.push({kind:'booking', id:b.id, email:b.studentEmail||'', profileId:b.profileId||null, type:'Étudiant', subject:b.studentName, className:c?c.name:'—', dateIso:b.dateIso, note:b.attendanceNote, author:b.attendanceNoteAuthor||'', at:b.attendanceNoteAt||0});
      }
    });
    state.data.classNotes.forEach(n=>{
      if(n.note){
        const c = state.data.classes.find(cl=>cl.id===n.classId);
        allNotes.push({kind:'classNote', id:n.id, email:'', type:'Cours', subject:c?c.name:'—', className:c?c.name:'—', dateIso:n.dateIso, note:n.note, author:n.authorName||'', at:n.updatedAt||n.createdAt||0});
      }
    });
    if(notesSortBy==='student') allNotes.sort((a,b)=>a.subject.localeCompare(b.subject));
    else if(notesSortBy==='class') allNotes.sort((a,b)=>a.className.localeCompare(b.className));
    else allNotes.sort((a,b)=>b.at-a.at);

    const studentSearchResults = state.studentSearchQuery ? searchStudentAccounts(state.studentSearchQuery) : [];
    const searchResultsHtml = state.studentSearchQuery ? (
      studentSearchResults.length ? `<ul class="link-list" style="margin-top:10px;">${studentSearchResults.map(s=>{

                <button class="small-btn" data-action="open-child-detail" data-parent-email="${escapeHtml(s.parentEmail)}" data-member-id="${s.memberId}">Voir la fiche</button>
              </span>
            </li>
          `;

        return `
        <li>
          <span><strong>${escapeHtml(s.name)}</strong><br><span style="color:var(--chalk-dim);font-size:11px;">${escapeHtml(s.email)}${s.phone?' · '+escapeHtml(s.phone):''}</span></span>

          </span>
        </li>

    return `
      ${adminCard('attendance-entry', 'Prise de présences', `

      ${allNotes.length ? adminCard('attendance-notes', `Notes de présence (${allNotes.length})`, `

        <table>
          <tr><th>Étudiant</th><th>Cours</th><th>Date</th><th></th></tr>

            const c = state.data.classes.find(cl=>cl.id===b.classId);
            return `<tr>
              <td style="color:var(--coral);">${studentLinkHtml(b.studentName, b.studentEmail, b.profileId)}${b.studentEmail?'<br><span style="color:var(--chalk-dim);font-size:11px;">'+escapeHtml(b.studentEmail)+'</span>':''}</td>

              <td>
                <button class="small-btn" data-action="mark-attendance-paid" data-id="${b.id}">A payé</button>
                <button class="small-btn" data-action="cancel-booking" data-id="${b.id}">Retirer</button>
              </td>
            </tr>`;
          }).join('')}
        </table>
      `, 'var(--coral)', 'var(--coral)') : ''}

      ${adminCard('pending-payments', `Paiements d\u2019abonnement à confirmer ${toConfirmMemberships.length ? '('+toConfirmMemberships.length+')' : ''}`, `
        ${toConfirmMemberships.length ? `<table><tr><th>Étudiant</th><th>Formule</th><th></th></tr>${confirmRows}</table>`
          : '<p class="muted" style="color:var(--chalk-dim);">Rien en attente pour le moment.</p>'}
      `)}

      ${(()=>{
        const pendingShared = pendingModerationSharedItems();
        const mgr = currentManager();
        const inbox = mgr ? receivedItemsForManager(mgr.id) : [];
        let out = '';
        if(pendingShared.length){
          out += adminCard('shared-moderation', `Notes anonymes à approuver (${pendingShared.length})`, `
            <p class="muted" style="color:var(--chalk-dim);">Vous voyez le contenu, jamais qui l’envoie ni à qui elle est destinée — pour repérer les abus tout en gardant l’anonymat. Exception : si le message va à un enfant, vous voyez au minimum si l’expéditeur est un adulte ou un profil enfant. Si un message est inacceptable, utilisez « 🚩 Signaler » pour voir d’où il vient et à qui il était destiné (politique de tolérance zéro).</p>
            ${pendingShared.map(it=>{
              const toChild = it.recipientType==='student' && isChildOwnerKey(it.recipientOwnerKey);
              const childNote = toChild ? `<p style="color:var(--amber);font-size:12px;margin:6px 0;">👶 Destiné à un enfant · Envoyé par ${isChildOwnerKey(it.senderOwnerKey) ? 'un profil enfant' : 'un adulte'}</p>` : '';
              return `
              <div style="border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px;">
                ${sharedContentPreviewHtml(it)}
                ${childNote}
                <div class="btn-row" style="margin-top:8px;">
                  <button class="small-btn" style="background:var(--sage);border-color:var(--sage);color:var(--ink);" data-action="approve-shared-item" data-id="${it.id}">Approuver</button>
                  <button class="small-btn" data-action="refuse-shared-item" data-id="${it.id}">Refuser</button>
                  <button class="small-btn" style="background:var(--coral);border-color:var(--coral);color:var(--ink);" data-action="flag-shared-item" data-id="${it.id}">🚩 Signaler comme inapproprié</button>
                </div>
              </div>
            `;}).join('')}
          `, 'var(--amber)', 'var(--amber)');
        }
        if(mgr && inbox.length){
          out += adminCard('shared-inbox', `Notes reçues pour ${escapeHtml(mgr.name)} (${inbox.length})`, `
            ${inbox.map(it=>`
              <div style="border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px;">
                ${sharedContentPreviewHtml(it)}
                <div class="btn-row" style="margin-top:8px;">
                  <button class="small-btn" data-action="archive-shared-item" data-id="${it.id}">Marquer comme lu</button>
                </div>
              </div>
            `).join('')}
          `);
        }
        const flagged = flaggedInappropriateItems();
        if(flagged.length){
          out += adminCard('shared-flagged', `🚩 Messages signalés inappropriés (${flagged.length})`, `
            <p class="muted" style="color:var(--chalk-dim);">Exception à l’anonymat : ces messages ont été signalés comme inacceptables — l’origine et la destination sont révélées ici (politique de tolérance zéro).</p>
            ${flagged.map(it=>`
              <div style="border:1px solid var(--coral);border-radius:8px;padding:10px;margin-bottom:10px;">
                ${sharedContentPreviewHtml(it)}
                <p style="font-size:12px;color:var(--chalk-dim);margin:6px 0;">De : <span style="color:var(--chalk);">${escapeHtml(ownerKeyLabel(it.senderOwnerKey))}</span><br>À : <span style="color:var(--chalk);">${it.recipientType==='coach' ? escapeHtml((state.data.managers.find(mg=>mg.id===it.recipientManagerId)||{}).name||'Coach inconnu') : escapeHtml(ownerKeyLabel(it.recipientOwnerKey))}</span></p>
                <div class="btn-row" style="margin-top:8px;">
                  <button class="small-btn" data-action="archive-shared-item" data-id="${it.id}">Marquer comme traité</button>
                </div>
              </div>
            `).join('')}
          `, 'var(--coral)', 'var(--coral)');
        }
        return out;
      })()}

      ${adminCard('students', 'Étudiants', `
        <div class="btn-row" style="margin-top:0;margin-bottom:14px;">
          <button class="btn btn-secondary" data-action="manage-memberships">Gérer les abonnements</button>
          <button class="btn btn-secondary" data-action="import-students">Importer des étudiants</button>
          <button class="btn btn-primary" data-action="open-report-builder">Générer un rapport</button>
        </div>
        <label>Rechercher (nom, prénom, courriel ou téléphone)</label>
        <input id="student-search-input" placeholder="Rechercher..." value="${escapeHtml(state.studentSearchQuery||'')}">
        <div class="btn-row"><button class="btn btn-secondary" data-action="run-student-search">Rechercher</button></div>
        ${searchResultsHtml}
      `)}

      ${adminCard('plans', 'Formules d\u2019abonnement', `
        ${planRows || '<p class="muted" style="color:var(--chalk-dim);">Aucune formule. Ajoutez-en une ci-dessous.</p>'}
        <div class="btn-row">
          <button class="btn btn-primary" data-action="new-plan">+ Ajouter une formule</button>
          <button class="btn btn-sage" data-action="grant-membership">Offrir un abonnement gratuit</button>
        </div>
      `)}

      ${adminCard('classes', 'Cours', `
        ${classRows || '<p class="muted" style="color:var(--chalk-dim);">Aucun cours. Ajoutez-en un ci-dessous.</p>'}
        <div class="btn-row"><button class="btn btn-primary" data-action="new-class">+ Ajouter un cours</button></div>
      `)}

      ${adminCard('stickers', `Autocollants (${state.data.stickers.length})`, `
        ${state.data.stickers.length ? `<ul class="link-list">${state.data.stickers.map(s=>`
          <li>
            <span><img src="${s.image}" style="width:34px;height:34px;object-fit:cover;border-radius:5px;vertical-align:middle;margin-right:8px;"><strong>${escapeHtml(s.name)}</strong> — ${s.availableToAll ? 'Tous les étudiants' : (s.assignedEmails && s.assignedEmails.length ? escapeHtml(s.assignedEmails.length+' étudiant(s)') : 'En banque (non assigné)')}</span>
            <span>
              <button class="small-btn" data-action="edit-sticker" data-id="${s.id}">Modifier</button>
              <button class="small-btn" data-action="delete-sticker" data-id="${s.id}">Supprimer</button>
            </span>
          </li>
        `).join('')}</ul>` : '<p class="muted" style="color:var(--chalk-dim);">Aucun autocollant. Ajoutez-en un ci-dessous.</p>'}
        <div class="btn-row"><button class="btn btn-primary" data-action="new-sticker">+ Ajouter un autocollant</button></div>
      `)}

      ${adminCard('all-bookings', `Réservations effectuées aujourd\u2019hui (${upcomingBookings.length})`, `
        ${allRows ? `<table><tr><th>Étudiant</th><th>Cours</th><th>Date du cours</th><th>Statut</th><th></th></tr>${allRows}</table>`
          : '<p class="muted" style="color:var(--chalk-dim);">Personne n\u2019a réservé aujourd\u2019hui pour l\u2019instant.</p>'}
      `)}

      ${adminCard('managers', 'Gestionnaires', renderManagersSection())}

      ${adminCard('settings', 'Réglages', `
        <label>Nom du studio</label>
        <input id="settings-name" value="${escapeHtml(state.data.config.name)}">
        <div class="btn-row"><button class="btn btn-secondary" data-action="save-name">Enregistrer le nom</button></div>

        <label style="margin-top:18px;">Sauvegarde des données</label>
        <p style="font-size:12px;color:var(--chalk-dim);margin:4px 0 8px;">Téléchargez une copie complète (cours, formules, abonnements, réservations) — utile en filet de sécurité, ou pour transférer vers un autre hébergement plus tard.</p>
        <div class="btn-row"><button class="btn btn-secondary" data-action="export-data">Exporter mes données</button></div>

        <label style="margin-top:18px;">Restaurer une sauvegarde</label>
        <p style="font-size:12px;color:var(--chalk-dim);margin:4px 0 8px;">Remplace toutes les données actuelles par celles d\u2019un fichier exporté précédemment.</p>
        <input type="file" id="restore-file" accept=".json,application/json">
        <div class="btn-row"><button class="btn btn-secondary" data-action="restore-data">Restaurer</button></div>
      `)}
    `;
  }

  function renderModal(){

        </div>

        <div class="modal">

            <div>
              <label>Jour</label>
              <select id="f-day">${DAYS.map((d,i)=>`<option value="${i}" ${i===c.dayOfWeek?'selected':''}>${d}</option>`).join('')}</select>

              <label>Heure</label>
              <input id="f-time" type="time" value="${c.time}">
            </div>
          </div>
          <label>Catégorie</label>
          <select id="f-category">${CATEGORIES.map(cat=>`<option value="${cat.key}" ${cat.key===c.category?'selected':''}>${cat.label}</option>`).join('')}</select>
          <div class="row">
            <div>
              <label>Capacité</label>
              <input id="f-capacity" type="number" min="1" value="${c.capacity}">
            </div>
            <div>
              <label>Prix (affiché)</label>
              <input id="f-price" value="${escapeHtml(c.price||'')}" placeholder="25 $">
            </div>
          </div>
          <label style="display:flex;align-items:center;gap:8px;margin-top:14px;">
            <input type="checkbox" id="f-free" style="width:auto;" ${c.free?'checked':''}>
            <span style="color:var(--chalk);font-size:13px;">Cours gratuit — réservable sans abonnement</span>
          </label>
          <label style="margin-top:14px;">Description du cours (visible aux étudiants)</label>
          <textarea id="f-description" rows="4">${escapeHtml(c.description||'')}</textarea>

          <p style="font-size:11px;color:var(--chalk-dim);margin:2px 0 6px;">Laissez vide pour un cours récurrent chaque semaine. Remplissez pour limiter ce cours à une période précise (ex. un programme de 5 séances).</p>
          <div class="row">
            <div>
              <label>Date de début</label>
              <input id="f-start-date" type="date" value="${c.startDate||''}">
            </div>
            <div>
              <label>Date de fin</label>
              <input id="f-end-date" type="date" value="${c.endDate||''}">
            </div>
          </div>

            <button class="btn btn-secondary" data-action="close-modal">Annuler</button>
          </div>
        </div>
      `;
    } else if(m.type === 'book-class'){
      const {classId, dateIso, showParticipants} = m.payload;
      const c = state.data.classes.find(cl=>cl.id===classId);
      const full = bookedCount(classId,dateIso) >= c.capacity;
      const acct = state.studentSession ? findStudentAccount(state.studentSession.email) : null;
      const isProgram = isProgramClass(c);
      const occ = isProgram ? getProgramOccurrences(c) : [];
      const isFirstOcc = isProgram && isFirstProgramOccurrence(c, dateIso);
      const confirmedList = state.data.bookings.filter(b=>b.classId===classId && b.dateIso===dateIso && b.status==='confirmee');
      const payLabel = c.free ? 'Cours gratuit' : 'Cours payant';

      let introBlock = '';
      if(isProgram && !isFirstOcc){
        introBlock = `
          <p style="font-size:13px;">Impossible de réserver ce programme après la date du premier cours.</p>

          <p class="muted">Date de début : ${formatFullClassDateTime(occ[0].dateIso, occ[0].time, c.durationMinutes)} · ${payLabel}</p>
        `;
      }

      html = `
        <div class="modal">
          <button class="close-x" data-action="close-modal">✕</button>
          <h3 data-action="toggle-class-description" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;">${escapeHtml(c.name)}</h3>
          ${m.payload.showDescription ? `<p style="font-size:13px;color:var(--chalk-dim);white-space:pre-line;">${escapeHtml(c.description || 'Aucune description disponible pour ce cours.')}</p>` : ''}
          <p class="muted">${formatFullClassDateTime(dateIso, c.time, c.durationMinutes)} · ${payLabel}</p>
          ${introBlock}
          ${full ? '<p style="color:var(--amber);font-size:13px;">Ce cours est complet — vous pouvez rejoindre la liste d\u2019attente.</p>' : ''}

          ${showParticipants ? `<ul class="link-list">${confirmedList.length ? confirmedList.map(b=>`<li>${escapeHtml(formatDisplayName(b.studentName))}</li>`).join('') : '<li style="color:var(--chalk-dim);">Aucun participant confirmé.</li>'}</ul>` : ''}
          ${acct ? `
            <p class="muted" style="margin-top:10px;">Compte : <strong style="color:var(--chalk);">${escapeHtml(acct.name)}</strong> (${escapeHtml(acct.email)})<br><button class="small-btn" data-action="student-logout-inline" style="margin-top:6px;">Ce n\u2019est pas moi</button></p>

              </select>
            ` : ''}

            <input id="b-firstname" placeholder="Prénom">
            <label>Nom</label>
            <input id="b-lastname" placeholder="Nom">
            <label>Courriel</label>
            <input id="b-email" type="email" placeholder="votre@courriel.com">

      const draw = ()=>{
        ctx.clearRect(0,0,size,size);
        const w = cropState.img.width * cropState.scale;
        const h = cropState.img.height * cropState.scale;
        const x = size/2 - w/2 + cropState.offsetX;
        const y = size/2 - h/2 + cropState.offsetY;
        ctx.drawImage(cropState.img, x, y, w, h);
      };
      const clamp = ()=>{
        const w = cropState.img.width*cropState.scale;
        const h = cropState.img.height*cropState.scale;
        const maxOffsetX = Math.max(0,(w-size)/2);
        const maxOffsetY = Math.max(0,(h-size)/2);
        cropState.offsetX = Math.max(-maxOffsetX, Math.min(maxOffsetX, cropState.offsetX));
        cropState.offsetY = Math.max(-maxOffsetY, Math.min(maxOffsetY, cropState.offsetY));
      };
      draw();
      canvas.addEventListener('pointerdown', (ev)=>{
        cropState.dragging = true;
        cropState.lastX = ev.clientX; cropState.lastY = ev.clientY;
        canvas.style.cursor = 'grabbing';
        try{ canvas.setPointerCapture(ev.pointerId); }catch(err){}
      });
      canvas.addEventListener('pointermove', (ev)=>{
        if(!cropState.dragging) return;
        cropState.offsetX += ev.clientX - cropState.lastX;
        cropState.offsetY += ev.clientY - cropState.lastY;
        cropState.lastX = ev.clientX; cropState.lastY = ev.clientY;
        clamp(); draw();
      });
      const endDrag = ()=>{ cropState.dragging = false; canvas.style.cursor = 'grab'; };
      canvas.addEventListener('pointerup', endDrag);
      canvas.addEventListener('pointerleave', endDrag);
      if(zoomInput){
        zoomInput.addEventListener('input', ()=>{

  function formatDisplayName(fullName){
    const parts = String(fullName||'').trim().split(/\s+/).filter(Boolean);
    if(parts.length === 0) return '';
    if(parts.length === 1) return parts[0];
    const first = parts[0];
    const lastInitial = parts[parts.length-1].charAt(0).toUpperCase();
    return `${first} ${lastInitial}.`;
  }

  function escapeHtml(str){
    return String(str||'').replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

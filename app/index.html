<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>K-OSS Jiu-Jitsu</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#28292E">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="K-OSS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=Permanent+Marker&family=Great+Vibes&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#28292E;
    --bg-panel:#35363C;
    --bg-tile:#3F4046;
    --chalk:#FFFBF8;
    --chalk-dim:#AEB8AC;
    --border:#4A4B52;
    --amber:#E9E6D5;
    --coral:#E2725B;
    --sage:#93B48F;
    --cyan:#8FCBD9;
    --lilac:#B9A6D9;
    --ink:#28292E;
    --font-d:'Oswald',sans-serif;
    --font-b:'Work Sans',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  #app{
    background:var(--bg);
    color:var(--chalk);
    font-family:var(--font-b);
    min-height:600px;
    border-radius:14px;
    padding:0;
    overflow:hidden;
    box-shadow:0 1px 0 rgba(255,255,255,0.04) inset;
    position:relative;
  }
  .header{
    padding:22px 24px 16px;
    border-bottom:1px dashed var(--border);
    display:flex;
    flex-direction:column;
    gap:48px; /* espace volontairement généreux entre le bloc nom/abonnement et le reste (S28, demande d'Amélie) */
  }
  .header-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    width:100%; /* ⚠️ Sans ça, le média query mobile (.header{align-items:flex-start} plus bas)
      empêche .header-top d'être étiré par le parent flex-column ; il ne prenait alors que la
      largeur de son contenu, donc le "justify-content:space-between" ne poussait le badge
      compte/abonnement que jusqu'au bord de CETTE largeur réduite, pas jusqu'au vrai bord droit
      de l'écran (gros espace vide à droite sur mobile, signalé par Amélie). */
  }
  .header-bottom{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
    width:100%; /* même raison que .header-top ci-dessus */
  }
  .studio-name{
    font-family:var(--font-d);
    font-weight:700;
    font-size:26px;
    letter-spacing:0.3px;
    color:var(--chalk);
    margin:0;
  }
  .studio-sub{
    font-size:13px;
    color:var(--chalk-dim);
    margin-top:2px;
  }
  .tabs{display:flex;gap:6px;}
  .tab-btn{
    font-family:var(--font-d);
    font-size:14px;
    letter-spacing:0.3px;
    background:transparent;
    color:var(--chalk-dim);
    border:1px solid var(--border);
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--amber);
    color:var(--ink);
    border-color:var(--amber);
  }
  .account-badge{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;min-width:0;max-width:100%;}
  /* ⚠️ Piège mobile (corrigé) : un nom de profil/gestionnaire un peu long (ex. avec une
     précision entre parenthèses) débordait silencieusement hors de la carte de l'app et se
     faisait couper net par #app{overflow:hidden} — parce qu'un enfant flex (le <span> du nom)
     refuse par défaut de rétrécir sous sa largeur "tout sur une ligne" (min-width:auto).
     min-width:0 + le retour à la ligne ci-dessous règlent ça : le nom s'enroule proprement au
     lieu d'être tronqué à un endroit arbitraire. */
  .account-badge span{white-space:normal;overflow-wrap:anywhere;word-break:break-word;min-width:0;}
  /* .account-corner n'est plus en position absolue — remplacé par un flex item normal dans
     .header-top, pour que sa hauteur réelle (ex. badge + abonnement sur 2 lignes) pousse
     correctement le reste de l'en-tête vers le bas au lieu de le chevaucher sur mobile. */
  .account-corner{z-index:5;flex-shrink:0;max-width:62%;min-width:0;}
  .account-menu{
    position:absolute;top:calc(100% + 6px);right:0;
    background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;
    overflow:hidden;z-index:10;display:flex;align-items:stretch;
  }
  .account-menu-profiles{min-width:130px;border-right:1px solid var(--border);padding:8px 0;}
  .account-menu-label{padding:4px 14px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--chalk-dim);font-family:var(--font-b);}
  .profile-item{
    display:block;width:100%;text-align:left;background:transparent;border:none;
    color:var(--chalk);font-family:var(--font-b);font-size:13px;
    padding:8px 14px;cursor:pointer;
  }
  .profile-item:hover{background:var(--bg-tile);}
  .profile-item.active{color:var(--sage);font-weight:600;}
  .account-menu-actions{min-width:170px;}
  .account-menu-actions button{
    display:block;width:100%;text-align:left;background:transparent;border:none;
    color:var(--chalk);font-family:var(--font-b);font-size:13px;
    padding:10px 14px;cursor:pointer;
  }
  .account-menu-actions button:hover{background:var(--bg-tile);}
  .account-menu-actions button + button{border-top:1px solid var(--border);}
  .field-invalid{border-color:var(--coral) !important; box-shadow:0 0 0 1px var(--coral);}
  .avatar-img{width:26px;height:26px;border-radius:50%;object-fit:cover;display:block;}
  .avatar-fallback{
    width:26px;height:26px;border-radius:50%;background:var(--amber);color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;font-size:13px;
  }
  .content{padding:20px 24px 28px;}
  .week-nav{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .week-nav button{
    background:var(--bg-tile);
    border:1px solid var(--border);
    color:var(--chalk);
    font-family:var(--font-b);
    font-size:14px;
    padding:6px 12px;
    border-radius:7px;
    cursor:pointer;
    white-space:nowrap;
  }
  .week-nav .short-text{display:none;}
  @media (max-width:480px){
    .week-nav .full-text{display:none;}
    .week-nav .short-text{display:block;text-align:center;line-height:1.3;}
    .week-nav button{white-space:normal;}
  }
  .week-nav button.btn-intro-highlight{
    background:var(--amber);
    border-color:var(--amber);
    color:var(--ink);
    font-weight:600;
  }
  .week-label{font-family:var(--font-d);font-size:15px;color:var(--chalk-dim);}
  .board{
    display:grid;
    grid-template-columns:repeat(7,minmax(150px,1fr));
    gap:10px;
    overflow-x:auto;
  }
  .day-col{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    min-height:120px;
  }
  .day-head{
    font-family:var(--font-d);
    font-size:13px;
    color:var(--chalk-dim);
    padding-bottom:8px;
    border-bottom:1px dashed var(--border);
    margin-bottom:8px;
  }
  .day-head .num{color:var(--chalk-dim);font-size:16px;font-weight:600;}
  .class-tile{
    background:var(--bg-tile);
    border:1px solid var(--border);
    border-left:5px solid var(--amber);
    border-radius:6px;
    padding:8px 10px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .class-tile.full{opacity:0.75;}
  .rainbow-wrap{
    padding:3px;
    border-radius:8px;
    background:linear-gradient(90deg,#E23B3B,#E8912E,#E8D93B,#4A9B6E,#4A7FB8,#8E6A9E);
    margin-bottom:8px;
  }
  .rainbow-wrap .class-tile{
    margin-bottom:0;
    border:none;
    border-radius:5px;
    background:#25262A;
  }
  .class-time{font-family:var(--font-d);font-size:13px;color:var(--chalk);font-weight:700;}
  .class-name{font-size:15px;font-weight:700;margin:2px 0;font-family:var(--font-d);}
  .class-spots{font-size:12px;color:var(--chalk-dim);}
  .dots{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .empty-note{
    color:var(--chalk-dim);
    font-size:13px;
    padding:20px 4px;
    text-align:center;
    grid-column:1/-1;
  }
  .card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    margin-bottom:16px;
  }
  .card h3{font-family:var(--font-d);font-size:16px;margin:0 0 12px;color:var(--chalk);font-weight:600;}
  label{display:block;font-size:12px;color:var(--chalk-dim);margin-bottom:4px;margin-top:10px;}
  input,select,textarea{
    width:100%;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--chalk);
    padding:8px 10px;
    border-radius:6px;
    font-family:var(--font-b);
    font-size:14px;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px;}
  .nb-switch-select{width:auto;max-width:180px;flex:0 1 auto;}
  /* Les <option> d'un <select> s'ouvrent avec un fond natif blanc (contrôlé par l'OS/le
     navigateur, pas par notre thème sombre) — sans cette règle ils héritent du texte clair
     défini ci-dessus et deviennent illisibles (texte blanc sur fond blanc) une fois le menu
     déroulant ouvert. */
  select option{ color:#141413; background:#FFFBF8; }
  /* 🔴 CORRIGÉ (S47) : la règle ci-dessus ne couvre que l'état "au repos" des options — la
     ligne survolée/sélectionnée dans le menu déroulant OUVERT utilise un surlignage propre au
     navigateur (bleu système, etc.) qui ignore `background` mais PAS toujours `color`, ce qui
     rendait le texte invisible une fois une option survolée (texte clair sur fond clair du
     surlignage). `:checked` est respecté par la plupart des navigateurs pour styliser cette
     ligne surlignée à l'intérieur d'un <select> natif — on lui donne un fond ambre bien
     contrasté avec le même texte sombre que les autres options.  */
  select option:checked, select option:hover{ color:#141413; background:var(--amber); }
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:66px;}
  .pw-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:3px 8px;font-size:10px;background:var(--bg-tile);}
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus,
  input:-webkit-autofill:active,
  textarea:-webkit-autofill,
  textarea:-webkit-autofill:hover,
  textarea:-webkit-autofill:focus{
    -webkit-text-fill-color: var(--chalk) !important;
    caret-color: var(--chalk);
    -webkit-box-shadow: 0 0 0px 1000px var(--bg-tile) inset !important;
    box-shadow: 0 0 0px 1000px var(--bg-tile) inset !important;
    transition: background-color 9999s ease-in-out 0s;
  }
  .btn{
    font-family:var(--font-d);
    letter-spacing:0.3px;
    border:none;
    padding:9px 18px;
    border-radius:7px;
    cursor:pointer;
    font-size:14px;
  }
  .btn-primary{background:var(--amber);color:var(--ink);}
  .btn-secondary{background:transparent;border:1px solid var(--border);color:var(--chalk);}
  .btn-danger{background:var(--coral);color:var(--ink);}
  .btn-sage{background:var(--sage);color:var(--ink);}
  .btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .row{display:flex;gap:10px;}
  .row > div{flex:1;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--chalk-dim);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border);font-family:var(--font-d);font-size:12px;}
  td{padding:8px;border-bottom:1px solid var(--border);}
  .badge{
    display:inline-block;
    padding:2px 8px;
    border-radius:20px;
    font-size:11px;
    font-family:var(--font-b);
    font-weight:600;
  }
  .badge-pending{background:rgba(232,185,74,0.2);color:var(--amber);}
  .badge-declared{background:rgba(147,180,143,0.2);color:var(--sage);}
  .badge-confirmed{background:var(--sage);color:var(--ink);}
  .badge-waitlist{background:rgba(174,184,172,0.2);color:var(--chalk-dim);}
  .badge-cancelled{background:rgba(226,114,91,0.2);color:var(--coral);}
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);
    display:flex;align-items:center;justify-content:center;
    z-index:50;padding:16px;
  }
  .modal{
    background:var(--bg-panel);
    color:var(--chalk);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px;
    max-width:400px;width:100%;
    max-height:85vh;
    overflow-y:auto;
  }
  .modal h3{font-family:var(--font-d);margin:0 0 4px;font-size:18px;color:var(--chalk);}
  .modal .muted{color:var(--chalk-dim);font-size:13px;margin-bottom:14px;}
  .close-x{
    float:right;background:none;border:none;color:var(--chalk-dim);
    font-size:18px;cursor:pointer;
  }
  .pin-screen{
    display:flex;flex-direction:column;align-items:center;
    padding:40px 20px;text-align:center;
  }
  .link-list{list-style:none;padding:0;margin:0;}
  .link-list li{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--border);
    font-size:13px;flex-wrap:wrap;gap:6px;
  }
  .small-btn{
    font-size:12px;padding:5px 10px;border-radius:6px;
    border:1px solid var(--border);background:transparent;color:var(--chalk);cursor:pointer;
  }
  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--sage);color:var(--ink);padding:10px 18px;border-radius:8px;
    font-size:13px;font-weight:600;z-index:99;
  }
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .notebook-cover{
    background:var(--ink,#28292E);
    background:linear-gradient(160deg, #2A2A2A, #1C1C1C);
    border-radius:10px;
    padding:110px 30px 60px;
    text-align:center;
    min-height:360px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    position:relative;
    overflow:hidden;
  }
  .koss-logo-wrap{
    position:absolute;
    cursor:move;
    touch-action:none;
    user-select:none;
    line-height:1;
    transform:translateX(-50%);
  }
  .koss-logo-wrap.dragging{opacity:0.85;}
  .koss-logo-main{
    font-family:var(--font-d);
    font-weight:700;
    font-size:46px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    white-space:nowrap;
    border:3px solid currentColor;
    padding:10px 22px;
    display:inline-block;
  }
  .notebook-cover .owner-name{
    font-family:'Permanent Marker',cursive;
    font-size:32px;
    color:var(--amber);
    margin-top:10px;
  }
  .notebook-page{
    border-radius:10px;
    padding:20px 20px 20px 50px;
    position:relative;
    background-image:
      linear-gradient(90deg, rgba(200,60,60,0.35) 2px, transparent 2px),
      repeating-linear-gradient(var(--nb-page-color,#FFFBF8) 0px, var(--nb-page-color,#FFFBF8) 27px, rgba(120,140,180,0.25) 28px);
    background-position: 34px 0, 0 6px;
    background-size: auto, 100% 28px;
    background-color:var(--nb-page-color,#FFFBF8);
    min-height:420px;
    font-family:'Permanent Marker',cursive;
    color:#28292E;
  }
  .notebook-page .btn-secondary,
  .notebook-page .small-btn{
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(40,41,46,0.4);
    color:#28292E;
  }
  .notebook-postits{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    padding-top:6px;
  }
  .postit{
    width:150px;
    min-height:130px;
    padding:12px 10px;
    box-shadow:2px 4px 8px rgba(0,0,0,0.25);
    font-family:'Permanent Marker',cursive;
    color:#28292E;
    position:relative;
    display:flex;
    flex-direction:column;
    transform:rotate(var(--tilt,-2deg));
  }
  .postit .postit-cat{
    font-family:var(--font-b);
    font-weight:700;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:rgba(40,41,46,0.6);
    margin-bottom:6px;
  }
  .postit .postit-text{
    font-size:15px;
    line-height:1.25;
    flex:1;
    white-space:pre-line;
    word-break:break-word;
  }
  .postit img{width:100%;border-radius:4px;margin-top:6px;}
  .postit .postit-actions{
    display:flex;
    flex-wrap:nowrap;
    gap:4px;
    margin-top:6px;
  }
  .postit .postit-actions button{
    font-family:var(--font-b);
    font-size:9px;
    white-space:nowrap;
    background:rgba(255,255,255,0.5);
    border:none;
    border-radius:3px;
    padding:2px 4px;
    cursor:pointer;
    color:#28292E;
  }
  .notebook-frame{
    display:flex;
    align-items:stretch;
    gap:0;
  }
  .notebook-tabs{
    display:flex;
    flex-direction:column;
    gap:3px;
    justify-content:flex-start;
    padding-top:6px;
  }
  .notebook-tabs.right{ align-items:flex-start; }
  .notebook-tabs.left{ align-items:flex-end; }
  .nb-tab{
    width:14px;
    min-height:20px;
    background:var(--bg-tile);
    border:1px solid var(--border);
    color:var(--chalk-dim);
    font-family:var(--font-b);
    font-size:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:1px;
  }
  .notebook-tabs.left .nb-tab{ border-radius:6px 0 0 6px; margin-right:-1px; }
  .notebook-tabs.right .nb-tab{ border-radius:0 6px 6px 0; margin-left:-1px; }
  .nb-tab.active{ background:var(--amber); color:var(--ink); border-color:var(--amber); font-weight:700; }
  .nb-tab.nb-search{ font-size:13px; margin-bottom:4px; }
  .notebook-canvas{
    position:relative;
    min-height:420px;
    flex:1;
  }
  .postit-free{
    position:absolute;
    width:150px;
    cursor:grab;
    z-index:2;
  }
  .postit-free.dragging{ cursor:grabbing; opacity:0.85; z-index:5; }
  .textnote-free{
    position:absolute;
    cursor:grab;
    z-index:2;
    max-width:220px;
    padding:6px;
  }
  .textnote-content{
    display:inline-block;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .textnote-free.dragging{ cursor:grabbing; opacity:0.85; z-index:5; }
  .textnote-toolbar{
    position:absolute;
    left:0;
    top:100%;
    margin-top:4px;
    display:flex;
    flex-wrap:nowrap;
    gap:3px;
    opacity:0.75;
    z-index:6;
  }
  .textnote-toolbar button{
    font-family:var(--font-b);
    font-size:9px;
    white-space:nowrap;
    background:rgba(255,255,255,0.6);
    border:1px solid rgba(40,41,46,0.2);
    border-radius:3px;
    padding:2px 4px;
    cursor:pointer;
    color:#28292E;
  }
  .sticker-free{
    position:absolute;
    cursor:grab;
    z-index:2;
    text-align:center;
  }
  .sticker-free.dragging{ cursor:grabbing; opacity:0.85; z-index:5; }
  .sticker-free img{ display:block; border-radius:6px; }
  .textnote-free.selected, .sticker-free.selected, .postit-free.selected{
    outline:2px dashed var(--amber);
    outline-offset:5px;
  }
  .textnote-free.text-select-mode .textnote-content, .postit-free.text-select-mode .postit-text{
    cursor:text;
  }
  #nb-canvas.quick-text-drawing{ cursor:crosshair; }
  .quick-text-preview{
    position:absolute; border:2px dashed var(--amber); background:rgba(242,166,90,0.14);
    border-radius:4px; pointer-events:none; z-index:7;
  }
  .textnote-free.quick-editing{ cursor:text; }
  .quick-text-textarea{
    display:block; box-sizing:border-box; resize:none; outline:none; border:1px dashed var(--amber);
    background:rgba(255,255,255,0.55); border-radius:4px; padding:6px 8px; line-height:1.25;
    font-family:inherit; box-shadow:0 1px 4px rgba(0,0,0,0.1);
  }
  .free-handle{
    position:absolute;
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--amber);
    color:var(--ink);
    border:2px solid #fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    line-height:1;
    cursor:pointer;
    touch-action:none;
    z-index:6;
    padding:0;
  }
  .free-handle.rotate-handle{ top:-15px; left:-15px; cursor:grab; }
  .free-handle.resize-handle{ bottom:-15px; right:-15px; cursor:nwse-resize; }
  .sticker-picker-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(70px, 1fr));
    gap:10px;
  }
  .sticker-picker-item{
    cursor:pointer;
    text-align:center;
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px;
  }
  .sticker-picker-item img{ width:100%; max-width:60px; border-radius:4px; }
  .sticker-picker-item .sname{ font-size:10px;color:var(--chalk-dim);margin-top:4px; }
  .category-chip{
    display:inline-block;
    padding:4px 10px;
    border-radius:14px;
    font-size:11px;
    font-family:var(--font-b);
    font-weight:600;
    border:1px solid var(--border);
    color:var(--chalk);
    background:transparent;
    cursor:pointer;
    margin:0 6px 6px 0;
  }
  .category-chip.active{
    background:var(--amber);
    color:var(--ink);
    border-color:var(--amber);
  }
  .board-am{margin-bottom:0;align-items:stretch;}
  .board-am .day-col{display:flex;flex-direction:column;}
  .board-am .am-tiles-wrap{margin-top:auto;}
  /* Sans ça, la marge basse du dernier cours du matin s'ajoutait au padding de la colonne,
     éloignant les cases du matin de la ligne pointillée par rapport à celles du soir. */
  .board-am .am-tiles-wrap > :last-child{margin-bottom:0;}
  .board-pm{margin-top:0;}
  .week-divider{
    border-top:2px dashed var(--chalk-dim);
    opacity:0.6;
    margin:14px 0;
  }
  @media (max-width:700px){
    .board{grid-template-columns:1fr;}
    .header{flex-direction:column;align-items:flex-start;}
    .week-divider{display:none;}
  }
  /* Bouton "Ajouter un raccourci" (installer la PWA) : n'a de sens que sur mobile,
     caché sur ordinateur (même seuil que les autres adaptations mobile ci-dessus). */
  .mobile-only-install{display:none;}
  @media (max-width:700px){
    .mobile-only-install{display:inline-block;}
  }
</style>

  // --- « Se souvenir de moi » ---------------------------------------------------------
  // Par défaut (case cochée), la session (jeton Supabase Auth ET nos propres clés locales
  // comme student_session/my_profile) est écrite dans localStorage, donc elle survit à la
  // fermeture du navigateur — c'était déjà le comportement de l'app avant l'ajout de cette
  // case (createClient() utilise localStorage par défaut). Si l'usager décoche la case au
  // moment de se connecter, on écrit plutôt dans sessionStorage : la session disparaît dès
  // que l'onglet/le navigateur est fermé (utile sur un poste partagé, ex. l'ordi du studio).
  // REMEMBER_FLAG_KEY lui-même reste toujours en localStorage (ce n'est pas une donnée
  // sensible, juste la préférence) pour qu'on sache, même après redémarrage du navigateur,
  // dans lequel des deux stockages aller relire la session.
  const REMEMBER_FLAG_KEY = 'koss_remember_me';
  function isRememberMeEnabled(){
    try{ return localStorage.getItem(REMEMBER_FLAG_KEY) !== '0'; }catch(e){ return true; }
  }
  function setRememberMe(enabled){
    try{ localStorage.setItem(REMEMBER_FLAG_KEY, enabled ? '1' : '0'); }catch(e){}
  }
  // Adaptateur de stockage utilisé à la fois par Supabase Auth (option `auth.storage`) et
  // par notre propre localBackend (student_session, my_profile) : mêmes règles pour tout.
  const rememberAwareStorage = {
    getItem(key){
      try{ const v = localStorage.getItem(key); if(v !== null) return v; }catch(e){}
      try{ return sessionStorage.getItem(key); }catch(e){ return null; }
    },
    setItem(key, value){
      const remember = isRememberMeEnabled();
      try{
        if(remember){ localStorage.setItem(key, value); try{ sessionStorage.removeItem(key); }catch(e){} }
        else { localStorage.removeItem(key); sessionStorage.setItem(key, value); }
      }catch(e){}
    },
    removeItem(key){
      try{ localStorage.removeItem(key); }catch(e){}
      try{ sessionStorage.removeItem(key); }catch(e){}
    }
  };

  // --- Backend Supabase (données partagées entre tous les visiteurs) ---
  const SUPABASE_URL = 'https://kwifgwyyiqinhiebmyqy.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_bDuifvFbk4Y_C7_iTqDHsQ_YU6iFfEP';
  const sb = (typeof window.supabase !== 'undefined')
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storage: rememberAwareStorage } })
    : null;
  // Enregistré ICI, tout de suite après la création du client — pas plus bas dans boot()
  // (qui fait plusieurs `await` avant d'y arriver) — car Supabase traite le lien de
  // récupération de mot de passe dans l'URL dès la création du client, et l'événement
  // PASSWORD_RECOVERY ne serait plus jamais reçu si on écoutait trop tard.
  if(sb){
    sb.auth.onAuthStateChange((event, session)=>{
      if(event === 'PASSWORD_RECOVERY'){
        state.modal = {type:'set-new-password', payload:null};
        render();
      }
    });
  }

  // Lien caché pour les gestionnaires : kossmtl.ca/app/?admin ouvre directement
  // l'écran de NIP (Gérer), sans passer par l'écran d'accueil membre/nouveau.
  const ADMIN_URL_FLAG = (function(){
    try{ return new URLSearchParams(window.location.search).has('admin'); }catch(e){ return false; }
  })();

  // Certaines clés (session de l'élève sur SON navigateur, profil personnel mémorisé
  // localement) ne doivent JAMAIS être partagées entre visiteurs : elles restent en
  // localStorage peu importe le backend. Seule STORAGE_KEY (studio_data_v1, les vraies
  // données du studio) passe par Supabase pour être visible par tout le monde.
  const LOCAL_ONLY_KEYS = new Set(['student_session', 'my_profile']);

  const localBackend = {
    async get(key){
      const v = rememberAwareStorage.getItem(key);
      if(v === null){ const e = new Error('not found'); e.notFound = true; throw e; }
      return {value: v};
    },
    async set(key, value){ rememberAwareStorage.setItem(key, value); },
    async delete(key){ rememberAwareStorage.removeItem(key); }
  };

  // NOUVEAU (S16) : les données du studio ne sont plus rangées dans une seule ligne
  // JSON géante (app_state) — elles sont réparties sur plusieurs tables Supabase
  // (une par collection : koss_classes, koss_bookings, koss_student_accounts, etc.),
  // synchronisées d'un coup via 2 fonctions Postgres (koss_load_all/koss_sync_all,
  // voir supabase/migration_multi_tables.sql) qui font tout dans UNE transaction —
  // soit tout est écrit, soit rien ne l'est. Le reste de l'app ne voit AUCUNE
  // différence : state.data garde exactement la même forme qu'avant (mêmes clés,
  // mêmes tableaux) — seul l'endroit où c'est rangé côté serveur a changé.
  const supabaseBackend = {
    async get(key){
      // Distinction cruciale (héritée du correctif du bug de perte de revenu, S14) :
      // une vraie erreur (réseau, permissions, Supabase down, etc.) ne doit JAMAIS être
      // traitée comme "pas encore de données" — sinon loadData() écraserait les vraies
      // données du studio par une base vide au moindre pépin de connexion. koss_load_all()
      // renvoie NULL seulement si la ligne 'meta' n'existe vraiment pas encore (premier
      // lancement) — toute vraie erreur remonte normalement via `error`.
      // Avant une vraie connexion (aucune session Supabase active), koss_load_all() est
      // refusé par le serveur — seul koss_load_public() (horaire + tarifs, rien de privé)
      // est accessible à un visiteur anonyme. Une fois connecté (élève ou gestionnaire),
      // koss_load_all() prend le relais et renvoie la vue filtrée selon le rôle.
      let hasSession = false;
      try{
        const { data: sessData } = await sb.auth.getSession();
        hasSession = !!(sessData && sessData.session);
      }catch(err){}
      const { data, error } = await sb.rpc(hasSession ? 'koss_load_all' : 'koss_load_public');
      if(error) throw error;
      if(data == null){ const e = new Error('not found'); e.notFound = true; throw e; }
      return { value: JSON.stringify(data) };
    },
    async set(key, value){
      const { error } = await sb.rpc('koss_sync_all', { payload: JSON.parse(value) });
      if(error) throw error;
    },
    async delete(key){
      const { error } = await sb.rpc('koss_reset_all');
      if(error) throw error;
    }
  };

  // window.storage n'existe que dans le bac à sable Claude (artifact). Sur le vrai site,
  // on route studio_data_v1 vers Supabase (partagé) et le reste vers localStorage (local
  // à cet appareil).
  const storageBackend = (typeof window.storage !== 'undefined' && window.storage) ? window.storage : {
    async get(key, ...args){ return (LOCAL_ONLY_KEYS.has(key) ? localBackend : supabaseBackend).get(key, ...args); },
    async set(key, value, ...args){ return (LOCAL_ONLY_KEYS.has(key) ? localBackend : supabaseBackend).set(key, value, ...args); },

  // Mélange deux couleurs hex ("#rrggbb") — pct = part de la couleur "accent"
  // dans le résultat (10 = 10%). Sert à teinter légèrement le fond de Gérer
  // avec l'accent choisi, sans changer le fond du reste du site.
  function mixHexColors(baseHex, accentHex, pct){
    const toRgb = (h)=>{ const s=h.replace('#',''); return [parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)]; };

    const t = pct/100;

  // ---------- Ajouter au calendrier (Google / Apple / Outlook) ----------
  // Convertit une date+heure LOCALE de Montréal en instant UTC exact, peu importe
  // le fuseau horaire de l'appareil qui consulte l'app, et peu importe l'heure d'été/hiver
  // (le décalage réel de America/Toronto est recalculé pour chaque date via Intl).
  function montrealInstant(dateIso, time){
    const [y,mo,d] = dateIso.split('-').map(Number);
    const [hh,mm] = time.split(':').map(Number);
    const guess = new Date(Date.UTC(y, mo-1, d, hh, mm, 0));
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone:'America/Toronto', hour12:false,
      year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', second:'2-digit'
    });
    const parts = fmt.formatToParts(guess).reduce((o,p)=>{ o[p.type]=p.value; return o; }, {});
    const hourNum = parts.hour === '24' ? 0 : Number(parts.hour);
    const asIfUtc = Date.UTC(Number(parts.year), Number(parts.month)-1, Number(parts.day), hourNum, Number(parts.minute), Number(parts.second));
    const offsetMs = asIfUtc - guess.getTime();
    return new Date(guess.getTime() - offsetMs);
  }
  function icsUtcStamp(date){
    const p2 = n => String(n).padStart(2,'0');
    return `${date.getUTCFullYear()}${p2(date.getUTCMonth()+1)}${p2(date.getUTCDate())}T${p2(date.getUTCHours())}${p2(date.getUTCMinutes())}${p2(date.getUTCSeconds())}Z`;
  }

  function downloadIcsEvent(evt){
    const ics = [

      'PRODID:-//K-OSS Jiu-Jitsu//App//FR',
      'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',

      `SUMMARY:${icsEscape(evt.title)}`,

      `LOCATION:${icsEscape(evt.location)}`,
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');
    const blob = new Blob([ics], {type:'text/calendar;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${evt.title.replace(/[^a-z0-9]+/gi,'-')}.ics`;
    document.body.appendChild(a);

  // --- Fusion à 3 voies -------------------------------------------------
  // Le fichier de données est un seul gros objet partagé par tous les appareils.
  // Sans fusion, la dernière fenêtre qui sauvegarde écrase tout ce que les autres
  // ont changé entre-temps (ex : une note signalée/supprimée par l'admin réapparaît
  // parce que la fenêtre élève, qui avait encore l'ancienne copie, sauvegarde après).
  // "base" = dernière copie qu'on sait identique au serveur, "local" = nos changements,
  // "remote" = ce qui est sur le serveur maintenant (fait par d'autres fenêtres/appareils).
  function deepClone(obj){ return obj == null ? obj : JSON.parse(JSON.stringify(obj)); }

  // Certaines collections n'ont pas de champ "id" (ex: studentAccounts, identifié par
  // courriel) — keyFn permet de fusionner ces listes-là aussi élément par élément plutôt
  // que de risquer d'écraser toute la liste (ex: une nouvelle inscription qui disparaît).
  function mergeArrayById(base, local, remote, keyFn){
    base = Array.isArray(base) ? base : [];
    local = Array.isArray(local) ? local : [];
    remote = Array.isArray(remote) ? remote : [];
    const getKey = keyFn || (x=> (x && x.id!=null) ? x.id : null);
    const hasKeys = (local.length===0 || local.every(x=>x && typeof x==='object' && getKey(x)!=null))
                 && (remote.length===0 || remote.every(x=>x && typeof x==='object' && getKey(x)!=null));
    if(!hasKeys){
      // Pas de clé fiable pour fusionner élément par élément : si on a changé la liste
      // localement, on garde notre version, sinon on prend celle du serveur.
      return JSON.stringify(local) !== JSON.stringify(base) ? local : remote;
    }
    const byKey = arr => { const m = new Map(); arr.forEach(x=>{ const k=getKey(x); if(k!=null) m.set(k, x); }); return m; };
    const baseMap = byKey(base), localMap = byKey(local), remoteMap = byKey(remote);
    const order = [];
    const seen = new Set();
    remote.forEach(x=>{ const k=getKey(x); if(k!=null && !seen.has(k)){ order.push(k); seen.add(k); } });
    local.forEach(x=>{ const k=getKey(x); if(k!=null && !seen.has(k)){ order.push(k); seen.add(k); } });
    const out = [];
    order.forEach(key=>{
      const inBase = baseMap.has(key), inLocal = localMap.has(key), inRemote = remoteMap.has(key);
      if(inLocal && inRemote){
        const localVal = localMap.get(key), remoteVal = remoteMap.get(key), baseVal = baseMap.get(key);
        const localChanged = !inBase || JSON.stringify(localVal) !== JSON.stringify(baseVal);
        const remoteChanged = !inBase || JSON.stringify(remoteVal) !== JSON.stringify(baseVal);
        if(localChanged) out.push(localVal);
        else if(remoteChanged) out.push(remoteVal);
        else out.push(localVal);
      } else if(inLocal && !inRemote){
        if(inBase){ /* supprimé ailleurs entre-temps : on respecte la suppression */ }
        else out.push(localMap.get(key)); // ajout local pas encore vu par le serveur
      } else if(!inLocal && inRemote){
        if(inBase){ /* on l'a supprimé localement : on respecte notre suppression */ }
        else out.push(remoteMap.get(key)); // ajout fait ailleurs qu'on n'a pas encore
      }
    });
    return out;
  }

  const MERGE_ARRAY_KEYS = {
    studentAccounts: x => x && x.email ? x.email.toLowerCase() : null,
  };

  function mergeAppData(base, local, remote){
    base = base || {}; local = local || {}; remote = remote || {};
    const keys = new Set([...Object.keys(base), ...Object.keys(local), ...Object.keys(remote)]);
    const out = {};
    keys.forEach(key=>{
      const b = base[key], l = local[key], r = remote[key];
      if(Array.isArray(l) || Array.isArray(r) || Array.isArray(b)){
        out[key] = mergeArrayById(b, l, r, MERGE_ARRAY_KEYS[key]);
      } else if(l && typeof l === 'object' && !Array.isArray(l) && r && typeof r === 'object'){
        // objet simple (ex: config) : on part du serveur puis on repasse par-dessus
        // chaque champ qu'on a nous-même changé localement.
        const merged = Object.assign({}, r);
        Object.keys(l).forEach(k=>{
          const changedLocally = !b || JSON.stringify(l[k]) !== JSON.stringify(b[k]);
          if(changedLocally) merged[k] = l[k];
        });
        out[key] = merged;
      } else {
        const changedLocally = JSON.stringify(l) !== JSON.stringify(b);
        out[key] = changedLocally ? l : r;
      }
    });
    return out;
  }

  async function persistNow(){
    let toWrite = state.data;
    try{
      const res = await storageBackend.get(STORAGE_KEY, true);
      const remote = JSON.parse(res.value);
      const base = state.lastSyncedData || remote;
      toWrite = mergeAppData(base, state.data, remote);
    }catch(mergeErr){
      // Pas de copie serveur lisible (ex: tout premier enregistrement) : on écrit tel quel.
    }
    const payload = JSON.stringify(toWrite);
    if(payload.length > APP_STORAGE_CAP){
      console.error('Erreur de sauvegarde: payload trop volumineux', payload.length);
      showToast("Espace de stockage maximal atteint. Envoie ce message à Amélie pour qu'elle règle le problème.");
      return false;
    }
    try{
      await storageBackend.set(STORAGE_KEY, payload, true);
      state.data = toWrite;
      state.lastSyncedData = deepClone(toWrite);
      return true;
    }catch(e){
      console.error('Erreur de sauvegarde', e);
      showToast("Erreur d'enregistrement, réessayez.");
      return false;
    }
  }

  // File d'attente pour persist() : deux persist() lancés presque en même temps (ex. supprimer
  // un compte puis en recréer un tout de suite après) pouvaient se chevaucher — chacun lisait le
  // serveur et fusionnait à partir d'un instantané différent, et celui qui écrivait EN SECOND
  // pouvait écraser le travail de l'autre (perte de la donnée la plus récente). En les mettant en
  // file, chaque persist() attend que le précédent soit complètement terminé (donc que
  // state.lastSyncedData soit à jour) avant de lire le serveur à son tour — plus de chevauchement.
  let persistChain = Promise.resolve();
  function persist(){
    const result = persistChain.then(()=> persistNow());
    persistChain = result.catch(()=>{});
    return result;
  }

  // Récupère périodiquement les changements faits ailleurs (autre appareil/fenêtre)
  // et les fusionne dans l'état local, pour que l'admin (ou l'élève) voie les nouveautés
  // sans devoir recharger la page manuellement.
  // NOUVEAU (S47 partie 2) : mémoire (en RAM seulement, par onglet) de la dernière version
  // de données connue, lue via koss_data_version() (voir supabase, quelques octets). Sert à
  // sauter le téléchargement complet du gros JSON quand rien n'a changé côté serveur depuis
  // la dernière fois. Redémarre à null à chaque rechargement de page — pas grave, ça ne fait
  // au pire qu'un chargement complet de plus, jamais une donnée manquée.
  let lastKnownDataVersion = null;
  // NOUVEAU (S47) : garde-fou pour maybeResumePendingPayment() — garantit qu'on ne tente la
  // reprise automatique du paiement qu'une seule fois par chargement de page, jamais en boucle
  // à chaque render() suivant.
  let pendingPayAttempted = false;
  async function refreshFromRemote(){
    if(state.modal) return; // on ne dérange pas une saisie en cours
    // Vérifie d'abord si quelque chose a vraiment changé côté serveur avant de retélécharger
    // tout le bloc JSON du studio. Échec ouvert : toute erreur ici (réseau, etc.) fait
    // simplement retomber sur l'ancien comportement (chargement complet), jamais de blocage
    // ni de donnée manquée — ce n'est qu'une optimisation réseau, pas un chemin critique.
    let freshVersion = null;
    try{
      const { data: v, error: vErr } = await sb.rpc('koss_data_version');
      if(!vErr) freshVersion = v;
    }catch(e){}
    if(freshVersion && lastKnownDataVersion && freshVersion === lastKnownDataVersion){
      return; // rien de neuf depuis la dernière fois : zéro appel réseau de plus
    }
    try{
      const res = await storageBackend.get(STORAGE_KEY, true);
      const remote = JSON.parse(res.value);
      const base = state.lastSyncedData || remote;
      const merged = mergeAppData(base, state.data, remote);
      const changed = JSON.stringify(merged) !== JSON.stringify(state.data);
      state.data = merged;
      state.lastSyncedData = deepClone(merged);
      // On ne retient la nouvelle version qu'APRÈS que le téléchargement complet ait
      // réellement réussi (voir ci-dessus) — jamais avant, sinon un échec réseau juste
      // après la lecture de la version ferait croire au prochain sondage que les données
      // sont déjà à jour alors qu'elles ne l'ont jamais été téléchargées.
      if(freshVersion) lastKnownDataVersion = freshVersion;
      // Déconnexion forcée : si l'élève est connecté sur CET appareil mais que son compte
      // vient de disparaître de studentAccounts (suppression par lui-même sur un autre
      // appareil, OU par un·e admin), on le déconnecte ici tout de suite plutôt que de le
      // laisser naviguer dans une app avec un compte qui n'existe plus côté serveur.
      // ⚠️ Ne jamais faire ça en mode admin : sinon supprimer "l'élève qui a le même
      // courriel qu'un·e gestionnaire" fait bugger l'affichage vers l'écran d'accueil
      // pendant que la vraie session admin reste valide (retour instantané en admin ensuite,
      // mais affichage trompeur entre-temps).
      if(!ADMIN_URL_FLAG && state.studentSession && !findStudentAccount(state.studentSession.email)){
        state.studentSession = null;
        await clearSessionStorage();
        // ⚠️ Piège corrigé (15 sept 2026) : sans fermer aussi la session Supabase Auth ici,
        // le jeton reste valide dans ce navigateur — au prochain chargement, boot() la
        // retrouve encore active et handleGoogleSession() recrée automatiquement un compte
        // élève tout neuf (même chemin qu'une toute première inscription), ce qui "ressuscite"
        // le compte qu'on vient tout juste de supprimer. Voir aussi confirm-delete-account-yes.
        try{ await sb.auth.signOut(); }catch(err){}
        state.view = 'welcome';
        render();
        showToast('Ce compte a été supprimé. Vous avez été déconnecté·e.');
        return;
      }
      if(changed && !state.modal) render();
    }catch(e){
      // silencieux : on réessaiera au prochain intervalle
    }
  }
  // Partage entre onglets du MÊME navigateur (demande d'Amélie, 20 sept) : si la personne a
  // l'app ouverte dans 2 onglets à la fois, chacun sondait Supabase indépendamment jusqu'ici
  // — même consommation réseau × le nombre d'onglets. Purement local (localStorage, aucun
  // réseau) : dès qu'UN onglet a fait un vrai appel réseau récent, les autres réutilisent son
  // résultat au lieu de retélécharger la même chose. Verrou à courte durée de vie (5s) pour
  // que 2 onglets qui sondent au même instant ne fassent pas 2 appels réseau simultanés.
  const TAB_SHARE_KEY = 'koss_shared_fetch_v1';
  const TAB_SHARE_TTL_MS = 5000;
  function applySharedRemoteData(remoteData){
    if(state.modal || !remoteData) return;
    const base = state.lastSyncedData || remoteData;
    const merged = mergeAppData(base, state.data, remoteData);
    const changed = JSON.stringify(merged) !== JSON.stringify(state.data);
    state.data = merged;
    state.lastSyncedData = deepClone(merged);
    if(changed) render();
  }
  async function coordinatedRefresh(){
    let shared = null;
    try{ shared = JSON.parse(localStorage.getItem(TAB_SHARE_KEY) || 'null'); }catch(e){}
    const now = Date.now();
    if(shared && shared.data && (now - shared.at) < TAB_SHARE_TTL_MS){
      // Un autre onglet vient tout juste de rafraîchir : on prend son résultat, zéro appel réseau.
      applySharedRemoteData(shared.data);
      return;
    }
    if(shared && shared.lockAt && (now - shared.lockAt) < TAB_SHARE_TTL_MS){
      // Un autre onglet est déjà en train de rafraîchir : on attend son résultat plutôt que
      // de dupliquer l'appel réseau maintenant (il arrivera via l'événement 'storage').
      return;
    }
    try{ localStorage.setItem(TAB_SHARE_KEY, JSON.stringify({lockAt: now})); }catch(e){}
    await refreshFromRemote();
    try{ localStorage.setItem(TAB_SHARE_KEY, JSON.stringify({at: Date.now(), data: state.data})); }catch(e){
      // Le JSON est peut-être trop gros pour localStorage (quota ~5-10 Mo) : tant pis, ce
      // n'est qu'une optimisation réseau, pas une fonctionnalité — les autres onglets
      // sonderont simplement eux-mêmes comme avant.
    }
  }
  // Un autre onglet vient d'écrire un résultat frais : on l'applique ici sans passer par le
  // réseau. L'événement 'storage' ne se déclenche JAMAIS dans l'onglet qui a écrit lui-même,
  // seulement dans les AUTRES — exactement ce qu'il faut ici.
  window.addEventListener('storage', (e)=>{
    if(e.key !== TAB_SHARE_KEY || !e.newValue) return;
    try{
      const shared = JSON.parse(e.newValue);
      if(shared && shared.data) applySharedRemoteData(shared.data);
    }catch(err){}
  });
  // Réduction de la bande passante egress Supabase (dépassement de quota confirmé par les
  // vrais chiffres du tableau de bord fin sept 2026 : ~8,3 Go/cycle, poussé par les jours de
  // test intensif — PAS par des photos, il n'y en a pas encore). refreshFromRemote()
  // retélécharge TOUT le bloc JSON du studio à chaque appel, donc un onglet simplement
  // laissé ouvert (même au premier plan, même sans qu'on y touche) le refaisait pour rien
  // toutes les 12s. Amélie a demandé (20 sept) que ça ne se mette à jour QUE si la personne
  // est vraiment en train d'utiliser l'onglet (navigue, clique) — pas juste "ouvert à
  // l'écran". Purement côté client, aucun changement SQL/Supabase, aucun risque sur les
  // données :
  // 1) On note la dernière fois qu'un vrai geste usager a eu lieu (clic, touche, défilement,
  //    toucher) dans `lastUserActivityAt`.
  // 2) La sonde toutes les 45s ne fait rien du tout si l'onglet est en arrière-plan OU si
  //    plus de 90s se sont écoulées sans le moindre geste (onglet ouvert mais délaissé).
  // 3) Dès qu'un geste survient après une telle pause, on rafraîchit tout de suite (sans
  //    attendre le prochain tic de 45s) — mais jamais plus d'une fois toutes les 20s, pour
  //    qu'une rafale de clics ne déclenche pas une rafale de requêtes.
  let lastUserActivityAt = Date.now();
  let lastAutoRefreshAt = 0;
  const REFRESH_IDLE_THRESHOLD_MS = 90000;
  const REFRESH_MIN_GAP_MS = 20000;
  function noteUserActivityForRefresh(){
    const wasIdle = (Date.now() - lastUserActivityAt) > REFRESH_IDLE_THRESHOLD_MS;
    lastUserActivityAt = Date.now();
    if(wasIdle && document.visibilityState === 'visible' && (Date.now() - lastAutoRefreshAt) > REFRESH_MIN_GAP_MS){
      lastAutoRefreshAt = Date.now();
      coordinatedRefresh();
    }
  }
  ['click','keydown','touchstart','pointerdown','scroll'].forEach(evt=>{
    document.addEventListener(evt, noteUserActivityForRefresh, {passive:true});
  });
  setInterval(()=>{
    if(document.visibilityState === 'hidden') return;
    if(Date.now() - lastUserActivityAt > REFRESH_IDLE_THRESHOLD_MS) return; // onglet délaissé : on ne sonde plus
    lastAutoRefreshAt = Date.now();
    coordinatedRefresh();
  }, 45000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible'){
      lastUserActivityAt = Date.now(); // revenir sur l'onglet compte comme un geste
      lastAutoRefreshAt = Date.now();
      coordinatedRefresh();
    }
  });

  // Helper générique pour télécharger un tableau de données en CSV — utilisé par les
  // différents rapports admin (ventes, conversions intro, présence, etc.).
  function downloadCsv(filename, columns, fieldLabels, rows){
    const csvRows = [columns.map(k=>fieldLabels[k]||k).join(',')];
    rows.forEach(r=>{
      csvRows.push(columns.map(k=>`"${String(r[k]==null?'':r[k]).replace(/"/g,'""')}"`).join(','));
    });
    const csv = csvRows.join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('CSV téléchargé.');
  }

  function showToast(msg){
    document.querySelectorAll('.toast').forEach(t=>t.remove());
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(()=>{ t.remove(); }, 2400);
  }

  // ---------- paiement Helcim intégré (HelcimPay.js) ----------
  // Ouvre le module de paiement Helcim DIRECTEMENT dans l'app (iframe superposée), sans
  // redirection. onDone(status, transaction) est appelé avec status 'SUCCESS' ou 'ABORTED' ;
  // sur SUCCESS, transaction est l'objet transaction rapporté par Helcim (contient
  // transactionId) — il sert seulement à savoir QUOI vérifier ; la confirmation réelle se
  // fait côté serveur (koss-confirm-payment) qui revérifie lui-même auprès de Helcim.
  function startHelcimCheckout(checkoutToken, onDone){
    if(typeof appendHelcimPayIframe !== 'function'){
      showToast('Le module de paiement n’a pas pu se charger. Réessayez ou contactez le studio.');
      onDone('ABORTED');
      return;
    }
    appendHelcimPayIframe(checkoutToken, true);
    const key = 'helcim-pay-js-' + checkoutToken;
    let done = false;
    // Helcim fournit removeHelcimPayIframe() spécifiquement pour fermer/retirer le module —
    // s'y fier plutôt que d'espérer un nettoyage automatique (c'est l'absence de cet appel qui
    // causait l'app "gelée" après un paiement : le module restait superposé, invisible mais
    // toujours là, bloquant les clics, jusqu'à un rafraîchissement de la page).
    const cleanup = ()=>{
      window.removeEventListener('message', handler);
      try{
        if(typeof removeHelcimPayIframe === 'function') removeHelcimPayIframe();
        else { const el = document.getElementById('helcimPayIframe'); if(el) el.remove(); }
      }catch(err){ console.error('Échec de fermeture du module de paiement Helcim:', err); }
    };
    const handler = (event)=>{
      if(!event.data || event.data.eventName !== key || done) return;
      if(event.data.eventStatus === 'HIDE'){
        // Aucun SUCCESS/ABORTED reçu avant que l'élève ferme la fenêtre : on traite ça comme
        // une annulation.
        done = true;
        cleanup();
        onDone('ABORTED', null);
        return;
      }
      done = true;
      let transaction = null;
      if(event.data.eventStatus === 'SUCCESS'){
        // eventMessage est une chaîne JSON de forme {data:{data:{...transaction...}, status, headers}}
        // (confirmé en conditions réelles le 10 sept 2026) — la transaction elle-même est nichée
        // deux niveaux plus bas que ce qu'on pourrait croire. On reste tolérant à d'autres formes
        // possibles (transaction directement à la racine, etc.) au cas où Helcim la ferait varier.
        let parsed = null;
        if(typeof event.data.eventMessage === 'string'){
          try{ parsed = JSON.parse(event.data.eventMessage); }catch(err){ console.error('Réponse Helcim illisible:', err); }
        } else if(event.data.eventMessage && typeof event.data.eventMessage === 'object'){
          parsed = event.data.eventMessage;
        }
        if(parsed){
          if(parsed.transactionId) transaction = parsed;
          else if(parsed.data && parsed.data.transactionId) transaction = parsed.data;
          else if(parsed.data && parsed.data.data && parsed.data.data.transactionId) transaction = parsed.data.data;
        }
        if(!transaction || !transaction.transactionId){
          console.error('Impossible d’extraire transactionId de la réponse Helcim:', event.data);
        }
      }
      cleanup();
      onDone(event.data.eventStatus, transaction);
    };
    window.addEventListener('message', handler);
  }

  // NOUVEAU (S47) : ouvre le paiement Helcim pour un abonnement DÉJÀ en attente de paiement
  // (offert par une gestionnaire à un montant personnalisé, ou tout autre abonnement
  // `attente_paiement`) — sans passer par le choix d'une formule dans le catalogue. Utilisé par
  // le bouton "🔒 Payer maintenant" dans le compte du client, ET par la reprise automatique
  // depuis le lien "PAYER MAINTENANT" du courriel (voir maybeResumePendingPayment ci-dessous).
  // `btn` est optionnel : présent pour un clic (on gère son état disabled/texte), absent pour
  // une ouverture automatique (on utilise un simple toast à la place).
  // ⚠️ Contrairement à pay-with-helcim (achat initial), on ne supprime JAMAIS l'abonnement en
  // cas d'annulation : celui-ci représente une vraie créance déjà existante, pas un brouillon
  // jetable créé à la volée pour obtenir un id à envoyer à Helcim.
  async function startPendingMembershipPayment(m, btn){
    const originalLabel = btn ? btn.textContent : null;
    if(btn){ btn.disabled = true; btn.textContent = 'Ouverture du paiement sécurisé…'; }
    else { showToast('Ouverture du paiement sécurisé…'); }
    try{
      const resp = await sb.functions.invoke('koss-init-payment', {body:{membershipId:m.id}});
      if(resp.error || !resp.data || !resp.data.checkoutToken) throw new Error('init failed');
      const checkoutToken = resp.data.checkoutToken;
      startHelcimCheckout(checkoutToken, async (status, transaction)=>{
        if(status==='SUCCESS'){
          state.modal = null; closeModalDom(); render();
          showToast('Paiement reçu, confirmation en cours…');
          let confirmedByHelcim = false;
          try{
            const confirmResp = await sb.functions.invoke('koss-confirm-payment', {
              body:{checkoutToken, transactionId: transaction && transaction.transactionId}
            });
            if(confirmResp.error || !confirmResp.data || !confirmResp.data.ok){
              showToast('Paiement reçu ! Le studio confirmera votre abonnement sous peu.');
            } else {
              confirmedByHelcim = true;
              showToast('Abonnement activé !');
            }
          }catch(confirmErr){
            console.error('Échec confirmation paiement:', confirmErr);
            showToast('Paiement reçu ! Le studio confirmera votre abonnement sous peu.');
          }
          await loadData();
          if(confirmedByHelcim){
            const confirmedM = state.data.memberships.find(mm=>mm.id===m.id);
            if(confirmedM && !confirmedM.paidViaHelcim){
              confirmedM.paidViaHelcim = true;
              confirmedM.paidViaHelcimAt = Date.now();
              await persist();
            }
            try{ sb.functions.invoke('koss-send-invoice', {body:{membershipId:m.id}}); }
            catch(err){ console.error('Échec envoi facture automatique:', err); }
          }
          render();
        } else if(status==='ABORTED'){
          if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
          showToast('Paiement annulé.');
        } else {
          if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
        }
      });
    }catch(err){
      console.error('Échec ouverture paiement Helcim:', err);
      if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
      showToast('Le paiement en ligne intégré est momentanément indisponible.');
    }
  }

  // NOUVEAU (S47) : reprise automatique du paiement quand le client arrive dans l'app via le
  // lien "PAYER MAINTENANT" de son courriel (?pay=<membershipId>, capturé au tout début de
  // boot() dans state.pendingPayMembershipId). Appelée depuis render() dès qu'une session
  // élève est présente — que ce soit une session déjà active, une connexion courriel/mot de
  // passe fraîche, ou un retour de connexion Google. `pendingPayAttempted` garantit qu'on
  // n'essaie qu'une seule fois par chargement de page, jamais en boucle.
  async function maybeResumePendingPayment(){
    const targetId = state.pendingPayMembershipId;
    state.pendingPayMembershipId = null;
    if(!targetId || !state.studentSession) return;
    const email = state.studentSession.email.toLowerCase();
    const m = state.data.memberships.find(mm =>
      mm.id === targetId &&
      mm.studentEmail && mm.studentEmail.toLowerCase() === email &&
      mm.status === 'attente_paiement'
    );
    // Rien à faire silencieusement si introuvable (déjà payé entre-temps, lien expiré/invalide,
    // ou ce compte n'est pas le bon destinataire) — pas d'erreur bruyante pour un clic sur un
    // vieux courriel.
    if(!m) return;
    state.view = 'account';
    render();
    await startPendingMembershipPayment(m, null);
  }

  // ---------- date helpers ----------
  function startOfWeek(offset){
    const now = new Date();
    const day = (now.getDay() + 6) % 7; // 0 = Monday
    const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day + offset*7);
    return monday;
  }
  function getWeekDates(offset){
    const monday = startOfWeek(offset);
    return Array.from({length:7}, (_,i)=>{
      const d = new Date(monday);
      d.setDate(monday.getDate()+i);
      return d;
    });
  }
  function isoDate(d){ return d.toISOString().slice(0,10); }
  function formatDayNum(d){ return d.getDate(); }

  function getNextIntroProgram(){
    const introClasses = state.data.classes.filter(c=>c.category==='intro_bjj' && c.startDate && c.endDate);
    if(!introClasses.length) return null;
    const programs = new Map();
    introClasses.forEach(c=>{
      const key = c.startDate+'|'+c.endDate;
      if(!programs.has(key)) programs.set(key, {startDate:c.startDate, endDate:c.endDate});
    });
    const list = Array.from(programs.values()).sort((a,b)=>a.startDate.localeCompare(b.startDate));
    const today = todayIso();
    return list.find(p=>p.startDate >= today) || list[list.length-1] || null;
  }

  function formatShortDate(dateIso){
    const d = new Date(dateIso+'T00:00:00');
    return formatDayNum(d) + ' ' + formatMonthShort(d);
  }

  function weekOffsetForDate(dateIso){
    const target = new Date(dateIso+'T00:00:00');
    const day = (target.getDay()+6)%7;
    const targetMonday = new Date(target);
    targetMonday.setDate(target.getDate()-day);
    const currentMonday = startOfWeek(0);
    const diffDays = Math.round((targetMonday - currentMonday)/(1000*60*60*24));
    return Math.round(diffDays/7);
  }
  function formatMonthShort(d){
    return d.toLocaleDateString('fr-FR', {month:'short'}).replace('.','');
  }
  function weekLabel(offset){
    const dates = getWeekDates(offset);
    const a = dates[0], b = dates[6];
    return `${formatDayNum(a)} ${formatMonthShort(a)} – ${formatDayNum(b)} ${formatMonthShort(b)}`;
  }

  // ---------- booking logic ----------
  const ACTIVE_STATUSES = ['attente_paiement','paiement_declare','confirmee'];

  function bookedCount(classId, dateIso){
    return state.data.bookings.filter(b => b.classId===classId && b.dateIso===dateIso && ACTIVE_STATUSES.includes(b.status)).length;
  }
  function waitlistFor(classId, dateIso){
    return state.data.bookings.filter(b => b.classId===classId && b.dateIso===dateIso && b.status==='liste_attente')
      .sort((a,b)=>a.createdAt-b.createdAt);
  }
  // Exception ponctuelle pour UNE date précise d'un cours (nom/places différents,
  // note publique, ou annulation) — n'affecte jamais l'horaire régulier (state.data.classes),
  // seulement l'affichage/la réservation pour ce classId+dateIso précis.
  function getClassOverride(classId, dateIso){
    return (state.data.classOverrides||[]).find(o=>o.classId===classId && o.dateIso===dateIso) || null;
  }
  // Annulation "cette classe et toutes les suivantes" — une seule règle active
  // par cours (classId). Toute date >= fromDateIso de ce cours est annulée,
  // jusqu'à ce que la règle soit retirée.
  function getClassCancelRule(classId){
    return (state.data.classCancelRules||[]).find(r=>r.classId===classId) || null;
  }
  function isCancelledByRule(classId, dateIso){
    const rule = getClassCancelRule(classId);
    return !!(rule && dateIso >= rule.fromDateIso);
  }
  function getEffectiveClass(c, dateIso){
    const ov = c ? getClassOverride(c.id, dateIso) : null;
    const rule = c ? getClassCancelRule(c.id) : null;
    const cancelledByRule = !!(rule && dateIso >= rule.fromDateIso);
    if(!ov && !cancelledByRule) return c;
    const cancelled = !!(ov && ov.cancelled) || cancelledByRule;
    // Amélie peut choisir, au moment d'annuler, de cacher complètement le cours de
    // l'horaire des élèves plutôt que de l'afficher barré « Annulé » (S36).
    const hideFromSchedule = cancelled && !!(
      (ov && ov.cancelled && ov.hideFromSchedule) ||
      (cancelledByRule && rule && rule.hideFromSchedule)
    );
    return Object.assign({}, c, {
      name: (ov && ov.name) || c.name,
      capacity: (ov && ov.capacity!=null && ov.capacity!=='') ? ov.capacity : c.capacity,
      publicNote: (ov && ov.note) || '',
      cancelled,
      hideFromSchedule,
    });
  }
  function isProgramClass(c){ return !!(c && c.startDate && c.endDate); }
  // Un cours à dates fixes dont le début et la fin sont le MÊME jour est un
  // événement ponctuel (une seule journée), pas un programme à plusieurs séances.
  function isEventClass(c){ return !!(c && c.startDate && c.endDate && c.startDate===c.endDate); }
  function programOrEventWord(c){ return isEventClass(c) ? 'événement' : 'programme'; }
  function ProgramOrEventWord(c){ return isEventClass(c) ? 'Événement' : 'Programme'; }

  function getProgramSiblings(c){
    return state.data.classes.filter(x => x.startDate===c.startDate && x.endDate===c.endDate && x.category===c.category);
  }

  function getProgramOccurrences(c){
    const siblings = getProgramSiblings(c);
    const occ = [];
    siblings.forEach(s=>{
      const jsDay = (s.dayOfWeek+1)%7; // our 0=Monday -> JS 0=Sunday
      let d = new Date(s.startDate+'T00:00:00');
      while(d.getDay() !== jsDay){ d.setDate(d.getDate()+1); }
      while(isoDate(d) <= s.endDate){
        occ.push({classId:s.id, dateIso:isoDate(d), className:s.name, time:s.time});
        d.setDate(d.getDate()+7);
      }
    });
    occ.sort((a,b)=> a.dateIso.localeCompare(b.dateIso) || a.time.localeCompare(b.time));
    return occ;
  }

  function isFirstProgramOccurrence(c, dateIso){
    const occ = getProgramOccurrences(c);
    return occ.length>0 && occ[0].classId===c.id && occ[0].dateIso===dateIso;
  }

  function promoteWaitlistIfRoom(classId, dateIso){
    const cls = state.data.classes.find(c=>c.id===classId);
    if(!cls) return;
    if(bookedCount(classId,dateIso) < cls.capacity){
      const wl = waitlistFor(classId,dateIso);
      if(wl.length){
        const promoted = wl[0];
        promoted.status = 'confirmee';
        promoted.promotedAt = Date.now();
        const membership = activeMembershipForEmail(promoted.studentEmail, cls.category, promoted.profileId);
        if(membership && membership.type==='credits'){
          membership.creditsRemaining = Math.max(0, membership.creditsRemaining - 1);
        }
      }
    }
  }

  async function proceedBooking(classId, dateIso, name, email, isDuplicateConfirmed, profileId, membershipId){
    const c = state.data.classes.find(cl=>cl.id===classId);
    if(!c){ showToast('Ce cours n\u2019existe plus.'); return; }

    if(isProgramClass(c)){
      return await proceedProgramBooking(c, name, email, isDuplicateConfirmed, profileId);
    }

    const alreadyBooked = state.data.bookings.some(b =>
      b.classId===classId && b.dateIso===dateIso &&
      b.studentEmail.toLowerCase()===email.toLowerCase() &&
      (b.profileId||null)===(profileId||null) &&
      ACTIVE_STATUSES.includes(b.status)
    );

    if(alreadyBooked && !isDuplicateConfirmed){
      state.modal = {type:'confirm-duplicate', payload:{classId, dateIso, name, email, profileId}};
      render();
      return;
    }

    let membership = null;
    if(!c.free){
      if(alreadyBooked){
        const candidates = activeMembershipsForEmail(email, c.category, profileId).filter(m=>m.type==='credits');
        if(!candidates.length){
          state.modal = {type:'need-membership', payload:{
            name, email, profileId, classId, dateIso,
            intro:'Un abonnement \u00e0 la carte (cr\u00e9dits) est requis pour r\u00e9server ce cours une 2e fois',
            neededCategory:c.category,
            requireCreditsOnly:true
          }};
          render();
          return;
        }
        if(candidates.length > 1 && !membershipId){
          state.modal = {type:'choose-membership', payload:{
            classId, dateIso, name, email, profileId, isDuplicateConfirmed,
            candidateIds: candidates.map(m=>m.id)
          }};
          render();
          return;
        }
        membership = membershipId ? candidates.find(m=>m.id===membershipId) : candidates[0];
        if(!membership){ showToast('Abonnement introuvable.'); return; }
      } else {
        const candidates = activeMembershipsForEmail(email, c.category, profileId);
        if(!candidates.length){
          state.modal = {type:'need-membership', payload:{
            name, email, profileId, classId, dateIso,
            intro:`Votre abonnement ne couvre pas les cours "${categoryLabel(c.category)}"`,
            neededCategory:c.category
          }};
          render();
          return;
        }
        if(candidates.length > 1 && !membershipId){
          state.modal = {type:'choose-membership', payload:{
            classId, dateIso, name, email, profileId, isDuplicateConfirmed,
            candidateIds: candidates.map(m=>m.id)
          }};
          render();
          return;
        }
        membership = membershipId ? candidates.find(m=>m.id===membershipId) : candidates[0];
        if(!membership){ showToast('Abonnement introuvable.'); return; }
      }
    }

    const full = bookedCount(classId,dateIso) >= c.capacity;
    const booking = {
      id: uid(), classId, dateIso,
      studentName:name, studentEmail:email, profileId: profileId||null,
      status: full ? 'liste_attente' : 'confirmee',
      membershipId: membership ? membership.id : null,
      createdAt: Date.now()
    };
    state.data.bookings.push(booking);
    if(!full && membership && membership.type==='credits'){
      membership.creditsRemaining = Math.max(0, membership.creditsRemaining - 1);
    }
    await persist();
    state.modal = null; closeModalDom();
    render();
    showToast(full ? 'Ajout\u00e9 \u00e0 la liste d\u2019attente.' : (isDuplicateConfirmed ? 'Deuxi\u00e8me r\u00e9servation confirm\u00e9e !' : 'R\u00e9servation confirm\u00e9e !'));
  }

  async function proceedProgramBooking(c, name, email, isDuplicateConfirmed, profileId){
    const occ = getProgramOccurrences(c);
    const firstDateIso = occ[0].dateIso;
    const alreadyInProgram = state.data.bookings.some(b =>
      b.classId===c.id && b.dateIso===firstDateIso &&
      b.studentEmail.toLowerCase()===email.toLowerCase() &&
      (b.profileId||null)===(profileId||null) &&
      ACTIVE_STATUSES.includes(b.status)
    );
    if(alreadyInProgram){
      state.modal = null; closeModalDom();
      render();
      showToast('Vous êtes déjà inscrit à ce programme.');
      return;
    }

    let membership = null;
    if(!c.free){
      membership = state.data.memberships.find(mm =>
        mm.studentEmail.toLowerCase()===email.toLowerCase() &&
        (mm.profileId||null)===(profileId||null) &&
        isMembershipActive(mm) && (mm.categories||[]).includes(c.category) &&
        (!mm.introStart || mm.introStart === c.startDate)
      );
      if(!membership){
        state.modal = {type:'need-membership', payload:{
          name, email, profileId,
          intro:`Votre abonnement ne couvre pas ce programme (${categoryLabel(c.category)} du ${formatShortDate(c.startDate)})`,
          neededCategory:c.category
        }};
        render();
        return;
      }
      if(membership.type==='credits' && membership.creditsRemaining < occ.length){
        state.modal = {type:'need-membership', payload:{
          name, email, profileId,
          intro:`Il vous manque des cours sur votre carte pour ce programme de ${occ.length} séances (${membership.creditsRemaining} restant(s))`,
          neededCategory:c.category
        }};
        render();
        return;
      }
    }

    let confirmedCount = 0, waitlistCount = 0;
    occ.forEach(o=>{
      const full = bookedCount(o.classId, o.dateIso) >= state.data.classes.find(cl=>cl.id===o.classId).capacity;
      state.data.bookings.push({
        id: uid(), classId:o.classId, dateIso:o.dateIso,
        studentName:name, studentEmail:email, profileId: profileId||null,
        status: full ? 'liste_attente' : 'confirmee',
        createdAt: Date.now(),
        programBooking: true
      });
      if(full) waitlistCount++; else confirmedCount++;
      if(!full && membership && membership.type==='credits'){
        membership.creditsRemaining = Math.max(0, membership.creditsRemaining - 1);
      }
    });

    await persist();
    state.modal = null; closeModalDom();
    render();
    showToast(waitlistCount ? `Programme réservé — ${confirmedCount} confirmée(s), ${waitlistCount} en liste d\u2019attente.` : `Programme réservé — ${confirmedCount} séances confirmées !`);
  }

  function statusBadge(status){

      paiement_declare: ['badge-declared','Paiement déclaré'],
      confirmee: ['badge-confirmed','Confirmée'],
      liste_attente: ['badge-waitlist','Liste d\u2019attente'],
      annulee: ['badge-cancelled','Annulée'],
    };

  // ---------- membership logic ----------
  function todayIso(){ return isoDate(new Date()); }

  function isMembershipActive(m){
    if(m.status !== 'active') return false;
    if(m.type === 'illimite') return m.endDate >= todayIso();
    if(m.type === 'credits') return m.creditsRemaining > 0;
    return false;
  }

  function membershipDisplayStatus(m){
    if(m.status === 'active' && !isMembershipActive(m)) return 'expiree';
    return m.status;
  }

  // Prix membre automatique (14 sept 2026) : quiconque a un abonnement illimité actif
  // (BJJ, Yoga, Muay Thai, All Unlimited — peu importe la catégorie) devient "membre" pour la
  // durée de cet abonnement et obtient le prix réduit sur les drop-in/pass qui en offrent un
  // (plan.memberPrice). Les cartes de crédits ("pass") ne rendent PAS membre.
  function hasActiveAbonnement(email, profileId){
    const e = (email||'').toLowerCase().trim();
    if(!e) return false;
    return state.data.memberships.some(m =>
      m.studentEmail && m.studentEmail.toLowerCase()===e &&
      (m.profileId||null) === (profileId||null) &&
      m.type === 'illimite' && isMembershipActive(m)
    );
  }

  function buyerQualifiesForMemberPrice(plan, email, profileId){
    if(!plan || !plan.memberPrice) return false;
    if(plan.familyMemberCheck){
      // Ex. "1 Enfant + 1 Parent" : doit être réservé à partir du compte du parent membre
      // OU de l'enfant membre (l'un ou l'autre suffit).
      return hasActiveAbonnement(email, null) || (!!profileId && hasActiveAbonnement(email, profileId));
    }
    return hasActiveAbonnement(email, profileId || null);
  }

  function priceForPurchase(plan, email, profileId){
    if(!plan) return '';
    return buyerQualifiesForMemberPrice(plan, email, profileId) ? plan.memberPrice : plan.price;
  }

  function membershipBadge(m){
    const ds = membershipDisplayStatus(m);
    const map = {
      attente_paiement: ['badge-pending','Paiement à faire'],
      paiement_declare: ['badge-declared','Paiement déclaré'],
      active: ['badge-confirmed','Actif'],
      expiree: ['badge-cancelled','Expiré'],
      annulee: ['badge-cancelled','Annulé'],
    };
    const [cls,label] = map[ds] || ['badge-pending', ds];
    return `<span class="badge ${cls}">${label}</span>`;
  }

  function membershipDetail(m){
    if(m.type === 'illimite') return 'jusqu\u2019au ' + m.endDate;
    if(m.type === 'credits') return m.creditsRemaining + ' cours restant(s)';
    return '';
  }

  function activeMembershipsForEmail(email, category, profileId){
    const e = email.toLowerCase();
    const pid = profileId || null;
    const mine = state.data.memberships.filter(m => m.studentEmail.toLowerCase()===e && (m.profileId||null)===pid);
    return mine.filter(m => isMembershipActive(m) && (!category || (m.categories||[]).includes(category)));
  }
  function activeMembershipForEmail(email, category, profileId){
    return activeMembershipsForEmail(email, category, profileId)[0] || null;
  }

  // Refunds a drop-in credit when a confirmed (non-waitlist, non-free) booking is cancelled.
  function refundCreditIfNeeded(b){
    if(!b || b.status !== 'confirmee') return;
    const c = state.data.classes.find(cl=>cl.id===b.classId);
    if(!c || c.free) return;
    // Si on sait quel abonnement a servi à réserver (cas normal depuis le 11 sept, utile
    // quand l'élève a plusieurs abonnements actifs), on rembourse celui-là précisément.
    const m = b.membershipId
      ? state.data.memberships.find(mm=>mm.id===b.membershipId)
      : activeMembershipForEmail(b.studentEmail, c.category, b.profileId);
    if(m && m.type==='credits'){
      m.creditsRemaining = (m.creditsRemaining||0) + 1;
    }
  }

  // Vrai si ce profil (enfant ou adulte via profileId) a déjà eu un abonnement ou une
  // réservation — sert à détecter la toute première réservation d'un enfant, pour
  // afficher l'avertissement "avez-vous contacté le club ?" avant le paiement.
  function childHasPriorActivity(email, profileId){
    const e = (email||'').toLowerCase();
    const pid = profileId || null;
    const hasMembership = state.data.memberships.some(m=>m.studentEmail.toLowerCase()===e && (m.profileId||null)===pid);
    if(hasMembership) return true;
    const hasBooking = state.data.bookings.some(b=>b.studentEmail.toLowerCase()===e && (b.profileId||null)===pid);
    return hasBooking;
  }

  function pendingMembershipForEmail(email){
    const e = email.toLowerCase();
    return state.data.memberships.find(m => m.studentEmail.toLowerCase()===e && (m.status==='attente_paiement' || m.status==='paiement_declare')) || null;
  }

  // NOUVEAU (S47) : customPrice permet à une gestionnaire d'offrir un abonnement à un
  // montant négocié différent du prix affiché de la formule (ex. rabais ponctuel), via la
  // fenêtre "Offrir un abonnement". undefined/null = comportement inchangé (prix normal de
  // la formule, ou prix membre s'il y a lieu).
  function activatePlanForStudent(plan, name, email, free, profileId, customPrice){
    const m = {
      id: uid(),
      planId: plan.id,
      planName: plan.name,
      categories: (plan.categories||[]).slice(),
      studentName: name,
      studentEmail: email,
      profileId: profileId||null,
      type: plan.type,
      status: free ? 'active' : 'attente_paiement',
      grantedFree: !!free,
      // Fige le prix réel au moment de l'achat (prix membre appliqué automatiquement s'il y a
      // lieu) — koss-init-payment charge exactement ce montant, jamais plan.price directement.
      planPrice: free ? null : (customPrice != null ? customPrice : priceForPurchase(plan, email, profileId)),
      createdAt: Date.now()
    };
    if(plan.type === 'illimite'){
      m.creditsRemaining = null;
      if(free){
        const start = new Date();
        const end = new Date(start); end.setDate(end.getDate() + plan.durationDays);
        m.startDate = isoDate(start);
        m.endDate = isoDate(end);
      }
    } else {
      m.creditsRemaining = free ? plan.creditsCount : 0;
    }
    state.data.memberships.push(m);
    return m;
  }

  function resizeImageFile(file, maxSize, maxBytes, opts){
    opts = opts || {};
    // Demandé par Amélie (S41) : pour un autocollant fourni en PNG, garder le fond
    // transparent plutôt que de le convertir en JPEG (qui compose sur du noir/blanc).
    // On ne le fait QUE si l'appelant le demande explicitement (opts.keepTransparency)
    // ET que le fichier source est bien un PNG — sinon comportement JPEG inchangé
    // (photos de post-it, captures d'écran de bug, etc., où la transparence n'a pas
    // d'importance et où JPEG donne un fichier bien plus léger).
    const keepPng = !!opts.keepTransparency && /image\/png/i.test(file.type||'');
    maxBytes = maxBytes || 220000; // ~ dataURL char length ceiling, keeps saved data small enough to persist reliably
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=>reject(new Error('read failed'));
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = ()=>reject(new Error('decode failed'));
        img.onload = ()=>{
          if(keepPng){
            // Un PNG n'a pas de curseur de "qualité" comme le JPEG — seule la réduction
            // de taille permet de faire baisser le poids si besoin.
            const pngMaxBytes = Math.max(maxBytes, 350000);
            const sizes = [maxSize, Math.round(maxSize*0.75), Math.round(maxSize*0.6), Math.round(maxSize*0.45), Math.round(maxSize*0.32)];
            let result = null;
            for(const size of sizes){
              let w = img.width, h = img.height;
              if(w > h){ if(w > size){ h = Math.round(h*size/w); w = size; } }
              else { if(h > size){ w = Math.round(w*size/h); h = size; } }
              const canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h); // canvas neuf = déjà transparent, pas de fond à effacer
              const dataUrl = canvas.toDataURL('image/png');
              result = dataUrl;
              if(dataUrl.length <= pngMaxBytes) break;
            }
            if(result && result.length <= pngMaxBytes*1.8) resolve(result);
            else reject(new Error('image too large after compression'));
            return;
          }
          const attempts = [
            {size:maxSize, q:0.82},
            {size:maxSize, q:0.6},
            {size:maxSize, q:0.4},
            {size:Math.round(maxSize*0.65), q:0.5},
            {size:Math.round(maxSize*0.5), q:0.4},
            {size:Math.round(maxSize*0.4), q:0.35},
          ];
          let result = null;
          for(const att of attempts){
            let w = img.width, h = img.height;
            if(w > h){ if(w > att.size){ h = Math.round(h*att.size/w); w = att.size; } }
            else { if(h > att.size){ w = Math.round(w*att.size/h); h = att.size; } }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', att.q);
            result = dataUrl;
            if(dataUrl.length <= maxBytes) break;
          }
          if(result && result.length <= maxBytes*1.4) resolve(result);
          else reject(new Error('image too large after compression'));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function hashPassword(pw){
    const enc = new TextEncoder().encode(String(pw||''));
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  function findAccountByQuery(query){
    const raw = String(query||'').trim();
    if(!raw) return null;
    let acct = state.data.studentAccounts.find(a=>a.email.toLowerCase()===raw.toLowerCase());
    if(acct) return acct;
    const qDigits = raw.replace(/\D/g,'');
    if(qDigits.length >= 7){
      acct = state.data.studentAccounts.find(a=>a.phone && a.phone.replace(/\D/g,'')===qDigits);
      if(acct) return acct;
    }
    const qNorm = normalizeStr(raw);
    acct = state.data.studentAccounts.find(a=>normalizeStr(a.name).includes(qNorm));
    return acct || null;
  }

    {key:'contrastes', label:'Contrastes', colors:['#F2C6A0','#3D1D5C','#A8D8C4','#5C1D1D','#F2E6A0','#1D3D5C','#D9A0C6','#1D5C2E','#A0C6F2','#5C3D1D']},
  ];
  function textnotePaletteColors(key){
    const p = TEXTNOTE_PALETTES.find(p=>p.key===key);

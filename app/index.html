  // ---------- event handling ----------
  function attachHandlers(scope){
    const root = scope || document.getElementById('app');
    root.querySelectorAll('[data-action]').forEach(node=>{
      // Filet de sécurité : si onAction (ou un render() qu'il déclenche) lève une erreur
      // inattendue, on l'affiche/loggue au lieu de laisser l'app silencieusement figée
      // (plus rien ne réagit aux clics) sans que personne ne sache pourquoi.
      node.addEventListener('click', (e)=>{
        Promise.resolve(onAction(e)).catch(err=>{
          console.error('Erreur dans onAction:', err);
          showToast('Une erreur est survenue. Rafraîchissez la page si l’app ne répond plus.');
        });
      });
    });
  }

  function attachNotebookDrag(){
    const canvas = document.getElementById('nb-canvas');
    if(!canvas) return;
    if(!state.notebookEditMode) return;
    let dragEl = null, dragId = null, startX = 0, startY = 0, startLeft = 0, startTop = 0, moved = false;

    function onMove(ev){
      if(!dragEl) return;
      const point = ev.touches ? ev.touches[0] : ev;
      const dxPx = point.clientX - startX;
      const dyPx = point.clientY - startY;
      if(Math.abs(dxPx) > 3 || Math.abs(dyPx) > 3) moved = true;
      const rect = canvas.getBoundingClientRect();
      const dxPct = (dxPx / rect.width) * 100;
      const dyPct = (dyPx / rect.height) * 100;
      let newLeft = startLeft + dxPct;
      let newTop = startTop + dyPct;
      newLeft = Math.max(0, Math.min(85, newLeft));
      newTop = Math.max(0, Math.min(88, newTop));
      dragEl.style.left = newLeft + '%';
      dragEl.style.top = newTop + '%';
    }
    async function onUp(){
      if(!dragEl) return;
      const el = dragEl, wasMoved = moved;
      dragEl.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      dragEl = null;
      if(wasMoved){
        const entry = state.data.notebookEntries.find(n=>n.id===dragId);
        if(entry){
          entry.x = parseFloat(el.style.left);
          entry.y = parseFloat(el.style.top);
          await persist();
        }
      } else if(el.classList.contains('textnote-free') || el.classList.contains('sticker-free')){
        state.notebookSelectedEntry = state.notebookSelectedEntry === dragId ? null : dragId;
        render();
      }
    }
    canvas.addEventListener('mousedown', (ev)=>{
      if(ev.target === canvas && state.notebookSelectedEntry){ state.notebookSelectedEntry = null; render(); }
    });
    canvas.querySelectorAll('.postit-free, .textnote-free, .sticker-free').forEach(node=>{
      const startDrag = (ev)=>{
        if(ev.target.closest('button')) return;
        const point = ev.touches ? ev.touches[0] : ev;
        dragEl = node;
        dragId = node.dataset.id;
        moved = false;
        startX = point.clientX;
        startY = point.clientY;
        startLeft = parseFloat(node.style.left) || 0;
        startTop = parseFloat(node.style.top) || 0;
        node.classList.add('dragging');
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        document.addEventListener('touchmove', onMove, {passive:false});
        document.addEventListener('touchend', onUp);
        ev.preventDefault();
      };
      node.addEventListener('mousedown', startDrag);
      node.addEventListener('touchstart', startDrag, {passive:false});
    });
  }

  function attachFreeHandles(){
    const canvas = document.getElementById('nb-canvas');
    if(!canvas) return;

    canvas.querySelectorAll('.rotate-handle').forEach(handle=>{
      const wrap = handle.closest('.textnote-free, .sticker-free');
      if(!wrap) return;
      const id = handle.dataset.id;
      const start = (ev)=>{
        ev.preventDefault(); ev.stopPropagation();
        const point = ev.touches ? ev.touches[0] : ev;
        const rect = wrap.getBoundingClientRect();
        const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
        const entry = state.data.notebookEntries.find(n=>n.id===id);
        const startRotation = (entry && entry.rotation) || 0;
        const startAngle = Math.atan2(point.clientY-cy, point.clientX-cx) * 180/Math.PI;
        let pendingRotation = startRotation;
        function onMove(mv){
          const p = mv.touches ? mv.touches[0] : mv;
          const angle = Math.atan2(p.clientY-cy, p.clientX-cx) * 180/Math.PI;
          pendingRotation = Math.round(startRotation + (angle-startAngle));
          wrap.style.transform = `rotate(${pendingRotation}deg)`;
        }
        async function onEnd(){
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onEnd);
          document.removeEventListener('touchmove', onMove);
          document.removeEventListener('touchend', onEnd);
          if(entry){
            entry.rotation = pendingRotation;
            await persist();
          }
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, {passive:false});
        document.addEventListener('touchend', onEnd);
      };
      handle.addEventListener('mousedown', start);
      handle.addEventListener('touchstart', start, {passive:false});
    });

    canvas.querySelectorAll('.resize-handle').forEach(handle=>{
      const wrap = handle.closest('.textnote-free, .sticker-free');
      if(!wrap) return;
      const id = handle.dataset.id;
      const isSticker = wrap.classList.contains('sticker-free');
      const start = (ev)=>{
        ev.preventDefault(); ev.stopPropagation();
        const point = ev.touches ? ev.touches[0] : ev;
        const rect = wrap.getBoundingClientRect();
        const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
        const startDist = Math.max(20, Math.hypot(point.clientX-cx, point.clientY-cy));
        const entry = state.data.notebookEntries.find(n=>n.id===id);
        const startSize = isSticker ? (entry.size||60) : (entry.fontSize||16);
        const minSize = isSticker ? 24 : 10;
        const maxSize = isSticker ? 240 : 60;
        let pendingSize = startSize;
        function onMove(mv){
          const p = mv.touches ? mv.touches[0] : mv;
          const dist = Math.max(20, Math.hypot(p.clientX-cx, p.clientY-cy));
          const scale = dist/startDist;
          pendingSize = Math.round(Math.max(minSize, Math.min(maxSize, startSize*scale)));
          if(isSticker){
            wrap.style.width = pendingSize+'px';
            const img = wrap.querySelector('img'); if(img) img.style.width = pendingSize+'px';
          } else {
            wrap.style.fontSize = pendingSize+'px';
          }
        }
        async function onEnd(){
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onEnd);
          document.removeEventListener('touchmove', onMove);
          document.removeEventListener('touchend', onEnd);
          if(entry){
            if(isSticker) entry.size = pendingSize; else entry.fontSize = pendingSize;
            await persist();
          }
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, {passive:false});
        document.addEventListener('touchend', onEnd);
      };
      handle.addEventListener('mousedown', start);
      handle.addEventListener('touchstart', start, {passive:false});
    });
  }

  function attachCoverLogoDrag(){

      let newTop = Math.max(0, Math.min(88, startTop + dyPct));

    async function onUp(){

      startLeft = parseFloat(wrap.style.left) || 0;

      wrap.classList.add('dragging');
      document.addEventListener('mousemove', onMove);

      document.addEventListener('touchmove', onMove, {passive:false});
      document.addEventListener('touchend', onUp);
      ev.preventDefault();
    };
    wrap.addEventListener('mousedown', startDrag);
    wrap.addEventListener('touchstart', startDrag, {passive:false});
  }

  async function onAction(e){
    if(e.currentTarget.tagName === 'A') e.preventDefault();
    const action = e.currentTarget.dataset.action;
    const id = e.currentTarget.dataset.id;

    if(action==='goto-student'){ state.view='student'; render(); }
    else if(action==='toggle-password'){
      const targetId = e.currentTarget.dataset.target;
      const input = document.getElementById(targetId);
      if(input){
        if(input.type === 'password'){
          input.type = 'text';
          e.currentTarget.textContent = 'Masquer';
        } else {
          input.type = 'password';
          e.currentTarget.textContent = 'Afficher';
        }
      }
    }
    else if(action==='goto-account'){ state.view='account'; state.accountMenuOpen=false; render(); }
    else if(action==='toggle-account-menu'){ state.accountMenuOpen = !state.accountMenuOpen; render(); }
    else if(action==='goto-admin'){ state.view = state.adminUnlocked ? 'admin' : 'admin-login'; render(); }
    else if(action==='goto-attendance'){ state.view = 'attendance'; render(); }
    else if(action==='open-notebook-cover'){ state.notebookOpened = true; render(); }
    else if(action==='close-notebook-cover'){ state.notebookOpened = false; state.notebookEditMode = false; state.notebookSelectedEntry = null; render(); }

          planName: planName || 'Abonnement importé',
          categories,
          studentName: name,
          studentEmail: email,
          type,
          status: 'active',
          grantedFree: false,
          imported: true,
          createdAt: Date.now()
        };

          mem.endDate = value || todayIso();
        } else {
          mem.creditsRemaining = parseInt(value,10) || 0;

        created++;

    }
    else if(action==='delete-family-member'){
      const acct = findStudentAccount(state.studentSession.email);
      acct.familyMembers = (acct.familyMembers||[]).filter(f=>f.id!==id);
      await persist();
      render();
      showToast('Membre retiré.');
    }
    else if(action==='remove-photo'){
      const acct = findStudentAccount(state.studentSession.email);
      if(acct) acct.photo = '';
      await persist();
      render();
      showToast('Photo retirée.');
    }
    else if(action==='save-cropped-photo'){
      if(!cropState){ showToast('Aucune image à enregistrer.'); return; }
      const srcSize = 260;
      const outSize = 200;
      const ratio = outSize/srcSize;
      const outCanvas = document.createElement('canvas');
      outCanvas.width = outSize; outCanvas.height = outSize;
      const octx = outCanvas.getContext('2d');
      const w = cropState.img.width * cropState.scale * ratio;
      const h = cropState.img.height * cropState.scale * ratio;
      const x = outSize/2 - w/2 + cropState.offsetX*ratio;
      const y = outSize/2 - h/2 + cropState.offsetY*ratio;
      octx.drawImage(cropState.img, x, y, w, h);
      const dataUrl = outCanvas.toDataURL('image/jpeg', 0.85);
      const acct = state.studentSession ? findStudentAccount(state.studentSession.email) : null;
      if(acct){
        acct.photo = dataUrl;
        await persist();
      }
      cropState = null;
      state.modal = null; closeModalDom();
      render();
      showToast('Photo mise à jour.');
    }
    else if(action==='self-cancel'){
      const b = state.data.bookings.find(bk=>bk.id===id);
      if(b){
        refundCreditIfNeeded(b);
        b.status='annulee';
        promoteWaitlistIfRoom(b.classId,b.dateIso);
      }
      await persist();
      render();
      showToast('Réservation annulée.');
    }
  }

  let resizeRenderTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeRenderTimer);
    resizeRenderTimer = setTimeout(()=>{
      if(state.view==='student' || state.view==='attendance') render();
    }, 200);
  });

  // --- Écran de connexion (accès privé, via Supabase Auth) ---
  function showLoginGate(){
    return new Promise((resolve)=>{
      const overlay = document.createElement('div');
      overlay.id = 'auth-gate';
      overlay.style.cssText = 'position:fixed;inset:0;background:#28292E;color:#FFFBF8;display:flex;align-items:center;justify-content:center;z-index:9999;font-family:"Work Sans",sans-serif;padding:16px;';
      overlay.innerHTML =
        '<form id="auth-gate-form" style="background:#35363C;border:1px solid #4A4B52;border-radius:12px;padding:28px;max-width:320px;width:100%;box-sizing:border-box;">' +
          '<h2 style="font-family:\'Oswald\',sans-serif;margin:0 0 18px;font-size:20px;color:#FFFBF8;">K-OSS — Accès privé</h2>' +
          '<label style="display:block;font-size:12px;color:#AEB8AC;margin-bottom:4px;">Courriel</label>' +
          '<input id="auth-gate-email" type="email" autocomplete="username" required style="width:100%;background:#28292E;border:1px solid #4A4B52;color:#FFFBF8;padding:8px 10px;border-radius:6px;margin-bottom:12px;box-sizing:border-box;font-size:14px;">' +
          '<label style="display:block;font-size:12px;color:#AEB8AC;margin-bottom:4px;">Mot de passe</label>' +
          '<input id="auth-gate-password" type="password" autocomplete="current-password" required style="width:100%;background:#28292E;border:1px solid #4A4B52;color:#FFFBF8;padding:8px 10px;border-radius:6px;margin-bottom:16px;box-sizing:border-box;font-size:14px;">' +
          '<div id="auth-gate-error" style="color:#E2725B;font-size:12px;margin-bottom:10px;display:none;"></div>' +
          '<button type="submit" style="width:100%;background:#E9E6D5;color:#28292E;border:none;padding:10px;border-radius:7px;font-family:\'Oswald\',sans-serif;font-size:14px;cursor:pointer;">Entrer</button>' +
        '</form>';
      document.body.appendChild(overlay);
      const form = overlay.querySelector('#auth-gate-form');
      const errEl = overlay.querySelector('#auth-gate-error');
      form.addEventListener('submit', async (e)=>{
        e.preventDefault();
        errEl.style.display = 'none';
        const email = overlay.querySelector('#auth-gate-email').value.trim();
        const password = overlay.querySelector('#auth-gate-password').value;
        const btn = form.querySelector('button');
        btn.disabled = true; btn.textContent = 'Connexion...';
        try{
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if(error){
            errEl.textContent = 'Courriel ou mot de passe incorrect.';
            errEl.style.display = 'block';
            btn.disabled = false; btn.textContent = 'Entrer';
            return;
          }
          overlay.remove();
          resolve();
        }catch(err){
          errEl.textContent = 'Erreur de connexion, réessaie.';
          errEl.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Entrer';
        }
      });
    });
  }

  async function boot(){
    if(!sb){
      // Cas de secours (ex: script Supabase bloqué) : on ne bloque pas complètement,
      // mais rien ne sera partagé/sauvegardé correctement sans connexion Supabase.
      loadData();
      return;
    }
    const { data: { session } } = await sb.auth.getSession();
    if(!session){
      await showLoginGate();
    }
    loadData();
  }

  boot();
})();
</script>

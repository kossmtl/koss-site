    else if(action==='confirm-reset-code'){
      const email = e.currentTarget.dataset.email;
      const code = document.getElementById('rp-code').value.trim();
      const newPw = document.getElementById('rp-new-password').value;
      if(!code || code.length !== 6){ markInvalid('rp-code'); showToast('Entrez le code à 6 chiffres reçu par courriel.'); return; }
      if(!newPw || newPw.length < 4){ markInvalid('rp-new-password'); showToast('Choisissez un mot de passe (4 caractères minimum).'); return; }
      const btn = e.currentTarget;
      const originalLabel = btn.textContent;
      btn.disabled = true; btn.textContent = 'Vérification…';
      try{
        const resp = await sb.functions.invoke('koss-verify-reset-code', {body:{email, code, newPassword:newPw}});
        if(resp.error || !resp.data || !resp.data.ok){
          const reason = resp.data && resp.data.error;
          showToast(reason==='invalid_code' ? 'Code invalide ou expiré.' : "Échec de la réinitialisation. Réessayez.");
          btn.disabled = false; btn.textContent = originalLabel;
          return;
        }
        state.modal = null; closeModalDom();
        await loadData();
        showToast('Mot de passe réinitialisé — vous pouvez vous connecter.');
      }catch(err){
        console.error('Échec vérification code de réinitialisation:', err);
        showToast("Échec de la réinitialisation. Réessayez.");
        btn.disabled = false; btn.textContent = originalLabel;
      }
    }
    else if(action==='confirm-signup-code-submit'){
      const payload = state.modal.payload || {};
      const code = (document.getElementById('signup-code').value || '').trim();
      if(!code || code.length !== 6){ markInvalid('signup-code'); showToast('Entrez le code à 6 chiffres reçu par courriel.'); return; }
      const btn = e.currentTarget;
      const originalLabel = btn.textContent;
      btn.disabled = true; btn.textContent = 'Vérification…';
      try{
        const resp = await sb.functions.invoke('koss-verify-signup-code', {body:{email:payload.email, code}});
        if(resp.error || !resp.data || !resp.data.ok){
          const reason = resp.data && resp.data.error;
          showToast(reason==='invalid_code' ? 'Code invalide ou expiré.' : "Échec de la vérification. Réessayez.");
          btn.disabled = false; btn.textContent = originalLabel;
          return;
        }
      }catch(err){
        console.error('Échec vérification code d’inscription:', err);
        showToast("Échec de la vérification. Réessayez.");
        btn.disabled = false; btn.textContent = originalLabel;
        return;
      }
      await loadData();
      state.studentSession = {email: payload.email};
      await saveSessionToStorage(payload.email);
      try{ await storageBackend.set('my_profile', JSON.stringify({name:payload.name, email:payload.email}), false); }catch(err){}
      const onVerified = payload.onVerified;
      state.modal = null; closeModalDom();
      render();
      showToast('Compte vérifié — bienvenue !');
      if(onVerified){ await onVerified(); }
    }
    else if(action==='open-sales-report'){
      const prev = (state.modal && state.modal.type==='sales-report') ? state.modal.payload : null;
      state.modal = {type:'sales-report', payload:{category:prev&&prev.category||'', from:prev&&prev.from||'', to:prev&&prev.to||todayIso()}};
      render();
    }
    else if(action==='run-sales-report'){
      const category = document.getElementById('sr-category').value;
      const from = document.getElementById('sr-from').value || '0000-01-01';
      const to = document.getElementById('sr-to').value || '9999-12-31';
      const sold = state.data.memberships.filter(m=> m.status!=='attente_paiement' && m.status!=='annulee');
      const inRange = sold.filter(m=>{
        const d = isoDate(new Date(m.createdAt));
        return d>=from && d<=to;
      });
      const filtered = category ? inRange.filter(m=>(m.categories||[]).includes(category)) : inRange;
      const rows = filtered.map(m=>{
        const plan = state.data.membershipPlans.find(p=>p.id===m.planId);
        const amountStr = m.planPrice || (plan?plan.price:'') || '';
        const amount = parsePriceAmount(amountStr);
        const cats = m.categories||[];
        return {
          studentName: m.studentName, email: m.studentEmail, profileId: m.profileId||null,
          category: cats.length>1 ? 'Plusieurs' : (cats[0]?categoryLabel(cats[0]):'—'),
          _categoryKey: cats.length===1 ? cats[0] : (cats.length>1 ? 'ALL_UNLIMITED' : ''),
          planName: m.planName, amountDisplay: amountStr||'—', amount,
          purchaseDate: isoDate(new Date(m.createdAt)), startDate: m.startDate||'', endDate: m.endDate||''
        };
      });
      const totalsMap = new Map();
      rows.forEach(r=>{
        const key = r._categoryKey || 'none';
        if(!totalsMap.has(key)) totalsMap.set(key, {label: r.category, count:0, amount:0});
        const t = totalsMap.get(key);
        t.count++; t.amount += r.amount;
      });
      const totals = Array.from(totalsMap.values());
      state.modal = {type:'sales-report', payload:{category, from:document.getElementById('sr-from').value, to:document.getElementById('sr-to').value, results:{rows, totals}}};
      render();
    }
    else if(action==='download-sales-report-csv'){
      const {rows} = state.modal.payload.results;
      downloadCsv(`rapport-ventes-${todayIso()}.csv`,
        ['studentName','category','planName','amountDisplay','purchaseDate','startDate','endDate'],
        {studentName:'Étudiant', category:'Catégorie', planName:'Formule', amountDisplay:'Montant payé', purchaseDate:'Date d’achat', startDate:'Date de début', endDate:'Date de fin'},
        rows);
    }
    else if(action==='open-intro-report'){
      const prev = (state.modal && state.modal.type==='intro-report') ? state.modal.payload : null;
      state.modal = {type:'intro-report', payload:{months:prev&&prev.months||'3'}};
      render();
    }
    else if(action==='run-intro-report'){
      const months = document.getElementById('ir-months').value;
      const cutoff = new Date(); cutoff.setMonth(cutoff.getMonth() - parseInt(months,10));
      const cutoffIso = isoDate(cutoff);
      const today = todayIso();
      const introMemberships = state.data.memberships.filter(m=>{
        const plan = state.data.membershipPlans.find(p=>p.id===m.planId);
        if(!plan || !plan.isIntroProgram) return false;
        if(m.status==='attente_paiement' || m.status==='annulee') return false;
        return isoDate(new Date(m.createdAt)) >= cutoffIso;
      });
      const rows = introMemberships.map(m=>{
        const pid = m.profileId || null;
        const next = state.data.memberships
          .filter(m2=> m2.id!==m.id && m2.studentEmail.toLowerCase()===m.studentEmail.toLowerCase() && (m2.profileId||null)===pid
            && m2.createdAt > m.createdAt && m2.status!=='attente_paiement' && m2.status!=='annulee'
            && !((state.data.membershipPlans.find(p=>p.id===m2.planId)||{}).isIntroProgram))
          .sort((a,b)=>a.createdAt-b.createdAt)[0];
        const introDateIso = isoDate(new Date(m.createdAt));
        const relevantBookings = state.data.bookings.filter(b=>
          b.studentEmail.toLowerCase()===m.studentEmail.toLowerCase() && (b.profileId||null)===pid
          && b.status==='confirmee' && b.dateIso >= introDateIso && b.dateIso <= today
        );
        const byClass = new Map();
        relevantBookings.forEach(b=>{ byClass.set(b.classId, (byClass.get(b.classId)||0)+1); });
        let topClass = '', topCount = 0;
        byClass.forEach((count, classId)=>{
          if(count>topCount){ topCount = count; const c = state.data.classes.find(cl=>cl.id===classId); topClass = c?c.name:''; }
        });
        return {
          studentName: m.studentName, email: m.studentEmail, profileId: pid, introDate: introDateIso,
          nextPlanName: next ? next.planName : '', visitCount: relevantBookings.length, topClass
        };
      });
      state.modal = {type:'intro-report', payload:{months, results:rows}};
      render();
    }
    else if(action==='download-intro-report-csv'){
      const rows = state.modal.payload.results;
      downloadCsv(`rapport-conversions-intro-${todayIso()}.csv`,
        ['studentName','email','introDate','nextPlanName','visitCount','topClass'],
        {studentName:'Étudiant', email:'Courriel', introDate:'Date intro', nextPlanName:'Abonnement suivant', visitCount:'Nb présences', topClass:'Cours le plus visité'},
        rows);
    }
    else if(action==='open-noshow-report'){
      const prev = (state.modal && state.modal.type==='noshow-report') ? state.modal.payload : null;
      state.modal = {type:'noshow-report', payload:{minDays:prev&&prev.minDays||30}};
      render();
    }
    else if(action==='run-noshow-report'){
      const minDays = parseInt(document.getElementById('ns-mindays').value,10) || 0;
      const today = todayIso();
      const todayDate = new Date(today+'T00:00:00');
      const profiles = [];
      state.data.studentAccounts.forEach(acct=>{
        profiles.push({email:acct.email, profileId:null, name:acct.name});
        (acct.familyMembers||[]).forEach(f=> profiles.push({email:acct.email, profileId:f.id, name:f.name}));
      });
      const rows = [];
      profiles.forEach(pr=>{
        const hasMembership = state.data.memberships.some(m=>m.studentEmail.toLowerCase()===pr.email.toLowerCase() && (m.profileId||null)===pr.profileId);
        const bookings = state.data.bookings.filter(b=>b.studentEmail.toLowerCase()===pr.email.toLowerCase() && (b.profileId||null)===pr.profileId && b.status==='confirmee' && b.dateIso<=today);
        if(!hasMembership && !bookings.length) return;
        const visitDates = bookings.map(b=>b.dateIso).sort();
        const lastVisit = visitDates[visitDates.length-1] || null;
        let daysSince = null;
        if(lastVisit){
          const d = new Date(lastVisit+'T00:00:00');
          daysSince = Math.round((todayDate - d) / 86400000);
        }
        if(daysSince===null || daysSince>=minDays){
          rows.push({studentName:pr.name, email:pr.email, profileId:pr.profileId||null, lastVisit, daysSince});
        }
      });
      rows.sort((a,b)=>{
        if(a.daysSince===null && b.daysSince===null) return 0;
        if(a.daysSince===null) return -1;
        if(b.daysSince===null) return 1;
        return b.daysSince - a.daysSince;
      });
      state.modal = {type:'noshow-report', payload:{minDays, results:rows}};
      render();
    }
    else if(action==='download-noshow-report-csv'){
      const rows = state.modal.payload.results;
      downloadCsv(`rapport-presence-${todayIso()}.csv`,
        ['studentName','email','lastVisit','daysSince'],
        {studentName:'Étudiant', email:'Courriel', lastVisit:'Dernière visite', daysSince:'Jours absent'},
        rows.map(r=>({...r, lastVisit:r.lastVisit||'Jamais venu', daysSince: r.daysSince==null?'':r.daysSince})));

    else if(action==='new-category'){ state.modal = {type:'category-form', payload:null}; render(); }

      if(!state.data.customCategories) state.data.customCategories = [];
      state.data.customCategories.push({key, label});

    else if(action==='edit-class'){
      const c = state.data.classes.find(cl=>cl.id===id);
      state.modal = {type:'class-form', payload:c};
      render();
    }
    else if(action==='delete-class'){
      state.data.classes = state.data.classes.filter(c=>c.id!==id);
      await persist();
      render();
    }
    else if(action==='save-class'){
      const name = document.getElementById('f-name').value.trim();
      const dayOfWeek = parseInt(document.getElementById('f-day').value,10);
      const time = document.getElementById('f-time').value || '00:00';
      const category = document.getElementById('f-category').value;
      const capacity = Math.max(1, parseInt(document.getElementById('f-capacity').value,10) || 1);
      const price = document.getElementById('f-price').value.trim();
      const free = document.getElementById('f-free').checked;
      const description = document.getElementById('f-description').value.trim();
      const startDate = document.getElementById('f-start-date').value || null;
      const endDate = document.getElementById('f-end-date').value || null;
      const durationMinutes = Math.max(1, parseInt(document.getElementById('f-duration').value,10) || 60);
      if(!name){ showToast('Le nom du cours est requis.'); return; }
      if(id){
        const c = state.data.classes.find(cl=>cl.id===id);
        Object.assign(c, {name,dayOfWeek,time,category,capacity,price,free,description,startDate,endDate,durationMinutes});
      } else {
        state.data.classes.push({id:uid(),name,dayOfWeek,time,category,capacity,price,free,description,startDate,endDate,durationMinutes});

                confirmedByHelcim = true;
                showToast('Abonnement activé !');

              console.error('Échec confirmation paiement:', confirmErr);
              showToast('Paiement reçu ! Le studio confirmera votre abonnement sous peu.');

            await loadData();
            // Marque ce paiement comme réellement passé par Helcim (pour le distinguer d'un

      if(!checked.length){ showToast('Choisissez au moins une colonne.'); return; }
      const planFilterId = document.getElementById('report-plan-filter').value;
      const today = todayIso();
      // Un compte parent peut avoir des enfants (familyMembers) : on génère une ligne pour
      // le parent ET une ligne par enfant, chacune avec ses propres statistiques (filtrées
      // par profileId), pour que les enfants apparaissent dans le rapport eux aussi.
      const computeReportRow = (email, profileId, displayName, birthday, createdAt, firstNameOverride, lastNameOverride)=>{
        const pid = profileId || null;
        const pastConfirmed = state.data.bookings.filter(b=>b.studentEmail.toLowerCase()===email.toLowerCase() && (b.profileId||null)===pid && b.status==='confirmee' && b.dateIso<=today);
        const cancelCount = state.data.bookings.filter(b=>b.studentEmail.toLowerCase()===email.toLowerCase() && (b.profileId||null)===pid && b.status==='annulee').length;
        const visitDates = pastConfirmed.map(b=>b.dateIso).sort();
        const memberships = state.data.memberships.filter(m2=>m2.studentEmail.toLowerCase()===email.toLowerCase() && (m2.profileId||null)===pid);
        const activeM = memberships.filter(m2=>membershipDisplayStatus(m2)==='active');
        const pastM = memberships.filter(m2=>membershipDisplayStatus(m2)!=='active');
        const nameParts = (displayName||'').trim().split(/\s+/);
        return {
          _hasFilterPlan: activeM.some(m2=>m2.planId===planFilterId),
          name: displayName, email, profileId: pid,
          lastName: lastNameOverride || nameParts.slice(1).join(' ') || '', firstName: firstNameOverride || nameParts[0] || '',
          registeredDate: createdAt ? isoDate(new Date(createdAt)) : '',
          firstVisit: visitDates[0]||'', lastVisit: visitDates[visitDates.length-1]||'',
          visitCount: pastConfirmed.length, cancelCount: cancelCount,
          activeMemberships: activeM.map(m2=>m2.planName).join('; '),
          pastMemberships: pastM.map(m2=>m2.planName).join('; '),
          membershipType: activeM.map(m2=>m2.type).join('; '),
          birthday: birthday||''
        };
      };
      let reportRows = [];
      state.data.studentAccounts.forEach(acct=>{
        reportRows.push(computeReportRow(acct.email, null, acct.name, acct.birthday, acct.createdAt, acct.firstName, acct.lastName));
        (acct.familyMembers||[]).forEach(fm=>{
          reportRows.push(computeReportRow(acct.email, fm.id, fm.name, fm.birthday, acct.createdAt));
        });
      });
      if(planFilterId) reportRows = reportRows.filter(r=>r._hasFilterPlan);
      reportRows.forEach(r=>delete r._hasFilterPlan);
      state.modal = {type:'report-builder', payload:{results:{columns:checked, rows:reportRows}}};
      render();

        firstVisit:'Première visite', lastVisit:'Dernière visite', visitCount:'Nombre de visites',

      const noteText = document.getElementById('mark-paid-note').value.trim();

      const c = state.data.classes.find(cl=>cl.id===b.classId);
      const acct = findStudentAccount(b.studentEmail);
      const target = acct ? (b.profileId ? (acct.familyMembers||[]).find(f=>f.id===b.profileId) : acct) : null;
      const approverName = (currentManager()||{}).name || 'Gestionnaire';
      const dateStr = new Date().toLocaleDateString('fr-CA');
      const line = `[${dateStr}] Présence sans abonnement (${c?c.name:'—'} du ${b.dateIso}) ajoutée par ${b.addedByManagerName||'inconnu'}, paiement approuvé par ${approverName} : ${noteText}`;
      if(target){
        if(!target.notes) target.notes = {};
        target.notes.membership = (target.notes.membership ? target.notes.membership + '\n' : '') + line;
      }
      b.noMembership = false;

      let start = 0;
      if(rows[0][0] && normalizeStr(rows[0][0]).includes('nom')) start = 1;
      let created = 0, unmatched = 0;
      for(let r = start; r < rows.length; r++){
        const row = rows[r];
        const name = (row[0]||'').trim();
        const email = (row[1]||'').trim();
        const typeRaw = (row[2]||'').trim();
        const value = (row[3]||'').trim();
        const catsStr = (row[4]||'').trim();
        const planName = (row[5]||'').trim();
        if(!name || !email) continue;
        const type = normalizeStr(typeRaw).includes('illimit') ? 'illimite' : 'credits';
        const categories = matchCategories(catsStr);
        if(!categories.length) unmatched++;
        const mem = {
          id: uid(),
          planId: null,
          planName: planName || 'Abonnement importé',
          categories,
          studentName: name,
          studentEmail: email,
          type,
          status: 'active',
          grantedFree: false,
          imported: true,
          createdAt: Date.now()
        };
        if(type === 'illimite'){
          mem.startDate = todayIso();
          mem.endDate = value || todayIso();
        } else {
          mem.creditsRemaining = parseInt(value,10) || 0;
        }
        state.data.memberships.push(mem);
        created++;
      }
      await persist();
      state.modal = null; closeModalDom();

      const belt = document.getElementById('fm-belt').value.trim();

      const phone = document.getElementById('fm-phone').value.trim();
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      const missing = [];
      if(!firstName) missing.push('fm-firstname');
      if(!lastName) missing.push('fm-lastname');

      const acct = findStudentAccount(state.studentSession.email);
      if(!acct.familyMembers) acct.familyMembers = [];
      const dupKey = s => String(s||'').trim().toLowerCase();
      const isDuplicate = acct.familyMembers.some(f =>
        f.id !== id &&
        dupKey(f.firstName) === dupKey(firstName) &&
        dupKey(f.lastName) === dupKey(lastName) &&
        (f.birthday||'') === birthday

        showToast('Cet enfant est déjà dans votre liste.');

      const name = `${firstName} ${lastName}`.trim();
      if(id){
        const fm = acct.familyMembers.find(f=>f.id===id);
        if(fm){ fm.firstName = firstName; fm.lastName = lastName; fm.name = name; fm.birthday = birthday; fm.belt = belt; fm.email = email; fm.phone = phone; }
      } else {
        acct.familyMembers.push({id:uid(), firstName, lastName, name, birthday, belt, email, phone, createdAt:Date.now()});
      }
      await persist();
      state.modal = null; closeModalDom();
      render();
      showToast('Membre de la famille enregistré.');
    }
    else if(action==='confirm-delete-family-member'){
      const memberId = e.currentTarget.dataset.id;
      const name = e.currentTarget.dataset.name;
      state.modal = {type:'confirm-delete-family-member', payload:{memberId, name}};
      render();
    }
    else if(action==='delete-family-member'){
      const acct = findStudentAccount(state.studentSession.email);
      // On annule (plutôt que supprimer) les abonnements de cet enfant : une fois le profil
      // retiré, son profileId ne peut plus être retrouvé, donc l'abonnement ne pourrait plus
      // jamais être géré ni recréé — l'annulation le rend au moins visible comme tel côté admin.
      state.data.memberships.forEach(m=>{
        if(m.studentEmail.toLowerCase()===acct.email.toLowerCase() && m.profileId===id && m.status!=='annulee'){
          m.status = 'annulee';
        }
      });
      acct.familyMembers = (acct.familyMembers||[]).filter(f=>f.id!==id);
      await persist();
      state.modal = null; closeModalDom();
      render();
      showToast('Membre retiré, abonnement(s) annulé(s).');
    }
    else if(action==='remove-manager-photo'){
      const mgr = currentManager();
      if(mgr) mgr.photo = '';
      await persist();
      render();
      showToast('Photo retirée.');
    }
    else if(action==='remove-photo'){
      const acct = findStudentAccount(state.studentSession.email);
      if(acct) acct.photo = '';
      await persist();
      render();
      showToast('Photo retirée.');
    }
    else if(action==='save-cropped-photo'){
      if(!cropState){ showToast('Aucune image à enregistrer.'); return; }
      const srcSize = 260;
      const outSize = 200;
      const ratio = outSize/srcSize;
      const outCanvas = document.createElement('canvas');
      outCanvas.width = outSize; outCanvas.height = outSize;
      const octx = outCanvas.getContext('2d');
      const w = cropState.img.width * cropState.scale * ratio;
      const h = cropState.img.height * cropState.scale * ratio;
      const x = outSize/2 - w/2 + cropState.offsetX*ratio;
      const y = outSize/2 - h/2 + cropState.offsetY*ratio;
      octx.drawImage(cropState.img, x, y, w, h);
      const dataUrl = outCanvas.toDataURL('image/jpeg', 0.85);
      if(cropTargetManager){
        const mgr = currentManager();
        if(mgr){ mgr.photo = dataUrl; await persist(); }
      } else {
        const acct = state.studentSession ? findStudentAccount(state.studentSession.email) : null;
        if(acct){
          acct.photo = dataUrl;
          await persist();
        }
      }
      cropTargetManager = false;
      cropState = null;
      state.modal = null; closeModalDom();
      render();
      showToast('Photo mise à jour.');
    }
    else if(action==='self-cancel'){
      const b = state.data.bookings.find(bk=>bk.id===id);
      if(b){
        refundCreditIfNeeded(b);
        b.status='annulee';
        promoteWaitlistIfRoom(b.classId,b.dateIso);
      }
      await persist();
      render();
      showToast('Réservation annulée.');
    }
  }

  let resizeRenderTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeRenderTimer);
    resizeRenderTimer = setTimeout(()=>{
      if(state.view==='student' || state.view==='attendance') render();
    }, 200);
  });

  // Site public depuis le lancement des tests avec de vrais courriels : plus de
  // mot de passe unique partagé (Supabase Auth) devant tout le site. Chaque
  // visiteur passe maintenant par l'écran d'accueil membre/nouveau (renderWelcome).
  // ⚠️ Ça veut dire que les appels à Supabase se font maintenant en rôle "anon" et
  // non "authenticated" — le rôle anon doit avoir le droit d'exécuter les fonctions
  // koss_load_all/koss_sync_all/koss_reset_all (GRANT EXECUTE, voir
  // supabase/migration_multi_tables.sql), sinon rien ne se charge.
  // Ferme les menus déroulants (compte élève, compte gestionnaire, abonnement actif) quand on
  // clique en dehors — attaché une seule fois sur document (pas à chaque render, sinon les
  // listeners s'empileraient). e.target reste utilisable même détaché du DOM live après un
  // render() déclenché par le même clic : la chaîne de parenté du sous-arbre détaché est
  // préservée, donc .closest() fonctionne toujours normalement.
  document.addEventListener('click', (e)=>{
    let changed = false;
    if((state.accountMenuOpen || state.managerMenuOpen || state.headerMembershipMenuOpen) && !e.target.closest('.account-corner')){
      state.accountMenuOpen = false;
      state.managerMenuOpen = false;
      state.headerMembershipMenuOpen = false;
      changed = true;
    }
    if(state.accountMembershipMenuOpen && !e.target.closest('[data-menu-root="account-membership"]')){
      state.accountMembershipMenuOpen = false;
      changed = true;
    }
    if(changed) render();
  });

  async function boot(){
    loadData();
  }

  boot();
})();
</script>

</body></html>

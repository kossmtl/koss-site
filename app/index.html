<style>

  // JSON géante (app_state) — elles sont réparties sur plusieurs tables Supabase
  // (une par collection : koss_classes, koss_bookings, koss_student_accounts, etc.),
  // synchronisées d'un coup via 2 fonctions Postgres (koss_load_all/koss_sync_all,
  // voir supabase/migration_multi_tables.sql) qui font tout dans UNE transaction —
  // soit tout est écrit, soit rien ne l'est. Le reste de l'app ne voit AUCUNE
  // différence : state.data garde exactement la même forme qu'avant (mêmes clés,
  // mêmes tableaux) — seul l'endroit où c'est rangé côté serveur a changé.
  const supabaseBackend = {
    async get(key){
      // Distinction cruciale (héritée du correctif du bug de perte de revenu, S14) :
      // une vraie erreur (réseau, permissions, Supabase down, etc.) ne doit JAMAIS être
      // traitée comme "pas encore de données" — sinon loadData() écraserait les vraies
      // données du studio par une base vide au moindre pépin de connexion. koss_load_all()
      // renvoie NULL seulement si la ligne 'meta' n'existe vraiment pas encore (premier
      // lancement) — toute vraie erreur remonte normalement via `error`.
      const { data, error } = await sb.rpc('koss_load_all');
      if(error) throw error;
      if(data == null){ const e = new Error('not found'); e.notFound = true; throw e; }
      return { value: JSON.stringify(data) };
    },
    async set(key, value){
      const { error } = await sb.rpc('koss_sync_all', { payload: JSON.parse(value) });
      if(error) throw error;
    },
    async delete(key){
      const { error } = await sb.rpc('koss_reset_all');
      if(error) throw error;
    }
  };

  // Mélange deux couleurs hex ("#rrggbb") — pct = part de la couleur "accent"
  // dans le résultat (10 = 10%). Sert à teinter légèrement le fond de Gérer
  // avec l'accent choisi, sans changer le fond du reste du site.
  function mixHexColors(baseHex, accentHex, pct){
    const toRgb = (h)=>{ const s=h.replace('#',''); return [parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)]; };
    const base = toRgb(baseHex), accent = toRgb(accentHex);
    const t = pct/100;
    const mixed = base.map((b,i)=> Math.round(b*(1-t) + accent[i]*t));
    return '#' + mixed.map(v=>v.toString(16).padStart(2,'0')).join('');
  }

  function addMinutesToTime(time, minutes){
    const [h,m] = time.split(':').map(Number);
    let total = h*60+m+minutes;
    total = ((total % 1440)+1440)%1440;
    const hh = Math.floor(total/60).toString().padStart(2,'0');
    const mm = (total%60).toString().padStart(2,'0');
    return `${hh}:${mm}`;
  }
  function formatFullClassDateTime(dateIso, time, durationMinutes){
    const d = new Date(dateIso+'T00:00:00');
    const dayName = DAYS[(d.getDay()+6)%7];
    const dayNum = d.getDate().toString().padStart(2,'0');
    const monthName = MONTHS_FULL[d.getMonth()];
    const year = d.getFullYear();
    const endTime = addMinutesToTime(time, durationMinutes||60);
    return `${dayName} ${dayNum} ${monthName} ${year} ${time} \u00e0 ${endTime}`;
  }

  async function loadData(){
    try{
      const res = await storageBackend.get(STORAGE_KEY, true);
      state.data = JSON.parse(res.value);
      state.lastSyncedData = deepClone(state.data);
    }catch(e){
      if(e && e.notFound){
        // Vraiment aucune ligne sur le serveur : premier lancement, sécuritaire de créer une base vide.
        state.data = defaultData();
        await persist();
      } else {
        // Échec de connexion/lecture (réseau, permissions, Supabase temporairement indisponible...) :
        // NE JAMAIS écraser les données existantes sur le serveur avec une base vide dans ce cas —
        // c'est ce qui a déjà effacé le revenu Helcim par le passé. On bloque plutôt l'app avec un
        // message clair et un bouton "Réessayer" (voir render()), sans jamais appeler persist().
        console.error('Échec du chargement des données depuis Supabase :', e);
        state.loadFailed = true;
        render();
        return;
      }
    }
    if(!state.data.membershipPlans) state.data.membershipPlans = [];
    if(!state.data.memberships) state.data.memberships = [];
    if(!state.data.studentAccounts) state.data.studentAccounts = [];

  function migrateData(){
    let changed = false;
    const guessCategory = (name)=>{
      const n = name.toLowerCase();
      if(n.includes('kids')) return 'enfants';
      if(n.includes('muay')) return 'muay_thai';
      if(n.includes('yoga')) return 'yoga';
      return 'bjj_adulte';
    };
    state.data.classes.forEach(c=>{
      if(!c.category){ c.category = guessCategory(c.name); changed = true; }
      if(typeof c.free !== 'boolean'){ c.free = false; changed = true; }
    });
    state.data.membershipPlans.forEach(p=>{
      if(!Array.isArray(p.categories)){ p.categories = []; changed = true; }
    });
    state.data.memberships.forEach(m=>{
      if(!Array.isArray(m.categories)){
        const plan = state.data.membershipPlans.find(p=>p.id===m.planId);
        m.categories = plan ? plan.categories.slice() : [];
        changed = true;
      }
    });
    if(!state.data.migratedCategoriesV2){
      state.data.classes.forEach(c=>{
        if(c.name && c.name.trim().toLowerCase()==='intro au bjj'){
          c.category = 'intro_bjj';
        }
      });
      state.data.membershipPlans.forEach(p=>{
        if(p.name && p.name.indexOf('Intro to BJJ')===0){
          p.categories = ['intro_bjj'];
          p.isIntroProgram = true;

        if(p.name==='1 Enfant + 1 Parent' || p.name==='2 Enfants + 1 Parent'){
          p.categories = ['parents_enfants'];

      state.data.migratedCategoriesV2 = true;
      changed = true;

    if(!state.data.migratedIntroProgramV1){

        if(c.category==='intro_bjj'){
          c.startDate = '2026-10-05';

  // --- Fusion à 3 voies -------------------------------------------------
  // Le fichier de données est un seul gros objet partagé par tous les appareils.
  // Sans fusion, la dernière fenêtre qui sauvegarde écrase tout ce que les autres
  // ont changé entre-temps (ex : une note signalée/supprimée par l'admin réapparaît
  // parce que la fenêtre élève, qui avait encore l'ancienne copie, sauvegarde après).
  // "base" = dernière copie qu'on sait identique au serveur, "local" = nos changements,
  // "remote" = ce qui est sur le serveur maintenant (fait par d'autres fenêtres/appareils).
  function deepClone(obj){ return obj == null ? obj : JSON.parse(JSON.stringify(obj)); }

  // Certaines collections n'ont pas de champ "id" (ex: studentAccounts, identifié par
  // courriel) — keyFn permet de fusionner ces listes-là aussi élément par élément plutôt
  // que de risquer d'écraser toute la liste (ex: une nouvelle inscription qui disparaît).
  function mergeArrayById(base, local, remote, keyFn){
    base = Array.isArray(base) ? base : [];
    local = Array.isArray(local) ? local : [];
    remote = Array.isArray(remote) ? remote : [];
    const getKey = keyFn || (x=> (x && x.id!=null) ? x.id : null);
    const hasKeys = (local.length===0 || local.every(x=>x && typeof x==='object' && getKey(x)!=null))
                 && (remote.length===0 || remote.every(x=>x && typeof x==='object' && getKey(x)!=null));
    if(!hasKeys){
      // Pas de clé fiable pour fusionner élément par élément : si on a changé la liste
      // localement, on garde notre version, sinon on prend celle du serveur.
      return JSON.stringify(local) !== JSON.stringify(base) ? local : remote;
    }
    const byKey = arr => { const m = new Map(); arr.forEach(x=>{ const k=getKey(x); if(k!=null) m.set(k, x); }); return m; };
    const baseMap = byKey(base), localMap = byKey(local), remoteMap = byKey(remote);
    const order = [];
    const seen = new Set();
    remote.forEach(x=>{ const k=getKey(x); if(k!=null && !seen.has(k)){ order.push(k); seen.add(k); } });
    local.forEach(x=>{ const k=getKey(x); if(k!=null && !seen.has(k)){ order.push(k); seen.add(k); } });
    const out = [];
    order.forEach(key=>{
      const inBase = baseMap.has(key), inLocal = localMap.has(key), inRemote = remoteMap.has(key);
      if(inLocal && inRemote){
        const localVal = localMap.get(key), remoteVal = remoteMap.get(key), baseVal = baseMap.get(key);
        const localChanged = !inBase || JSON.stringify(localVal) !== JSON.stringify(baseVal);
        const remoteChanged = !inBase || JSON.stringify(remoteVal) !== JSON.stringify(baseVal);
        if(localChanged) out.push(localVal);
        else if(remoteChanged) out.push(remoteVal);
        else out.push(localVal);
      } else if(inLocal && !inRemote){
        if(inBase){ /* supprimé ailleurs entre-temps : on respecte la suppression */ }
        else out.push(localMap.get(key)); // ajout local pas encore vu par le serveur
      } else if(!inLocal && inRemote){
        if(inBase){ /* on l'a supprimé localement : on respecte notre suppression */ }
        else out.push(remoteMap.get(key)); // ajout fait ailleurs qu'on n'a pas encore
      }
    });
    return out;
  }

  const MERGE_ARRAY_KEYS = {
    studentAccounts: x => x && x.email ? x.email.toLowerCase() : null,
  };

  function mergeAppData(base, local, remote){
    base = base || {}; local = local || {}; remote = remote || {};
    const keys = new Set([...Object.keys(base), ...Object.keys(local), ...Object.keys(remote)]);
    const out = {};
    keys.forEach(key=>{
      const b = base[key], l = local[key], r = remote[key];
      if(Array.isArray(l) || Array.isArray(r) || Array.isArray(b)){
        out[key] = mergeArrayById(b, l, r, MERGE_ARRAY_KEYS[key]);
      } else if(l && typeof l === 'object' && !Array.isArray(l) && r && typeof r === 'object'){
        // objet simple (ex: config) : on part du serveur puis on repasse par-dessus
        // chaque champ qu'on a nous-même changé localement.
        const merged = Object.assign({}, r);
        Object.keys(l).forEach(k=>{
          const changedLocally = !b || JSON.stringify(l[k]) !== JSON.stringify(b[k]);
          if(changedLocally) merged[k] = l[k];
        });
        out[key] = merged;
      } else {
        const changedLocally = JSON.stringify(l) !== JSON.stringify(b);
        out[key] = changedLocally ? l : r;
      }
    });
    return out;
  }

  async function persistNow(){
    let toWrite = state.data;
    try{
      const res = await storageBackend.get(STORAGE_KEY, true);
      const remote = JSON.parse(res.value);
      const base = state.lastSyncedData || remote;
      toWrite = mergeAppData(base, state.data, remote);
    }catch(mergeErr){
      // Pas de copie serveur lisible (ex: tout premier enregistrement) : on écrit tel quel.
    }
    const payload = JSON.stringify(toWrite);
    if(payload.length > APP_STORAGE_CAP){
      console.error('Erreur de sauvegarde: payload trop volumineux', payload.length);
      showToast("Espace de stockage maximal atteint. Envoie ce message à Amélie pour qu'elle règle le problème.");
      return false;
    }
    try{
      await storageBackend.set(STORAGE_KEY, payload, true);
      state.data = toWrite;
      state.lastSyncedData = deepClone(toWrite);
      return true;
    }catch(e){
      console.error('Erreur de sauvegarde', e);
      showToast("Erreur d'enregistrement, réessayez.");
      return false;
    }
  }

  // File d'attente pour persist() : deux persist() lancés presque en même temps (ex. supprimer
  // un compte puis en recréer un tout de suite après) pouvaient se chevaucher — chacun lisait le
  // serveur et fusionnait à partir d'un instantané différent, et celui qui écrivait EN SECOND
  // pouvait écraser le travail de l'autre (perte de la donnée la plus récente). En les mettant en
  // file, chaque persist() attend que le précédent soit complètement terminé (donc que
  // state.lastSyncedData soit à jour) avant de lire le serveur à son tour — plus de chevauchement.
  let persistChain = Promise.resolve();
  function persist(){
    const result = persistChain.then(()=> persistNow());
    persistChain = result.catch(()=>{});
    return result;
  }

  // Récupère périodiquement les changements faits ailleurs (autre appareil/fenêtre)
  // et les fusionne dans l'état local, pour que l'admin (ou l'élève) voie les nouveautés
  // sans devoir recharger la page manuellement.
  async function refreshFromRemote(){
    if(state.modal) return; // on ne dérange pas une saisie en cours
    try{
      const res = await storageBackend.get(STORAGE_KEY, true);
      const remote = JSON.parse(res.value);
      const base = state.lastSyncedData || remote;
      const merged = mergeAppData(base, state.data, remote);
      const changed = JSON.stringify(merged) !== JSON.stringify(state.data);
      state.data = merged;
      state.lastSyncedData = deepClone(merged);
      if(changed && !state.modal) render();
    }catch(e){
      // silencieux : on réessaiera au prochain intervalle
    }
  }
  setInterval(refreshFromRemote, 12000);

  // Helper générique pour télécharger un tableau de données en CSV — utilisé par les
  // différents rapports admin (ventes, conversions intro, présence, etc.).
  function downloadCsv(filename, columns, fieldLabels, rows){
    const csvRows = [columns.map(k=>fieldLabels[k]||k).join(',')];
    rows.forEach(r=>{
      csvRows.push(columns.map(k=>`"${String(r[k]==null?'':r[k]).replace(/"/g,'""')}"`).join(','));
    });
    const csv = csvRows.join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('CSV téléchargé.');
  }

  function showToast(msg){
    document.querySelectorAll('.toast').forEach(t=>t.remove());
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(()=>{ t.remove(); }, 2400);
  }

  // ---------- paiement Helcim intégré (HelcimPay.js) ----------
  // Ouvre le module de paiement Helcim DIRECTEMENT dans l'app (iframe superposée), sans
  // redirection. onDone(status, transaction) est appelé avec status 'SUCCESS' ou 'ABORTED' ;
  // sur SUCCESS, transaction est l'objet transaction rapporté par Helcim (contient
  // transactionId) — il sert seulement à savoir QUOI vérifier ; la confirmation réelle se
  // fait côté serveur (koss-confirm-payment) qui revérifie lui-même auprès de Helcim.
  function startHelcimCheckout(checkoutToken, onDone){
    if(typeof appendHelcimPayIframe !== 'function'){
      showToast('Le module de paiement n’a pas pu se charger. Réessayez ou contactez le studio.');
      onDone('ABORTED');
      return;
    }
    appendHelcimPayIframe(checkoutToken, true);
    const key = 'helcim-pay-js-' + checkoutToken;
    let done = false;
    // Helcim fournit removeHelcimPayIframe() spécifiquement pour fermer/retirer le module —
    // s'y fier plutôt que d'espérer un nettoyage automatique (c'est l'absence de cet appel qui
    // causait l'app "gelée" après un paiement : le module restait superposé, invisible mais
    // toujours là, bloquant les clics, jusqu'à un rafraîchissement de la page).
    const cleanup = ()=>{
      window.removeEventListener('message', handler);
      try{
        if(typeof removeHelcimPayIframe === 'function') removeHelcimPayIframe();
        else { const el = document.getElementById('helcimPayIframe'); if(el) el.remove(); }
      }catch(err){ console.error('Échec de fermeture du module de paiement Helcim:', err); }
    };
    const handler = (event)=>{
      if(!event.data || event.data.eventName !== key || done) return;
      if(event.data.eventStatus === 'HIDE'){
        // Aucun SUCCESS/ABORTED reçu avant que l'élève ferme la fenêtre : on traite ça comme
        // une annulation.
        done = true;
        cleanup();
        onDone('ABORTED', null);
        return;
      }
      done = true;
      let transaction = null;
      if(event.data.eventStatus === 'SUCCESS'){
        // eventMessage est une chaîne JSON de forme {data:{data:{...transaction...}, status, headers}}
        // (confirmé en conditions réelles le 10 sept 2026) — la transaction elle-même est nichée
        // deux niveaux plus bas que ce qu'on pourrait croire. On reste tolérant à d'autres formes
        // possibles (transaction directement à la racine, etc.) au cas où Helcim la ferait varier.
        let parsed = null;
        if(typeof event.data.eventMessage === 'string'){
          try{ parsed = JSON.parse(event.data.eventMessage); }catch(err){ console.error('Réponse Helcim illisible:', err); }
        } else if(event.data.eventMessage && typeof event.data.eventMessage === 'object'){
          parsed = event.data.eventMessage;
        }
        if(parsed){
          if(parsed.transactionId) transaction = parsed;
          else if(parsed.data && parsed.data.transactionId) transaction = parsed.data;
          else if(parsed.data && parsed.data.data && parsed.data.data.transactionId) transaction = parsed.data.data;
        }
        if(!transaction || !transaction.transactionId){
          console.error('Impossible d’extraire transactionId de la réponse Helcim:', event.data);
        }
      }
      cleanup();
      onDone(event.data.eventStatus, transaction);
    };
    window.addEventListener('message', handler);
  }

  // ---------- date helpers ----------
  function startOfWeek(offset){
    const now = new Date();
    const day = (now.getDay() + 6) % 7; // 0 = Monday
    const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day + offset*7);
    return monday;
  }
  function getWeekDates(offset){
    const monday = startOfWeek(offset);
    return Array.from({length:7}, (_,i)=>{
      const d = new Date(monday);
      d.setDate(monday.getDate()+i);
      return d;
    });
  }
  function isoDate(d){ return d.toISOString().slice(0,10); }
  function formatDayNum(d){ return d.getDate(); }

  function getNextIntroProgram(){
    const introClasses = state.data.classes.filter(c=>c.category==='intro_bjj' && c.startDate && c.endDate);
    if(!introClasses.length) return null;
    const programs = new Map();
    introClasses.forEach(c=>{
      const key = c.startDate+'|'+c.endDate;
      if(!programs.has(key)) programs.set(key, {startDate:c.startDate, endDate:c.endDate});
    });
    const list = Array.from(programs.values()).sort((a,b)=>a.startDate.localeCompare(b.startDate));
    const today = todayIso();
    return list.find(p=>p.startDate >= today) || list[list.length-1] || null;
  }

  function formatShortDate(dateIso){
    const d = new Date(dateIso+'T00:00:00');
    return formatDayNum(d) + ' ' + formatMonthShort(d);
  }

  function weekOffsetForDate(dateIso){
    const target = new Date(dateIso+'T00:00:00');
    const day = (target.getDay()+6)%7;
    const targetMonday = new Date(target);
    targetMonday.setDate(target.getDate()-day);
    const currentMonday = startOfWeek(0);
    const diffDays = Math.round((targetMonday - currentMonday)/(1000*60*60*24));
    return Math.round(diffDays/7);
  }
  function formatMonthShort(d){
    return d.toLocaleDateString('fr-FR', {month:'short'}).replace('.','');
  }
  function weekLabel(offset){
    const dates = getWeekDates(offset);
    const a = dates[0], b = dates[6];
    return `${formatDayNum(a)} ${formatMonthShort(a)} – ${formatDayNum(b)} ${formatMonthShort(b)}`;
  }

  // ---------- booking logic ----------
  const ACTIVE_STATUSES = ['attente_paiement','paiement_declare','confirmee'];

  function bookedCount(classId, dateIso){
    return state.data.bookings.filter(b => b.classId===classId && b.dateIso===dateIso && ACTIVE_STATUSES.includes(b.status)).length;
  }
  function waitlistFor(classId, dateIso){
    return state.data.bookings.filter(b => b.classId===classId && b.dateIso===dateIso && b.status==='liste_attente')
      .sort((a,b)=>a.createdAt-b.createdAt);
  }
  function isProgramClass(c){ return !!(c && c.startDate && c.endDate); }

  function getProgramSiblings(c){
    return state.data.classes.filter(x => x.startDate===c.startDate && x.endDate===c.endDate && x.category===c.category);
  }

  function getProgramOccurrences(c){
    const siblings = getProgramSiblings(c);
    const occ = [];
    siblings.forEach(s=>{
      const jsDay = (s.dayOfWeek+1)%7; // our 0=Monday -> JS 0=Sunday
      let d = new Date(s.startDate+'T00:00:00');
      while(d.getDay() !== jsDay){ d.setDate(d.getDate()+1); }
      while(isoDate(d) <= s.endDate){
        occ.push({classId:s.id, dateIso:isoDate(d), className:s.name, time:s.time});
        d.setDate(d.getDate()+7);
      }
    });
    occ.sort((a,b)=> a.dateIso.localeCompare(b.dateIso) || a.time.localeCompare(b.time));
    return occ;
  }

  function isFirstProgramOccurrence(c, dateIso){
    const occ = getProgramOccurrences(c);
    return occ.length>0 && occ[0].classId===c.id && occ[0].dateIso===dateIso;
  }

  function promoteWaitlistIfRoom(classId, dateIso){
    const cls = state.data.classes.find(c=>c.id===classId);
    if(!cls) return;
    if(bookedCount(classId,dateIso) < cls.capacity){
      const wl = waitlistFor(classId,dateIso);
      if(wl.length){
        const promoted = wl[0];
        promoted.status = 'confirmee';
        promoted.promotedAt = Date.now();
        const membership = activeMembershipForEmail(promoted.studentEmail, cls.category, promoted.profileId);
        if(membership && membership.type==='credits'){
          membership.creditsRemaining = Math.max(0, membership.creditsRemaining - 1);
        }
      }
    }
  }

  async function proceedBooking(classId, dateIso, name, email, isDuplicateConfirmed, profileId, membershipId){
    const c = state.data.classes.find(cl=>cl.id===classId);
    if(!c){ showToast('Ce cours n\u2019existe plus.'); return; }

    if(isProgramClass(c)){
      return await proceedProgramBooking(c, name, email, isDuplicateConfirmed, profileId);
    }

    const alreadyBooked = state.data.bookings.some(b =>
      b.classId===classId && b.dateIso===dateIso &&
      b.studentEmail.toLowerCase()===email.toLowerCase() &&
      (b.profileId||null)===(profileId||null) &&
      ACTIVE_STATUSES.includes(b.status)
    );

    if(alreadyBooked && !isDuplicateConfirmed){
      state.modal = {type:'confirm-duplicate', payload:{classId, dateIso, name, email, profileId}};
      render();
      return;
    }

    let membership = null;
    if(!c.free){
      if(alreadyBooked){
        const candidates = activeMembershipsForEmail(email, c.category, profileId).filter(m=>m.type==='credits');
        if(!candidates.length){
          state.modal = {type:'need-membership', payload:{
            name, email, profileId, classId, dateIso,
            intro:'Un abonnement \u00e0 la carte (cr\u00e9dits) est requis pour r\u00e9server ce cours une 2e fois',
            neededCategory:c.category,
            requireCreditsOnly:true
          }};
          render();
          return;
        }
        if(candidates.length > 1 && !membershipId){
          state.modal = {type:'choose-membership', payload:{
            classId, dateIso, name, email, profileId, isDuplicateConfirmed,
            candidateIds: candidates.map(m=>m.id)
          }};
          render();
          return;
        }
        membership = membershipId ? candidates.find(m=>m.id===membershipId) : candidates[0];
        if(!membership){ showToast('Abonnement introuvable.'); return; }
      } else {
        const candidates = activeMembershipsForEmail(email, c.category, profileId);
        if(!candidates.length){
          state.modal = {type:'need-membership', payload:{
            name, email, profileId, classId, dateIso,
            intro:`Votre abonnement ne couvre pas les cours "${categoryLabel(c.category)}"`,
            neededCategory:c.category
          }};
          render();
          return;
        }
        if(candidates.length > 1 && !membershipId){
          state.modal = {type:'choose-membership', payload:{
            classId, dateIso, name, email, profileId, isDuplicateConfirmed,
            candidateIds: candidates.map(m=>m.id)
          }};
          render();
          return;
        }
        membership = membershipId ? candidates.find(m=>m.id===membershipId) : candidates[0];
        if(!membership){ showToast('Abonnement introuvable.'); return; }
      }
    }

    const full = bookedCount(classId,dateIso) >= c.capacity;
    const booking = {
      id: uid(), classId, dateIso,
      studentName:name, studentEmail:email, profileId: profileId||null,
      status: full ? 'liste_attente' : 'confirmee',
      membershipId: membership ? membership.id : null,
      createdAt: Date.now()
    };
    state.data.bookings.push(booking);
    if(!full && membership && membership.type==='credits'){
      membership.creditsRemaining = Math.max(0, membership.creditsRemaining - 1);
    }
    await persist();
    state.modal = null; closeModalDom();
    render();
    showToast(full ? 'Ajout\u00e9 \u00e0 la liste d\u2019attente.' : (isDuplicateConfirmed ? 'Deuxi\u00e8me r\u00e9servation confirm\u00e9e !' : 'R\u00e9servation confirm\u00e9e !'));
  }

  async function attendanceAddParticipant(name, email, noMembership, profileId){

    if(!c){ showToast('Ce cours n\u2019existe plus.'); return; }

    });

  async function proceedProgramBooking(c, name, email, isDuplicateConfirmed, profileId){
    const occ = getProgramOccurrences(c);
    const firstDateIso = occ[0].dateIso;
    const alreadyInProgram = state.data.bookings.some(b =>
      b.classId===c.id && b.dateIso===firstDateIso &&
      b.studentEmail.toLowerCase()===email.toLowerCase() &&
      (b.profileId||null)===(profileId||null) &&
      ACTIVE_STATUSES.includes(b.status)
    );
    if(alreadyInProgram){
      state.modal = null; closeModalDom();
      render();
      showToast('Vous êtes déjà inscrit à ce programme.');
      return;
    }

    let membership = null;
    if(!c.free){
      membership = state.data.memberships.find(mm =>
        mm.studentEmail.toLowerCase()===email.toLowerCase() &&
        (mm.profileId||null)===(profileId||null) &&
        isMembershipActive(mm) && (mm.categories||[]).includes(c.category) &&
        (!mm.introStart || mm.introStart === c.startDate)
      );
      if(!membership){
        state.modal = {type:'need-membership', payload:{
          name, email, profileId,
          intro:`Votre abonnement ne couvre pas ce programme (${categoryLabel(c.category)} du ${formatShortDate(c.startDate)})`,
          neededCategory:c.category
        }};
        render();
        return;
      }
      if(membership.type==='credits' && membership.creditsRemaining < occ.length){
        state.modal = {type:'need-membership', payload:{
          name, email, profileId,
          intro:`Il vous manque des cours sur votre carte pour ce programme de ${occ.length} séances (${membership.creditsRemaining} restant(s))`,
          neededCategory:c.category
        }};
        render();
        return;
      }
    }

    let confirmedCount = 0, waitlistCount = 0;
    occ.forEach(o=>{
      const full = bookedCount(o.classId, o.dateIso) >= state.data.classes.find(cl=>cl.id===o.classId).capacity;
      state.data.bookings.push({
        id: uid(), classId:o.classId, dateIso:o.dateIso,
        studentName:name, studentEmail:email, profileId: profileId||null,
        status: full ? 'liste_attente' : 'confirmee',
        createdAt: Date.now(),
        programBooking: true
      });
      if(full) waitlistCount++; else confirmedCount++;
      if(!full && membership && membership.type==='credits'){
        membership.creditsRemaining = Math.max(0, membership.creditsRemaining - 1);
      }
    });

    await persist();
    state.modal = null; closeModalDom();
    render();
    showToast(waitlistCount ? `Programme réservé — ${confirmedCount} confirmée(s), ${waitlistCount} en liste d\u2019attente.` : `Programme réservé — ${confirmedCount} séances confirmées !`);
  }

  function statusBadge(status){
    const map = {
      attente_paiement: ['badge-pending','Paiement à faire'],
      paiement_declare: ['badge-declared','Paiement déclaré'],
      confirmee: ['badge-confirmed','Confirmée'],
      liste_attente: ['badge-waitlist','Liste d\u2019attente'],
      annulee: ['badge-cancelled','Annulée'],
    };
    const [cls,label] = map[status] || ['badge-pending', status];
    return `<span class="badge ${cls}">${label}</span>`;
  }

  // ---------- membership logic ----------
  function todayIso(){ return isoDate(new Date()); }

  function isMembershipActive(m){
    if(m.status !== 'active') return false;
    if(m.type === 'illimite') return m.endDate >= todayIso();
    if(m.type === 'credits') return m.creditsRemaining > 0;
    return false;
  }

  function membershipDisplayStatus(m){
    if(m.status === 'active' && !isMembershipActive(m)) return 'expiree';
    return m.status;
  }

  // Prix membre automatique (14 sept 2026) : quiconque a un abonnement illimité actif
  // (BJJ, Yoga, Muay Thai, All Unlimited — peu importe la catégorie) devient "membre" pour la
  // durée de cet abonnement et obtient le prix réduit sur les drop-in/pass qui en offrent un
  // (plan.memberPrice). Les cartes de crédits ("pass") ne rendent PAS membre.
  function hasActiveAbonnement(email, profileId){
    const e = (email||'').toLowerCase().trim();
    if(!e) return false;
    return state.data.memberships.some(m =>
      m.studentEmail && m.studentEmail.toLowerCase()===e &&
      (m.profileId||null) === (profileId||null) &&
      m.type === 'illimite' && isMembershipActive(m)
    );
  }

  function buyerQualifiesForMemberPrice(plan, email, profileId){
    if(!plan || !plan.memberPrice) return false;
    if(plan.familyMemberCheck){
      // Ex. "1 Enfant + 1 Parent" : doit être réservé à partir du compte du parent membre
      // OU de l'enfant membre (l'un ou l'autre suffit).
      return hasActiveAbonnement(email, null) || (!!profileId && hasActiveAbonnement(email, profileId));
    }
    return hasActiveAbonnement(email, profileId || null);
  }

  function priceForPurchase(plan, email, profileId){
    if(!plan) return '';
    return buyerQualifiesForMemberPrice(plan, email, profileId) ? plan.memberPrice : plan.price;
  }

  function membershipBadge(m){
    const ds = membershipDisplayStatus(m);
    const map = {
      attente_paiement: ['badge-pending','Paiement à faire'],
      paiement_declare: ['badge-declared','Paiement déclaré'],
      active: ['badge-confirmed','Actif'],
      expiree: ['badge-cancelled','Expiré'],
      annulee: ['badge-cancelled','Annulé'],
    };
    const [cls,label] = map[ds] || ['badge-pending', ds];
    return `<span class="badge ${cls}">${label}</span>`;
  }

  function membershipDetail(m){
    if(m.type === 'illimite') return 'jusqu\u2019au ' + m.endDate;
    if(m.type === 'credits') return m.creditsRemaining + ' cours restant(s)';
    return '';
  }

  function activeMembershipsForEmail(email, category, profileId){
    const e = email.toLowerCase();
    const pid = profileId || null;
    const mine = state.data.memberships.filter(m => m.studentEmail.toLowerCase()===e && (m.profileId||null)===pid);
    return mine.filter(m => isMembershipActive(m) && (!category || (m.categories||[]).includes(category)));
  }
  function activeMembershipForEmail(email, category, profileId){
    return activeMembershipsForEmail(email, category, profileId)[0] || null;
  }

  // Refunds a drop-in credit when a confirmed (non-waitlist, non-free) booking is cancelled.
  function refundCreditIfNeeded(b){
    if(!b || b.status !== 'confirmee') return;
    const c = state.data.classes.find(cl=>cl.id===b.classId);
    if(!c || c.free) return;
    // Si on sait quel abonnement a servi à réserver (cas normal depuis le 11 sept, utile
    // quand l'élève a plusieurs abonnements actifs), on rembourse celui-là précisément.
    const m = b.membershipId
      ? state.data.memberships.find(mm=>mm.id===b.membershipId)
      : activeMembershipForEmail(b.studentEmail, c.category, b.profileId);
    if(m && m.type==='credits'){
      m.creditsRemaining = (m.creditsRemaining||0) + 1;
    }
  }

  // Vrai si ce profil (enfant ou adulte via profileId) a déjà eu un abonnement ou une
  // réservation — sert à détecter la toute première réservation d'un enfant, pour
  // afficher l'avertissement "avez-vous contacté le club ?" avant le paiement.
  function childHasPriorActivity(email, profileId){
    const e = (email||'').toLowerCase();
    const pid = profileId || null;
    const hasMembership = state.data.memberships.some(m=>m.studentEmail.toLowerCase()===e && (m.profileId||null)===pid);
    if(hasMembership) return true;
    const hasBooking = state.data.bookings.some(b=>b.studentEmail.toLowerCase()===e && (b.profileId||null)===pid);
    return hasBooking;
  }

  function pendingMembershipForEmail(email){
    const e = email.toLowerCase();
    return state.data.memberships.find(m => m.studentEmail.toLowerCase()===e && (m.status==='attente_paiement' || m.status==='paiement_declare')) || null;
  }

  function activatePlanForStudent(plan, name, email, free, profileId){
    const m = {
      id: uid(),
      planId: plan.id,
      planName: plan.name,
      categories: (plan.categories||[]).slice(),
      studentName: name,
      studentEmail: email,
      profileId: profileId||null,
      type: plan.type,
      status: free ? 'active' : 'attente_paiement',
      grantedFree: !!free,
      // Fige le prix réel au moment de l'achat (prix membre appliqué automatiquement s'il y a
      // lieu) — koss-init-payment charge exactement ce montant, jamais plan.price directement.
      planPrice: free ? null : priceForPurchase(plan, email, profileId),
      createdAt: Date.now()
    };
    if(plan.type === 'illimite'){
      m.creditsRemaining = null;
      if(free){
        const start = new Date();
        const end = new Date(start); end.setDate(end.getDate() + plan.durationDays);
        m.startDate = isoDate(start);
        m.endDate = isoDate(end);
      }
    } else {
      m.creditsRemaining = free ? plan.creditsCount : 0;
    }
    state.data.memberships.push(m);
    return m;
  }

  function resizeImageFile(file, maxSize, maxBytes){
    maxBytes = maxBytes || 220000; // ~ dataURL char length ceiling, keeps saved data small enough to persist reliably
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=>reject(new Error('read failed'));
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = ()=>reject(new Error('decode failed'));
        img.onload = ()=>{
          const attempts = [
            {size:maxSize, q:0.82},
            {size:maxSize, q:0.6},
            {size:maxSize, q:0.4},
            {size:Math.round(maxSize*0.65), q:0.5},
            {size:Math.round(maxSize*0.5), q:0.4},
            {size:Math.round(maxSize*0.4), q:0.35},
          ];
          let result = null;
          for(const att of attempts){
            let w = img.width, h = img.height;
            if(w > h){ if(w > att.size){ h = Math.round(h*att.size/w); w = att.size; } }
            else { if(h > att.size){ w = Math.round(w*att.size/h); h = att.size; } }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', att.q);
            result = dataUrl;
            if(dataUrl.length <= maxBytes) break;
          }
          if(result && result.length <= maxBytes*1.4) resolve(result);
          else reject(new Error('image too large after compression'));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function hashPassword(pw){
    const enc = new TextEncoder().encode(String(pw||''));
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  function findAccountByQuery(query){
    const raw = String(query||'').trim();
    if(!raw) return null;
    let acct = state.data.studentAccounts.find(a=>a.email.toLowerCase()===raw.toLowerCase());
    if(acct) return acct;
    const qDigits = raw.replace(/\D/g,'');
    if(qDigits.length >= 7){
      acct = state.data.studentAccounts.find(a=>a.phone && a.phone.replace(/\D/g,'')===qDigits);
      if(acct) return acct;
    }
    const qNorm = normalizeStr(raw);
    acct = state.data.studentAccounts.find(a=>normalizeStr(a.name).includes(qNorm));
    return acct || null;
  }

  // Catégories du carnet : entièrement créées par l'usager (plus de liste préétablie) — on
  // suggère juste celles qu'il a déjà tapées, via une <datalist> sur le champ catégorie.
  function userNotebookCategories(ownerKey){
    const set = new Set();
    state.data.notebookEntries.forEach(n=>{
      if(n.ownerKey===ownerKey && !n.trashed && n.category && n.category.trim()) set.add(n.category.trim());
    });
    return Array.from(set).sort((a,b)=>a.localeCompare(b));
  }
  // Catégories des autocollants : même stratégie que celles du carnet — texte libre créé
  // par la gestion, pas la liste des catégories de cours. On suggère juste celles déjà
  // utilisées, via une <datalist> sur le champ.
  function usedStickerCategories(){
    const set = new Set();
    state.data.stickers.forEach(s=>{ if(s.category && s.category.trim()) set.add(s.category.trim()); });
    return Array.from(set).sort((a,b)=>a.localeCompare(b));
  }
  const POSTIT_COLORS = ['#F2E27A','#F2A65A','#8FCBD9','#93B48F','#E8A9A0','#B79FDB','#FFFBF8'];
  const TEXTNOTE_FONTS = [
    {key:'marker', label:'Manuscrite (Sharpie)', css:"'Permanent Marker', cursive"},

    {key:'title', label:'Titre (Oswald)', css:"'Oswald', sans-serif"},
    {key:'serif', label:'Serif classique', css:"Georgia, serif"},
    {key:'mono', label:'Machine à écrire', css:"'Courier New', monospace"},
    {key:'calligraphy', label:'Calligraphie', css:"'Great Vibes', cursive"},
    {key:'handwriting', label:'Écriture manuscrite', css:"'Caveat', cursive"},
  ];
  const TEXTNOTE_INK_COLORS = ['#28292E','#7A3B12','#1D5C43','#8B1E3F','#2A4B7C'];
  // Palettes de couleurs d'encre pour les notes texte du carnet (choisies par
  // l'usager, mémorisées par carnet dans nb.inkPalette — défaut 'pastel').
  const TEXTNOTE_PALETTES = [
    {key:'pastel', label:'Pastel doux', colors:['#C97B84','#E8A87C','#E3C567','#A8C08A','#8FCBD9','#A6B9D9','#B9A6D9','#D9A6C9','#C9B79F','#9FB8B0']},
    {key:'vif', label:'Vif', colors:['#E4573D','#E8912D','#D9B92D','#7FB83D','#2DB894','#2D8FE8','#5A5FE8','#A83DE8','#E83DA8','#E83D5F']},
    {key:'classique', label:'Classique', colors:['#000000','#1D3B7A','#1D5C3D','#7A1D2D','#5C3A1D','#1D5C6B','#4A1D5C','#7A5C1D','#3D5C1D','#5C1D3A']},
    {key:'melange', label:'Mélange', colors:['#E8A87C','#E4573D','#1D5C3D','#8FCBD9','#A83DE8','#7A3B12','#E3C567','#0B1D3A','#E83D5F','#9C9C9C']},
    {key:'contrastes', label:'Contrastes', colors:['#F2C6A0','#3D1D5C','#A8D8C4','#5C1D1D','#F2E6A0','#1D3D5C','#D9A0C6','#1D5C2E','#A0C6F2','#5C3D1D']},
  ];
  function textnotePaletteColors(key){
    const p = TEXTNOTE_PALETTES.find(p=>p.key===key);
    return p ? p.colors : TEXTNOTE_PALETTES[0].colors;
  }
  function renderTextnoteSwatchesHtml(colors, selected){
    return colors.map(col=>`<span class="textnote-color-swatch" data-color="${col}" style="width:26px;height:26px;border-radius:4px;background:${col};cursor:pointer;border:2px solid ${selected===col?'var(--amber)':'transparent'};display:inline-block;"></span>`).join('');
  }
  function textnoteFontCss(key){ return (TEXTNOTE_FONTS.find(f=>f.key===key)||TEXTNOTE_FONTS[0]).css; }
  const NOTEBOOK_TEXTURES = [
    {key:'uni', label:'Uni'},
    {key:'cuir', label:'Cuir'},
    {key:'tisse', label:'Tissée'},
    {key:'kraft', label:'Papier kraft'},
    {key:'denim', label:'Denim'},
    {key:'pointille', label:'Pointillé'},
  ];
  function notebookTextureCss(key){
    switch(key){
      case 'cuir': return 'background-image:repeating-linear-gradient(45deg, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 3px, transparent 3px, transparent 9px);';
      case 'tisse': return 'background-image:repeating-linear-gradient(0deg, rgba(255,255,255,0.09) 0px, rgba(255,255,255,0.09) 1px, transparent 1px, transparent 7px), repeating-linear-gradient(90deg, rgba(255,255,255,0.09) 0px, rgba(255,255,255,0.09) 1px, transparent 1px, transparent 7px);';
      case 'kraft': return 'background-image:repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px, transparent 1px, transparent 14px);';
      case 'denim': return 'background-image:repeating-linear-gradient(65deg, rgba(255,255,255,0.08) 0px, rgba(255,255,255,0.08) 2px, transparent 2px, transparent 6px);';
      case 'pointille': return 'background-image:radial-gradient(rgba(0,0,0,0.18) 1px, transparent 1.5px);background-size:8px 8px;';
      default: return '';
    }
  }

  function notebookPageBgCss(nb){
    const color = nb.pageColor || '#FFFBF8';
    const style = nb.pageStyle || 'ligne';
    if(style === 'vierge'){
      return `background-image:none;background-color:${color};`;
    }
    if(style === 'point'){
      return `background-image:radial-gradient(rgba(40,41,46,0.28) 1.5px, transparent 2px);background-size:18px 18px;background-position:0 0;background-color:${color};`;
    }
    return `background-image:linear-gradient(90deg, rgba(200,60,60,0.35) 2px, transparent 2px), repeating-linear-gradient(${color} 0px, ${color} 27px, rgba(120,140,180,0.25) 28px);background-position:34px 0, 0 6px;background-size:auto, 100% 28px;background-color:${color};`;
  }

  function notebookOwnerKey(email, profileId){
    return `${email.toLowerCase()}::${profileId||'self'}`;
  }
  // Décompose un ownerKey de carnet ("email::self" ou "email::idProfilEnfant").
  function parseOwnerKey(ownerKey){
    const idx = String(ownerKey||'').lastIndexOf('::');
    if(idx === -1) return {email: ownerKey||'', profileId: null};
    const email = ownerKey.slice(0, idx);
    const rest = ownerKey.slice(idx+2);
    return {email, profileId: rest==='self' ? null : rest};
  }
  // true si l'ownerKey correspond au profil d'un enfant (pas le compte principal/adulte).
  function isChildOwnerKey(ownerKey){
    return !!parseOwnerKey(ownerKey).profileId;
  }
  // Étiquette lisible pour un ownerKey — utilisée UNIQUEMENT dans les endroits où on a le
  // droit de révéler une identité (jamais dans la modération des notes anonymes en attente,
  // sauf le signalement "inapproprié" — voir plus bas).
  function ownerKeyLabel(ownerKey){
    const {email, profileId} = parseOwnerKey(ownerKey);
    const acct = findStudentAccount(email);
    if(!acct) return email || 'Inconnu';
    const name = getProfileName(acct, profileId);
    return profileId ? `${name} (enfant · compte ${email})` : `${name} (${email})`;
  }
  function stickersAvailableForStudent(email){
    const e = (email||'').toLowerCase();
    return state.data.stickers.filter(s=> s.availableToAll || (s.assignedEmails && s.assignedEmails.includes(e)));
  }
  function giftedStickersForStudent(email, profileId){
    const e = (email||'').toLowerCase();
    const pid = profileId || null;
    const grants = state.data.stickerGrants.filter(g=>g.email.toLowerCase()===e && (g.profileId||null)===pid && !g.used);
    return grants.map(g=>{
      const s = state.data.stickers.find(x=>x.id===g.stickerId);
      return s ? Object.assign({}, s, {grantId:g.id, grantMessage:g.message||''}) : null;
    }).filter(Boolean);
  }
  function giftedStickersForOwner(ownerKey){
    const parsed = parseOwnerKey(ownerKey);
    return giftedStickersForStudent(parsed.email, parsed.profileId);
  }
  // Nombre total de notes/autocollants pas encore vus (ni placés sur une page, ni supprimés),
  // sur TOUS les profils du compte (soi-même + enfants) — utilisé pour le petit icône ✉️
  // dans l'en-tête, à côté du nom, pour prévenir l'usager sans qu'il ait à ouvrir son carnet.
  function unreadInboxCountForAccount(acct){
    if(!acct) return 0;
    const profiles = getProfiles(acct);
    return profiles.reduce((sum,p)=>{
      const ownerKey = notebookOwnerKey(acct.email, p.id||null);
      return sum + receivedItemsForOwner(ownerKey).length + giftedStickersForOwner(ownerKey).length;
    }, 0);
  }
  // Notes/post-its/autocollants partagés entre carnets (élève → coach ou élève → élève).
  // Une note "signée" est livrée immédiatement (statut 'delivered') ; une note "anonyme"
  // doit d'abord être approuvée par un·e gestionnaire (statut 'pending_review') — dans les
  // deux cas, personne (ni Amélie via la modération, ni le destinataire) ne voit qui l'a
  // envoyée : l'identité de l'expéditeur n'est jamais affichée dans l'interface.
  function sharedItemContentFromEntry(entry){
    const base = {kind: entry.kind, category: entry.category||''};
    if(entry.kind === 'text'){
      Object.assign(base, {text:entry.text, fontFamily:entry.fontFamily, color:entry.color, hAlign:entry.hAlign});
    } else if(entry.kind === 'sticker'){
      Object.assign(base, {stickerId:entry.stickerId});
    } else {
      Object.assign(base, {text:entry.text, color:entry.color, photo:entry.photo||null});
    }
    return base;
  }
  function receivedItemsForOwner(ownerKey){
    return state.data.sharedItems.filter(s=>s.recipientType==='student' && s.recipientOwnerKey===ownerKey && s.status==='delivered');
  }
  function receivedItemsForManager(managerId){
    return state.data.sharedItems.filter(s=>s.recipientType==='coach' && s.recipientManagerId===managerId && s.status==='delivered');
  }
  function pendingModerationSharedItems(){
    return state.data.sharedItems.filter(s=>s.anonymous && s.status==='pending_review');
  }
  function flaggedInappropriateItems(){
    return state.data.sharedItems.filter(s=>s.inappropriate && s.status!=='archived');
  }
  // Présences ajoutées sans abonnement valide, encore non réglées, pour un étudiant (ou un
  // de ses enfants) précis — affiché directement dans sa fiche, en plus de la liste globale
  // "Présences sans abonnement" du tableau de bord.
  function unpaidAttendanceFor(email, profileId){
    const pid = profileId || null;
    return state.data.bookings.filter(b=>b.studentEmail.toLowerCase()===(email||'').toLowerCase() && (b.profileId||null)===pid && b.noMembership && b.status!=='annulee');
  }
  function unpaidAttendanceHtml(email, profileId){
    const items = unpaidAttendanceFor(email, profileId);
    if(!items.length) return '';
    return `
      <label style="margin-top:14px;color:var(--coral);">⚠ Présences non réglées (${items.length})</label>
      <ul class="link-list">
        ${items.map(b=>{
          const c = state.data.classes.find(cl=>cl.id===b.classId);
          return `<li><span>${c?escapeHtml(c.name):'—'} — ${b.dateIso}</span><span><button class="small-btn" data-action="open-mark-attendance-paid" data-id="${b.id}">A payé</button></span></li>`;
        }).join('')}
      </ul>
    `;
  }
  // Onglet "Visites" dépliable dans la fiche d'un étudiant (ou d'un enfant) : toutes ses
  // réservations passées et à venir (hors déjà annulées), avec possibilité de les retirer.
  function studentVisitsHtml(email, profileId, showVisits){
    const pid = profileId || null;
    const visits = state.data.bookings.filter(b=>b.studentEmail.toLowerCase()===(email||'').toLowerCase() && (b.profileId||null)===pid && b.status!=='annulee').sort((a,b)=>a.dateIso.localeCompare(b.dateIso));
    const today = todayIso();
    return `
      <div class="btn-row" style="margin-top:14px;">
        <button class="small-btn" data-action="toggle-modal-visits">${showVisits?'▲':'▼'} Visites (${visits.length})</button>
      </div>
      ${showVisits ? (visits.length ? `
        <table style="margin-top:6px;">
          <tr><th>Cours</th><th>Date</th><th>Statut</th><th></th></tr>
          ${visits.map(b=>{
            const c = state.data.classes.find(cl=>cl.id===b.classId);
            const upcoming = b.dateIso >= today;
            return `<tr><td>${c?escapeHtml(c.name):'—'}${upcoming?' <span style="color:var(--sage);font-size:11px;">(à venir)</span>':''}</td><td>${b.dateIso}</td><td>${statusBadge(b.status)}</td><td><button class="small-btn" data-action="cancel-booking" data-id="${b.id}">Supprimer</button></td></tr>`;
          }).join('')}
        </table>
      ` : '<p class="muted" style="color:var(--chalk-dim);margin-top:6px;">Aucune visite.</p>') : ''}
    `;
  }
  function trashedItemsForOwner(ownerKey){
    return state.data.notebookEntries.filter(n=>n.ownerKey===ownerKey && n.trashed).sort((a,b)=>(b.trashedAt||0)-(a.trashedAt||0));
  }
  function sharedContentPreviewHtml(c){
    if(c.kind === 'sticker'){
      const sticker = state.data.stickers.find(s=>s.id===c.stickerId);
      return sticker ? `<img src="${sticker.image}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;"><div class="sname">${escapeHtml(sticker.name)}</div>` : '<p class="muted" style="color:var(--chalk-dim);">Autocollant introuvable.</p>';
    }
    // Les notes-texte utilisent une encre foncée pensée pour la page claire du carnet.
    // Ici (modale sur fond sombre), on leur donne toujours un fond clair type papier pour
    // que le texte reste lisible (sinon: texte foncé sur fond sombre = invisible).
    return `
      <div class="postit" style="background:${c.kind==='text' ? 'var(--chalk)' : (c.color||POSTIT_COLORS[0])};${c.kind==='text' ? 'box-shadow:none;border:1px dashed rgba(40,41,46,0.3);font-family:'+textnoteFontCss(c.fontFamily)+';color:'+(c.color||TEXTNOTE_INK_COLORS[0])+';' : ''}max-width:220px;">
        ${c.category ? `<div class="postit-cat" style="${c.kind==='text'?'color:rgba(40,41,46,0.6);':''}">${escapeHtml(c.category)}</div>` : ''}
        <div class="postit-text">${escapeHtml(c.text||'')}</div>
        ${c.photo ? `<img src="${c.photo}">` : ''}
      </div>
    `;
  }
  const MAX_NOTEBOOK_PAGES = 40;
  function getNotebooksForOwner(ownerKey){
    return state.data.notebooks.filter(nb=>nb.ownerKey===ownerKey).sort((a,b)=>a.createdAt-b.createdAt);
  }
  function getOrCreateActiveNotebook(ownerKey){
    let list = getNotebooksForOwner(ownerKey);
    if(!list.length){
      const nb = {id:uid(), ownerKey, name:'Mon carnet', pageCount:1,
        coverColor:'#1D5C43', coverTexture:'uni', coverTextColor:'#F2E27A',
        pageColor:'#FFFBF8', postitColor:POSTIT_COLORS[0], createdAt:Date.now()};
      state.data.notebooks.push(nb);
      list = [nb];
    }
    if(!state.notebookActiveId || !list.find(nb=>nb.id===state.notebookActiveId)){
      state.notebookActiveId = list[0].id;
    }
    return list.find(nb=>nb.id===state.notebookActiveId);
  }

  function getProfiles(acct){
    const self = {id:null, name:acct.name, firstName:acct.firstName, lastName:acct.lastName, isSelf:true};
    return [self].concat((acct.familyMembers||[]).map(f=>({...f, isSelf:false})));
  }
  function getProfileName(acct, profileId){
    if(!profileId) return acct.name;
    const fm = (acct.familyMembers||[]).find(f=>f.id===profileId);
    return fm ? fm.name : acct.name;
  }

  function currentManager(){
    return state.data.managers.find(m=>m.id===state.currentManagerId) || null;
  }

  function findStudentAccount(email){
    const e = String(email||'').toLowerCase();
    return state.data.studentAccounts.find(a=>a.email.toLowerCase()===e) || null;
  }

  function renderMembershipRows(filterEmail, filterProfileId){
    let allMemberships = state.data.memberships.slice().sort((a,b)=>b.createdAt-a.createdAt);
    if(filterEmail) allMemberships = allMemberships.filter(m=>m.studentEmail.toLowerCase()===filterEmail.toLowerCase());
    if(filterProfileId!==undefined) allMemberships = allMemberships.filter(m=>(m.profileId||null)===(filterProfileId||null));
    const showHidden = !!state.adminShowHiddenMemberships;
    const hiddenCount = allMemberships.filter(m=>m.hiddenByAdmin).length;
    if(!showHidden) allMemberships = allMemberships.filter(m=>!m.hiddenByAdmin);
    const rows = allMemberships.map(m=>{
      const ds = membershipDisplayStatus(m);
      let extra = '';
      if(ds==='active'){
        extra = m.type==='credits'
          ? `<button class="small-btn" data-action="add-credit" data-id="${m.id}">+1 cours</button>`
          : `<button class="small-btn" data-action="add-days" data-id="${m.id}">+7 jours</button>`;
      }
      if(ds!=='annulee'){
        extra += ` <button class="small-btn" data-action="edit-membership" data-id="${m.id}">Modifier</button>`;
        extra += ` <button class="small-btn" data-action="refund-membership" data-id="${m.id}">Rembourser</button>`;
        if(findStudentAccount(m.studentEmail)) extra += ` <button class="small-btn" data-action="open-transfer-membership" data-id="${m.id}">Transférer</button>`;
        extra += ` <button class="small-btn" data-action="toggle-paid-helcim" data-id="${m.id}">${m.paidViaHelcim ? 'Retirer du revenu Helcim' : 'Marquer payé Helcim'}</button>`;
      }
      if(ds==='active'){
        extra += ` <button class="small-btn" data-action="revoke-membership" data-id="${m.id}">Révoquer</button>`;
      }
      if(ds==='expiree'){
        extra += m.hiddenByAdmin
          ? ` <button class="small-btn" data-action="unhide-membership" data-id="${m.id}">Afficher</button>`
          : ` <button class="small-btn" data-action="hide-membership" data-id="${m.id}">Masquer</button>`;
        extra += ` <button class="small-btn" data-action="delete-membership" data-id="${m.id}">Supprimer</button>`;
      }
      if(ds==='annulee'){
        extra += ` <button class="small-btn" data-action="delete-membership" data-id="${m.id}">Supprimer</button>`;
      }
      const refundNote = m.refund ? `<br><span style="color:var(--coral);font-size:11px;">Remboursé ${m.refund.type==='complet'?'complet':'partiel'}${m.refund.amount?' · '+escapeHtml(m.refund.amount):''}</span>` : '';
      const hiddenNote = m.hiddenByAdmin ? ` <span style="color:var(--chalk-dim);font-size:11px;">(masqué)</span>` : '';
      const nameLink = m.profileId
        ? `<button class="small-btn" data-action="open-child-detail" data-parent-email="${escapeHtml(m.studentEmail)}" data-member-id="${escapeHtml(m.profileId)}" style="padding:0;border:none;background:none;text-decoration:underline;color:var(--chalk);font-weight:bold;">${escapeHtml(m.studentName)}</button>`
        : `<button class="small-btn" data-action="open-student-detail" data-email="${escapeHtml(m.studentEmail)}" style="padding:0;border:none;background:none;text-decoration:underline;color:var(--chalk);font-weight:bold;">${escapeHtml(m.studentName)}</button>`;
      return `
        <tr>
          <td>${nameLink}${childOfNoteHtml(m.studentEmail, m.profileId)}<br><span style="color:var(--chalk-dim);font-size:11px;">${escapeHtml(m.studentEmail)}</span></td>
          <td>${escapeHtml(m.planName)}${m.grantedFree?' <span style="color:var(--chalk-dim);font-size:11px;">(offert)</span>':''}${hiddenNote}${refundNote}</td>
          <td>${ds==='active' ? membershipDetail(m) : '—'}</td>
          <td>${membershipBadge(m)}</td>
          <td>${extra}</td>
        </tr>
      `;
    }).join('');
    const toggleRow = hiddenCount ? `
      <tr><td colspan="5" style="text-align:center;">
        <button class="small-btn" data-action="toggle-show-hidden-memberships">${showHidden ? 'Cacher les abonnements masqués' : `Afficher les abonnements masqués (${hiddenCount})`}</button>
      </td></tr>
    ` : '';
    return rows + toggleRow;
  }

  function searchStudentAccounts(query){
    const q = normalizeStr(query);
    if(!q) return [];
    const results = [];
    state.data.studentAccounts.forEach(a=>{
      const hay = normalizeStr(`${a.name||''} ${a.firstName||''} ${a.lastName||''} ${a.email||''} ${a.phone||''}`);
      if(hay.includes(q)) results.push({type:'account', email:a.email, name:a.name, phone:a.phone||''});
      (a.familyMembers||[]).forEach(f=>{
        if(normalizeStr(f.name||'').includes(q)){
          results.push({type:'child', parentEmail:a.email, parentName:a.name, memberId:f.id, name:f.name, birthday:f.birthday||'', email:f.email||'', phone:f.phone||''});
        }
      });
    });
    return results;
  }

  function allStudents(){
    const map = new Map();
    state.data.studentAccounts.forEach(a=>{
      map.set(a.email.toLowerCase(), {email:a.email, name:a.name, phone:a.phone||''});
    });
    state.data.memberships.forEach(m=>{
      const k = m.studentEmail.toLowerCase();
      if(!map.has(k)) map.set(k, {email:m.studentEmail, name:m.studentName, phone:''});
    });
    state.data.bookings.forEach(b=>{
      const k = b.studentEmail.toLowerCase();
      if(!map.has(k)) map.set(k, {email:b.studentEmail, name:b.studentName, phone:''});
    });
    return Array.from(map.values()).sort((a,b)=>a.name.localeCompare(b.name));
  }

  // Returns {ok, reason, isNew}. Creates the account on first use of an email.
  async function verifyOrCreateAccount(email, name, password, firstName, lastName){
    if(!password){ return {ok:false, reason:'missing'}; }
    const acct = findStudentAccount(email);
    const hash = await hashPassword(password);
    if(acct){
      if(acct.hash !== hash) return {ok:false, reason:'wrong'};
      return {ok:true, isNew:false};
    } else {
      state.data.studentAccounts.push({
        email, name, hash, phone:'',
        firstName: firstName||'', lastName: lastName||'',
        createdAt:Date.now(), lastVisit:null, firstVisit:null, visitCount:0, cancelCount:0,
        birthday:'', belt:'', notes:{}, familyMembers:[]
      });
      // Courriel de bienvenue — best-effort, ne doit jamais bloquer ni faire échouer la création
      // de compte si Resend n'est pas configuré ou indisponible.
      try{
        sb.functions.invoke('koss-send-welcome-email', {body:{email, firstName: firstName||name}});
      }catch(err){ console.error('Échec envoi courriel de bienvenue:', err); }
      return {ok:true, isNew:true};
    }
  }

  // Étape 1 de la création de compte vérifiée par courriel. Si le courriel a déjà un compte,
  // on retombe simplement sur une connexion normale (aucun code requis — l'usager s'est juste
  // trompé de bouton). Sinon, envoie un code à 6 chiffres et ne crée PAS le compte tout de
  // suite : il ne sera créé qu'une fois le code confirmé (confirm-signup-code-submit), pour
  // qu'on ne puisse jamais créer de compte avec un courriel qu'on ne possède pas.
  async function startSignupCode(email, name, password, firstName, lastName){
    const existing = findStudentAccount(email);
    if(existing){
      const hash = await hashPassword(password);
      if(existing.hash !== hash) return {ok:false, reason:'wrong'};
      return {ok:true, isNew:false};
    }
    try{
      const hash = await hashPassword(password);
      const resp = await sb.functions.invoke('koss-send-signup-code', {body:{email, name, firstName, lastName, hash}});
      if(resp.error || !resp.data || !resp.data.ok){
        const errCode = resp.data && resp.data.error;
        return {ok:false, reason: errCode==='exists' ? 'exists' : 'send_failed'};
      }
      return {ok:true, isNew:true, needsCode:true};
    }catch(err){
      console.error('Échec envoi code de vérification (inscription):', err);
      return {ok:false, reason:'send_failed'};
    }
  }

  function normalizeStr(s){
    return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  }

  function matchCategories(str){
    if(!str) return [];
    const parts = str.split(/[;,/]/).map(normalizeStr).filter(Boolean);
    const found = new Set();
    parts.forEach(p=>{
      CATEGORIES.forEach(cat=>{
        const label = normalizeStr(cat.label);
        const keyWords = cat.key.replace('_',' ');
        if(p.includes(label) || label.includes(p) || p.includes(keyWords)) found.add(cat.key);
      });
    });
    return Array.from(found);
  }

  function parseCSV(text){
    const rows = [];
    let i=0, field='', row=[], inQuotes=false;
    const s = String(text||'').replace(/\r\n/g,'\n');
    while(i < s.length){
      const c = s[i];
      if(inQuotes){
        if(c === '"'){
          if(s[i+1] === '"'){ field+='"'; i+=2; continue; }
          inQuotes = false; i++; continue;
        } else { field += c; i++; continue; }
      } else {
        if(c === '"'){ inQuotes = true; i++; continue; }
        if(c === ','){ row.push(field); field=''; i++; continue; }
        if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
        field += c; i++; continue;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.some(cell => cell.trim() !== ''));
  }

  function activateMembership(m){
    m.status = 'active';
    const plan = state.data.membershipPlans.find(p=>p.id===m.planId);
    const durationDays = plan ? plan.durationDays : 30;
    const creditsCount = plan ? plan.creditsCount : 1;
    if(m.type === 'illimite'){
      const start = new Date();
      const end = new Date(start); end.setDate(end.getDate() + durationDays);
      m.startDate = isoDate(start);
      m.endDate = isoDate(end);
    } else {
      let remaining = creditsCount;
      if(m.introStart){
        const introClass = state.data.classes.find(c=>c.category==='intro_bjj' && c.startDate===m.introStart && c.endDate===m.introEnd);
        if(introClass){
          const alreadyBooked = state.data.bookings.filter(b=>
            b.studentEmail.toLowerCase()===m.studentEmail.toLowerCase() &&
            ACTIVE_STATUSES.includes(b.status) &&
            getProgramOccurrences(introClass).some(o=>o.classId===b.classId && o.dateIso===b.dateIso)
          ).length;
          remaining = Math.max(0, creditsCount - alreadyBooked);
        }
      }
      m.creditsRemaining = remaining;
    }
  }

  function render(){
    const app = document.getElementById('app');

      // state.loadFailed = échec réel de connexion/lecture (voir loadData) — on ne montre JAMAIS
      // l'app avec une base vide dans ce cas (ça écraserait les vraies données au prochain
      // enregistrement). On bloque avec un message clair plutôt qu'un "Chargement…" qui ne finit
      // jamais silencieusement.
      app.innerHTML = state.loadFailed
        ? '<div style="padding:40px;text-align:center;"><p style="color:#E37D4E;font-weight:700;margin-bottom:10px;">⚠️ Impossible de charger les données du studio.</p><p style="color:#AEB8AC;font-size:13px;margin-bottom:16px;">Vérifiez votre connexion internet, puis réessayez. Rien n’a été perdu — l’app refuse simplement d’afficher une page vide pour ne rien écraser par erreur.</p><button class="btn btn-primary" onclick="location.reload()">Réessayer</button></div>'

    // absente (déconnexion, expiration, ouverture directe d'un lien), on retombe

    if(!state.studentSession && !state.adminUnlocked && ['student','account','notebook'].includes(state.view)){

    }

    let inner = '';
    const hideHeader = state.view === 'welcome' || state.view === 'gate';
    if(!hideHeader) inner += renderHeader();

    if(state.view === 'gate') inner += renderGate();

    app.innerHTML = inner;

    // Accent personnalisé de Gérer : n'affecte que #app pendant qu'on est dans
    // les vues admin/présences déverrouillées, choisi par le gestionnaire
    // connecté dans son compte. Le reste du site (élève, accueil) garde les

    // reçoit la teinte, pas le fond de toute la page.

    const wirePhotoInput = (inputId, forManager)=>{
      const input = document.getElementById(inputId);
      if(!input) return;
      input.addEventListener('change', (ev)=>{
        const f = ev.target.files[0];
        if(!f) return;
        const reader = new FileReader();
        reader.onerror = ()=> showToast('Impossible de lire cette image.');
        reader.onload = ()=>{
          const img = new Image();
          img.onerror = ()=> showToast('Impossible de traiter cette image.');
          img.onload = ()=>{
            const size = 260;
            const cover = Math.max(size/img.width, size/img.height);
            cropState = { img, scale:cover, minScale:cover, offsetX:0, offsetY:0, dragging:false, lastX:0, lastY:0 };
            cropTargetManager = !!forManager;
            state.modal = {type:'crop-photo', payload:{}};
            render();
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(f);
      });
    };
    wirePhotoInput('acc-photo-file', false);

    closeModalDom();
    if(state.modal) renderModal();
    wirePhotoInput('mgr-photo-file', true);

    if(state.toastMsg){
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = state.toastMsg;
      document.body.appendChild(t);
    }
  }

  function buildStudentTileHtml(c, dateIso){
    const booked = bookedCount(c.id, dateIso);
    const full = booked >= c.capacity;
    const numDots = Math.ceil(c.capacity/2);
    const filledUnits = booked/2;
    let dots = '';
    for(let k=0;k<numDots;k++){
      const fill = Math.max(0, Math.min(1, filledUnits-k));
      const dotColor = capacityColor(numDots>1 ? k/(numDots-1) : 0);
      let dotStyle;
      if(fill<=0) dotStyle = `border:1px solid var(--border);background:transparent;`;
      else if(fill>=1) dotStyle = `background:${dotColor};border:1px solid ${dotColor};`;
      else dotStyle = `background:linear-gradient(90deg, ${dotColor} 50%, transparent 50%);border:1px solid ${dotColor};`;
      dots += `<span class="dot" style="${dotStyle}"></span>`;
    }
    const isProgram = isProgramClass(c);
    let spotsText;
    if(full){
      spotsText = 'Complet \u00b7 liste d\u2019attente';
    } else {
      spotsText = (c.capacity - booked) + ' place(s) restante(s)';
    }
    const accent = categoryAccent(c.category);
    const isRainbow = c.name && c.name.trim()==='Queers & Allies';
    const nameColor = isRainbow ? '#FFFBF8' : accent;
    const tint = categoryTint(c.category);
    const tileStyle = isRainbow ? '' : ` style="border-left-color:${accent};${tint ? `background:${tint};` : ''}"`;
    const tileInner = `
      <div class="class-tile ${full?'full':''}"${tileStyle} data-action="open-class" data-class="${c.id}" data-date="${dateIso}">
        <div class="class-time">${c.time} <span style="color:var(--chalk);font-weight:700;">\u00b7 ${categoryLabel(c.category)}</span> ${c.free ? '<span style="color:var(--sage);">\u00b7 gratuit</span>' : ''}</div>
        <div class="class-name" style="color:${nameColor};">${escapeHtml(c.name)}${isProgram ? ' <span style="color:var(--amber);font-size:11px;">\u00b7 programme</span>' : ''}</div>
        <div class="class-spots">${spotsText}</div>
        <div class="dots">${dots}</div>
      </div>
    `;
    return isRainbow ? `<div class="rainbow-wrap">${tileInner}</div>` : tileInner;
  }

  function renderStudent(){
    const dates = getWeekDates(state.weekOffset);
    let anyClass = false;
    let weekHasMorning = false;
    let weekHasAfternoon = false;
    const dayData = dates.map((d,i)=>{
      const dateIso = isoDate(d);
      const dayClasses = state.data.classes.filter(c=>c.dayOfWeek===i)
        .filter(c=> (!c.startDate || dateIso >= c.startDate) && (!c.endDate || dateIso <= c.endDate))
        .sort((a,b)=>a.time.localeCompare(b.time));
      if(dayClasses.length) anyClass = true;
      const morning = dayClasses.filter(c=>c.time < '12:01');
      const afternoon = dayClasses.filter(c=>c.time >= '12:01');
      if(morning.length) weekHasMorning = true;
      if(afternoon.length) weekHasAfternoon = true;
      return {d, i, dateIso, dayClasses, morning, afternoon};
    });
    const splitAmPm = weekHasMorning && weekHasAfternoon && window.innerWidth > 700;
    let cols = '';
    if(splitAmPm){
      cols += '<div class="board board-am">';
      dayData.forEach(({d,i,dateIso,morning})=>{
        const tiles = morning.map(c=>buildStudentTileHtml(c, dateIso)).join('');
        cols += `
          <div class="day-col">
            <div class="day-head">${DAYS_SHORT[i]} <span class="num">${formatDayNum(d)}</span></div>
            <div class="am-tiles-wrap">${tiles}</div>
          </div>
        `;
      });
      cols += '</div><div class="week-divider"></div><div class="board board-pm">';
      dayData.forEach(({dateIso,afternoon})=>{
        const tiles = afternoon.map(c=>buildStudentTileHtml(c, dateIso)).join('');
        cols += `<div class="day-col">${tiles}</div>`;
      });
      cols += '</div>';
    } else {
      dayData.forEach(({d,i,dateIso,dayClasses})=>{
        const tiles = dayClasses.map(c=>buildStudentTileHtml(c, dateIso)).join('');
        cols += `
          <div class="day-col">
            <div class="day-head">${DAYS_SHORT[i]} <span class="num">${formatDayNum(d)}</span></div>
            ${tiles || '<div style="font-size:12px;color:var(--chalk-dim);">\u2014</div>'}
          </div>
        `;
      });
    }
    let myWeekBookingsHtml = '';
    if(state.studentSession){
      const weekStart = isoDate(dates[0]);
      const weekEnd = isoDate(dates[6]);
      const myBookings = state.data.bookings.filter(b=>
        b.studentEmail.toLowerCase()===state.studentSession.email.toLowerCase() &&
        b.status!=='annulee' &&
        b.dateIso>=weekStart && b.dateIso<=weekEnd
      ).sort((a,b)=>a.dateIso.localeCompare(b.dateIso));
      if(myBookings.length){
        myWeekBookingsHtml = `
          <div class="card" style="margin-bottom:16px;">
            <h3 style="margin:0 0 8px;">Mes réservations cette semaine</h3>
            ${myBookings.map(b=>{
              const c = state.data.classes.find(cl=>cl.id===b.classId);
              const d = new Date(b.dateIso+'T00:00:00');
              const dayShort = DAYS_SHORT[(d.getDay()+6)%7].toUpperCase();
              return `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;">
                  <span style="color:var(--chalk-dim);font-family:var(--font-d);font-size:11px;min-width:50px;">${dayShort} ${formatDayNum(d)}</span>
                  <span style="flex:1;padding:0 10px;">${c?escapeHtml(c.name):'—'} · ${c?c.time:''}</span>
                  ${statusBadge(b.status)}
                  <button class="small-btn" style="margin-left:8px;" data-action="student-cancel-booking" data-id="${b.id}" title="Annuler cette réservation">✕</button>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }
    }

    return `
      ${myWeekBookingsHtml}
      <div class="week-nav">
        ${state.weekOffset>0 ? '<button data-action="week-prev"><span class="full-text">← Semaine préc.</span><span class="short-text">Semaine<br>← Préc.</span></button>' : ''}
        <span class="week-label">${weekLabel(state.weekOffset)}</span>
        <button data-action="week-next"><span class="full-text">Semaine suiv. →</span><span class="short-text">Semaine<br>Suiv. →</span></button>
        ${state.weekOffset!==0 ? '<button data-action="week-today">Aujourd\'hui</button>' : ''}
        ${getNextIntroProgram() ? `<button class="btn-intro-highlight" data-action="goto-next-intro" style="line-height:1.3;text-align:center;">Aller au prochain<br>programme d\u2019intro<br>${formatShortDate(getNextIntroProgram().startDate)} au ${formatShortDate(getNextIntroProgram().endDate)}</button>` : ''}
      </div>
      ${anyClass ? (splitAmPm ? cols : `<div class="board">${cols}</div>`) : `<div class="board"><div class="empty-note">Aucun cours programm\u00e9 pour l\u2019instant. Revenez bient\u00f4t !</div></div>`}

        <h3>Devenir membre</h3>

        <div class="btn-row"><button class="btn btn-primary" data-action="browse-plans">Voir les formules</button></div>
